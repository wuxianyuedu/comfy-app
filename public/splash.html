<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comfy APP 正在启动</title>
  <style>
    :root {
      --bg: #0A0A0F;
      --surface: #12101C;
      --border: rgba(255, 255, 255, 0.08);
      --violet: #7C5CFC;
      --violet-dim: rgba(124, 92, 252, 0.25);
      --text: #E5E5E7;
      --muted: #9CA3AF;
      --dim: #6B7280;
      --error: #EF4444;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    /* 窗口即内容：启动页窗口按内容尺寸开（见 src-tauri/src/lib.rs 的
       SPLASH_WINDOW_SIZE），所以这里不再要求「居中一张卡片」，而是让面板
       铺满整个窗口，四周只留一点内边距——窗口边缘就是内容边缘，屏幕上
       不出现任何空白区域。 */
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(124, 92, 252, 0.12), transparent),
                  radial-gradient(1000px 500px at 90% 110%, rgba(255, 92, 168, 0.08), transparent),
                  var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    /* 面板是唯一的子元素，纵向撑满窗口：日志展开时由日志面板吃掉剩余高度，
       收起时内容在上、下方不留空白带（窗口高度本来就按内容给）。 */
    .card {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      padding: 14px 16px 12px;
      background: #151320;
    }
    /* 标题行：品牌 + 窗口按钮（最小化 / 关闭）。
       窗口本身关了原生装饰（decorations: false），系统标题栏与那三个按钮
       都不再存在，这两个按钮就是启动期唯一的最小化 / 关闭入口。
       整条是拖拽区，按钮用 -webkit-app-region: no-drag 排除，点击不会被
       拖拽吞掉（与主窗口自定义标题行同一套约定）。 */
    .titlebar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 10px;
      -webkit-app-region: drag;
    }
    .brand {
      font-size: 17px;
      font-weight: 700;
      color: var(--violet);
      margin: 0;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .win-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .win-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
    }
    .win-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .win-btn.danger:hover {
      background: var(--error);
      color: #fff;
    }
    .stale-banner {
      display: none;
      margin: 0 0 10px;
      padding: 8px 10px;
      border: 1px solid rgba(245, 180, 60, 0.35);
      background: rgba(245, 180, 60, 0.1);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.6;
      color: #F5C07A;
      word-break: break-word;
    }
    .bar-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--violet), #9F7CFF);
      border-radius: 999px;
      transition: width 0.35s ease;
      box-shadow: 0 0 12px var(--violet-dim);
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .phase {
      color: var(--muted);
      font-weight: 500;
    }
    .message {
      font-size: 12px;
      line-height: 1.5;
      color: var(--dim);
      min-height: 34px;
      word-break: break-word;
      flex-shrink: 0;
    }
    .message.error {
      color: var(--error);
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 11px;
      color: var(--dim);
      flex-shrink: 0;
    }
    .elapsed {
      font-variant-numeric: tabular-nums;
    }
    .hint {
      opacity: 0.7;
    }
    .log-toggle {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--muted);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .log-toggle:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.3);
    }
    /* 日志面板吃掉剩余高度（不再写死 320px）：展开时窗口同步放大
       （set_splash_compact(false)），面板随窗口长高，单行日志一次能看到
       更多行；窗口被用户拉大时也不会在面板下方留空白。 */
    .log-panel {
      display: none;
      margin-top: 12px;
      background: #0B0A12;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }
    .log-panel pre {
      margin: 0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
      /* 一行一条日志：不折行、超宽横向滚动。让每一行都完整地待在一行里，
         读日志才是「扫一眼」；折行的日志会让人分不清哪一行的尾巴接到了哪儿。 */
      white-space: pre;
      overflow-x: auto;
      /* 日志内容允许选中复制，便于把启动卡住的现场发给协作者 */
      user-select: text;
    }
    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 1.5px solid rgba(124, 92, 252, 0.3);
      border-top-color: var(--violet);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="titlebar">
      <h1 class="brand">Comfy APP</h1>
      <p class="subtitle" id="subtitle">正在启动桌面应用…</p>
      <div class="win-buttons">
        <button class="win-btn" id="btn-minimize" type="button" title="最小化" aria-label="最小化">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2 6h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
        </button>
        <button class="win-btn danger" id="btn-close" type="button" title="关闭" aria-label="关闭">
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
    <div class="stale-banner" id="stale-banner"></div>
    <div class="bar-track">
      <div class="bar-fill" id="bar"></div>
    </div>
    <div class="meta">
      <span class="phase" id="phase"><span class="spinner"></span>初始化</span>
      <span id="percent">0%</span>
    </div>
    <div class="message" id="message">启动器正在初始化…</div>
    <div class="footer">
      <span class="hint">点右上角 ✕ 即终止启动</span>
      <button class="log-toggle" id="log-btn" type="button">查看日志</button>
      <span class="elapsed" id="elapsed">00:00</span>
    </div>
    <div class="log-panel" id="log-panel">
      <pre id="log-pre"></pre>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const bar = $('bar');
    const phaseEl = $('phase');
    const percentEl = $('percent');
    const messageEl = $('message');
    const elapsedEl = $('elapsed');
    const logBtn = $('log-btn');
    const logPanel = $('log-panel');
    const logPre = $('log-pre');

    const PHASE_LABELS = {
      initial: '初始化',
      'port-check': '检查端口占用',
      'port-ready': '端口已就绪',
      cache: '处理编译缓存',
      'job-object': '创建进程容器',
      'dev-server-starting': '启动本地服务',
      'tauri-compiling': '编译桌面壳',
      'tauri-shell-started': '桌面壳已启动',
      'dev-server-ready': '服务已就绪',
      ready: '启动完成',
      error: '启动失败',
      timeout: '仍在启动',
    };

    function fmtTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // 原始 IPC 调用：命令返回 Err 时抛错。invoke 封装会吞掉错误返回 null，
    // 而导航失败时上层需要区分「失败」（继续轮询重试）与「无数据」。
    async function invokeRaw(cmd, args) {
      if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
        return await window.__TAURI__.core.invoke(cmd, args || {});
      }
      throw new Error('tauri ipc unavailable');
    }

    async function invoke(cmd, args) {
      try {
        return await invokeRaw(cmd, args);
      } catch (e) {
        console.warn('tauri invoke failed:', e);
      }
      return null;
    }

    // ── 窗口按钮（最小化 / 关闭）与尺寸档位 ──
    // 启动页窗口关了原生装饰（decorations: false），系统标题栏连同它的
    // 最小化 / 关闭按钮都不存在，下面这两个按钮就是启动期唯一的窗口出口。
    // 窗口控制走 Tauri 自带的 window API（withGlobalTauri 已开），失败时安静
    // 降级——按钮画不出来不该影响启动流程本身。
    const COMPACT_SIZE = { width: 744, height: 216 };
    const subtitleEl = $('subtitle');

    /** 取当前启动页窗口（非 Tauri 环境返回 null）。 */
    function currentWindow() {
      const api = window.__TAURI__ && window.__TAURI__.window;
      return api && api.getCurrentWindow ? api.getCurrentWindow() : null;
    }

    $('btn-minimize').addEventListener('click', () => {
      const win = currentWindow();
      if (win) void win.minimize().catch((e) => console.warn('minimize failed:', e));
    });
    // 关闭 = 放弃本次启动：壳退出后由 dev-launcher 的兜底回收 sidecar / dev server
    // 进程树（与主窗口「关窗即退出」同一语义）。
    $('btn-close').addEventListener('click', () => {
      const win = currentWindow();
      if (win) void win.close().catch((e) => console.warn('close failed:', e));
    });

    /** 把窗口调到与内容匹配的档位（展开日志变宽变高，收起回到紧凑）。 */
    async function applyCompact(compact) {
      subtitleEl.textContent = compact ? '正在启动桌面应用…' : '正在启动桌面应用…（展开日志）';
      // 尺寸由壳按与建窗同一份常量计算（含显示器上限），页面不自己写第二份
      // magic number，只把「紧凑 / 展开」这件事告诉壳。非壳环境忽略。
      await invoke('set_splash_compact', { compact });
      if (!compact) return;
      // 收起日志时若用户手动拉大过窗口，把它收回内容宽度：窗口状态插件不记忆
      // splash，回落档位以 COMPACT_SIZE 为准，避免「收起后仍是宽窗」的空白。
      const win = currentWindow();
      if (win) {
        void win
          .setSize(new window.__TAURI__.window.LogicalSize(COMPACT_SIZE.width, COMPACT_SIZE.height))
          .then(() => win.center())
          .catch((e) => console.warn('restore splash size failed:', e));
      }
    }

    async function fetchStatus() {
      try {
        const data = await invoke('get_launch_status');
        if (data) return typeof data === 'string' ? JSON.parse(data) : data;
      } catch (e) {
        // 首次启动时 Rust command 可能尚未注册，静默重试
      }
      return null;
    }

    // 解析出需要探测的真实应用 URL：优先 Rust 状态 > launch-status.json > 兜底 dev URL
    async function resolveAppUrl() {
      try {
        const url = await invoke('get_app_url');
        if (url) return url;
      } catch (e) {}
      try {
        const status = await fetchStatus();
        if (status && status.app_url) return status.app_url;
      } catch (e) {}
      return 'http://127.0.0.1:3000/workspace';
    }

    // 探测后端是否已可访问：先尝试跨域 GET，失败再用 no-cors HEAD 兜底
    async function probeBackend(url) {
      try {
        const r = await fetch(url, { method: 'GET', cache: 'no-store', mode: 'cors' });
        if (r.ok) return true;
      } catch (e) {
        // 可能 CORS 或尚未就绪，继续 fallback
      }
      try {
        await fetch(url, { method: 'HEAD', cache: 'no-store', mode: 'no-cors' });
        return true;
      } catch (e) {}
      return false;
    }

    // 进度条只进不退：launcher 写状态文件与 splash 自身探测是两条并行的更新来源，
    // 探测成功瞬间状态文件里可能还是旧文案（下秒才刷新），若直接覆盖会来回跳。
    // 错误态不受此限制：失败提示必须始终能透出，避免被高进度挡住。
    let maxProgress = 0;

    function updateUI(progress, phase, message, error, elapsed) {
      const raw = Math.max(0, Math.min(1, progress || 0));
      if (raw < maxProgress && !error) return;
      maxProgress = raw;
      const pct = Math.round(raw * 100);
      bar.style.width = `${pct}%`;
      percentEl.textContent = `${pct}%`;

      const label = PHASE_LABELS[phase] || phase || '启动中';
      phaseEl.innerHTML = pct >= 100
        ? '✓ ' + label
        : '<span class="spinner"></span>' + label;

      messageEl.textContent = message || '';
      messageEl.classList.toggle('error', !!error);
      elapsedEl.textContent = fmtTime(elapsed || 0);
    }

    // ── 日志面板：展示 dev-launcher 编排日志尾部（Rust 命令 get_launch_log 提供）──
    let logVisible = false;
    let logTimer = null;
    let logFailCount = 0;

    function renderLog(text) {
      if (text === logPre.dataset.raw) return;
      logPre.dataset.raw = text || '';
      logPre.textContent = text || '';
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    async function fetchLog() {
      const data = await invoke('get_launch_log');
      if (typeof data === 'string' && data) {
        logFailCount = 0;
        renderLog(data);
      } else {
        logFailCount++;
        /* 连续拿不到日志要能区分两种成因，否则用户看到空面板不知道该做什么：
         *   - 壳版本过旧 / IPC 不可用（拿不到数据）→ 提示重编壳；
         *   - 日志确实还没产生（启动第一步就卡住）→ 提示看状态文件与磁盘日志。 */
        if (logFailCount === 4 && !logPre.dataset.raw) {
          renderLog(
            '（暂时读不到日志。）\n' +
              '若启动器刚启动，日志可能还没写入：稍等几秒后本面板会自动刷新。\n' +
              '持续为空时按顺序看这两处：\n' +
              '  1) 启动状态文件 run/launch-status.json（记录执行到哪一步、什么阶段失败）\n' +
              '  2) log/launcher/dev-launcher.log 与 log/launcher/dev-launcher-stderr.log\n' +
              '若两处都取不到（命令不可用）→ 桌面壳版本过旧，重编：cd src-tauri && cargo build --release --features custom-protocol',
          );
        }
      }
    }

    /* 先预热一次：用户点开「查看日志」时面板立刻有内容，而不是空白几十毫秒。 */
    fetchLog();

    logBtn.addEventListener('click', () => {
      logVisible = !logVisible;
      logPanel.style.display = logVisible ? 'block' : 'none';
      logBtn.textContent = logVisible ? '隐藏日志' : '查看日志';
      // 窗口也跟着内容变：展开日志时窗口放大到「一屏放得下多少行日志」，
      // 收起时回到紧凑尺寸——窗口始终与内容同尺寸，屏幕上不留空白区。
      void applyCompact(!logVisible);
      if (logVisible) {
        fetchLog();
        logTimer = setInterval(fetchLog, 800);
      } else if (logTimer) {
        clearInterval(logTimer);
        logTimer = null;
      }
    });

    let navigating = false;
    let ticks = 0;
    let appUrl = null;

    async function tick() {
      if (navigating) return;
      ticks++;

      if (!appUrl) appUrl = await resolveAppUrl();

      // 1. 先尝试读取 launcher 写入的进度信息（如果有）
      const status = await fetchStatus();
      if (status) {
        updateUI(status.progress || 0, status.phase, status.message, status.error, status.elapsed);
        // 壳过期提醒（dev-launcher 预检写入 launch-status.json 的 stale_shell）
        // 常驻语义：一旦出现过就保持可见（window.staleShown 锁存），不再随
        // 后续轮询反复显示/隐藏——状态文件里的 stale_shell 消失（如字段
        // 被部分写入）也不闪没，直到本启动页生命周期结束。
        const banner = document.getElementById('stale-banner');
        if (banner) {
          if (status.stale_shell) {
            if (!window.staleShown) {
              window.staleShown = true;
              banner.textContent = '⚠ ' + status.stale_shell;
            }
            banner.style.display = 'block';
          } else if (!window.staleShown) {
            banner.style.display = 'none';
          }
        }
      } else {
        // 没有状态文件时显示等待动画，进度按时间平滑增长但不要满 100%
        const secs = Math.floor(ticks / 4);
        const fakeProgress = Math.min(0.9, ticks / 480); // 约 2 分钟到 90%
        /* 久等而无进度时，把「怎么自查」写进同一条消息——启动页是用户此刻唯一
         * 能看到的界面，只显示一个转圈的秒数等于让人干等（ISSUE #360）。 */
        const hint =
          secs > 90
            ? '· 等待超过 90 秒，可点「查看日志」，或看启动状态文件 run/launch-status.json'
            : '· 可随时点「查看日志」看执行到哪一步';
        updateUI(
          fakeProgress,
          'dev-server-starting',
          `正在等待本地服务就绪：${appUrl}（已用 ${fmtTime(secs)}）${hint}`,
          false,
          secs,
        );
      }

      // 2. 自主探测后端可响应后，请 Rust 侧把隐藏的应用窗口导航到应用地址。
      //    不再把本启动窗口 location.replace 过去：服务未就绪时那会正好把
      //    Edge「无法访问此页面」错误页顶到用户面前。导航失败就下个 tick 重试
      //    （3 秒节流，避免高频重复导航打断正在编译路由的 dev server）。
      if (await probeBackend(appUrl)) {
        navigating = true;
        updateUI(0.95, 'dev-server-ready', '服务已就绪，正在加载应用…', false, Math.floor(ticks / 4));
        setTimeout(() => { navigating = false; }, 3000);
        try {
          await invokeRaw('navigate_to_app');
        } catch (e) {
          console.warn('navigate_to_app failed, will retry:', e);
        }
      }
    }

    // 开局把窗口尺寸对齐到「紧凑」档（壳建窗时已设过一次；用户上次把窗口
    // 拉大后重启，这里再对齐一次以保证一致）。
    void applyCompact(true);

    // 首次立即执行，随后每 250ms 轮询，保证启动页观感顺滑
    tick();
    setInterval(tick, 250);
  </script>
</body>
</html>
