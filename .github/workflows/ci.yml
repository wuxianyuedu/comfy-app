name: CI

on:
  # 本仓库默认分支是 master（不是 main）——此前写成 main，workflow 从未被触发，
  # 门禁形同虚设。改分支保护/默认分支时必须同步这里。
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 不写 version：读 package.json 的 packageManager（pnpm@12.4.1）。
          # 手写版本号迟早与 packageManager 漂移，且 pnpm 11 起项目级配置已迁移
          # 到 pnpm-workspace.yaml（.npmrc 里的 pnpm 专属设置不再生效）。
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install build toolchain
        # better-sqlite3（Drizzle 的 sqlite 驱动）的原生模块安装脚本会走
        # node-gyp rebuild；ubuntu-latest 默认不含完整编译工具链，缺
        # make/gcc/g++ 会让 `pnpm install --frozen-lockfile` 在依赖安装阶段
        # 直接失败（此前 Linux 环境踩过此坑）。此处显式安装 build-essential。
        # 即使 better-sqlite3 命中内置 prebuild 二进制，此步骤也仅是兜底开销，
        # 保证 CI 在任何情况下都能正常装完依赖。
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install dependencies
        # 门禁用 pnpm（AGENTS.md 硬规则 1：npm 11 在本项目解析 typescript 别名
        # 链会崩溃）。--frozen-lockfile 保证 CI 装的就是锁文件里的版本。
        run: pnpm install --frozen-lockfile

      # 说明：ORM 已由 Prisma 迁到 Drizzle（better-sqlite3），`prisma generate`
      # 步骤已删除——它在本仓库既不存在也必然失败。

      # 说明：format:check（prettier）仍未纳入门禁——全库 361 个文件未过 prettier，
      # 一次性格式化是与本次门禁对齐无关的大面积噪声 diff（且会与 §13.7 的
      # 「禁止无关全文件变更」冲突）。待基线整改后单独接入。

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        # 零警告门禁：与规范 11.7 / 13.5 对齐
        run: pnpm exec eslint . --max-warnings 0

      - name: Test
        run: pnpm run test

      - name: Title bar clearance
        # 顶层浮层（fixed + inset-0）必须让出窗口标题行，否则页签与窗口按钮被盖住
        run: node scripts/check-title-bar-clearance.cjs

      - name: CHANGELOG fragments
        # 碎片形态（规范 13.10.5 / ISSUE #408）：条目写 changelog.d/<issue号>-<slug>.md，
        # 文件名与段落标题不合规即失败，避免发版并入时才发现写歪
        run: node scripts/check-changelog-fragments.cjs

      - name: UI/Logic separation ratchet
        # 棘轮只许降不许升（规范 17）：新增违规失败；治理后未收紧基线也失败
        run: node scripts/check-ui-logic-separation.cjs --strict

      - name: Coverage
        # 覆盖率棘轮（vitest.config.ts）：middleware/lib 目录按真实水平设硬门槛
        run: pnpm run test:coverage

      - name: Build
        # src/env.js 在 build/dev 期校验；CI 无真实密钥，用占位值通过 schema 校验
        env:
          SKIP_ENV_VALIDATION: "1"
        run: pnpm run build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright @critical)
        # 只跑 @critical 关键流程（规范 11.7）；其余 E2E 不阻断合并
        env:
          SKIP_ENV_VALIDATION: "1"
        run: pnpm exec playwright test --grep @critical

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
