name: CI

on:
  # 本仓库默认分支是 master（不是 main）——此前写成 main，workflow 从未被触发，
  # 门禁形同虚设。改分支保护/默认分支时必须同步这里。
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 不写 version：读 package.json 的 packageManager（pnpm@12.4.1）。
          # 手写版本号迟早与 packageManager 漂移，且 pnpm 11 起项目级配置已迁移
          # 到 pnpm-workspace.yaml（.npmrc 里的 pnpm 专属设置不再生效）。
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install build toolchain
        # better-sqlite3（Drizzle 的 sqlite 驱动）的原生模块安装脚本会走
        # node-gyp rebuild；ubuntu-latest 默认不含完整编译工具链，缺
        # make/gcc/g++ 会让 `pnpm install --frozen-lockfile` 在依赖安装阶段
        # 直接失败（此前 Linux 环境踩过此坑）。此处显式安装 build-essential。
        # 即使 better-sqlite3 命中内置 prebuild 二进制，此步骤也仅是兜底开销，
        # 保证 CI 在任何情况下都能正常装完依赖。
        run: sudo apt-get update && sudo apt-get install -y build-essential

      - name: Install dependencies
        # 门禁用 pnpm（AGENTS.md 硬规则 1：npm 11 在本项目解析 typescript 别名
        # 链会崩溃）。--frozen-lockfile 保证 CI 装的就是锁文件里的版本。
        run: pnpm install --frozen-lockfile

      # 说明：ORM 已由 Prisma 迁到 Drizzle（better-sqlite3），`prisma generate`
      # 步骤已删除——它在本仓库既不存在也必然失败。

      - name: Branch guard (PR 必须来自分支,不来自 master)
        # master 只接受「分支开发 → PR → 合并」(规范 13.6 / ISSUE #492)。
        # 本地门槛在 .githooks/pre-commit,但 --no-verify 或未启用钩子的检出可以绕过;
        # 这里在服务端复核一次:HEAD 是 master 且不是合并提交 = PR 源分支就是 master。
        run: |
          branch=$(git symbolic-ref --quiet --short HEAD || echo "")
          parents=$(git rev-list --parents -n 1 HEAD | wc -w)
          echo "PR head branch=$branch parents=$((parents - 1))"
          if [ "$branch" = "master" ] && [ "$((parents - 1))" -le 1 ]; then
            echo "::error::PR 源分支不能是 master:请从分支提交并创建 PR(规范 13.6)"
            exit 1
          fi

      - name: Sync database schema (non-interactive)
        # 门禁此前**从不建库**，于是「跑起来的应用要有库」这条路径没有任何
        # 自动检查在验（ISSUE #489）：`pnpm build` 只证明「没有库也能构建」，
        # 而 `db:push` 在无 TTY 上「报错 + exit 0 + 留 0 字节库」的静默失败
        # 因此长期潜伏。走 scripts/db-push.mjs：它复核库里到底有没有表，
        # 失败即非零退出——CI 上这条链路必须真的能跑通。
        run: pnpm run db:push

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        # 零警告门禁：与规范 11.7 / 13.5 对齐
        run: pnpm exec eslint . --max-warnings 0

      - name: Test
        run: pnpm run test

      - name: Title bar clearance
        # 顶层浮层（fixed + inset-0）必须让出窗口标题行，否则页签与窗口按钮被盖住
        run: node scripts/check-title-bar-clearance.cjs

      - name: File structure rules
        # 文件命名/组织硬规则（规范 §12.6/§12.8/§12.11/§12.12）：R7/R8 Windows
        # 入口 .ps1 化与 BOM、R9 根目录不放双击入口、R10 注释禁历史流水、
        # R11 Next 16 代理约定名、R12 源码禁内嵌控制字符。
        # 此前这套规则**只在本地 pre-commit 跑**（`--no-verify` 或未启用钩子的检出
        # 可绕过），CI 侧没有任何复核——与 13.5「本地与 CI 同一口径」相悖。
        #
        # `--strict`（ISSUE #575 第 8 项 / 规范 §18.5）：R5 的超 900 行文件从
        # 「只提醒」升级为棘轮。提醒只是输出里的一行字，**没有人会因为一行提示去
        # 拆文件** —— 本项目 900 行以上的文件长期停在 10 个、只增不减。CI 用
        # `--strict` 判「新增超限文件 / 已有文件继续变大」，治理后 `--update` 收紧。
        run: node scripts/check-file-structure.cjs --strict

      - name: Cross-platform action pairs
        # 跨平台动作对照（规范 §9.5）。Windows 入口是 .ps1，Linux / macOS 跑不了
        # .ps1 —— 同一个动作因此在两侧各有一份实现，而「记得同步另一侧」全靠自觉
        # （启动编排已经因为这条静默分叉过一次）。本步骤核两件事：对照表里每个
        # 动作两侧脚本都真实存在；会失效的清单（KNOWN_FAILED_FILES）只定义一次。
        run: node scripts/check-ps1-consistency.mjs

      - name: ComfyUI port contract
        # ComfyUI 端口口径一致性（规范 §5 / §12.14 / ISSUE #534 P1）：默认端口
        # 单点定义、连接侧与拉起侧共用同一常量、buildSpawnArgs 的 >0 口径、
        # 源码里没有裸 8188 字面量。「配置端口为空」两侧落到同一个默认端口，
        # 分叉的表现是静默连到另一个实例（现象是上传失败 / 端口漂移）。
        run: node scripts/check-comfyui-port-contract.cjs

      - name: Inline style injection
        # 视图层不得动态注入 <style>（规范 03 §3.5 / 反模式 T5）：写在组件里的
        # <style>{CSS}</style> 会随每一次渲染重新生成同一个 style 元素，代码分割
        # 后还可能被多份 chunk 各自注入。本仓库在 WorkflowEditorCanvas 与
        # studio/ui/CodeBlock 上各犯过一次，形态一模一样 —— 故机器化。
        run: node scripts/check-inline-style.cjs

      - name: Cross-file duplication
        # 跨文件重复块（规范 §12.12 / ISSUE #536）：同一能力的两份实现逐行
        # 重合 ≥75% 即失败。历史上 api-channel 与 test-usage 各有一对孪生，
        # review 单看每一份都「没毛病」，只有并排比较才发现是同一段。
        run: node scripts/check-code-duplication.cjs --strict

      - name: Function length ratchet
        # 函数长度（规范 §12.13 / ISSUE #536）：超过 400 行的函数按文件记账，
        # 棘轮只许降不许升。文件行数由 R5 管、函数没人管，于是 2186 行的单函数
        # 一路合法存在。
        #
        # ISSUE #570 第 7 项补齐另一半（规范 §12.13.2）：**无名字的块体**
        # （IIFE / 回调 / 闭包参数）与跨行签名的具名函数同受约束 —— 此前
        # 「把 300 行塞进 IIFE 里」能整条绕过本门禁（真实实例：lifecycle.ts 的
        # ensureComfyUiReady 里挂了 288 行 IIFE）。基线与脚本各带判据版本，
        # 棘轮不许被静默放宽。
        run: node scripts/check-function-length.cjs --strict

      - name: Rust function length ratchet
        # Rust 壳函数长度（规范 §12.13 / ISSUE #536 P4）：§12.13 的 TS/TSX 门禁
        # 扫不到 Rust —— 于是 lib.rs 的 run() 里塞了近 300 行的窗口 / 托盘 /
        # 协议 / sidecar 编排，没有任何机器信号。阈值 120（Rust 是结构化编排，
        # 自然长度比 TSX 短），按文件记账走棘轮。
        run: node scripts/check-rust-function-length.cjs --strict

      - name: Module circular dependencies ratchet
        # 模块循环依赖（规范 §12.7 / ISSUE #574）：`src/lib` 内曾有 2 组真实环
        # （executor 家族 4 文件互相递归、comfyui 状态探测 3 文件成环），此前只靠
        # executor.ts 的一句注释「加载期是安全的」维持、**没有任何测试**。环的症状
        # 是「import 顺序变了就 undefined is not a function」，排查成本极高，因此
        # 把「无环」做成棘轮：新增环即失败；消除一个必须 --update 收紧基线。
        run: node scripts/check-circular-deps.cjs --strict

      - name: App port cross-language consistency
        # 端口推导四语言一致性（规范 §1.1 / ISSUE #489 缺陷 4）：四侧读同一份
        # 共享向量 tests/fixtures/app-port-vectors.json，Node/Python 真跑，
        # Rust/PowerShell 锁引用。任一侧漂移即失败——此前只有文档承诺。
        run: node scripts/check-app-port-vectors.cjs

      - name: CHANGELOG fragments
        # 碎片形态（规范 13.10.5 / ISSUE #408）：条目写 changelog.d/<issue号>-<slug>.md，
        # 文件名与段落标题不合规即失败，避免发版并入时才发现写歪
        run: node scripts/check-changelog-fragments.cjs

      - name: Theme color scan ratchet
        # 主题色扫描（规范 03 §3.6.1 / ISSUE #75）：「类型色例外」与「固定暗色
        # 清单」在此脚本里**显式豁免**，不再每轮重报；未豁免的写死色值走棘轮，
        # 只许降不许升 —— 新增表面/文字语义的 #hex / rgba(...) 即失败。
        run: node scripts/check-theme-colors.cjs --strict

      - name: UI/Logic separation ratchet
        # 棘轮只许降不许升（规范 17）：新增违规失败；治理后未收紧基线也失败
        run: node scripts/check-ui-logic-separation.cjs --strict

      - name: lib Node-only declarations
        # `src/lib` 的 Node-only 声明与可达性（规范 §18.4 / ISSUE #572 第 1 项）。
        # 三套写法（.server.ts / server-only / 都没有）并存了很久，而「都没有」
        # 那一类真的出过整页 500：log-session-scope 顶层 node:fs 被客户端组件
        # 引到，Turbopack 报 does not support external modules（ISSUE #317）。
        # 判据走依赖图，不用「扫到 fs 就要求 server-only」——后者会误伤纯 Node
        # 宿主（kill-process-tree / llm-secrets，它们的入口是一句 throw，加上去
        # scripts/*.mjs 的启动编排直接崩）。
        run: pnpm exec vitest run tests/lib-node-only-declarations.test.ts

      - name: Prettier format ratchet
        # 格式门禁（规范 §13.5 / ISSUE #575 第 9 项）：`format:check` 长期是唯一
        # 没进门禁的既有质量命令 —— 全库 576 个文件未过 prettier，一次性 --write
        # 会产生与本次改动无关的全文件 diff（违反 §13.7）。判据改为**基线 +
        # 只许下降**：新增脏文件即失败；存量修掉后必须 --update 收紧（CI 用
        # --strict，未收紧也失败）——否则「等基线整改完再接入」永远不会发生。
        run: node scripts/check-format.cjs --strict

      - name: Reformat-only commit guard
        # 格式化提交与行为改动分离（规范 §13.5 / ISSUE #575 第 9 项）。
        # 格式棘轮只判「文件干不干净」，管不住「顺手全库 format:write」——那会把
        # 一次真实改动埋在几百个文件的重排里，`git blame` 当场失效。这条判**提交
        # 形态**：改动若「过一遍 prettier 就变成另一种写法」即视为纯格式化，
        # 一次提交里这种文件 ≥ 10 个即失败。squash 合并后 master 上只剩一个提交，
        # 所以本地不拆就再没机会补 —— CI 必须复核一次。
        run: node scripts/check-reformat-only.cjs

      - name: Core spine single source
        # core 骨架三处「唯一事实源」（ISSUE #568）：日志只有一条通道
        # （core/logger 是 pino 薄封装、服务端库代码禁直接 console.*）、
        # 仓储只有一种取法（container 已移除）、config 不再承诺「集中配置」。
        # 这三条此前**只写在注释里**，而注释与现状恰好相反（容器只有 2 个调用方、
        # 30+ 处直接读 process.env）—— 于是「照着注释写」的人会再多一条口径。
        run: pnpm exec vitest run tests/single-logger-channel.test.ts tests/container-single-access.test.ts tests/core-spine-single-source.test.ts

      - name: Dead export ratchet
        # `src/lib` 的零消费值导出（规范 §12.16 / ISSUE #573 第 9 项）。
        # §12.15 给了「死代码该接线还是该删」的口径，但它只有口径、没有判据 ——
        # 那批 `Result` / 7 个零 `new` 调用点的错误类 / `eventBus` 全是人工读出来
        # 的。判据只扫 `src/lib/**` 且只认**值导出**（`type` / `interface` 不看：
        # 「导出但零外部引用」的 566 个清单里 90% 是同文件内使用的 props 类型，
        # 纳入只会把判据变成噪音），按符号记棘轮、只许降不许升。
        run: node scripts/check-dead-exports.cjs --strict

      - name: Coverage
        # 覆盖率棘轮（vitest.config.ts）：middleware/lib 目录按真实水平设硬门槛
        run: pnpm run test:coverage

      - name: Build
        # src/env.js 在 build/dev 期校验；CI 无真实密钥，用占位值通过 schema 校验。
        # BETTER_AUTH_SECRET 必须一并注入（ISSUE #489）：`SKIP_ENV_VALIDATION=1`
        # 只绕过 src/env.js 的 schema 校验，绕过**不了** better-auth 自己的
        # 生产校验 —— `next start`（生产模式）下缺失该值时 better-auth 退回内置
        # DEFAULT_SECRET 并直接抛「You are using the default secret」，连带
        # createTRPCContext() 抛错、所有 authedProcedure 全灭（设置页整页读不出来）。
        # 该值只用于 CI 冒烟，不参与任何真实部署。
        env:
          SKIP_ENV_VALIDATION: "1"
          BETTER_AUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
        run: pnpm run build

      - name: Standalone contents guard
        # `.next/standalone` 的产物级护栏（ISSUE #489 / 规范 §7.2）：真去数产物
        # 里有没有测试文件 / 变更碎片 / 文档。上一轮修的是 `outputFileTracingExcludes`
        # 的清单与键位，但「清单还在」不等于「清单生效」——必须有一条构建后的检查
        # 去数文件，否则清单再次静默失效（历史事故：键位挂在 experimental 下，
        # 一个字都没被读）也没人会发现。脚本在产物缺失时跳过，必须先于它运行 Build。
        run: node scripts/check-standalone-contents.cjs

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (Playwright @critical)
        # 只跑 @critical 关键流程（规范 11.7）；其余 E2E 不阻断合并。
        # 注意**不要**设 SKIP_ENV_VALIDATION 以外的捷径：门禁前面的
        # `db:push` 已建好表，这里跑的用例要能真的读到库（见 e2e/smoke.spec.ts
        # 的「数据库链路」一组），否则「库没建」这类退化又会从门禁视野里消失。
        #
        # BETTER_AUTH_SECRET 同理必须注入（ISSUE #489）：E2E 的 webServer 在 CI 上
        # 跑的是 `pnpm start`（生产模式），缺该值会让 better-auth 抛「default secret」
        # —— 实测会让 3 条 @critical 用例（ComfyUI 页签内嵌/不可嵌说明/浏览器打开）
        # 全部挂在同一个 helper 上，即「设置页整体读不出来」这类退化的守卫失效。
        env:
          SKIP_ENV_VALIDATION: "1"
          BETTER_AUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
        run: pnpm exec playwright test --grep @critical

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
