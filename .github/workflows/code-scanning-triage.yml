# code scanning 巡检（镜像档）
#
# 把 GitHub code scanning 的 open 告警按**规则**聚合成 CNB issue（一规则一单）。
# 实现与六条口径见 `scripts/ci-code-scanning-triage.mjs` 文件头。
#
# 为什么是 GA 而不是 CNB：`workflow_dispatch` 的手动按钮是 GA 原生的（本仓 daily.yml /
# package-desktop.yml 同一写法），CNB 侧要另建一个手动口；而告警本体在 GitHub 那一侧。
#
# 排班：北京 02:00 = UTC 18:00，与 01:00 的每日档错开一小时（不抢同一夜的 runner，
# 也不排在「每日单元测试」之后 —— 那一格是唯一会因机器负载而红的一档）。
#
# 权限只给两项：读代码（检出脚本）与读安全事件（告警）。**不写 GitHub issue**：
# 落点已定为 CNB（`moon-read/comfy-app-t3`），GitHub 镜像仓的 issues 不参与。
#
# ⚠️ 首次运行才会回答的那一问：内置 `GITHUB_TOKEN` + `security-events: read` 能否读到
# code scanning alerts。官方文档说这个权限就是为此设的，但本机无法复现内置 token 的
# 授权形态（本机是细粒度 PAT）⇒ 只能等这一跑的首个读数为准。
#
# `uses:` 版本口径同 pr-gate.yml 文件头（有 v7 上 v7）。
name: Code scanning triage (mirror)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read

concurrency:
  # 独立一把锁：与每日档 / 桌包档互不相干；不掐旧跑（这一格没有「新跑覆盖旧跑」的必要，
  # 两次并发会让同一规则的两张单同时创建）。
  group: code-scanning-triage
  cancel-in-progress: false

env:
  CNB_API_ENDPOINT: "https://api.cnb.cool"
  CNB_REPO_SLUG: "moon-read/comfy-app-t3"

jobs:
  triage:
    runs-on: ubuntu-24.04
    # 一次全量分页（告警 / 分析 / 已有单）+ 至多 9 次写：给 10m，卡死要早报。
    timeout-minutes: 10
    steps:
      - name: 检出（只要脚本这一层）
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          fetch-depth: 1

      - name: 装 Node（与 engines 同一条线）
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: 巡检并建单
        env:
          # 内置 token：权限由本文件顶层的 `permissions:` 授予（`security-events: read`）。
          GH_TOKEN: ${{ github.token }}
          # CNB 侧建单 / 改单 / 贴标签（repo-issue:rw）与评论 / 仓库标签（repo-notes:rw）。
          CNB_ISSUE_TOKEN: ${{ secrets.CNB_ISSUE_TOKEN }}
        run: node scripts/ci-code-scanning-triage.mjs
