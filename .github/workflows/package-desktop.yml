# 桌面成品包（镜像档）—— 对位 `.cnb.yml` 的「桌面成品包」（crontab 0 3 * * *，北京时间）
#
# 承接的格（命令逐字对位 CNB 桌包档）：
#   安装依赖 → 桌包工具预置（tauri-tools-cache.mjs）→ 桌面成品构建（pnpm tauri build）。
#
# 刻意不承接 / 不同形：
#   · `打包·壳工具链自证`（--rust-only）是自托管宿主机事实读数；windows-latest 镜像
#     自带 Rust 工具链，无需自证，cargo 缓存由 swatinem/rust-cache 承担。
#   · **发布落点不同形（已定）**：CNB 那一格 `publish-desktop-bundle.mjs` 发布到
#     **本机常驻目录**（留 2 份）；GitHub runner 是即弃机，回写那台机既没有通道也不该
#     让一次 CI 反过来写开发机。所以这里是 `upload-artifact`（14 天，按 run 取）+
#     滚动 `nightly` GitHub Release（按名字取，每天都指向最新一份）。两者各答一件事：
#     「这一跑产了什么」与「现在要拿一个包去哪拿」。Release 用 runner 自带的 `gh`
#     与 workflow 级 `permissions: contents: write`，不引第三方 action。
#   · **两类成品分开下载（ISSUE #3345）**：安装版（nsis / msi）与免安装版（解压即用的
#     portable zip）是两种分发形态，不再混进同一个 artifact。`pnpm tauri build` 只产
#     安装包；紧接着那一格用 `scripts/package-desktop-portable.mjs` 把同一份载荷按
#     打包器同布局（`app.exe` + `node.exe` + `static/**`，见规范 §7.6）收成单个 zip。
#     两个 artifact 各传一类、Release 资产也按名字分开 —— 拿包的人不用再从一堆 exe 里挑。
#   · CNB 的 `ci-cp936-exit.mjs` 包裹是给 CP936 控制台的转码层；GitHub Windows runner
#     的 pwsh 输出 UTF-8，直跑真命令。
#
# ⚠️ 桌包工具预置这一格曾四跑全红（schedule #1~#4，均 3-4s、`exit code 2`）⇒ 打包步
#    整片 skipped，artifact 与 nightly 从第一天起就是空的。根因不是资产失效（URL / sha256 /
#    字节 / zip 顶层目录逐件实测为真），而是 `tauri-tools-cache.mjs --download` 用 `tar -xf`
#    解 zip，而本步 `shell: bash` 是 Git Bash、里面的 `tar` 是 GNU tar、不读 zip —— 下载完
#    即 `bail(2)`。脚本侧已把解 zip 换成仓内既有的纯 Node `extractZipTo`（带 zip-slip 防护），
#    不再押 Windows 自带 bsdtar；本文件这一侧同步把工具根从写死盘符换成 `runner.temp`。
#    详见 §7.7 与 `ci-toolchain-browser-fetch.mjs`「为什么不走 tar -xf」。
#
# ⚠️ schedule 只跑在**镜像仓默认分支**上（同 daily.yml 那段前提，#3064 起已接上）。
# `workflow_dispatch`（可指 sha）仍是手动入口。GitHub cron 是 UTC：北京 03:00 = UTC 19:00。
# `uses:` 版本口径同 pr-gate.yml 文件头（有 v7 上 v7；pnpm/action-setup 与 rust-cache
# 的最新主版本分别是 v6 与 v2）。
name: Package desktop (mirror)

# `nightly` 滚动 Release 要写 tag / 上传资产；其余格只需要读代码。
# 不写成仓库级默认写权限 —— 这一档是唯一需要它的 workflow。
permissions:
  contents: write

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      head_sha:
        description: 要打包的那一笔 sha（留空 = 默认分支 HEAD）
        required: false
        default: ""

concurrency:
  # 对位 CNB 的 `.lock-package`：桌包档全局一把锁。
  group: package
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: "1"
  BETTER_AUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
  CI: "true"

jobs:
  package:
    # 桌包的目标平台是 Windows（tauri.conf.json targets: nsis + msi）⇒ 只能 Windows runner。
    # 钉 2022 不跟 `windows-latest` 浮动标签，理由同 pr-gate.yml 的镜像钉版口径。
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.head_sha || github.sha }}
          # 桌包档定时触发在 master HEAD，打包不做三点 diff / 不读 origin/master ⇒ 1 够。
          fetch-depth: 1
          # 打包要把字体真身嵌进成品（LFS 指针文件打进去就是坏包）⇒ 这一格必须拉 LFS。
          # 对象由镜像那一格 `git lfs push` 送到；配额口径见 pr-gate.yml 同名注释。
          lfs: true

      - name: 装 pnpm（按 package.json 的 packageManager 钉死版）
        id: setup-pnpm
        uses: pnpm/action-setup@v6

      - name: 装 Node（engines 下限 26.12.1；镜像预装只到 24，必须显式）
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: cargo 缓存
        uses: swatinem/rust-cache@v2

      - name: 安装依赖（better-sqlite3 原生编译吃 VS 生成工具，镜像自带）
        run: pnpm install --frozen-lockfile

      # `pnpm tauri build` 的 `beforeBuildCommand` 是 `node scripts/build-desktop.mjs`：
      # 它跑在 Node 子进程里，再从 `ci-install-deps.mjs` 的 `pnpmCli()` 找 pnpm —— 那条
      # 判据只认「PATH 条目下能真起 `pnpm.exe -v` 的绝对路径」。action-setup 加进 PATH
      # 的是 `<dest>/node_modules/.bin`（npm 在 Windows 摆 `pnpm` / `.cmd` / `.ps1` 垫片）
      # 与 `<dest>/node_modules/.bin/bin`（`self-update` 落点）；pnpm 12 的原生 `pnpm.exe`
      # 在 `<dest>/node_modules/pnpm/`，**不在 PATH 上**（ISSUE #3305）。
      #
      # 不能从 `bin_dest` 拼父目录猜：bootstrap 装 12.17.0、本仓钉 12.4.1 ⇒ 走
      # `self-update`，`bin_dest` 实为 `.bin/bin`，它的父目录里 `pnpm` 是**垫片文件**而非
      # 目录，`Test-Path` 对文件也返回真 —— 上一轮就是这样把文件路径追加进 GITHUB_PATH、
      # 该格假绿，而 build-desktop 仍回落裸 `pnpm` ⇒ ENOENT。这一格改为取 action-setup 的
      # `dest` 输出，枚举真身目录并**真起一次 `pnpm.exe -v`**，起不来就当场红，不冒充绿。
      - name: 把 pnpm 真身目录补进 PATH（供 beforeBuildCommand 的 Node 子进程）
        shell: pwsh
        env:
          # `${{ }}` 不直接写进 `run:`：经 env 传入，避免表达式文本被宿主二次解释。
          PNPM_DEST: ${{ steps.setup-pnpm.outputs.dest }}
          PNPM_BIN_DEST: ${{ steps.setup-pnpm.outputs.bin_dest }}
        run: |
          # 顺序有意义：`bin_dest` 是 self-update 的落点（版本与 packageManager 一致），
          # 优先用它；bootstrap 的 `<dest>/node_modules/pnpm` 是 12.17.0 真身，作兜底。
          $candidates = @(
            $env:PNPM_BIN_DEST,
            (Join-Path $env:PNPM_DEST 'node_modules/pnpm')
          ) | Select-Object -Unique
          $found = $null
          foreach ($dir in $candidates) {
            if (-not (Test-Path -LiteralPath $dir -PathType Container)) { continue }
            $exe = Join-Path $dir 'pnpm.exe'
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { continue }
            & $exe -v | Out-Null
            if ($LASTEXITCODE -ne 0) { continue }
            $found = $dir
            break
          }
          if (-not $found) {
            Write-Error "没找到能真起 pnpm.exe -v 的目录（候选：$($candidates -join ', ')）"
            exit 1
          }
          # 补的是**真身目录**（不是 .bin 垫片目录）：pwsh 与 Node 两条解析面都够得着。
          $found | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "[package-desktop] pnpm 真身目录已补进 PATH：$found"

      # NSIS 工具镜像做成跨跑缓存：key 锁死 NSIS_PLAN 的版本（3.13），版本升上去 = 同批改
      # 这里与 scripts/tauri-tools-cache.mjs 的 NSIS_PLAN。path 即 mirrorDir 的落点
      # （<COMFY_CI_TOOLS_ROOT>/nsis/3.13），与预置步 COMFY_CI_TOOLS_ROOT 同源。命中 ⇒ 预置步的
      # ensure 直接补齐 bundler 缓存；miss ⇒ 预置步先 --download 建镜像（付一次下载），
      # 本步在跑尾把镜像存进缓存。
      - name: NSIS 工具镜像缓存（锁 3.13）
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\ci-tools\nsis\3.13
          key: comfyapp-nsis-3.13-${{ runner.os }}

      # ensure || (download && ensure)：三态 fail-closed 不静默降级 —— 镜像已在场
      # （缓存命中）⇒ ensure 补齐即过；两边都没有（缓存 miss）⇒ ensure 退 2，接 --download
      # 从被钉的公开资产建镜像再 ensure；下载/解压失败退 2、哈希对不上退 1，都是红。
      # `shell: bash` 只为 `||`/`&&` 链式语义一致；脚本内部的解 zip 已改用纯 Node，不再
      # 经 bash 里的 `tar`（GNU tar 不读 zip，正是四跑全红那一格）。
      - name: 桌包工具预置（cnb 同款入口；缓存 miss 时先 --download 建镜像）
        shell: bash
        # `runner` context 只在 step 级可用；放进 workflow 级 env 会让整份文件解析失败
        # （Unrecognized named-value: 'runner'）。工具根与上方 cache 的 path 同源。
        env:
          COMFY_CI_TOOLS_ROOT: ${{ runner.temp }}\ci-tools
        run: node scripts/tauri-tools-cache.mjs || (node scripts/tauri-tools-cache.mjs --download && node scripts/tauri-tools-cache.mjs)

      - name: 桌面成品构建（cnb 同款判据一字不改）
        run: pnpm tauri build

      # 免安装版：同一份载荷、不打安装器。输出刻意放在 bundle/ 之外 —— 放进 bundle/
      # 会被下面「安装版」artifact 一起收走，两类成品又混回一处。
      # 组装步只读三件现成产物（壳 / sidecar / static），缺件即红，不重跑任何构建。
      - name: 组装免安装版（portable zip；与安装包同一次构建、同一份载荷）
        run: node scripts/package-desktop-portable.mjs --out portable/ComfyAPP-portable.zip --stage portable-stage

      # upload-artifact v4 → v7（2026-11-02 核过 tag）：v5 起 node24 运行时，v6 起要求
      # runner ≥ 2.327.1（托管 runner 恒满足），v7 新增 `archive` 输入（缺省 true ⇒
      # 本步的 name/path/retention-days 用法不变）。
      # 两个 artifact 各装一类：下载页上能分别点「安装版」与「免安装版」。
      - name: 上传安装版（artifact：nsis / msi）
        uses: actions/upload-artifact@v7
        with:
          name: comfyapp-desktop-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          retention-days: 14
          # 打包绿了却一个安装包都没有 ⇒ 判红，不许 warn 蒙混（§7.7「发布只能排在构建绿之后」）。
          if-no-files-found: error

      - name: 上传免安装版（artifact：解压即用的 portable zip）
        uses: actions/upload-artifact@v7
        with:
          name: comfyapp-desktop-portable
          path: portable/ComfyAPP-portable.zip
          retention-days: 14
          # 免安装版缺件也判红：少 sidecar / server.js 的包在用户机器上是「双击没反应」，
          # 构建侧静默放行 = 发一个起不来的包。
          if-no-files-found: error

      # 发布落点：CNB 那一格把成品留在本机常驻目录（留 2 份），GitHub runner 是即弃机，
      # 等价物是 GitHub Releases 的滚动 `nightly` tag —— artifact 只活 14 天，而「现在
      # 要拿一个包」的人不该先去翻某一次 run。用 runner 自带的 `gh`，不引第三方
      # action（`uses:` 主版本要逐仓核 tag，这里没有需要它的能力）。
      # `--clobber` 是滚动 tag 的关键：每天同一组资产名，没有它第二天就撞已存在。
      - name: 发布到滚动 Release（nightly）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 先数两类成品再动 Release：空手时不许先 create 出一个没有资产的 nightly tag。
          mapfile -d '' installers < <(find src-tauri/target/release/bundle -type f \( -name '*.exe' -o -name '*.msi' \) -print0)
          portable=portable/ComfyAPP-portable.zip
          if [ ${#installers[@]} -eq 0 ] || [ ! -f "$portable" ]; then
            echo "两类成品不齐（安装包 ${#installers[@]} 份 / 免安装版 $([ -f "$portable" ] && echo 有 || echo 无)），滚动 Release 不动"
            exit 1
          fi
          gh release view nightly >/dev/null 2>&1 || \
            gh release create nightly --title "每日桌面成品" \
              --notes "定时任务滚动更新，保留最新一份。安装版 = setup.exe / msi；免安装版 = *-portable.zip（解压后双击 app.exe 即用）" --prerelease
          gh release upload nightly "${installers[@]}" "$portable" --clobber
