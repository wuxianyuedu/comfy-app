# 每日档（镜像档）—— 对位 `.cnb.yml` 的「每日生产构建」（crontab 0 1 * * *，北京时间）
#
# 承接的格（命令与 env 逐字对位 CNB 每日档，顺序一致 —— 单 job 串行，与 CNB 同一
# 工作区语义对齐：`每日生产构建` 的产物接着给 `每日全量E2E` 的 `COMFY_E2E_SERVER=start`
# 用，拆成多 job 就要跨 job 传产物，那不是等价形态）：
#   安装依赖 → 同步数据库表结构 → 新鲜度账 → 生产构建 → ESLint 零警告 →
#   浏览器安装 → 全量E2E → API 文档自检 → 单元测试（排最后，与 CNB「最容易出问题的放最后」同口径）。
#   每个 step 的 `timeout-minutes` 与 CNB 那一格 stage 的 `timeout` 同值（卡死要在
#   自己的名字上报，而不是让 300m 的 job 顶层兜底）——映射见各 step 行尾注释。
#
# 刻意不承接（CNB 专有或自托管节点事实）：每日失败立案 / 每日令牌权限读数
# （CNB API）/ 每日工具链自证 / 每日 Python 可用性 / 每日 Python 探针读数
# （自托管宿主机事实读数；GitHub runner 的工具链由镜像与 setup-* 钉死，无需自证）。
#
# 两处与 CNB 不同形、但判据不变：
#   · 安装用裸 `pnpm install --frozen-lockfile`：CNB 的 `ci-install-deps.mjs` 多出来的
#     那一半是缓存槽登记（`COMFY_CI_SLOT` 不置时一次槽都不问），GitHub 侧缓存由
#     setup-node 的 `cache: pnpm` 承担，槽逻辑在这里是空转。
#   · CNB 的 `ci-cp936-exit.mjs` 包裹是给 CP936 控制台的转码层，这里原生 UTF-8，直跑。
#
# ⚠️ schedule 只跑在**镜像仓默认分支**上：它成立的前提是默认分支跟着 CNB `master`
# 走 —— 2026-11-02 起 CNB push 档有了「GitHub master 镜像」格（#3064），前提已接上。
# `workflow_dispatch`（可指 sha）仍是手动入口。
# `uses:` 版本口径同 pr-gate.yml 文件头（有 v7 上 v7；pnpm/action-setup 最新只到 v6）。
# GitHub cron 是 UTC：北京 01:00 = UTC 17:00（前一日）。
name: Daily (mirror)

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      head_sha:
        description: 要判的那一笔 sha（留空 = 默认分支 HEAD）
        required: false
        default: ""

concurrency:
  # 对位 CNB 的 `.lock-daily`：每日档全局一把锁，新跑到来掐掉旧跑。
  group: daily
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: "1"
  BETTER_AUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
  CI: "true"
  COMFY_TEST_TIMEOUT_SCALE: "2"
  COMFYAPP_QUIET_COVERAGE: "1"
  # vitest 并发：默认由 `scripts/ci-load.mjs:resolveCiWorkers()` 按平台分档推导 ——
  # GA 托管 runner（`GITHUB_ACTIONS=true`，每个 job 独享 4 核 VM）走 `ceil(cores/2)` ⇒ 2；
  # CNB 自托管（共享宿主机）仍走 `ceil(cores/8)` ⇒ 16 核上 2，行为逐字不变。
  # 这里只接「人的覆盖出口」，**不写数**：仓库变量没设 ⇒ 展开成空串 ⇒ 走上面的默认；
  # 设成 ≥1 整数才覆盖，只调并发、不动任何判据（口径同 `.cnb.yml` 同名键）。
  COMFY_CI_MAX_WORKERS: ${{ vars.COMFY_CI_MAX_WORKERS }}
  # 主体=master ⇒ 读机器分支那份权威账（对位 `.cnb.yml` 每日档各格的同名键）。
  COMFY_CI_SUBJECT: "master"
  # 全量单测里有**要真建一笔提交**的用例（tests/freshness-ledger-backend.test.ts 的
  # `commit-tree`）：GitHub runner 检出后不带 git 身份 ⇒ `Author identity unknown`
  # （#3095）。喂一份中性身份，判据一字不动；CNB 自托管节点本来就有全局身份。
  GIT_AUTHOR_NAME: ci-mirror
  GIT_AUTHOR_EMAIL: ci-mirror@users.noreply.github.com
  GIT_COMMITTER_NAME: ci-mirror
  GIT_COMMITTER_EMAIL: ci-mirror@users.noreply.github.com

jobs:
  daily:
    # 钉 24.04 不跟浮动标签的理由见 pr-gate.yml 同名注释。
    runs-on: ubuntu-24.04
    # CNB 各格预算之和（build 30m + lint 30m + E2E 45m + 单测 45m + 安装/浏览器）≈ 160m，
    # 冷装与现场编译留一个量级，给到 300m。GitHub 单 job 硬上限 6h，这条在它之内。
    timeout-minutes: 300
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.head_sha || github.sha }}
          # 全量单测里有按 git 历史现算的判据（tests/audits-doc-references.test.ts：
          # `git log --all --diff-filter=D -- scripts/` 找已删的棘轮基线；浅克隆退化成
          # 空集 ⇒ 那条「判据面非空」反向锚点必红，读数同 pr-gate.yml 的 fixed 格注释）
          # ⇒ 全量档必须全历史，1 和 2 都不够。
          fetch-depth: 0
          # 全量单测含字体用例（tests/embedded-title-font.test.ts，在固定结构清单里）：
          # 它要字体真身字节，只检 LFS 指针文件必红 ⇒ 这一格必须拉 LFS。
          # 对象由镜像那一格 `git lfs push` 送到；配额口径见 pr-gate.yml 同名注释。
          lfs: true

      - name: 装 pnpm（按 package.json 的 packageManager 钉死版）
        uses: pnpm/action-setup@v6

      - name: 装 Node（engines 下限 26.12.1；镜像预装只到 24，必须显式）
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: 安装依赖（冷装约 8 分钟；allowBuilds 清单见 pnpm-workspace.yaml）
        timeout-minutes: 20 # 对位 CNB `每日安装依赖` 20m（其内部墙钟预算 12m）
        run: pnpm install --frozen-lockfile

      - name: 同步数据库表结构（cnb 同款判据一字不改）
        timeout-minutes: 30 # CNB `每日同步数据库表结构` 走平台默认 30m
        run: node scripts/db-push.mjs

      - name: 新鲜度账（cnb 同款判据一字不改）
        timeout-minutes: 5 # 对位 CNB `每日新鲜度账` 5m
        run: node scripts/freshness-gate.mjs

      - name: 生产构建（cnb 同款判据一字不改）
        timeout-minutes: 30 # 对位 CNB `每日生产构建` 30m
        env:
          COMFY_CI_BUILD_CACHE: "1"
        run: node scripts/ci-daily-build.mjs

      - name: ESLint 零警告（cnb 同款判据一字不改：pnpm run lint，不是 eslint .）
        env:
          # 全量 lint 在这一格 OOM 过（runner 7GB RAM，V8 默认老生代上限约 2GB 不够）。
          # 只抬本 step 的堆上限，不动全局 env —— 其余 step 用不上，改了反而掩盖别处的
          # 内存回归信号。
          NODE_OPTIONS: "--max-old-space-size=4096"
        timeout-minutes: 30 # 对位 CNB `每日 ESLint 零警告` 30m
        run: pnpm run lint

      - name: 浏览器安装（cnb 同款入口；npmmirror 镜像源同 CNB）
        timeout-minutes: 20 # 对位 CNB `每日浏览器安装` 20m
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: "https://cdn.npmmirror.com/binaries/playwright"
        run: node scripts/ci-toolchain-selfcheck.mjs --playwright-only

      - name: 全量E2E（cnb 同款判据一字不改）
        timeout-minutes: 45 # 对位 CNB `每日全量E2E` 45m
        env:
          COMFY_E2E_SERVER: "start"
        run: node scripts/e2e-run.mjs

      - name: API 文档生成与自检（cnb 同款判据一字不改）
        # 2026-11-05 从 CNB push 档撤到每日档（ISSUE #2537）：PR 侧不再即时判，
        # 最晚次日 01:00 在这一跑暴露（窗口 ≤24h）。位置与 CNB 每日档同一处 ——
        # 全量E2E 之后、单元测试之前（后者必须是最后一个会红的格）。
        timeout-minutes: 30 # CNB `每日 API 文档生成与自检` 走平台默认 30m
        run: node scripts/check-docs-api.cjs

      - name: 单元测试（排最后：唯一会因机器负载而红的一档，同 CNB 口径）
        timeout-minutes: 45 # 对位 CNB `每日单元测试` 45m（内部墙钟预算 30m）
        run: node scripts/full-suite-run.mjs

      # 覆盖率上报的对位落点。CNB 那一格是 `ci-coverage-report.mjs`，走 `cnb` CLI
      # 把 lcov 交给平台；GitHub runner 没有那个 CLI，判据本体不该为换平台重抄一遍。
      # 这里退成**产物出口**：`full-suite-run.mjs` 已经产出 lcov / json-summary，
      # 上传成 artifact 让「今天的覆盖率」有地方可取。
      # `always()` + `warn` 对位 CNB 那格「没有报告时跳过而不是判红」的口径：
      # 单测红了仍要能拿到报告，而报告缺席不许把这一格叠成第二个红。
      - name: 覆盖率报告（artifact；对位 CNB 的 `覆盖率上报` 格）
        # CNB 那格有 30m 平台默认预算，但 GA 这一格只做上传（报告已由上一格产出），
        # 5m 是按「卡死要早报」给的上限，不是放宽判据。
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comfyapp-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn
