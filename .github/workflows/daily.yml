# 每日档（镜像档）—— 对位 `.cnb.yml` 的「每日生产构建」（crontab 0 1 * * *，北京时间）
#
# 承接的格（命令与 env 逐字对位 CNB 每日档，顺序一致 —— **重格链**单 job 串行，与 CNB 同一
# 工作区语义对齐：`每日生产构建` 的产物接着给 `每日全量E2E` 的 `COMFY_E2E_SERVER=start`
# 用，拆成多 job 就要跨 job 传产物，那不是等价形态。唯一的例外是末尾那个 `daily-failure-issue`
# job：它只读 jobs API、一个工作区产物都不碰，拆出去不损失等价性 —— 理由见下面那段）：
#   安装依赖 → 同步数据库表结构 → 新鲜度账 → 生产构建 → ESLint 零警告 →
#   浏览器安装 → 全量E2E → API 文档自检 → 单元测试（排最后，与 CNB「最容易出问题的放最后」同口径）
#   → 失败时补一步环境证据（dmesg 的 OOM 行 + 内存读数；ISSUE #3333，`if: failure()`
#   只花在红的那一跑 —— 重格死成「子进程被信号打死 / 没有读数」时，OOM 不再停在「最大嫌疑」）
#   → 镜像漂移判据（CNB master vs GitHub master；ISSUE #3252 的每日兜底，放最末尾）。
#   每个 step 的 `timeout-minutes` 与 CNB 那一格 stage 的 `timeout` 同值（卡死要在
#   自己的名字上报，而不是让 300m 的 job 顶层兜底）——映射见各 step 行尾注释。
#
# 刻意不承接（CNB 专有或自托管节点事实）：每日令牌权限读数 / 每日工具链自证 /
# 每日 Python 可用性 / 每日 Python 探针读数（自托管宿主机事实读数；GitHub runner 的工具链
# 由镜像与 setup-* 钉死，无需自证）。
#
# 每日失败立案**原本**在这份清单里，理由是它依赖 CNB API / cnb CLI —— 那条理由在「脚本走
# HTTP 而不是 cnb CLI」之后不再成立：它用内置 GITHUB_TOKEN 读这一跑的 jobs、用
# CNB_ISSUE_TOKEN 写单（与 code-scanning-triage.yml 同一条通道），把「这一跑红了」变成一张
# 按格名去重的 CNB 单（#3436；缺口现场 #3368 / #3435）。CNB 自己的 `每日失败立案`
# 判的是 CNB 上一跑，与本档这一跑互不覆盖。
#
# ⚠️ 它是**下游 job**（`daily-failure-issue`：`needs: daily` + `if: failure()`），不是 `daily`
# 里的一个 step。这一条是 #3563 治出来的，**别挪回去**：
# 脚本唯一的红格来源是 jobs API 的 `steps[].conclusion === "failure"`。它作为 step 跑在 `daily`
# 内部时那个 job 自己还是 `in_progress`，实测读回来 **0 个红格** —— run `42915112854`：
# `单元测试` 22:39:17 判 failure，`失败立案` 22:39:17→22:39:19 就跑了，打印「红格 0 个」⇒
# 零写入、退码 2 被 `--no-block` 折成 0，于是「红了」与「没红」在账上长得一样。
# 这里原先写的「jobs API 此时已把前面红格的 conclusion 写好」是**未经复核的前提**，已被那一跑
# 推翻。至于 API 是「在飞的 job 根本不报 step conclusion」还是「报得慢」**没有结论**：338 个
# 在飞 job 的抽样 0 命中，而「job 在飞且已有红 step」那个窗口只有几秒，取不到不等于没有。
# 挪到下游之后 `daily` 已 `completed`、conclusion 是终值 —— 这个修法在两种成因下都成立，
# 不必先把成因分清（也分不清：在 job 内部轮询等它自己 completed 是死锁）。
# 同族先例：pr-gate.yml 的 `ga-verdict-callback` 与 `ci-ga-logs-relay.mjs` 一直是「下游 job 读
# 上游终态」，实测读得到失败 job。
#
# 两处与 CNB 不同形、但判据不变：
#   · 安装用裸 `pnpm install --frozen-lockfile`：CNB 的 `ci-install-deps.mjs` 多出来的
#     那一半是缓存槽登记（`COMFY_CI_SLOT` 不置时一次槽都不问），GitHub 侧缓存由
#     setup-node 的 `cache: pnpm` 承担，槽逻辑在这里是空转。
#   · CNB 的 `ci-cp936-exit.mjs` 包裹是给 CP936 控制台的转码层，这里原生 UTF-8，直跑。
#
# ⚠️ schedule 只跑在**镜像仓默认分支**上：它成立的前提是默认分支跟着 CNB `master`
# 走 —— 2026-11-02 起 CNB push 档有了「GitHub master 镜像」格（#3064），前提已接上。
# `workflow_dispatch`（可指 sha）仍是手动入口。
# `uses:` 版本口径同 pr-gate.yml 文件头（有 v7 上 v7；pnpm/action-setup 最新只到 v6）。
# GitHub cron 是 UTC：北京 01:37 = UTC 17:37（前一日）。
# 挪出整点（#3485）：官方明示 schedule 在高负载（含每小时开头）下会延迟、
# 负载够高时排队任务可能被直接丢弃 —— 2026-11-09 北京 01:00 那条 schedule 就没被
# 创建（三个定时档集体缺席，无 run、无 cancelled）。历史读数也印证整点从来没准点过
# （名义 17:00 UTC 实际落在 20:35–22:27Z）。分钟取 37 与桌包档对齐，错开整点峰值。
name: Daily (mirror)

on:
  schedule:
    - cron: "37 17 * * *"
  workflow_dispatch:
    inputs:
      head_sha:
        description: 要判的那一笔 sha（留空 = 默认分支 HEAD）
        required: false
        default: ""

# 漂移判据要在镜像仓建单（ISSUE #3252），因此显式要 issues: write；
# 失败立案要读自身这一跑的 jobs（`/actions/runs/{id}/jobs`），因此显式要 actions: read。
# 其余权限按最小面给（本档只读代码、写 artifact）。
permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  # 对位 CNB 的 `.lock-daily`：每日档全局一把锁，新跑到来掐掉旧跑。
  group: daily
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: "1"
  BETTER_AUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
  CI: "true"
  COMFYAPP_QUIET_COVERAGE: "1"
  # vitest 并发：默认由 `scripts/ci-load.mjs:resolveCiWorkers()` 按平台分档推导 ——
  # GA 托管 runner（`GITHUB_ACTIONS=true`，每个 job 独享 4 核 VM）走 `ceil(cores/2)` ⇒ 2；
  # CNB 自托管（共享宿主机）仍走 `ceil(cores/8)` ⇒ 16 核上 2，行为逐字不变。
  # 这里只接「人的覆盖出口」，**不写数**：仓库变量没设 ⇒ 展开成空串 ⇒ 走上面的默认；
  # 设成 ≥1 整数才覆盖，只调并发、不动任何判据（口径同 `.cnb.yml` 同名键）。
  COMFY_CI_MAX_WORKERS: ${{ vars.COMFY_CI_MAX_WORKERS }}
  # 主体=master ⇒ 读机器分支那份权威账（对位 `.cnb.yml` 每日档各格的同名键）。
  COMFY_CI_SUBJECT: "master"
  # 全量单测里有**要真建一笔提交**的用例（tests/freshness-ledger-backend.test.ts 的
  # `commit-tree`）：GitHub runner 检出后不带 git 身份 ⇒ `Author identity unknown`
  # （#3095）。喂一份中性身份，判据一字不动；CNB 自托管节点本来就有全局身份。
  GIT_AUTHOR_NAME: ci-mirror
  GIT_AUTHOR_EMAIL: ci-mirror@users.noreply.github.com
  GIT_COMMITTER_NAME: ci-mirror
  GIT_COMMITTER_EMAIL: ci-mirror@users.noreply.github.com

jobs:
  daily:
    # 钉 24.04 不跟浮动标签的理由见 pr-gate.yml 同名注释。
    runs-on: ubuntu-24.04
    # CNB 各格预算之和（build 30m + lint 30m + E2E 45m + 单测 45m + 安装/浏览器）≈ 160m，
    # 冷装与现场编译留一个量级，给到 300m。GitHub 单 job 硬上限 6h，这条在它之内。
    timeout-minutes: 300
    steps:
      - name: 检出
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.head_sha || github.sha }}
          # 全量单测里有按 git 历史现算的判据（tests/audits-doc-references.test.ts：
          # `git log --all --diff-filter=D -- scripts/` 找已删的棘轮基线；浅克隆退化成
          # 空集 ⇒ 那条「判据面非空」反向锚点必红，读数同 pr-gate.yml 的 fixed 格注释）
          # ⇒ 全量档必须全历史，1 和 2 都不够。
          fetch-depth: 0
          # 全量单测含字体用例（tests/embedded-title-font.test.ts，在固定结构清单里）：
          # 它要字体真身字节，只检 LFS 指针文件必红 ⇒ 这一格必须拉 LFS。
          # 对象由镜像那一格 `git lfs push` 送到；配额口径见 pr-gate.yml 同名注释。
          lfs: true

      - name: 装 pnpm（按 package.json 的 packageManager 钉死版）
        uses: pnpm/action-setup@v6

      - name: 装 Node（engines 下限 26.12.1；镜像预装只到 24，必须显式）
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: 安装依赖（allowBuilds 清单见 pnpm-workspace.yaml）
        timeout-minutes: 20 # 对位 CNB `每日安装依赖` 20m（其内部墙钟预算 12m）
        run: pnpm install --frozen-lockfile

      - name: 同步数据库表结构（cnb 同款判据一字不改）
        timeout-minutes: 30 # CNB `每日同步数据库表结构` 走平台默认 30m
        run: node scripts/db-push.mjs

      - name: 新鲜度账（cnb 同款判据一字不改）
        timeout-minutes: 5 # 对位 CNB `每日新鲜度账` 5m
        run: node scripts/freshness-gate.mjs

      - name: 生产构建（cnb 同款判据一字不改）
        timeout-minutes: 30 # 对位 CNB `每日生产构建` 30m
        env:
          COMFY_CI_BUILD_CACHE: "1"
        run: node scripts/ci-daily-build.mjs

      - name: ESLint 零警告（cnb 同款判据一字不改：pnpm run lint，不是 eslint .）
        env:
          # 全量 lint 在这一格 OOM 过（runner 7GB RAM，V8 默认老生代上限约 2GB 不够）。
          # 只抬本 step 的堆上限，不动全局 env —— 其余 step 用不上，改了反而掩盖别处的
          # 内存回归信号。
          NODE_OPTIONS: "--max-old-space-size=4096"
        timeout-minutes: 30 # 对位 CNB `每日 ESLint 零警告` 30m
        run: pnpm run lint

      - name: 浏览器安装（cnb 同款入口；npmmirror 镜像源同 CNB）
        timeout-minutes: 20 # 对位 CNB `每日浏览器安装` 20m
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: "https://cdn.npmmirror.com/binaries/playwright"
          # 与 CNB 同款（`cnb-rkr-1k510rsgg` 的取证）：180 MiB 包撞 Playwright 默认 30s
          # **套接字**超时被掐断 —— 那不是「CDN 不通」的结论，是「这一次没量完」，
          # 处置相反（换镜像 vs 放宽）。键缺失不会在解析期报错，只会在下一次下载时同形再红。
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
        run: node scripts/ci-toolchain-selfcheck.mjs --playwright-only

      - name: 全量E2E（cnb 同款判据一字不改）
        timeout-minutes: 45 # 对位 CNB `每日全量E2E` 45m
        env:
          COMFY_E2E_SERVER: "start"
        run: node scripts/e2e-run.mjs

      - name: API 文档生成与自检（cnb 同款判据一字不改）
        # 2026-11-05 从 CNB push 档撤到每日档（ISSUE #2537）：PR 侧不再即时判，
        # 最晚次日 01:00 在这一跑暴露（窗口 ≤24h）。位置与 CNB 每日档同一处 ——
        # 全量E2E 之后、单元测试之前（后者必须是最后一个会红的格）。
        timeout-minutes: 30 # CNB `每日 API 文档生成与自检` 走平台默认 30m
        run: node scripts/check-docs-api.cjs

      - name: 单元测试（排最后：唯一会因机器负载而红的一档，同 CNB 口径）
        timeout-minutes: 45 # 对位 CNB `每日单元测试` 45m（内部墙钟预算 30m）
        run: node scripts/full-suite-run.mjs

      # 环境证据（ISSUE #3333）：重格红成「子进程被信号打死 / 没有读数」时，OOM 定性
      # 此前只能停在「最大嫌疑」——内核的 OOM 行不会自己进 step 日志，而 ubuntu-24.04
      # 镜像的 dmesg 要 sudo（hosted runner 有免密 sudo）。`if: failure()` 兜住上面
      # 全部会红的格：证据只花在红的那一跑，绿的那一跑一个字节都不付。
      # grep 无命中退 1 是「内核没记 OOM」这一读数本身，`|| echo` 把它接住、不冒充第二格红。
      - name: 环境证据（失败时：dmesg 的 OOM 行 + 内存读数）
        timeout-minutes: 5 # 读数步给「卡死要早报」的上限，同其他读数格
        if: failure()
        run: |
          echo "== dmesg 的 OOM / killed 行（空 = 内核没记 OOM，别把环境杀念成 OOM）=="
          sudo dmesg -T | grep -iE "out of memory|oom|killed process" || echo "（dmesg 无 OOM 形状的行）"
          echo "== 内存读数 =="
          free -h

      # 覆盖率上报的对位落点。CNB 那一格是 `ci-coverage-report.mjs`，走 `cnb` CLI
      # 把 lcov 交给平台；GitHub runner 没有那个 CLI，判据本体不该为换平台重抄一遍。
      # 这里退成**产物出口**：`full-suite-run.mjs` 已经产出 lcov / json-summary，
      # 上传成 artifact 让「今天的覆盖率」有地方可取。
      # `always()` + `warn` 对位 CNB 那格「没有报告时跳过而不是判红」的口径：
      # 单测红了仍要能拿到报告，而报告缺席不许把这一格叠成第二个红。
      - name: 覆盖率报告（artifact；对位 CNB 的 `覆盖率上报` 格）
        # CNB 那格有 30m 平台默认预算，但 GA 这一格只做上传（报告已由上一格产出），
        # 5m 是按「卡死要早报」给的上限，不是放宽判据。
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: comfyapp-coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      # 漂移判据（ISSUE #3252）：CNB master ≠ GitHub master 即立案。
      # push 镜像出口已挪到平台池流水线、摘掉 `--readout`（退码生效，推不出去即 error）；
      # 但「之后没人再推」没有别的执行者 —— 平台池那一跳失败后 master 会停在旧树，
      # 只能靠每日这一条跨仓库核对兜住（两边匿名 ls-remote，不引新密钥）。
      # 放最后且 `always()`：它红或没结论都不挡前面任何树级读数。两边都是匿名 ls-remote，
      # 不引新密钥；`--allow-no-fact` 只把「今天这条链没连上」记成警告，不冒充漂移。
      - name: 镜像漂移判据（CNB master vs GitHub master）
        timeout-minutes: 5
        if: always()
        run: node scripts/ci-mirror-drift.mjs --file-issue --allow-no-fact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

  # 失败立案（#3436 / 同族 #2274）：把「这一跑红了」变成一张 CNB 单。
  # 本档此前**没有**这一格 —— CNB 的 `每日失败立案` 判的是 CNB 自己的上一跑，本档这一跑
  # 不在它的读数面里；于是那次掉页（#3368 换了模型库的 UI 形状、e2e 用例没跟着改，
  # 全量E2E 红）只能靠人手动 `gh run view --log-failed` 再手动立案。判据在场、执行者不在场，
  # 这一格补的就是那个执行者。
  #
  # **为什么是独立 job 而不是 `daily` 里的一个 step**：见文件头那段（#3563）。一句话 ——
  # 脚本只认 jobs API 的 `steps[].conclusion`，而 step 形态下那个 job 自己还在飞，
  # 实测读回 0 个红格 ⇒ 零写入。`needs: daily` 让上游先 `completed`，conclusion 才是终值。
  daily-failure-issue:
    runs-on: ubuntu-24.04
    needs: daily
    # 判的是**上游那一跑**：`daily` 里任一格红即成立。绿跑一个字节都不付（job 直接 skipped）。
    if: failure()
    # 本格自己发没发出去不该给这一跑叠第二个红；但**不静默** —— 失败话术与手工出口由脚本
    # 原样打印（`tests/ci-ga-daily-failure-issue.test.ts` 钉住）。
    continue-on-error: true
    # 立案要读上游那一跑的**失败 job 日志正文**（#3584：正文直接贴红的那部分）。
    # 5m 是「只读 jobs API + 写单」那一版的预算，逐 job 拉日志（含重试与脱敏）会超；
    # 10m 让日志取不到时也有时间走完「取不到 + 出口」那一节，而不是被平台掐成半截单。
    timeout-minutes: 10
    steps:
      # 只要脚本自己与它 import 的那几个模块，不要历史也不要 LFS 字体（对位 pr-gate.yml
      # 的 `ga-verdict-callback`：整条 import 链只吃 node:*，所以这一 job 不装依赖）。
      - name: 检出（立案脚本在仓库里）
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.head_sha || github.sha }}
          fetch-depth: 1
          lfs: false

      - name: 装 Node（engines 下限 26.12.1；脚本只吃 node:*）
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: 失败立案（补洞：GA 每日档跑红 ⇒ CNB 单，按格名去重）
        env:
          # 内置 token 只读这一跑的 jobs（`actions: read` 见顶层 permissions）。
          GITHUB_TOKEN: ${{ github.token }}
          # CNB 侧建单 / 贴标签 / 评论（repo-issue:rw + repo-notes:rw），与 code-scanning-triage 同一枚。
          CNB_ISSUE_TOKEN: ${{ secrets.CNB_ISSUE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # `--no-block`：脚本自己的出口话术按「平台那一跳」念（非零落 0 + 手工出口），
        # 与 job 侧的 continue-on-error 同向，两边口径一致（同 .cnb.yml 那一格）。
        run: node scripts/ci-ga-daily-failure-issue.mjs --no-block
