<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comfy APP 正在启动</title>
  <style>
    :root {
      --bg: #0A0A0F;
      --surface: #12101C;
      --border: rgba(255, 255, 255, 0.08);
      --violet: #7C5CFC;
      --violet-dim: rgba(124, 92, 252, 0.25);
      --text: #E5E5E7;
      --muted: #9CA3AF;
      --dim: #6B7280;
      --error: #EF4444;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    /* 窗口即内容：启动页窗口按内容尺寸开（见 src-tauri/src/lib.rs 的
       SPLASH_WINDOW_SIZE），所以这里不再要求「居中一张卡片」，而是让面板
       铺满整个窗口，四周只留一点内边距——窗口边缘就是内容边缘，屏幕上
       不出现任何空白区域。 */
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(124, 92, 252, 0.12), transparent),
                  radial-gradient(1000px 500px at 90% 110%, rgba(255, 92, 168, 0.08), transparent),
                  var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    /* 面板是唯一的子元素，纵向撑满窗口：日志展开时由日志面板吃掉剩余高度，
       收起时内容在上、下方不留空白带（窗口高度本来就按内容给）。 */
    .card {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      padding: 14px 16px 12px;
      background: #151320;
    }
    /* 标题行：品牌 + 窗口按钮（最小化 / 关闭）。
       窗口本身关了原生装饰（decorations: false），系统标题栏与那三个按钮
       都不再存在，这两个按钮就是启动期唯一的最小化 / 关闭入口。
       「哪块能拖」由页面脚本显式接管（见 startSplashDrag）：落点不在交互件
       上就调 startDragging()。交互件这里同时用 -webkit-app-region: no-drag
       标出来，与脚本判据同源（与主窗口自定义标题行同一套约定）。 */
    .titlebar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 10px;
    }
    .brand {
      font-size: 17px;
      font-weight: 700;
      color: var(--violet);
      margin: 0;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .win-buttons {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }
    .win-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-family: inherit;
    }
    .win-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
    }
    .win-btn.danger:hover {
      background: var(--error);
      color: #fff;
    }
    .stale-banner {
      display: none;
      margin: 0 0 10px;
      /* 提示是多行的（诊断 + 修复命令），必须按换行原样渲染：
         压成一行会把「先做什么」挤没，而这正是用户此刻唯一能照着做的东西。 */
      white-space: pre-wrap;
      padding: 8px 10px;
      border: 1px solid rgba(245, 180, 60, 0.35);
      background: rgba(245, 180, 60, 0.1);
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.6;
      color: #F5C07A;
      word-break: break-word;
    }
    .bar-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--violet), #9F7CFF);
      border-radius: 999px;
      transition: width 0.35s ease;
      box-shadow: 0 0 12px var(--violet-dim);
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .phase {
      color: var(--muted);
      font-weight: 500;
    }
    .message {
      font-size: 12px;
      line-height: 1.5;
      color: var(--dim);
      min-height: 34px;
      word-break: break-word;
      flex-shrink: 0;
    }
    .message.error {
      color: var(--error);
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      font-size: 11px;
      color: var(--dim);
      flex-shrink: 0;
    }
    .elapsed {
      font-variant-numeric: tabular-nums;
    }
    .hint {
      opacity: 0.7;
    }
    .log-toggle {
      -webkit-app-region: no-drag;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--muted);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .log-toggle:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.3);
    }
    /* 日志面板吃掉剩余高度（不再写死 320px）：展开时窗口同步放大
       （set_splash_compact(false)），面板随窗口长高，单行日志一次能看到
       更多行；窗口被用户拉大时也不会在面板下方留空白。 */
    .log-panel {
      display: none;
      /* 日志面板里要能选中复制现场（见 pre 的 user-select: text），
         所以整块不参与拖拽，否则按住一拖就把窗口带走了。 */
      -webkit-app-region: no-drag;
      margin-top: 12px;
      background: #0B0A12;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
    }
    .log-panel pre {
      margin: 0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
      /* 一行一条日志：不折行、超宽横向滚动。让每一行都完整地待在一行里，
         读日志才是「扫一眼」；折行的日志会让人分不清哪一行的尾巴接到了哪儿。 */
      white-space: pre;
      overflow-x: auto;
      /* 日志内容允许选中复制，便于把启动卡住的现场发给协作者 */
      user-select: text;
    }
    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 1.5px solid rgba(124, 92, 252, 0.3);
      border-top-color: var(--violet);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="titlebar">
      <h1 class="brand">Comfy APP</h1>
      <p class="subtitle" id="subtitle">正在启动桌面应用…</p>
      <div class="win-buttons">
        <button
          class="win-btn"
          id="btn-minimize"
          type="button"
          title="最小化"
          aria-label="最小化"
          data-win-action="minimize"
          onclick="window.__splashWinAction && window.__splashWinAction('minimize')"
        >
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M2 6h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
        </button>
        <button
          class="win-btn danger"
          id="btn-close"
          type="button"
          title="关闭"
          aria-label="关闭"
          data-win-action="close"
          onclick="window.__splashWinAction && window.__splashWinAction('close')"
        >
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
            <path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </div>
    <div class="stale-banner" id="stale-banner"></div>
    <div class="bar-track">
      <div class="bar-fill" id="bar"></div>
    </div>
    <div class="meta">
      <span class="phase" id="phase"><span class="spinner"></span>初始化</span>
      <span id="percent">0%</span>
    </div>
    <div class="message" id="message">启动器正在初始化…</div>
    <div class="footer">
      <span class="hint">关闭（右上角 ✕）即放弃本次启动</span>
      <button class="log-toggle" id="log-btn" type="button">查看日志</button>
      <span class="elapsed" id="elapsed">00:00</span>
    </div>
    <div class="log-panel" id="log-panel">
      <pre id="log-pre"></pre>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const bar = $('bar');
    const phaseEl = $('phase');
    const percentEl = $('percent');
    const messageEl = $('message');
    const elapsedEl = $('elapsed');
    const logBtn = $('log-btn');
    const logPanel = $('log-panel');
    const logPre = $('log-pre');

    const PHASE_LABELS = {
      initial: '初始化',
      'port-check': '检查端口占用',
      'port-ready': '端口已就绪',
      cache: '处理编译缓存',
      'job-object': '创建进程容器',
      'dev-server-starting': '启动本地服务',
      'tauri-compiling': '编译桌面壳',
      'tauri-shell-started': '桌面壳已启动',
      'dev-server-ready': '服务已就绪',
      ready: '启动完成',
      error: '启动失败',
      timeout: '仍在启动',
      // 壳自编排（ISSUE #784）后新增的三档：壳自己会在「编排器还没写状态」的
      // 窗口期写一份 fallback 快照（见 src/lib/shell/launch-diagnostics.ts），
      // 状态文件真读不到时 Rust 侧回 no-status-file。标签给全，页面才不会把
      // 这几档显示成裸的英文 phase 名。
      'shell-boot': '桌面壳已启动',
      'shell-prepare': '准备启动环境',
      'shell-orchestrating': '拉起本地服务',
      'no-status-file': '等待状态文件',
    };

    function fmtTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // 原始 IPC 调用：命令返回 Err 时抛错。invoke 封装会吞掉错误返回 null，
    // 而导航失败时上层需要区分「失败」（继续轮询重试）与「无数据」。
    async function invokeRaw(cmd, args) {
      if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
        return await window.__TAURI__.core.invoke(cmd, args || {});
      }
      throw new Error('tauri ipc unavailable');
    }

    async function invoke(cmd, args) {
      try {
        return await invokeRaw(cmd, args);
      } catch (e) {
        console.warn('tauri invoke failed:', e);
      }
      return null;
    }

    // ── 窗口按钮（最小化 / 关闭）与尺寸档位 ──
    // 启动页窗口关了原生装饰（decorations: false），系统标题栏连同它的
    // 最小化 / 关闭按钮都不存在，这两个按钮就是启动期唯一的窗口出口。
    //
    // 三条互补的调用路径，任一条能成就成（见 docs/standards/07-日志系统.md §7.18.7）：
    //   ① 脚本就绪后在此绑定监听 —— 常规路径；
    //   ② 按钮内联 onclick 调 window.__splashWinAction —— 脚本还没跑到绑定、
    //      或监听器被别的东西清掉时的兜底；两条路走同一个入口 performWinAction，
    //      因此不会重复触发；
    //   ③ 应用自建命令 win_minimize / win_close（壳侧直接操作窗口）——
    //      Tauri window API 抛错或全局对象不可得时的最后一条。
    // 三条都不可用时消息区给出可见提示（不再「点了没反应」）。
    const COMPACT_SIZE = { width: 744, height: 216 };
    const subtitleEl = $('subtitle');

    /** 正在执行的窗口动作（'' 表示空闲）——onclick 与监听两条路的去重。 */
    let winActionPending = '';
    /** 提示定时器：连续点击不叠出多个。 */
    let winActionNoticeTimer = 0;

    /** 在消息区给出可见提示（借 8 秒后把进度文案还回去）。 */
    function noticeWindowAction(text) {
      if (!messageEl) return;
      clearTimeout(winActionNoticeTimer);
      const previous = messageEl.dataset.progressText ?? messageEl.textContent ?? '';
      messageEl.dataset.progressText = previous;
      messageEl.textContent = text;
      winActionNoticeTimer = setTimeout(() => {
        if (messageEl.dataset.progressText !== undefined) {
          messageEl.textContent = messageEl.dataset.progressText;
          delete messageEl.dataset.progressText;
        }
      }, 8000);
    }

    /**
     * 取当前启动页窗口。
     * 优先 `getCurrentWindow()`；老版本全局对象里没有它时用
     * `getCurrentWebviewWindow()` 兜底；都不可得时返回 null（走壳命令路径）。
     */
    function currentWindow() {
      const api = window.__TAURI__ && window.__TAURI__.window;
      if (!api) return null;
      try {
        if (typeof api.getCurrentWindow === 'function') return api.getCurrentWindow();
        if (typeof api.getCurrentWebviewWindow === 'function') return api.getCurrentWebviewWindow();
      } catch (e) {
        console.warn('resolve current window failed:', e);
      }
      return null;
    }

    /** 真正执行一次窗口动作：成功返回 true。 */
    async function runWindowAction(action) {
      const win = currentWindow();
      if (win) {
        try {
          if (action === 'close') await win.close();
          else await win.minimize();
          return true;
        } catch (e) {
          console.warn('window ' + action + ' via api failed:', e);
        }
      }
      // 壳命令兜底：命令没注册（壳过期）或失败都算未完成。
      const fallback = action === 'close' ? 'win_close' : 'win_minimize';
      try {
        await invokeRaw(fallback);
        return true;
      } catch (e) {
        console.warn('window ' + action + ' via ' + fallback + ' failed:', e);
      }
      return false;
    }

    /** 按钮的唯一入口（监听与内联 onclick 都走到这里，重复调用自动去重）。 */
    async function performWinAction(action) {
      if (winActionPending === action) return;
      winActionPending = action;
      try {
        const done = await runWindowAction(action);
        if (!done) {
          noticeWindowAction(
            action === 'close'
              ? '关闭失败：当前壳缺少窗口命令，请更新（重编壳 / 重新打包启动器）'
              : '最小化失败：当前壳缺少窗口命令，请更新（重编壳 / 重新打包启动器）',
          );
        }
      } finally {
        winActionPending = '';
      }
    }

    // 兜底路径②的落点：先挂上，任何时刻点击都有响应。
    window.__splashWinAction = (action) => {
      void performWinAction(action === 'close' ? 'close' : 'minimize');
    };

    // 兜底路径①：正常的事件监听（与内联 onclick 同入口，不会执行两次）。
    const minBtn = $('btn-minimize');
    const closeBtn = $('btn-close');
    if (minBtn) minBtn.addEventListener('click', () => void performWinAction('minimize'));
    if (closeBtn) closeBtn.addEventListener('click', () => void performWinAction('close'));

    // ── 拖动窗口 ──
    // 窗口关了原生装饰（decorations: false），系统标题栏连同它的拖拽区一起消失，
    // 「能拖」只能由页面自己给。此前只有 .titlebar 一条是拖拽区——十几像素高、
    // 右侧还被按钮占掉，按到窗口其余任何地方都不动，用户看到的就是「拖不动」。
    //
    // 现在改由这条脚本统一接管：按主键且落点不在交互件上，就调 startDragging()，
    // 于是整窗（含面板内边距）都能拖。为什么不用 CSS -webkit-app-region: drag：
    // 非客户区判定在各 WebView 引擎上并不一致（主窗正是因此走的
    // window-controls-client 里的同款 startDragging 调用），显式调用是一条唯一
    // 判据，也才好把「哪块能拖」与下面那条 ACL 权限绑在一起。
    //
    // 第二个成因是权限：启动页来自内嵌本地源，而 core:default **不含**
    // allow-start-dragging —— 未授权时拖拽会被 ACL 静默拒绝，页面看起来完全正常，
    // 就是按住不动。权限声明在 capabilities/splash.json（与主窗同一条）。
    //
    // 判定口径与主窗口 title-bar-derive 的 isDragRegionTarget 一致：
    // 落点落在 button/a/input/textarea/select/[data-no-drag] 上就不拖，
    // 按钮点击与日志文本的选中复制才不会被拖拽吞掉。
    const INTERACTIVE_SELECTOR = 'button, a, input, textarea, select, [data-no-drag]';

    /** 按住窗口任意非交互区域即开始拖动。 */
    async function startSplashDrag(event) {
      const target = event && event.target;
      if (target && typeof target.closest === 'function' && target.closest(INTERACTIVE_SELECTOR)) {
        return;
      }
      const win = currentWindow();
      if (!win || typeof win.startDragging !== 'function') {
        // 壳过期（老壳没有 window API）时给出可见提示，而不是静默「拖不动」。
        noticeWindowAction('拖动失败：当前壳缺少窗口命令，请更新（重编壳 / 重新打包启动器）');
        return;
      }
      try {
        await win.startDragging();
      } catch (e) {
        console.warn('startDragging failed:', e);
        noticeWindowAction('拖动失败：当前壳缺少窗口命令，请更新（重编壳 / 重新打包启动器）');
      }
    }

    // pointerdown 只在主键时接管（右键 / 中键不拖窗口）。
    document.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      void startSplashDrag(e);
    });

    // 「壳命令是否就位」不做启动期探测：invoke 命令就是真的执行（调 win_minimize
    // 会真的把窗口最小化），启动页会一出现就自己缩进任务栏。壳是否过期由用户
    // 真正点按钮时的三条互补路径判断，全部失败时消息区已给出可见提示。

    /** 把窗口调到与内容匹配的档位（展开日志变宽变高，收起回到紧凑）。 */
    async function applyCompact(compact) {
      subtitleEl.textContent = compact ? '正在启动桌面应用…' : '正在启动桌面应用…（展开日志）';
      // 尺寸由壳按与建窗同一份常量计算（含显示器上限），页面不自己写第二份
      // magic number，只把「紧凑 / 展开」这件事告诉壳。非壳环境忽略。
      await invoke('set_splash_compact', { compact });
      if (!compact) return;
      // 收起日志时若用户手动拉大过窗口，把它收回内容宽度：窗口状态插件不记忆
      // splash，回落档位以 COMPACT_SIZE 为准，避免「收起后仍是宽窗」的空白。
      const win = currentWindow();
      const api = window.__TAURI__ && window.__TAURI__.window;
      if (win && api && api.LogicalSize) {
        void win
          .setSize(new api.LogicalSize(COMPACT_SIZE.width, COMPACT_SIZE.height))
          .then(() => win.center())
          .catch((e) => console.warn('restore splash size failed:', e));
      }
    }

    async function fetchStatus() {
      try {
        const data = await invoke('get_launch_status');
        if (data) return typeof data === 'string' ? JSON.parse(data) : data;
      } catch (e) {
        // 首次启动时 Rust command 可能尚未注册，静默重试
      }
      return null;
    }

    // 解析出需要探测的真实应用 URL：优先 Rust 状态 > launch-status.json > 兜底 dev URL
    async function resolveAppUrl() {
      try {
        const url = await invoke('get_app_url');
        if (url) return url;
      } catch (e) {}
      try {
        const status = await fetchStatus();
        if (status && status.app_url) return status.app_url;
      } catch (e) {}
      return 'http://127.0.0.1:3000/workspace';
    }

    // 探测后端是否「真正就绪」：打 /api/health（权威就绪端点），且要求可读的 2xx。
    // 为什么不再探 appUrl（/workspace 页面路由）、也不再用 no-cors HEAD 兜底：
    //   · 「Turbopack 会话级路由失效」时页面路由仍回 200、只有 /api/* 404，探页面
    //     会把半死会话判成就绪、导航进一个数据永远加载不出的页面（正是自退事故的
    //     前奏）；/api/health 只有服务与数据层都就绪才回 200，是权威判据。
    //   · no-cors 的响应是 opaque，读不到状态码，404 也不会让 fetch 抛错——等于
    //     「端口一应答就算就绪」，是过早导航的根因。health 端点已放行 CORS，
    //     cors GET 能读到真实状态码。
    async function probeBackend(appUrl) {
      let healthUrl;
      try {
        const u = new URL(appUrl);
        healthUrl = `${u.protocol}//${u.host}/api/health`;
      } catch (e) {
        healthUrl = appUrl;
      }
      try {
        const r = await fetch(healthUrl, {
          method: 'GET',
          cache: 'no-store',
          mode: 'cors',
        });
        return r.ok; // 仅 2xx 算就绪；404/5xx/连不上一律继续等
      } catch (e) {
        return false;
      }
    }

    // 进度条只进不退：launcher 写状态文件与 splash 自身探测是两条并行的更新来源，
    // 探测成功瞬间状态文件里可能还是旧文案（下秒才刷新），若直接覆盖会来回跳。
    // 错误态不受此限制：失败提示必须始终能透出，避免被高进度挡住。
    let maxProgress = 0;
    /* 壳的常驻快照轮（`fallback: true`）里进度恒为 0：那**不是**「退回起点」，
     * 而是「这一刻还没有权威进度」。可它写盘比编排器更晚（壳在起编排器之后才
     * 把快照推进到 shell-orchestrating），于是轮询到它时 0.3 会被 0 顶掉 ——
     * 「启动本地服务」退回「拉起本地服务」、进度条退回 0%，看起来像启动自己
     * 重来了一遍（ISSUE #784 手验反馈）。因此这一轮只更新文案，进度取两者
     * 较大值：快照永远不许让进度条倒退。 */
    let updateFromShellFallback = false;

    function updateUI(progress, phase, message, error, elapsed) {
      let raw = Math.max(0, Math.min(1, progress || 0));
      if (updateFromShellFallback && !error) raw = Math.max(raw, maxProgress);
      if (raw < maxProgress && !error) return;
      maxProgress = raw;
      const pct = Math.round(raw * 100);
      bar.style.width = `${pct}%`;
      percentEl.textContent = `${pct}%`;

      const label = PHASE_LABELS[phase] || phase || '启动中';
      phaseEl.innerHTML = pct >= 100
        ? '✓ ' + label
        : '<span class="spinner"></span>' + label;

      // 消息区正被「窗口按钮失败」提示占用时不要被轮询顶掉：那句提示是
      // 用户「点了没反应」时唯一的解释（8 秒后自动交还进度文案）。
      if (messageEl.dataset.progressText === undefined) {
        messageEl.textContent = message || '';
        messageEl.classList.toggle('error', !!error);
      } else {
        messageEl.dataset.progressText = message || '';
      }
      elapsedEl.textContent = fmtTime(elapsed || 0);
    }

    // ── 日志面板：展示 dev-launcher 编排日志尾部（Rust 命令 get_launch_log 提供）──
    let logVisible = false;
    let logTimer = null;
    let logFailCount = 0;

    function renderLog(text) {
      if (text === logPre.dataset.raw) return;
      logPre.dataset.raw = text || '';
      logPre.textContent = text || '';
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    /** 把「读不到日志」翻译成「现在看哪里、下一步做什么」。
     *
     * 事实一律来自壳侧报告（`get_launch_status` 的 diagnostics：壳写下的路径
     * 与项目根），不猜文件名 —— 手验反馈「启动读不到日志，启动状态文件也没有」
     * 的根因就是旧提示把用户指去两份此刻恰好为空的文件（ISSUE #784）。
     * 取不到报告（纯 Web / 壳过旧）才退回「重编壳」那一句。
     */
    async function emptyLogGuidance() {
      const lines = ['（面板暂时读不到日志。）'];
      const status = await fetchStatus();
      const diag = (status && status.diagnostics) || null;
      if (diag) {
        lines.push('桌面壳已接手编排，但日志还没落地。现在按顺序看这几处：');
        lines.push(`  1) 壳侧编排链路（壳自己写的，启动期最先有内容）：${diag.launchLog || '(未知)'}`);
        lines.push(`  2) 壳日志（release）：${diag.shellLog || '(未知)'}`);
        lines.push(`  3) 启动状态文件：${diag.statusFile || '(未知)'}`);
        if (diag.projectRoot) lines.push(`项目根：${diag.projectRoot}`);
        lines.push('编排器（dev-launcher.mjs）写自己那份日志之前，第 1 份就是唯一的现场。');
        return lines.join('\n');
      }
      lines.push('状态里连诊断路径都没带（说明桌面壳过旧），请重编壳后重试：');
      lines.push('  cd src-tauri && cargo build --release --features custom-protocol');
      return lines.join('\n');
    }

    /** 「这次启动已经失败了」的诊断头。
     *
     * 编排器自己写的 `phase: error` 状态只带一句标题（`启动失败，见 log/`），
     * 明细全在日志里；壳识别出自编排走不通时写的 `shellLaunchFailed` 更是
     * **只有状态文件里有说明**——面板不把它带出来，用户就只能对着
     * 「启动失败，见 log/」和一屏还没落地的路径干瞪眼（ISSUE #784 手验反馈）。
     * 诊断内容一律取壳写下的字段，页面不自己拼路径。 */
    function failureDiagnostics(status) {
      const lines = ['（本次启动已经失败，下面就是现场。）'];
      if (status && status.message) lines.push(status.message);
      if (status && status.shellLaunchFailed) {
        lines.push('（自编排没能起来：这一条不依赖日志文件，直接从启动状态里读出来的）');
      }
      const diag = (status && status.diagnostics) || null;
      if (diag) {
        lines.push('按顺序看这几处（存在哪份就先看哪份）：');
        if (diag.projectRoot) lines.push(`项目根：${diag.projectRoot}`);
        lines.push(`  1) 壳侧编排链路（壳自己写的，启动期最先有内容）：${diag.launchLog || '(未知)'}`);
        lines.push(`  2) 壳日志（release）：${diag.shellLog || '(未知)'}`);
        lines.push(`  3) 启动状态文件：${diag.statusFile || '(未知)'}`);
      }
      lines.push('诊断面板只读日志文件；日志还没落地时，上面这一份说明就是全部现场。');
      return lines.join('\n');
    }

    async function fetchLog() {
      const data = await invoke('get_launch_log');
      if (typeof data === 'string' && data) {
        logFailCount = 0;
        renderLog(data);
      } else {
        logFailCount++;
        /* 连续拿不到日志要能区分三种成因，否则用户看到空面板不知道该做什么：
         *   - **这次启动已经失败**（状态里 error / shellLaunchFailed）→ 先把
         *     失败说明与诊断出口摆出来，别让人以为「再等等就好」（见
         *     failureDiagnostics）；
         *   - 日志确实还没产生（启动第一步卡住 / 编排器还没起）→ 给出壳写下的
         *     诊断路径（emptyLogGuidance，判据是壳的报告而不是页面自己猜）；
         *   - 壳版本过旧 / IPC 不可用（连路径都拿不到）→ 提示重编壳。 */
        if (logFailCount === 4 && !logPre.dataset.raw) {
          const status = await fetchStatus();
          renderLog(
            status && (status.error || status.shellLaunchFailed)
              ? failureDiagnostics(status)
              : await emptyLogGuidance(),
          );
        }
      }
    }

    /* 先预热一次：用户点开「查看日志」时面板立刻有内容，而不是空白几十毫秒。 */
    fetchLog();

    logBtn.addEventListener('click', () => {
      logVisible = !logVisible;
      logPanel.style.display = logVisible ? 'block' : 'none';
      logBtn.textContent = logVisible ? '隐藏日志' : '查看日志';
      // 窗口也跟着内容变：展开日志时窗口放大到「一屏放得下多少行日志」，
      // 收起时回到紧凑尺寸——窗口始终与内容同尺寸，屏幕上不留空白区。
      void applyCompact(!logVisible);
      if (logVisible) {
        fetchLog();
        logTimer = setInterval(fetchLog, 800);
      } else if (logTimer) {
        clearInterval(logTimer);
        logTimer = null;
      }
    });

    let navigating = false;
    let ticks = 0;
    let appUrl = null;

    async function tick() {
      if (navigating) return;
      ticks++;

      if (!appUrl) appUrl = await resolveAppUrl();

      // 1. 先尝试读取 launcher 写入的进度信息（如果有）
      const status = await fetchStatus();
      // 启动已经失败时，「再等等」不是出路：把面板打开摆到用户面前。
      // 壳识别出自编排走不通时写的状态（`shellLaunchFailed`）可能只有一句标题
      // （`启动失败，见 log/`），明细全在日志文件里；用户此刻唯一能做的动作就是
      // 看日志（ISSUE #784 手验反馈：失败态下没有任何可见出口）。
      if (status && (status.error || status.shellLaunchFailed) && !logVisible) {
        logBtn.click();
      }
      if (status) {
        // 这一轮是不是壳的快照（而非编排器的权威进度）——见 updateUI 上的说明。
        updateFromShellFallback =
          status.fallback === true || status.phase === 'no-status-file';
        updateUI(status.progress || 0, status.phase, status.message, status.error, status.elapsed);
        // 壳过期提醒（dev-launcher 预检写入 launch-status.json 的 stale_shell）
        // 常驻语义：一旦出现过就保持可见（window.staleShown 锁存），不再随
        // 后续轮询反复显示/隐藏——状态文件里的 stale_shell 消失（如字段
        // 被部分写入）也不闪没，直到本启动页生命周期结束。
        const banner = document.getElementById('stale-banner');
        if (banner) {
          if (status.stale_shell) {
            if (!window.staleShown) {
              window.staleShown = true;
              banner.textContent = '⚠ ' + String(status.stale_shell).replace(/\r\n?/g, '\n');
            }
            banner.style.display = 'block';
          } else if (!window.staleShown) {
            banner.style.display = 'none';
          }
        }
      } else {
        // 读不到状态：下面那份是本页自己按时间推的假进度，同样不许被别的来源
        // 顶退，所以标记清零。
        updateFromShellFallback = false;
        // 没有状态文件时显示等待动画，进度按时间平滑增长但不要满 100%
        const secs = Math.floor(ticks / 4);
        const fakeProgress = Math.min(0.9, ticks / 480); // 约 2 分钟到 90%
        /* 久等而无进度时，把「怎么自查」写进同一条消息——启动页是用户此刻唯一
         * 能看到的界面，只显示一个转圈的秒数等于让人干等（ISSUE #360）。
         * 提示要指向**壳真实写下的路径**（diagnostics 由壳给出）：写死的
         * run/launch-status.json 在项目根推不出来时指向一个不存在的位置，
         * 用户照着找只会更困惑（ISSUE #784 手验反馈）。 */
        const diag = (status && status.diagnostics) || null;
        const hint =
          secs > 90
            ? `· 等待超过 90 秒，可点「查看日志」，或看启动状态文件 ${
                (diag && diag.statusFile) || 'run/launch-status.json'
              }`
            : '· 可随时点「查看日志」看执行到哪一步';
        updateUI(
          fakeProgress,
          'dev-server-starting',
          `正在等待本地服务就绪：${appUrl}（已用 ${fmtTime(secs)}）${hint}`,
          false,
          secs,
        );
      }

      // 2. 导航以启动器的权威就绪状态为准（`status.ready`）：启动器已在服务端
      //    验过 /api/health 返回 200，且检测到陈旧路由表会先清缓存自愈，所以它
      //    说「就绪」才是真就绪。只有拿不到启动器状态（纯 Web、无壳 IPC）时，
      //    才退回自主探测 /api/health。两条都要求真就绪，杜绝「端口一应答就把
      //    隐藏主窗导航进一个 /api/* 全 404、数据永远加载不出的半死页面」。
      //    导航失败下个 tick 重试（3 秒节流，避免高频重复导航打断正在编译路由的
      //    dev server）。
      // 壳的常驻快照（`fallback: true` / `no-status-file`）**不是**权威进度：
      // 它只回答「壳接手了、在等谁」，不回答「服务好了没」。就绪判据仍只有
      // `status.ready === true`（编排器在服务端验过 /api/health）；快照则在
      // 下面第二支里退回自主探测，由 /api/health 定夺。
      const shellFallback =
        !!status && (status.fallback === true || status.phase === 'no-status-file');
      const authoritativeReady = !!(status && status.ready === true);
      // 中间那一段「状态文件不在、但编排器还在起」的窗口期——自编排链路
      //（双击壳，见 ISSUE #784）里壳自己刚把 dev-launcher 拉起来，它写第一份
      // launch-status.json 之前有 1~2 秒空档——由自主探测补齐：状态文件不在
      // 时探 /api/health，真就绪才导航。判据与「状态文件在」时同源（都要求
      // 2xx），因此不会把半死会话放进来。
      const shouldNavigate =
        authoritativeReady || ((!status || shellFallback) && (await probeBackend(appUrl)));
      if (shouldNavigate) {
        navigating = true;
        updateUI(0.95, 'dev-server-ready', '服务已就绪，正在加载应用…', false, Math.floor(ticks / 4));
        setTimeout(() => { navigating = false; }, 3000);
        try {
          await invokeRaw('navigate_to_app');
        } catch (e) {
          console.warn('navigate_to_app failed, will retry:', e);
        }
      }
    }

    // 开局把窗口尺寸对齐到「紧凑」档（壳建窗时已设过一次；用户上次把窗口
    // 拉大后重启，这里再对齐一次以保证一致）。
    void applyCompact(true);

    // 首次立即执行，随后每 250ms 轮询，保证启动页观感顺滑
    tick();
    setInterval(tick, 250);
  </script>
</body>
</html>
