<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Comfy APP 正在启动</title>
  <style>
    :root {
      --bg: #0A0A0F;
      --surface: #12101C;
      --border: rgba(255, 255, 255, 0.08);
      --violet: #7C5CFC;
      --violet-dim: rgba(124, 92, 252, 0.25);
      --text: #E5E5E7;
      --muted: #9CA3AF;
      --dim: #6B7280;
      --error: #EF4444;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: radial-gradient(1200px 600px at 20% -10%, rgba(124, 92, 252, 0.12), transparent),
                  radial-gradient(1000px 500px at 90% 110%, rgba(255, 92, 168, 0.08), transparent),
                  var(--bg);
      color: var(--text);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }
    .card {
      width: min(520px, calc(100vw - 48px));
      /* 不用半透明 + backdrop-filter：WebView2 在某些显卡/驱动下会把这层渲染成
         透明或黑块，导致启动页只剩窗口底色。改用不透明面板保证可见。 */
      background: #151320;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius);
      padding: 32px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
    }
    .brand {
      font-size: 22px;
      font-weight: 700;
      color: var(--violet);
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 13px;
      color: var(--muted);
      margin: 0 0 22px;
    }
    .bar-track {
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--violet), #9F7CFF);
      border-radius: 999px;
      transition: width 0.35s ease;
      box-shadow: 0 0 12px var(--violet-dim);
    }
    .meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 12px;
      color: var(--dim);
      margin-bottom: 10px;
    }
    .phase {
      color: var(--muted);
      font-weight: 500;
    }
    .message {
      font-size: 12px;
      line-height: 1.5;
      color: var(--dim);
      min-height: 36px;
      word-break: break-word;
    }
    .message.error {
      color: var(--error);
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      font-size: 11px;
      color: var(--dim);
    }
    .elapsed {
      font-variant-numeric: tabular-nums;
    }
    .hint {
      opacity: 0.7;
    }
    .stale-banner {
      display: none;
      margin: 0 0 14px;
      padding: 10px 12px;
      border: 1px solid rgba(245, 180, 60, 0.35);
      background: rgba(245, 180, 60, 0.1);
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.6;
      color: #F5C07A;
      word-break: break-word;
    }
    .log-toggle {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--muted);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
    }
    .log-toggle:hover {
      color: var(--text);
      border-color: rgba(255, 255, 255, 0.3);
    }
    .log-panel {
      display: none;
      margin-top: 14px;
      background: #0B0A12;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      height: 180px;
      overflow-y: auto;
    }
    .log-panel pre {
      margin: 0;
      font-family: Consolas, "Courier New", monospace;
      font-size: 11px;
      line-height: 1.5;
      color: var(--muted);
      white-space: pre-wrap;
      word-break: break-all;
      /* 日志内容允许选中复制，便于把启动卡住的现场发给协作者 */
      user-select: text;
    }
    .spinner {
      display: inline-block;
      width: 10px;
      height: 10px;
      border: 1.5px solid rgba(124, 92, 252, 0.3);
      border-top-color: var(--violet);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="brand">Comfy APP</h1>
    <p class="subtitle">正在启动桌面应用…</p>
    <div class="stale-banner" id="stale-banner"></div>
    <div class="bar-track">
      <div class="bar-fill" id="bar"></div>
    </div>
    <div class="meta">
      <span class="phase" id="phase"><span class="spinner"></span>初始化</span>
      <span id="percent">0%</span>
    </div>
    <div class="message" id="message">启动器正在初始化…</div>
    <div class="footer">
      <span class="hint">窗口关闭即可终止启动</span>
      <button class="log-toggle" id="log-btn" type="button">查看日志</button>
      <span class="elapsed" id="elapsed">00:00</span>
    </div>
    <div class="log-panel" id="log-panel">
      <pre id="log-pre"></pre>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const bar = $('bar');
    const phaseEl = $('phase');
    const percentEl = $('percent');
    const messageEl = $('message');
    const elapsedEl = $('elapsed');
    const logBtn = $('log-btn');
    const logPanel = $('log-panel');
    const logPre = $('log-pre');

    const PHASE_LABELS = {
      initial: '初始化',
      'port-check': '检查端口占用',
      'port-ready': '端口已就绪',
      cache: '处理编译缓存',
      'job-object': '创建进程容器',
      'dev-server-starting': '启动本地服务',
      'tauri-compiling': '编译桌面壳',
      'tauri-shell-started': '桌面壳已启动',
      'dev-server-ready': '服务已就绪',
      ready: '启动完成',
      error: '启动失败',
      timeout: '仍在启动',
    };

    function fmtTime(sec) {
      const m = Math.floor(sec / 60).toString().padStart(2, '0');
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    // 原始 IPC 调用：命令返回 Err 时抛错。invoke 封装会吞掉错误返回 null，
    // 而导航失败时上层需要区分「失败」（继续轮询重试）与「无数据」。
    async function invokeRaw(cmd, args) {
      if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
        return await window.__TAURI__.core.invoke(cmd, args || {});
      }
      throw new Error('tauri ipc unavailable');
    }

    async function invoke(cmd, args) {
      try {
        return await invokeRaw(cmd, args);
      } catch (e) {
        console.warn('tauri invoke failed:', e);
      }
      return null;
    }

    async function fetchStatus() {
      try {
        const data = await invoke('get_launch_status');
        if (data) return typeof data === 'string' ? JSON.parse(data) : data;
      } catch (e) {
        // 首次启动时 Rust command 可能尚未注册，静默重试
      }
      return null;
    }

    // 解析出需要探测的真实应用 URL：优先 Rust 状态 > launch-status.json > 兜底 dev URL
    async function resolveAppUrl() {
      try {
        const url = await invoke('get_app_url');
        if (url) return url;
      } catch (e) {}
      try {
        const status = await fetchStatus();
        if (status && status.app_url) return status.app_url;
      } catch (e) {}
      return 'http://127.0.0.1:3000/workspace';
    }

    // 探测后端是否已可访问：先尝试跨域 GET，失败再用 no-cors HEAD 兜底
    async function probeBackend(url) {
      try {
        const r = await fetch(url, { method: 'GET', cache: 'no-store', mode: 'cors' });
        if (r.ok) return true;
      } catch (e) {
        // 可能 CORS 或尚未就绪，继续 fallback
      }
      try {
        await fetch(url, { method: 'HEAD', cache: 'no-store', mode: 'no-cors' });
        return true;
      } catch (e) {}
      return false;
    }

    // 进度条只进不退：launcher 写状态文件与 splash 自身探测是两条并行的更新来源，
    // 探测成功瞬间状态文件里可能还是旧文案（下秒才刷新），若直接覆盖会来回跳。
    // 错误态不受此限制：失败提示必须始终能透出，避免被高进度挡住。
    let maxProgress = 0;

    function updateUI(progress, phase, message, error, elapsed) {
      const raw = Math.max(0, Math.min(1, progress || 0));
      if (raw < maxProgress && !error) return;
      maxProgress = raw;
      const pct = Math.round(raw * 100);
      bar.style.width = `${pct}%`;
      percentEl.textContent = `${pct}%`;

      const label = PHASE_LABELS[phase] || phase || '启动中';
      phaseEl.innerHTML = pct >= 100
        ? '✓ ' + label
        : '<span class="spinner"></span>' + label;

      messageEl.textContent = message || '';
      messageEl.classList.toggle('error', !!error);
      elapsedEl.textContent = fmtTime(elapsed || 0);
    }

    // ── 日志面板：展示 dev-launcher 编排日志尾部（Rust 命令 get_launch_log 提供）──
    let logVisible = false;
    let logTimer = null;
    let logFailCount = 0;

    function renderLog(text) {
      if (text === logPre.dataset.raw) return;
      logPre.dataset.raw = text || '';
      logPre.textContent = text || '';
      logPanel.scrollTop = logPanel.scrollHeight;
    }

    async function fetchLog() {
      const data = await invoke('get_launch_log');
      if (typeof data === 'string') {
        logFailCount = 0;
        renderLog(data);
      } else {
        logFailCount++;
        // 连续拿不到日志（壳版本过旧 / IPC 不可用 / 日志尚未产生）时给出指引
        if (logFailCount === 4 && !logPre.dataset.raw) {
          renderLog('（暂无日志：启动器尚未写入输出；若持续为空请重编桌面壳：cd src-tauri && cargo build --release）');
        }
      }
    }

    logBtn.addEventListener('click', () => {
      logVisible = !logVisible;
      logPanel.style.display = logVisible ? 'block' : 'none';
      logBtn.textContent = logVisible ? '隐藏日志' : '查看日志';
      if (logVisible) {
        fetchLog();
        logTimer = setInterval(fetchLog, 800);
      } else if (logTimer) {
        clearInterval(logTimer);
        logTimer = null;
      }
    });

    let navigating = false;
    let ticks = 0;
    let appUrl = null;

    async function tick() {
      if (navigating) return;
      ticks++;

      if (!appUrl) appUrl = await resolveAppUrl();

      // 1. 先尝试读取 launcher 写入的进度信息（如果有）
      const status = await fetchStatus();
      if (status) {
        updateUI(status.progress || 0, status.phase, status.message, status.error, status.elapsed);
        // 壳过期提醒（dev-launcher 预检写入 launch-status.json 的 stale_shell）
        const banner = document.getElementById('stale-banner');
        if (banner) {
          if (status.stale_shell) {
            banner.textContent = '⚠ ' + status.stale_shell;
            banner.style.display = 'block';
          } else {
            banner.style.display = 'none';
          }
        }
      } else {
        // 没有状态文件时显示等待动画，进度按时间平滑增长但不要满 100%
        const fakeProgress = Math.min(0.9, ticks / 480); // 约 2 分钟到 90%
        updateUI(fakeProgress, 'dev-server-starting', `正在等待本地服务就绪：${appUrl}（${fmtTime(Math.floor(ticks / 4))}）`, false, Math.floor(ticks / 4));
      }

      // 2. 自主探测后端可响应后，请 Rust 侧把隐藏的应用窗口导航到应用地址。
      //    不再把本启动窗口 location.replace 过去：服务未就绪时那会正好把
      //    Edge「无法访问此页面」错误页顶到用户面前。导航失败就下个 tick 重试
      //    （3 秒节流，避免高频重复导航打断正在编译路由的 dev server）。
      if (await probeBackend(appUrl)) {
        navigating = true;
        updateUI(0.95, 'dev-server-ready', '服务已就绪，正在加载应用…', false, Math.floor(ticks / 4));
        setTimeout(() => { navigating = false; }, 3000);
        try {
          await invokeRaw('navigate_to_app');
        } catch (e) {
          console.warn('navigate_to_app failed, will retry:', e);
        }
      }
    }

    // 首次立即执行，随后每 250ms 轮询，保证启动页观感顺滑
    tick();
    setInterval(tick, 250);
  </script>
</body>
</html>
