[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 官方模板同款 feature 透传：启用后 tauri 的 cfg(dev) 关闭，
# 窗口相对 URL 解析到编译期内嵌资源（http://tauri.localhost/splash.html），
# 资源真正内嵌进二进制；不带它 cargo build --release 会把启动页导航到
# build.devUrl（dev server），服务未就绪时启动页就是 Edge 错误页。
# 重编壳必须带：cargo build --release --features custom-protocol
[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# tray-icon：系统托盘（「打开主界面」入口 + 显式退出）。应用启动时可能只显示
# 到任务栏而不抢前台（见 lib.rs 的 show_main_window_without_focus），需要一个
# 常驻的唤起入口，用户才不会「找不到窗口」。
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# 按检出隔离的单实例保护（src-tauri/src/single_instance.rs）：tauri-plugin-
# single-instance 的互斥量/窗口名取自编译期 identifier，是全机共享的——同一
# 项目检出两份并行开发时，后启动的壳会被另一份检出「吞掉」。自实现把身份
# 锚点换成检出路径（多检出并行，launch-and-build.md §1.4）。
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
] }
