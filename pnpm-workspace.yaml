# pnpm 11 起项目级配置迁移到本文件（.npmrc 中的 pnpm 专属设置不再生效）。
# minimumReleaseAge: pnpm 默认开启「最短发布年龄」供应链保护（默认 24h，
# 拒绝安装发布不足 24h 的包）。本仓库依赖版本以 pnpm-lock.yaml 锁定为准，
# 锁定的新版本包（如 typescript-eslint 8.69.0）会撞上该默认值导致 install 被拒、
# node_modules 残缺。此处关闭；如需启用供应链年龄保护，删除下面这行即可。
minimumReleaseAge: 0

# pnpm 默认 verify-deps-before-run=install：任何 pnpm 命令（dev/exec/run）
# 执行前都会自动补跑 pnpm install + postinstall。副作用：dev server 运行期间
# prisma 引擎 DLL 被进程锁定 → postinstall EPERM → 所有 pnpm 命令连锁失败。
# 依赖状态改由启动器/scripts 显式管理（preflight 检查），这里彻底关闭隐式安装。
verifyDepsBeforeRun: false

# pnpm 默认不批准第三方包的 postinstall 构建脚本，非交互模式下存在未批准
# 依赖时 pnpm install 会以 exit 1 失败（ERR_PNPM_IGNORED_BUILDS），并连带
# pnpm dev 启动前的依赖自动检查一起失败。以下为检出含构建脚本的依赖，显式
# 批准（恢复「默认执行构建脚本」之前的既有行为）；新增含构建脚本的依赖后需补充。
allowBuilds:
  "@sentry/cli": true
  unrs-resolver: true
  # better-sqlite3 **显式拒绝**其构建脚本（v12 时这里本是 `true`）。
  # v13 换了发版形态：`install: prebuild-install || node-gyp rebuild` 那条脚本没了，
  # 改成**随包附带** `prebuilds/<platform>.node`（8 个平台，含 linux-x64 / win32-x64），
  # 由 `lib/binding.js` 直接 require —— 运行期根本不需要编译。
  # 但包仍带 `binding.gyp` 与 `"gypfile": true`，pnpm 据此**隐式**跑 `node-gyp rebuild`：
  # 在没装 C++ 工具链的环境（本仓的构建容器实测缺 `make`）里那句必然失败，
  # 整个 `pnpm install` 以 ERR_PNPM_EXECUTOR_LIFECYCLE_SCRIPT_FAILED 中断 ——
  # 而它要产出的东西包里**本来就有**。故改为拒绝：既不触发未批准构建，
  # 也不再让一次无谓的编译决定 install 成败。
  # 判据：`require("better-sqlite3")` 能开库、能建表（实测 13.0.3 / linux-x64 通过）。
  "better-sqlite3": false
  # MCP SDK 与 tsx 均为纯 JS / 预编译可执行，无原生构建脚本；此处显式批准以防
  # pnpm 对新依赖的 postinstall 校验（与上面策略一致）。
  "@modelcontextprotocol/sdk": true
  "tsx": true
  # prisma 系为 better-auth prisma-adapter 的传递依赖（本项目用 Drizzle/sqlite，schema 已删）。
  # 显式拒绝其构建脚本：既不生成 client，也不触发 ERR_PNPM_IGNORED_BUILDS。
  '@prisma/client': false
  '@prisma/engines': false
  prisma: false
  # esbuild：vite/vitest 的可选优化依赖，postinstall 只是下载/校验平台二进制。
  # pnpm 不批准时非交互 install 直接 exit 1（ERR_PNPM_IGNORED_BUILDS），
  # 会让 CI 的 `pnpm install --frozen-lockfile` 装不完就挂掉；已随包提供
  # 平台专属二进制（@esbuild/linux-x64 等），不执行脚本也能正常工作。
  esbuild: true
  # msw: 含 postinstall；按 §7 规则新增含构建脚本的依赖需在 allowBuilds 显式批准
  msw: true

# esbuild 安全修复 + 单实例收敛（ISSUE #1319 第二批）：drizzle-kit（当前 latest 0.31.11）
# 依赖的 @esbuild-kit/esm-loader / @esbuild-kit/core-utils 都已废弃（包里自带
# `deprecated: Merged into tsx`），而 core-utils 把 esbuild 钉在 `~0.18.20` ——
# 正是 GHSA-67mh-4wv8-2f99 的受影响区间（serve 功能 CORS 缺陷，修复线 `>=0.25.0`）。
# 所以这条 override **不能删**：删掉就退回 0.18.20、漏洞复现（drizzle-kit 上游没有
# 换掉 esm-loader，latest 也是同一形状，没有「升 drizzle-kit 就自然消掉」这条路）。
#
# 两条键都把同一份 npm 包顶到顶层那份（package.json 的 devDependency `esbuild`）：
#   · core-utils>esbuild —— 安全修复，见上；
#   · drizzle-kit>esbuild —— 它自己声明 `^0.25.4`，range 不含 0.28，不顶就会与
#     顶层那份**分裂成两个实例**（node_modules 里同时存在 0.25.12 与 0.28.2）。
# 收敛到一个实例的理由不是省体积：`scripts/build-executor-host.mjs` 直接 require 顶层
# 那份做打包，而 drizzle-kit 用的是自己的那份 —— 两个版本并存时，「构建期转译行为」
# 就取决于调用方是谁，出问题无法归因。esbuild JS API（transform/transformSync）跨
# 0.25→0.28 保持稳定，实测 `pnpm exec tsc --noEmit` + `pnpm build` 全链通过。
# 判据：`pnpm why esbuild` 应只报 **Found 1 version of esbuild**。
overrides:
  '@esbuild-kit/core-utils>esbuild': '0.28.2'
  'drizzle-kit>esbuild': '0.28.2'
  # 安全修复：deepmerge-ts@7.1.5 存在 CVE-2026-40345（合并递归对象图时栈溢出），
  # 由 prisma 工具链（@better-auth/prisma-adapter 的可选 peer）传递引入。
  # 本项目实际使用 Drizzle/sqlite，schema 已删、从不 import prisma，prisma 系仅为
  # better-auth 捆绑各 adapter 时声明的可选 peer（autoInstallPeers 自动安装导致）。
  # 将其覆盖为不可解析版本，pnpm 对可选 peer 解析失败即跳过，从而彻底移除
  # prisma/@prisma/client 子树及 deepmerge-ts，避免携带 CVE 的依赖进入锁文件。
  '@better-auth/prisma-adapter>prisma': '0.0.0-nonexistent'
  '@better-auth/prisma-adapter>@prisma/client': '0.0.0-nonexistent'
  # eslint-plugin-unused-imports 把 @typescript-eslint/eslint-plugin 声明为**可选 peer**
  # （范围 ^8.0.0-0），pnpm 的 autoInstallPeers 会为它**独立**解析出一个实例；而本项目
  # 直接依赖的 typescript-eslint 自带同一批插件。两者只要版本不同，ESLint 10 就会在
  # 扁平配置合并时报 `ConfigError: Cannot redefine plugin "@typescript-eslint"` ——
  # 表现是**整仓 lint 完全跑不起来**（连非 React 文件都过不去），而不是几条告警。
  # 锁成同一个版本即可：让可选 peer 与 typescript-eslint 解析到同一实例。
  '@typescript-eslint/eslint-plugin': '8.71.0'
  # 安全修复（ISSUE #1331，`node scripts/check-dependency-audit.mjs` 的第一批存量）：
  # 下面四条都是**同 major 的补丁版**，且全部是**传递依赖**（没有一处是我们直接 import 的
  # API），所以走 overrides 而不是升级顶层依赖 —— 顶层升级既动不到它们（父包钉着自己的
  # range），也会把无关的次版本跳变一起带进来。
  # 每条都按 registry 给的 `patched_versions` 取**最小可达的修复版**，别顺手写成 `^x`：
  # range 会让下一次 install 悄悄跳到一个没人复核过的新版本。
  #   · js-yaml 4.3.1 → 4.3.2（`shadcn > cosmiconfig > js-yaml`，原型污染 DoS 类）
  'js-yaml@4': '4.3.2'
  #   · fast-uri 3.1.6 → 3.1.8（`@hookform/resolvers > ajv > fast-uri` 等 20 条路径）。
  #     原值 3.1.7 是 #1331 当时那条 advisory 的最小可达修复版；advisory 库后续把同一个库
  #     的**另一条**（host 大小写归一不一致，`>=3.0.0 <3.1.8`）的 patched 提到 3.1.8，
  #     于是 3.1.7 反而落回受影响区间。**override 的版本号是会被新 advisory 追上的**，
  #     这正是 §13.5.9 那条「按 advisory 记账、不按版本记账」的现实理由（ISSUE #1623）。
  #     3.1.8 → 3.1.9（ISSUE #3267）：同一个库又出了四条（scheme 伪冒 / host 归一 /
  #     首段冒号注入 / 相对路径等价），patched 一律 `>=3.1.9` —— 第三次被追上。
  'fast-uri@3': '3.1.9'
  #   · undici 7.29.0 → 7.29.1（`shadcn > @dotenvx/dotenvx > undici`）
  #     7.29.1 → 7.30.1（ISSUE #2989）：advisory 库后补的四条（DoS via 未处理的
  #     content-encodings 错误、跨源重定向的缓存投毒、Agent 丢掉 tls 选项导致的证书校验
  #     绕过、TLS 1.2 renegotiation）patched 一律是 `>=7.30.1`，于是 7.29.1 落回区间 ——
  #     又一次「override 的版本号会被新 advisory 追上」。
  'undici@7': '7.30.1'
  #   · brace-expansion 有**两条 major 同时中招**，所以键上必须带 major，写一条全局
  #     override 会把 1.x 的消费方（`minimatch@3`）顶到 5.x 的 API 上：
  #     1.1.18 → 1.1.21（`eslint-config-next > eslint-plugin-* > minimatch@3`）
  #     5.0.9  → 5.0.12（`@sentry/nextjs > … > glob > minimatch@10`、`shadcn > ts-morph > …`）
  #     两个 major 都再进了一格：advisory 的 patched 被提到 1.1.21 / 5.0.12（二次多项式
  #     展开，`{a},b}` 形态的 ReDoS）。同 `fast-uri` 那条 —— **旧 override 会被新 advisory 追上**。
  'brace-expansion@1': '1.1.21'
  'brace-expansion@5': '5.0.12'
  #   · ISSUE #1282 第三批（advisory 库更新后新出现的三条，全部传递依赖、全部有最小可达
  #     修复版，所以按 §13.5.9 走出路 ① 而不是登记进基线）：
  #     proxy-addr 2.0.7 → 2.0.8（`shadcn > @modelcontextprotocol/sdk > express`，
  #       critical：`X-Forwarded-For` 解析可被构造出畸形 IP）。本仓运行时不启 express，
  #       shadcn 是按需召唤的组件 CLI，但既然是同 major 补丁版就一并升掉、不留待办。
  'proxy-addr@2': '2.0.8'
  #     source-map-js 1.2.1 → 1.2.2（`next > postcss`、`@sentry/nextjs > … > webpack`，
  #       high）。只影响 sourcemap 解析，升版无 API 变化。
  'source-map-js@1': '1.2.2'
  #     sharp 0.35.4 → 0.35.5（`next > sharp` 与 `better-auth > next > sharp`，high）。
  #       sharp 是 next 的**可选依赖**，next 自己声明 `^0.35.x`，所以这是它认可的补丁版；
  #       它带预编译二进制（`@img/sharp-*`），升版要确认 install 仍不触发本地编译 ——
  #       实测 `pnpm install` 不报 ERR_PNPM_IGNORED_BUILDS，`pnpm why sharp` 只剩 0.35.5。
  'sharp@0.35': '0.35.5'
  #   · handlebars 4.7.9 → 4.7.10（`eslint-plugin-boundaries > @boundaries/elements >
  #     handlebars` 与 `eslint-plugin-boundaries > handlebars` 两条路径，advisory
  #     #1241677 / #1241678 均 critical：受影响范围 `>=4.0.0 <=4.7.9`）。只在 lint
  #     工具链里出现、不进运行时不进产物；4.7.10 正是 advisory 给的最小可达修复版。
  #     ⚠️ 这条是**回填**：此前已有一条同键 override，被上游改动整条删掉之后版本落回
  #     4.7.9，而新 advisory 的范围恰好把它包进去 —— 也就是「同一个坑被填了两次」。
  #     删 override 等于把修复一起删掉，别再删它。
  'handlebars@4': '4.7.10'
  #   · ISSUE #1623 第二批（阶段二 2-4）：advisory 库里**有最小可达修复版**的那批
  #     moderate 全部升掉，剩下的才留在「不纳入 high/critical 判据」的口径里。
  #     五条全是**传递依赖**、全是**同 major 补丁版**，各取 registry 给的最小可达修复版。
  #     这批的规模本身是个读数：9 条 moderate **全部**有修复版 —— 所以「moderate 不判」
  #     这条口径此前挡住的不是「修不了的噪声」，是「还没人去修的那批」（ISSUE #1623 §一）。
  #     · markdown-it 14.3.0 → 14.3.1（`typedoc > markdown-it`，linkify 的两条二次路径）。
  #       只在 `pnpm docs` 这一条链上（devDependency），不进运行时、不进产物。
  #       14.3.1 → 14.3.3（ISSUE #2989）：两条 High 的 patched 分别抬到 `>=14.3.2`
  #       （smartquotes 的二次复杂度）与 `>=14.3.3`（多行 link reference definition 的
  #       二次时间渲染，14.0 起的回归），取交集即 14.3.3。同一链、不进产物。
  'markdown-it@14': '14.3.3'
  #     · ip-address 10.7.0 → 10.7.1（`express-rate-limit > ip-address` 与 `socks > ip-address`，
  #       两条 advisory 同一修复版：`isInSubnet()` 的地址比较、`Address6` 的诊断串构造成本）。
  #       两条路径都在 `shadcn > @modelcontextprotocol/sdk` 那一支（按需召唤的组件 CLI）。
  #       10.7.1 → 10.7.4（ISSUE #3267）：#1242883（Address6 的 zone identifier 二次时间
  #       匹配可让单条长串拖住进程）patched `>=10.7.4`。
  'ip-address@10': '10.7.4'
  #     · hono 4.13.5 → 4.13.7（`shadcn > @modelcontextprotocol/sdk > hono` /
  #       `@hono/node-server > hono`，jsx 边界组件的字符串未转义）。运行时没有一处 import，
  #       但它与 ip-address 同链，一并升掉不留待办。
  #       4.13.7 → 4.13.11（ISSUE #3267）：#1242595（`serveStatic` 把请求路径二次解码，
  #       可绕过静态路径上的 middleware）patched `>=4.13.11`。
  'hono@4': '4.13.11'
  #     · postcss-selector-parser 7.1.5 → 7.1.6（`shadcn > postcss-selector-parser`，
  #       flat selector 解析的二次复杂度）。构建期工具链，不进产物。
  #       ⚠️ 它的**另一条路径**（`@storybook/nextjs > css-loader > postcss-modules-*`）
  #       随 ISSUE #3372 的 webpack → vite 迁移一起消失了（`@storybook/nextjs` 已移除，
  #       `pnpm why postcss-selector-parser` 现在只剩 shadcn 一条）。这条 override 留着
  #       ——它守的是**还在**的那条路径。
  'postcss-selector-parser@7': '7.1.6'
  #     · fast-copy 4.0.4 → 4.1.0（`pino-pretty > fast-copy`，深拷贝深嵌套对象时栈耗尽）。
  #       本仓唯一一条**直接依赖链上**的（`pino-pretty` 在 dependencies 里）——
  #       但它仍只在**日志美化**那一面（`pino-pretty` 是开发期可读输出），
  #       所以判为同一条口径：补丁版，升掉。
  'fast-copy@4': '4.1.0'
  #   · ISSUE #3267：Dependabot 点名的另外两个包，都是**跨 major**。按 §13.5.9
  #     `webpack-dev-middleware@6` 那条先例，**验证走真正干活的那一面**，不是「装得上」。
  #     · minimatch 10.2.6 → 11.0.1（#1244623，globparts 放大 DoS，
  #       `>=7.0.0 <11.0.1`）。消费方 `@eslint/config-array@0.23.5`（eslint 10）、
  #       `@sentry/bundler-plugins`、storybook 链；registry 元数据里 11 与 10 同为
  #       ESM、exports / engines 相同，11 多一个 `@isaacs/nonrecursive-glob-match`。
  #       ⚠️ **实测证伪（2026-11-07，ISSUE #3252）**：minimatch 11 删掉了实例方法
  #       `Minimatch#matchOne`，而 typedoc 0.28.20 的 `glob()` 正好调它 ⇒ 每日档
  #       `API 文档生成与自检` 崩在 `mini.matchOne is not a function`。「exports /
  #       engines 相同」只覆盖装载面，不覆盖实例 API。处置：override 保留（其余消费方
  #       不受影响），typedoc 用 `patchedDependencies` 打一处最小补丁换成等价的
  #       `match(f, partial)`（`patches/typedoc@0.28.20.patch`）。typedoc 升级到已支持
  #       minimatch 11 的版本后，删掉这条 patch。
  #     · glob 13.0.6 → 14.0.2（#1244013，AbortSignal 取消后仍继续遍历文件系统，
  #       `>=9.0.0 <=14.0.1`）。消费方 `@sentry/bundler-plugins@11.9.0` 扫 sourcemap；
  #       14 与 13 的 dependencies / exports / engines 逐项相同。
  #     ⚠️ **两条键都必须带 major**：锁里同时有 `minimatch@3.1.5`（eslint-plugin-import /
  #       jsx-a11y / react / glob@7）与 `glob@7.2.3`（rimraf / flat-cache），它们都**不在**
  #       这两条 advisory 的区间内；不带 major 的全局 override 会把它们顶到 11 / 14 上
  #       （`brace-expansion@1` / `@5` 双键就是为同一个形状写的）。
  #     验证面：`pnpm run lint` 真跑 eslint 10 的 config-array 匹配、`pnpm why` 对齐到
  #       新版本且旧 major 一支不动、`pnpm audit --json` 复算、受影响固定清单用例。
  'minimatch@10': '11.0.1'
  'glob@13': '14.0.2'

patchedDependencies:
  typedoc@0.28.20: patches/typedoc@0.28.20.patch
