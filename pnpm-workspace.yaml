# pnpm 11 起项目级配置迁移到本文件（.npmrc 中的 pnpm 专属设置不再生效）。
# minimumReleaseAge: pnpm 默认开启「最短发布年龄」供应链保护（默认 24h，
# 拒绝安装发布不足 24h 的包）。本仓库依赖版本以 pnpm-lock.yaml 锁定为准，
# 锁定的新版本包（如 typescript-eslint 8.69.0）会撞上该默认值导致 install 被拒、
# node_modules 残缺。此处关闭；如需启用供应链年龄保护，删除下面这行即可。
minimumReleaseAge: 0

# pnpm 默认 verify-deps-before-run=install：任何 pnpm 命令（dev/exec/run）
# 执行前都会自动补跑 pnpm install + postinstall。副作用：dev server 运行期间
# prisma 引擎 DLL 被进程锁定 → postinstall EPERM → 所有 pnpm 命令连锁失败。
# 依赖状态改由启动器/scripts 显式管理（preflight 检查），这里彻底关闭隐式安装。
verifyDepsBeforeRun: false

# pnpm 默认不批准第三方包的 postinstall 构建脚本，非交互模式下存在未批准
# 依赖时 pnpm install 会以 exit 1 失败（ERR_PNPM_IGNORED_BUILDS），并连带
# pnpm dev 启动前的依赖自动检查一起失败。以下为检出含构建脚本的依赖，显式
# 批准（恢复「默认执行构建脚本」之前的既有行为）；新增含构建脚本的依赖后需补充。
allowBuilds:
  "@sentry/cli": true
  unrs-resolver: true
  # better-sqlite3 **显式拒绝**其构建脚本（v12 时这里本是 `true`）。
  # v13 换了发版形态：`install: prebuild-install || node-gyp rebuild` 那条脚本没了，
  # 改成**随包附带** `prebuilds/<platform>.node`（8 个平台，含 linux-x64 / win32-x64），
  # 由 `lib/binding.js` 直接 require —— 运行期根本不需要编译。
  # 但包仍带 `binding.gyp` 与 `"gypfile": true`，pnpm 据此**隐式**跑 `node-gyp rebuild`：
  # 在没装 C++ 工具链的环境（本仓的构建容器实测缺 `make`）里那句必然失败，
  # 整个 `pnpm install` 以 ERR_PNPM_EXECUTOR_LIFECYCLE_SCRIPT_FAILED 中断 ——
  # 而它要产出的东西包里**本来就有**。故改为拒绝：既不触发未批准构建，
  # 也不再让一次无谓的编译决定 install 成败。
  # 判据：`require("better-sqlite3")` 能开库、能建表（实测 13.0.3 / linux-x64 通过）。
  "better-sqlite3": false
  # MCP SDK 与 tsx 均为纯 JS / 预编译可执行，无原生构建脚本；此处显式批准以防
  # pnpm 对新依赖的 postinstall 校验（与上面策略一致）。
  "@modelcontextprotocol/sdk": true
  "tsx": true
  # prisma 系为 better-auth prisma-adapter 的传递依赖（本项目用 Drizzle/sqlite，schema 已删）。
  # 显式拒绝其构建脚本：既不生成 client，也不触发 ERR_PNPM_IGNORED_BUILDS。
  '@prisma/client': false
  '@prisma/engines': false
  prisma: false
  # esbuild：vite/vitest 的可选优化依赖，postinstall 只是下载/校验平台二进制。
  # pnpm 不批准时非交互 install 直接 exit 1（ERR_PNPM_IGNORED_BUILDS），
  # 会让 CI 的 `pnpm install --frozen-lockfile` 装不完就挂掉；已随包提供
  # 平台专属二进制（@esbuild/linux-x64 等），不执行脚本也能正常工作。
  esbuild: true
  # msw: 含 postinstall；按 §7 规则新增含构建脚本的依赖需在 allowBuilds 显式批准
  msw: true
  # core-js-pure：@storybook/nextjs 经 @pmmmwh/react-refresh-webpack-plugin 传递引入。
  # 其 postinstall 只是 `require('./postinstall')` 里打印捐献提示（try/catch 吞掉一切），
  # 不产出任何产物 —— 显式拒绝，避免非交互 install 触发 ERR_PNPM_IGNORED_BUILDS。
  core-js-pure: false

# esbuild 安全修复 + 单实例收敛（ISSUE #1319 第二批）：drizzle-kit（当前 latest 0.31.11）
# 依赖的 @esbuild-kit/esm-loader / @esbuild-kit/core-utils 都已废弃（包里自带
# `deprecated: Merged into tsx`），而 core-utils 把 esbuild 钉在 `~0.18.20` ——
# 正是 GHSA-67mh-4wv8-2f99 的受影响区间（serve 功能 CORS 缺陷，修复线 `>=0.25.0`）。
# 所以这条 override **不能删**：删掉就退回 0.18.20、漏洞复现（drizzle-kit 上游没有
# 换掉 esm-loader，latest 也是同一形状，没有「升 drizzle-kit 就自然消掉」这条路）。
#
# 两条键都把同一份 npm 包顶到顶层那份（package.json 的 devDependency `esbuild`）：
#   · core-utils>esbuild —— 安全修复，见上；
#   · drizzle-kit>esbuild —— 它自己声明 `^0.25.4`，range 不含 0.28，不顶就会与
#     顶层那份**分裂成两个实例**（node_modules 里同时存在 0.25.12 与 0.28.2）。
# 收敛到一个实例的理由不是省体积：`scripts/build-executor-host.mjs` 直接 require 顶层
# 那份做打包，而 drizzle-kit 用的是自己的那份 —— 两个版本并存时，「构建期转译行为」
# 就取决于调用方是谁，出问题无法归因。esbuild JS API（transform/transformSync）跨
# 0.25→0.28 保持稳定，实测 `pnpm exec tsc --noEmit` + `pnpm build` 全链通过。
# 判据：`pnpm why esbuild` 应只报 **Found 1 version of esbuild**。
overrides:
  '@esbuild-kit/core-utils>esbuild': '0.28.2'
  'drizzle-kit>esbuild': '0.28.2'
  # 安全修复：deepmerge-ts@7.1.5 存在 CVE-2026-40345（合并递归对象图时栈溢出），
  # 由 prisma 工具链（@better-auth/prisma-adapter 的可选 peer）传递引入。
  # 本项目实际使用 Drizzle/sqlite，schema 已删、从不 import prisma，prisma 系仅为
  # better-auth 捆绑各 adapter 时声明的可选 peer（autoInstallPeers 自动安装导致）。
  # 将其覆盖为不可解析版本，pnpm 对可选 peer 解析失败即跳过，从而彻底移除
  # prisma/@prisma/client 子树及 deepmerge-ts，避免携带 CVE 的依赖进入锁文件。
  '@better-auth/prisma-adapter>prisma': '0.0.0-nonexistent'
  '@better-auth/prisma-adapter>@prisma/client': '0.0.0-nonexistent'
  # eslint-plugin-unused-imports 把 @typescript-eslint/eslint-plugin 声明为**可选 peer**
  # （范围 ^8.0.0-0），pnpm 的 autoInstallPeers 会为它**独立**解析出一个实例；而本项目
  # 直接依赖的 typescript-eslint 自带同一批插件。两者只要版本不同，ESLint 10 就会在
  # 扁平配置合并时报 `ConfigError: Cannot redefine plugin "@typescript-eslint"` ——
  # 表现是**整仓 lint 完全跑不起来**（连非 React 文件都过不去），而不是几条告警。
  # 锁成同一个版本即可：让可选 peer 与 typescript-eslint 解析到同一实例。
  '@typescript-eslint/eslint-plugin': '8.71.0'
  # 安全修复（ISSUE #1331，`node scripts/check-dependency-audit.mjs` 的第一批存量）：
  # 下面四条都是**同 major 的补丁版**，且全部是**传递依赖**（没有一处是我们直接 import 的
  # API），所以走 overrides 而不是升级顶层依赖 —— 顶层升级既动不到它们（父包钉着自己的
  # range），也会把无关的次版本跳变一起带进来。
  # 每条都按 registry 给的 `patched_versions` 取**最小可达的修复版**，别顺手写成 `^x`：
  # range 会让下一次 install 悄悄跳到一个没人复核过的新版本。
  #   · js-yaml 4.3.1 → 4.3.2（`shadcn > cosmiconfig > js-yaml`，原型污染 DoS 类）
  'js-yaml@4': '4.3.2'
  #   · fast-uri 3.1.6 → 3.1.7（`@hookform/resolvers > ajv > fast-uri` 等 20 条路径；
  #     另一条 advisory 标注受影响版本 `=3.1.6` 且「上游无修复版」—— 离开 3.1.6 即同时消掉，
  #     这正是「按 advisory 记账」与「按版本记账」会给出不同结论的例子）
  'fast-uri@3': '3.1.7'
  #   · undici 7.29.0 → 7.29.1（`shadcn > @dotenvx/dotenvx > undici`）
  'undici@7': '7.29.1'
  #   · brace-expansion 有**两条 major 同时中招**，所以键上必须带 major，写一条全局
  #     override 会把 1.x 的消费方（`minimatch@3`）顶到 5.x 的 API 上：
  #     1.1.18 → 1.1.20（`eslint-config-next > eslint-plugin-* > minimatch@3`）
  #     5.0.9  → 5.0.11（`@sentry/nextjs > … > glob > minimatch@10`、`shadcn > ts-morph > …`）
  'brace-expansion@1': '1.1.20'
  'brace-expansion@5': '5.0.11'
  #   · webpack-dev-middleware 6.x → 7.4.5（`@storybook/nextjs >
  #     @storybook/builder-webpack5 > webpack-dev-middleware`，advisory #1240027：
  #     `publicPath` 不以 `/` 结尾时的路径穿越）。
  #     本块里唯一一条**跨 major**：Storybook 10.6.1 把自己的 range 钉在 6.x，
  #     不动到这条就消不掉，而 audit 判据给出的两条出路里「登记进基线」被明确排除
  #     （棘轮的后门）。代价面只有组件工作台的 dev server（`pnpm storybook`）——
  #     本地预览用、不对外提供服务。**验证走它真正干活的那一面**，不是「装得上」：
  #     dev server 起来后 `/`、`/iframe.html`、`/index.json` 全 200，后两个正是 wdm 从
  #     内存文件系统 serve 的（日志里 `[webpack-dev-middleware] wait until bundle finished`
  #     在场）；`storybook:build` 出件；`pnpm why webpack-dev-middleware` 只剩 7.4.5 一个版本。
  #     哪天 storybook dev 起不来，先回看这一条。
  'webpack-dev-middleware@6': '7.4.5'
  # 安全修复（ISSUE #1326 存量红收尾）：三条 high/critical 全是**传递依赖**，
  # 且三条的父包 range 都允许修复版（所以走 overrides 而不是升级顶层依赖）：
  #   · proxy-addr 2.0.7 → 2.0.8（`@modelcontextprotocol/sdk > express > proxy-addr`，
  #     express@5.2.1 声明 `^2.0.7`，2.0.8 在 range 内）
  #   · sharp 0.35.4 → 0.35.5（`next > sharp`，next 声明 `^0.35.4`）
  #   · source-map-js 1.2.1 → 1.2.2（`postcss > source-map-js`，postcss 声明 `^1.2.2`）
  'proxy-addr': '2.0.8'
  'sharp': '0.35.5'
  'source-map-js': '1.2.2'
