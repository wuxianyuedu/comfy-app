    #   唯一会因**这台机器的负载**而红的格子（套件里大量用例真起子进程，超订的那一份
    #   从等 CPU 变成等子进程 ⇒ `Test timed out in 30000ms`），而它排在中间时，一单条
    #   抖动就把 `每日生产构建` / `每日浏览器安装` / `每日全量E2E` 一起 skip 掉。
    #   顺序本身有判据（这一格必须是每日清单的最后一条），挪回中间会当场红。
    #
    # ⚠️ **只判节点事实的格子不再每个 PR 都判**（口径：「这个环境不会经常
    #   改动」）：`工具链自证` 13.8s、`Python 可用性` 2.8s、`Python 探针读数` 3.0s、
    #   `浏览器安装` 3.0s 从 PR 那份清单撤到这里，**每撤一格都必须同批在这份清单里
    #   加上同名的一格** —— 判据 `tests/no-platform-ci-config.test.ts` 逐格双向核对
    #   （PR 清单里不许再有它、每日清单里必须有它、且那一格点的仍是同一个入口与
    #   同一面旗标）。少了这条判据，「撤到每日档」与「悄悄删掉」在配置文件里逐字同形。
    #    PR 档不再装依赖（GA 的安装 step 接管那个问题），本档只留
    #   平台读数与判决链；撤下来的每一格都得先在每日/GA 侧有执行者，判据同一条。
    COMFYAPP_CI_DAILY_GATES: >-
      每日失败立案, 每日令牌权限读数, 每日工具链自证, 每日安装依赖, 每日镜像出勤立案, 每日 YAML 真解析,
      每日 Python 可用性, 每日 Python 探针读数, 每日同步数据库表结构, 每日新鲜度账, 每日生产构建,
      每日 ESLint 零警告, 每日浏览器安装, 每日全量E2E, 每日 API 文档生成与自检, 每日单元测试, 覆盖率上报
    # ⚠️ `每日浏览器安装` 与 `每日全量E2E` 的相对顺序不许动：装那一件要下 ~120 MiB
    #   （分钟级），而判「装没装成」是零成本的。这一格是**唯一**的执行者
    #   （PR 上那一格同日撤到这里）—— 撤的理由是 PR 上再没有任何一步用浏览器
    #   （`E2E 关键流程` 早已撤成 `每日全量E2E`，两条出路的取舍写在 `.gates` 末尾那段），
    #   而它每次仍然要在 PR 上占一格排队位。同一台机、同一个账号，落点仍是
    #   `%LOCALAPPDATA%`，所以每日档跑过一次之后，节点上的缓存在下一次每日档时是热的。
    # ── 落点：把 CI 的临时目录与浏览器都放到开发盘（G:）────────────────────────
    #
    # 为什么写在这**一级**（流水线级 env）而不是某一格的 `env:`：这一组变量的作用面
    # 是**跨格**的 —— 浏览器装在 `每日浏览器安装` 那一格、跑在 `每日全量E2E` 那一格，
    # 两格必须看**同一个**落点。写在某一格里 ⇒ 那一格看得到、另一格看不到 ⇒
    # **装好了，探不到**（这两种红在日志里原本逐字同形，是本仓最贵的那类红）。
    # 判据：`tests/ci-dev-drive-root.test.ts` 钉「这三行必须在流水线级 env 里」。
    #
    # ⚠️ **这三个值是给这台自托管节点用的**：它的检出工作区在 `G:`（`ORANGE_RUNNER_DATA_DIR`
    # 指到那儿），而服务账号（systemprofile）的 `%LOCALAPPDATA%` 与 `%TEMP%` 落在 `C:` 上 ——
    # 于是「检出在开发盘、临时目录与浏览器在系统盘」是今天的事实。换节点要跟着换。
    # 落点与卷的实测读数见 `docs/guides/dev-drive-refs.md` 的「CI 侧」那节。
    #
    # `TEMP` / `TMP` **成对**写：Node 的 `os.tmpdir()` 只看 `TEMP`，而另一些工具只看
    # `TMP` —— 只写一个的形态是「一半的工具把临时文件写到了临时目录之外」。
    # 目录必须**事先存在**（`G:\Temp` 已在开发盘上建好）：临时根不存在时 Node 仍会
    # 把它当成临时目录返回，于是第一次写就 ENOENT —— 那不是「慢」，是「看不懂的红」。
    # `环境前提` 那一格会把它补出来并打印读数（幂等，缺了才建）。
    TEMP: "G:\\Temp"
    TMP: "G:\\Temp"
    # 浏览器落点：Playwright 自己的环境变量（不引第二套机制）。**装与判都只看它** ——
    # 判据 `playwrightBrowsersRoot()` 与 `browserExecutableExists()` 同源（实现住在
    # `scripts/ci-toolchain-browser-root.mjs`），所以这一行改了就同时改了两边。
    #
    # ⚠️ **不要把它挪进某一格的 `env:`** —— 理由见上面那段「为什么写在这一级」。
    # 也**不要**写成容器里那个 `/ms-playwright`：那是给镜像配的，在宿主上不存在，
    # 写了等于让落点判据去一个空目录找东西（判据 `tests/ci-image-identity.test.ts` 守这条）。
    PLAYWRIGHT_BROWSERS_PATH: "G:\\.cache\\ms-playwright"
    # ── 判决行的颜色：平台日志页那一屏也要带色──────────────────────
    #
    # 为什么**不是** `FORCE_COLOR`：那枚是全生态共识旗标，chalk / picocolors / oxfmt 的
    # anstyle 都读它 —— 挂上之后被聚合档**捕获后解析**的那份子进程输出会开始带色号，
    # 而 `lastLine()` / `looksSkipped()` / 90 字压缩三处都会把色号算进内容
    # （§13.5.29.1 那条边界写明的后果）。所以这枚只被本仓那一层认
    # （`scripts/ci-log.mjs` 的 `colorEnabled()`），第三方读不到它 ⇒ 子进程那一路
    # 天然仍是干净文本。
    #
    # 为什么写在这**一级**：它说的是「这台节点的日志页会渲染色号」，那是宿主的属性、
    # 不是某一格的属性 —— 写在某一格里，其余各格的判决行照旧全灰（同一族坑见上面
    # 「落点」那段：作用面跨格却写在格内 = 装好了，探不到）。
    #
    # ⚠️ 它压不过 `NO_COLOR`：`colorEnabled()` 里 `NO_COLOR` 仍是一票否决；`0` 按关算。
    # 当场读数：绿跑的 stage 正文里只有平台自己的 `Runner` / `Finished` 前缀带 ANSI，
    # 我们的 `[ok]` / `[skip]` 无色。
    COMFYAPP_CI_COLOR: "1"

# 门禁清单。
# ⚠️ 它**没有**「清单逐条核对」那类判据捧着 —— 那类判据随旧版 `.cnb.yml` 一并删除
# （它锁的是旧版那三十步与上报插件，两样在自托管上都不成立）。守着这份文件的现有判据是 `tests/no-platform-ci-config.test.ts`
# 那一条**形态**判据（分支键 / `namespace: group` / 非空 `tags` / 两个事件键 /
# lock.cancel-in-progress / 停用登记）—— **条目本身的增删仍不报错**，
# 所以这里的每一步都要靠人逐条核对。
#
# ── 增量：哪些 stage 可以在「本次改动没碰到它的扫描面」时跳过 ──
#
# 用户的质疑是「CI 里的检查能否增量，而不是没有改动也重跑」。答案是 stage 级的
# `ifModify`（CNB 官方语法手册 `zh/build/grammar.md` 的 `#stage-ifmodify`）：
# 变更文件一个都不落在给定 glob 内 ⇒ 这一步不执行。它**支持 PR 触发的事件**
# （官方原文：「PR 触发的事件，统计 PR 中的变更文件」），正是本流水线要跑的那一类。
# 语义与本地钩子那一层（`scripts/gate-scan-read.cjs` 的 `skipUnlessStagedTouches()`）
# **逐字同义** —— 也就是说，平台侧终于和本地用同一套扫描面在说话。
#
# 两条安全边界（都是「宁可多跑」的方向）：
#   · **新建分支的 push 事件忽略 `ifModify`**（没有对比基准）⇒ 全部照跑；
#   · **没有 `ifModify` 的 stage 就是默认档 = 任何改动都跑** —— 本文件里绝大多数
#     stage 都在这一档，包括每一条全库级不变量与全部前提步骤。
#
# ⚠️ 还有**两种**收窄不在 `ifModify` 这一档（它们的前半是前提，跳不得）：
#   · `安装依赖` 的**装的那一跳**（push / 单跑那几档；PR 档已不装）——
#     依赖面（锁文件 / `package.json` / `pnpm-workspace.yaml` / `next.config.js`）一项都
#     没碰就不装，判定在 `scripts/ci-install-deps.mjs`（`pnpm` 自证照旧每次都跑，
#     判据见 §13.5.20）；
#   · `oxfmt 格式` 的**扫描面** —— 判据面是「改动面 ∩ `GLOBS`」（`check-format.cjs`，
#     `GLOBS` 含 mjs/cjs、改动面不过 `IGNORE_GLOBS`）。它整格在 GA 上跑，没有
#     `ifModify`（每次 PR 都判），收窄面由判据自己算 ——
#     原先那两份表达（手写 glob ⇄ GLOBS）的对账随之取消，不再是配置面的风险。
#   · 判据脚本**自己的触发面** —— `API 文档生成与自检` 已从 push 撤到每日档，
#     它在那一档**不带 `ifModify`**（每跑必判）；`docsApiTriggerGlobs()`
#     仍是触发面的唯一派生处（从 typedoc 的解析根派生），供判据自己的 `--staged` 档与
#     元测试使用，不手抄第二份。
#
# ⚠️ **「哪几条被收窄了」只有一处出处**：`scripts/ci-incremental-gates.mjs` 的
# `INCREMENTAL_GATES`（每条都写着它守的是哪份脚本、为什么这条收窄安全）。
# 两个方向都由 `tests/ci-incremental-gates.test.ts` 判（登记表里每条 ⇒ 配置里必须
# 逐字带着那组 `ifModify`；配置里带 `ifModify` 的 ⇒ 必须在登记表里），
# 该判据在固定清单里、每次提交都跑。**别在这里直接给一个 stage 加 `ifModify`** ——
# 那会在两处各写一份「收窄名单」，而漂了之后「哪一份是真的」没有判据能回答。
# 随手自查：`pnpm run check:ci-incremental`（= `node scripts/ci-incremental-gates.mjs --check`）。
#
# 判定门槛（哪类能进登记表、哪类绝对不行）逐条写在 `scripts/ci-incremental-gates.mjs`
# 的文件头；口径与边界见规范 §13.5.18。
# ── 每日那一份：定时与手动触发**共用这一份**（`.daily-gates` 锚点）────────────
#
# 为什么做成锚点而不是两处各写一遍：这条清单现在有**三个触发口** ——
# ① GA `.github/workflows/daily.yml` 的 schedule（每天 01:00，北京时间）；② `web_trigger_daily`
# （人在页面上手点，按钮定义在 `.cnb/web_trigger.yml`）；③ `api_trigger_daily`
# （CLI / API：`cnb build start-build --event api_trigger_daily`，服务端只认
# `api_trigger` 前缀，所以那个按钮**点不动**自动化这条路 —— 见下面那格的注释）。
# 三条跑的是**同一件事**：
# 「现在就把这份清单跑一遍」。写成几份的时刻就是它们开始各漂的时刻（哪天给每日档加一格、
# 忘了加到手点那条，「手点一遍每日档」得到的就不是每天 01:00 那一跑）——
# §12.12 的孪生形态，只是它长在配置里。判据钉的是「三条解析出来的 stage 名单**逐字相同**
# 且等于 `COMFYAPP_CI_DAILY_GATES`」（`tests/no-platform-ci-config.test.ts`）。
#
# 与 `.gates`（PR 那三十七格）同理，这里也刻意**不带 `ifModify`**：这一档是「重跑一遍」
# 的语义，按改动面跳过就不是每日档了。

# ── 锁按**触发类**分：`push` / `daily` / 单跑三档各一把 ────────────────────────
#
# `.common` 那条 `lock.key: pr-$CNB_PULL_REQUEST_IID` 的理由写在它自己的头注里：
# 平台默认 key 含 `CNB_BRANCH`，而合并类事件上它是**目标分支** ⇒ 全仓 PR 共用一把锁、
# 并行 PR 互相掐停）。PR 那一半今天照旧成立，这里一字未动。坏下来的是它**多出来的那半句**：
# `CNB_PULL_REQUEST_IID` 在非 PR 事件上没有值 ⇒ 所有非 PR 流水线落回同一把字面 `pr-`，
# 而写下那句前提时全档只有**一条**非 PR 流水线（`master 合并复核`），
# 所以「不带分支名也不丢语义」当时是真的。
#
# 后来加的两批都用了 `<<: *common`，那句前提就没人回来改了：每日档三条触发口
# （定时 / 手点 / API）+ 单跑口六条 ⇒ **九条**非 PR 流水线共用一把 `pr-`。
# 后果是当场取到的读数，不是推演：一次 master push 掐掉了前 9 格全绿的每日档
# 最后一格（cancel，与 push 的 `createTime` 仅差 3 秒）；一次按需复验跑到第 244 秒
# 被紧挨着的 push 掐掉（相差 0.2 秒）—— 被掐的不是「每天一次的无人值守」，
# 而是**一个人为了排障刚点下去的按需复验**，它前面已经花了 244 秒装依赖。
#
# ⇒ 一把锁要挡的是「**同一件事**被重复排队」，不是「所有非 PR 的事」。
#   `master 合并复核` 掐掉正在跑的每日档 / 单跑，从来不是任何人的意图。
#
# 所以按触发类各给一把，键名一律是**字面量**（不带变量 ⇒ 不存在「某个事件上变量无值
# 就退化」这条路；那条教训正是别指望变量在某个事件上有值）：
#
#   · `push`     —— 仍然只有 `master 合并复核` 一条，它本来就该「一条就够」；
#                   ⚠️ 但它**不掐旧的那一跑、也不掐新来的那一跑**（`cancel-in-progress: false`
#                   **+ `wait: true`**）：
#                   这一格判的是「落到 master 的是不是 PR 合并形态」，**逐提交**给读数。
#                   「终止旧的一跑」摘掉过（现场两对被掐的间隔都在 12 秒内，prepare 里的
#                   原文是 `The current pipeline is terminated`），而**新来的那一跑**
#                   照旧在 Prepare 里被判 `The lock … is occupied and the current process is
#                   terminated` —— `wait` 的默认值是 false，不写它就没有「排队」这件事。
#                   两笔都该有结论，所以这一把是 `false` + `true` 的组合；理由与现场逐拍
#                   读数写在 `.lock-push` 锚点上（那是唯一定义处，这里只留指路）。
#   · `daily`    —— 定时 / 手点 / API 那三条**同一档**，「后起的掐掉先跑的」一字未改地保留
#                   （§13.5.3.10 想要的就是这份互斥：同一台机上不要同时压两遍那七格）；
#   · `oneshot-build` / `oneshot-e2e` / `oneshot-unit` —— 每档自己一把：同一档被连点两次
#                   仍然只留最新那一跑，而**不同档各跑各的** ——
#                   「我要复验构建」不再被别人的「我要复验 E2E」掐掉。
#
# ⚠️ 这里**新增**了一条平台事实：不同档的单跑从此可以同时在跑，而节点只有一台。
#   这不是拿并发换绿 —— PR 之间本来就各用一把 `pr-<iid>`、早就在叠加了；真要挡「整台机
#   一次只跑一条重档」得另做一条全局锁，那是另一个决定，写在这里而不是顺手做掉。
#
# 判据：`tests/no-platform-ci-config.test.ts` 的 `pipelineLockAssignments()` 与
# `resolveLockKey()` 一族 —— 按事件把每条流水线的**有效 key** 代出来，判
# 「同类的 key 相同、异类的 key 相异、任何一条都不与 `pr-<iid>` 撞」，
# 并逐条带坏形态的反向复算（含「有人忘了写覆盖 ⇒ 退回 `pr-`」那一种）。
.lock-push: &lock_push
  key: push
  # 唯一一把**排队而不终止**的类锁（理由见上面 `push` 那一行）：
  # 这一格逐提交给读数，「只留最新那一笔」等于把前一笔的结论删掉。
  cancel-in-progress: false
  # `wait: true` 是这一把的**承重项**，不是陪衬。不带它时
  # 「不终止」并不等于「排队」—— 官方 `grammar.md#pipeline-lock`：
  # `wait`（默认 **false**）= 锁被占用时是否等待，`cancel-in-progress`（默认 false）
  # = 是否**终止**占用锁的那一跑。两个默认值叠起来的语义是「**不终止，也不等**」，
  # 而现场读数正是这一形：
  #
  #   前一笔整跑 110s、6 格全绿；9 秒后到达的下一笔在 Prepare 就落了
  #   `Pipeline init error: The lock … is occupied and the current process is
  #   terminated.`，6 格全 `skipped`、整跑 405ms 判 `error`。
  #
  # 也就是说 `cancel-in-progress: false` 单独在场时，**被销毁的是后到那一跑的读数**
  # （它连跑都没跑起来），而这一把要的是「前一笔的结论别被删掉」—— 两笔都该有读数。
  # 一笔合并后紧跟删源分支（`branch.delete` 那一推）就是最常见的两跑重叠形态，
  # 而删分支那一推是平台自己发起的、没人会去补跑它 ⇒ 缺的那笔读数永久缺着。
  wait: true
.lock-daily: &lock_daily
  key: daily
  cancel-in-progress: true
.lock-oneshot-build: &lock_oneshot_build
  key: oneshot-build
  cancel-in-progress: true
.lock-oneshot-e2e: &lock_oneshot_e2e
  key: oneshot-e2e
  cancel-in-progress: true
.lock-oneshot-unit: &lock_oneshot_unit
  key: oneshot-unit
  cancel-in-progress: true
# 桌包那一档自己的锁。它**不与每日档共用**：两条档各有自己的格子
# （条数只以这份文件里的 `*daily_gates` 与 `*package_gates` 两个锚点为准，**不在注释里记账数**
# —— 写死的数已经漂过一轮了），共用一把就等于「手点一次桌包会把
# 当日那一跑的某一格掐掉」—— 而这两件事各自要
# 结论。`cancel-in-progress: true` 的语义在这一档上是「同一档连点两次只留最新那一跑」。
.lock-package: &lock_package
  key: package
  cancel-in-progress: true
# 探针 A 的锁（一次性）。`cancel-in-progress: false` **就是被测的那个东西**：
# 第二条在第一条活着时到达，到底是排队、被跳过、还是照样并行 —— 写 `true` 等于把问题掐掉。
# 「锁按类分开」那一族的 R2（类锁必须带 `cancel-in-progress: true`）因此在这把锁上**刻意
# 不成立**，它是 `PROBE_PIPELINES` 那段有期限例外的一部分（判据与到期日见
# `tests/no-platform-ci-config.test.ts`），不是漏写。
.lock-probe-a: &lock_probe_a
  key: probe-2363-a
  cancel-in-progress: false
# ── GA 回调的共用锁（已转正）──────────────────────────
#
# 转正后只有**一个写者**：GA 收尾 job 发的 callback。这把
# `cancel-in-progress: true` 的锁仍留着，管的是「同一个 PR 连着派发几次」：
# 后一条 callback 到达时掐掉还在跑的前一条，避免旧结论晚落定、把新结论
# 覆盖回去（探针实测过的「后写覆盖前写」）。
#
# 骨架期还有 `GA_ROLE=placeholder` 那半个写者撑 pending；那一半随转正退役，
# fail-closed 改由 `GA 回调结论回读` 承担（主列 build 活到出结论，超时即红）。
# 被 cancel 的占位会不会仍写终态那一格探针已实测闭合（cancel 不留拉红聚合的
# 终态），而单写者之后它连对象都没有了。
#
# 不与 `pr-$CNB_PULL_REQUEST_IID` 共用：api_trigger 事件上那个变量无值，
# 落回字面 `pr-` 会把并行的 PR 主列一起掐掉（`pr-` 一把共用的同款死因）。
.lock-ga-verdict: &lock_ga_verdict
  key: ga-verdict
  cancel-in-progress: true
# ⚠️ 这里曾有 `.lock-formatfix`（`oxfmt 格式` 的委托回写口独占一把锁）。
# 那个事件连同委托后来被整条摘掉（PR 事件的令牌推不动、也触发不了可信事件），
# 所以这把锁没有引用者了 —— 留着它就是一条「在册而无人出勤」的配置（§13.5.x 那一族）。

# ── push 档（`master 合并复核`）的格子：树级校验档 ────────────────────────────
#
# 扩格（此前整条只有 `合并形态复核` 一格、20~35 秒）。撤进来的四格判的都是
# 「**合并后的树**一致不一致 / 这次运行的事实是什么」，不是「这次 PR 改了什么」——
# 那一类留在 PR 档（判据面在 `ci-incremental-gates.mjs` 的登记里逐条写着为什么收窄安全）。
# 的 `GitHub master 镜像` 是这一档里唯一的例外：它不校验树，是出口动作
# （把 master 镜像到 GitHub，那边的 schedule 才跑得到新树），取舍写在那格的注释里。
# 顺序有讲究：
#   · `合并形态复核` 排最前：形态不对（非合并提交）时后面全部 skipped，
#     别在没资格的工作区上花文档链的钱；
#   · `GitHub master 镜像` 紧随其后：它不吃 node_modules，排在前提格之前没有成本；
#     排在它后面反而会让「文档链红了」连带「镜像不推」—— 那不是想要的对偶；
#   · `安装依赖` 是前提格：这一档的 `生成态文档与源同步` 要吃 `node_modules`，而 push 是
#     全新 job 目录、`node_modules` 恒不在场（与每日档同一形态，理由见 `每日安装依赖` 那段）。
#     缺了它，这一档会以「找不到依赖」的形态红 —— 与每日档当年「找不到 next」同一族。
#     `API 文档生成与自检` 撤到每日档后不再吃这一格，但它在每日档同样排在
#     `每日安装依赖` 之后。
#     **这一格接槽**。判「哪一档能接」的那条线不是档名，是**后面有没有
#     `next build`**：接槽把作业的 `node_modules` 整棵接成指向项目根之外的 junction，而
#     Turbopack 对这一条有硬要求（每日那一档因此不接，理由与两臂读数见 `每日安装依赖` 上面那段）。
#     push 清单里没有构建格 ⇒ 那条限制与这一档无关。证伪不是靠推的：这四格在搬到 push 档之前
#     长在**接了槽的 PR 流水线**上，两臂（未命中建槽 / 命中）的逐格原值、以及「哪一格在哪一臂
#     因 `ifModify` 没被执行到」都记在规范 §13.5.3.4.3 —— 这里不抄数，抄一份就会漂第二次。
#     ⚠️ 收益的**预估同样不进正文**（§13.5.3.4.3 那条量具纪律）：落地后已按同一格回查，
#     原值与「两个方向都不许外推」那两句都在规范那一份出处里。
#   · 四格保持 PR 档时的**同一入口、同一旗标、同一 `ifModify`** —— 撤档不等于换判据。
#     `ifModify` 在 push 事件上的语义由平台按合并提交的差异面算；平台不认时恒跑，
#     方向是「多跑」不是「漏跑」，安全侧。
.push-stages: &push_stages
  - name: 合并形态复核
    # 这一格曾有「唯一没钉控制台编码」的历史（规范 §13.5.3.9）：补上那层 `$enc=…`
    # 不改变读数，但让它不依赖「控制台代码页恰好是多少」这个**继承来的**状态。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-branch-guard.cjs --merge-commit
  # ── GitHub master 镜像：这一档唯一的**出口动作**（不校验树）──────────────────
  #
  # 它要回答的事：GitHub 侧的 schedule（`.github/workflows/daily.yml` /
  # `package-desktop.yml`）跑的是镜像仓的**默认分支** —— CNB 的 master 不推过去，
  # 它们每天跑的就是一棵停在旧 SHA 的树，绿灯与「今天的 master 行不行」无关。
  # 所以每一次 master push 都要把 HEAD 推成那边的 `refs/heads/master`（`--force`：
  # 镜像语义是「跟住」，漏推之后下一推自己追平），并补一跳 `git lfs push` ——
  # daily / package-desktop 的 checkout 同样开 `lfs: true`，字体对象不在就是假红。
  #
  # 排位：在 `合并形态复核` **之后**（形态不对的工作区整档 fail-stop，没资格的树不推）、
  # 在 `安装依赖` **之前**（推送只吃 git 与令牌，不吃 node_modules —— 早推早就位，
  # 也让后面几格校验红掉时镜像不跟着陪葬：树级校验红 ≠ master 不该被镜像）。
  #
  # `--readout` 与 PR 那一格 `GitHub 镜像同步` 同族同理由：egress / 仓库 /
  # 令牌是**外部前提**，实测这条链路上撞过 `Failed to connect to github.com port 443`，
  # 前提没落地不许叠进树级校验的红；三态原值照旧逐行打在日志里。脚本那一侧的形态
  # （不派发、不需要 IID、`[mirror-master]` 前缀）见 `scripts/ci-github-mirror-push.mjs`
  # 文件头「--master」一节。令牌经 push 流水线的 `imports:` 注入（与 PR 那条同一枚）。
  - name: GitHub master 镜像
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-github-mirror-push.mjs --master --readout
    # 与 PR 那一格同一档外框：探活与内容推送**共用一份 4 分钟墙钟预算**（从探活起算，
    # 两跳各至多 10 次、退避 5s→50s）、LFS 第二跳单独吃 60s 预算（至多 5 次）。
    # 探活也纳入这份预算：那一跳失败会短路掉整格，只给推送等于没给。
    # 常量与理由在 `scripts/ci-mirror-retry-policy.mjs` 与 `ci-mirror-wire-budget.mjs`。
    # 10m 包住最坏账（探活+推送共用 240s + LFS 首刀 240s = 480s）与冷启动余量；
    # LFS 首刀**不裁**超时（60s 预算只管重试），免得把一次「慢但正常」的对象上传掐死。
    timeout: 10m
  - name: 安装依赖
    # 与 `每日安装依赖` 的**命令行 / env / timeout 三样都逐字相同**
    # （判据 `tests/no-platform-ci-config.test.ts` 的 `CROSS_LANE_SCRIPT_MIRRORS`；
    # PR 档不再有安装格，这一对面换成「每日 ⇄ push」）。
    # 同一份脚本长在几条流水线上各配一份 env，就是几条流水线各自漂（§12.12 的孪生形态，
    # 只是它长在配置里）。墙钟那一行是给 `ci-install-deps.mjs` 自己的 12m 预算留的余量，
    # 不是「抬 timeout 换绿」（§11.13）。
    env:
      COMFY_CI_SLOT: "1"
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 生成态文档与源同步
    ifModify:
      - "docs/**"
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/render-doc-placeholders.cjs --check --autofix
  - name: 文档引用与权威源一致
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-doc-references.cjs
  - name: 工作区出处
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-workspace-provenance.mjs
    timeout: 5m

.daily-gates: &daily_gates
  # ── 每日失败立案：排在**整份清单的最前面**，判的是「上一跑」──────────────────
  #
  # 为什么在这一格：`check-daily-attendance` 那条判据要有人跑才出结论，
  # 于是「每天 01:00 那一跑红了」这件事在没人问的日子里等于没发生 —— 而它一红就带下去
  # 后面四格整片 `skipped`，其中 `每日单元测试` / `每日全量E2E` 的唯一执行者就在这条链上。
  # 这一格把「红了」自动变成一张单（或在同一格的旧单下追加一条读数），不依赖有人想起来去问。
  #
  # ⚠️ **必须在最前面，不是排版选择**：它立案的是**上一跑**（此刻这一跑还没跑完，
  # 它自己的结论不存在）。写在任何一条红格之后，都会被那条红一起 `skipped` ——
  # 而那正是本单要治的形态。平台没有可用的条件语法可依赖：本文件今天只有 `ifModify`，
  # 没有一处 `when:` / `fail()`（别猜它有）。
  #
  # ⚠️ `--no-block` 是一条**取舍**，不是宽容：这一格自己坏掉时（取不到平台读数 / 写单被拒），
  # 拦路等于用「后面四格没有读数」换「红被承认」。所以非零都落成退 0，但那句红话原样打在
  # 屏幕上并给出可粘贴的手工出口 —— 由用例钉住「不许改成静默 return」（`--no-block` 不带时
  # 仍是仓内三态口径 0/1/2，本地与判据档用那一档）。
  #
  # ⚠️ `--lane 每日生产构建` 是**必给**的：定性与日志取回来之后，
  # 还要认得出「红的那一格是不是这一档的流水线」—— 02:00 那条定时口的事件名同样是
  # `crontab:` 前缀，只按事件名挑「上一跑」，就会把桌包那一跑的红记到每日档头上
  # （实测现场：一次桌包档红在 `打包·壳工具链自证`，标题却写成
  # `ci(daily): … 红在「打包·壳工具链自证」`）。流水线名就是平台自己写的归属，
  # 不必猜事件与档的对应关系；给了它之后，不是这一档的那几跑一律「不归本格管」。
  - name: 每日失败立案
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-daily-failure-issue.mjs --no-block --lane 每日生产构建
    # 5m：三条读命令（构建列表 / 逐格详情 / 逐格日志）+ 最多一次建单。实测本地跑同一入口
    # （`--dry-run`，含逐格日志摘录）1.6s。给 5m 是留给节点冷启动与平台慢响应，
    # 而不是给「让它多试几次」—— 这一格拿不到读数时**不重试也不写**，退 2 由话术说出来。
    timeout: 5m
  # ── 令牌权限读数：这一跑的 `CNB_TOKEN` 够得着哪些能力────────────
  #
  # 为什么要有这一格：本仓引用「PR 那一族只有 `repo-code:r`」这句话的地方有十几处，
  # 而出处始终是**别人先撞上 403 之后抄下来的
  # 那句话**。于是「PR 上到底有没有 `repo-issue:r`」这个问题，过去只能翻官方文档的权限表
  # 再猜平台实现。这一格拿一串**只读**接口挨个问一遍：403 里平台会自己点名缺什么 scope，
  # 于是**平台自报的授权面**落进构建日志，不必等某一格真去写、真被拒。
  #
  # ⚠️ **排在第一格 `每日失败立案` 之后**，不是排在它之前：那一格立案的是**上一跑**，
  # 所以它必须排在任何可能红的格前面（否则被前面那次红一起 `skipped`，而它要治的正是
  # 那个形态）。这一格虽然是读数、自己也几乎不会红，但要挪到它前面就得先回答「为什么
  # 立案那一格可以让位」—— 答案是没有理由让位，所以顺序就是这样。
  #
  # ⚠️ **不带 `--strict`**，而且这是踩过一脚之后的结论：带了之后这一格在
  # `pr_fail_stage` 上**红**了，而红的原因是
  # **平台侧** —— 那一跑的令牌连 `repo-cnb-history:r` 都没有（同跑的 `PR 失败立案`
  # 撞的就是这一句），于是 14 条探针全落「没拿到答复」，`--strict` 把「一条明确答复
  # 都没有」提成退 2。于是 PR 上会出现一条**永远红、且没有任何人能修**的格子 ——
  # 「没量到」不是这一格坏了，那正是这一格要量的东西。
  #
  # 于是这一格**任何情况都不构成红**（`--strict` 只留给手工自查）。这与
  # `工作区复用读数` / `镜像身份` 同一口径：量的是平台怎么给权限，判它红等于把平台形态
  # 伪装成这次 PR 的缺陷。
  #
  # ⚠️ 它**不打令牌值**（硬规则 17）：打的是「哪些能力够得着」，不是「凭什么够得着」。
  # OIDC 兑换那一问的请求体含 `cnb_token`，所以默认不发、只有 `--probe-oidc` 显式点名才发。
  #
  # ⚠️ **它走 HTTP，不起 `cnb`**（第五跑读数）：自托管 runner 的宿主 PATH 上**没有 cnb**
  # （`Install dependencies` 那一格的日志里只有 node / pnpm / git），前四跑因此全落
  # 「输出里没有平台信封」。这一格只要平台无条件注入的两件：`CNB_TOKEN` +
  # `CNB_API_ENDPOINT`，加宿主 Node 自带的 `fetch` —— 所以它能在装依赖之前就跑。
  - name: 每日令牌权限读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-token-scopes.mjs
    # 5m：14 条只读请求**并发**跑（实测本机合计 0.45s）。第五跑给的是 2m，而那一跑
    # 撞上了这个数 —— 读数全跑完了、却整格被判超时。预算按「卡死要早报」的量级给，
    # 不按那次读数调：并发之后单条慢请求已经被掩盖掉，剩下的风险是平台整体慢。
    timeout: 5m
  # ── 前提三格：script 行与 PR 那条流水线上的同名档**逐字相同** ──────────
  # 为什么不共用 YAML 锚点：`pipelineStageNames()` / `stageBlock()` 是按名字在文本里
  # 取块的，两格重名会让「哪一条流水线的读数」变成解析器的运气。所以这里各起一个
  # 带「每日」前缀的名字，而**由判据钉住它的 script 与 PR 那一格逐字相同**
  # （`tests/no-platform-ci-config.test.ts`）—— 漂移的形态是「一边改了另一边没改」，
  # 那正是这份清单里所有「只许一处」的判据在挡的东西。
  # ── 工具链自证（自托管特有：没有 docker 镜像兜底，装没装由这一步说了算）──
  # 这段是本文件存在的**前提**，不是可选的自检：宿主机缺 Node / pnpm / git 时，
  # 后面每一步都会以看不懂的方式失败（`pnpm: not recognized`、corepack 拉版本超时），
  # 排障成本远高于在这里花三秒正面回答。失败即非零退出 —— 它必须会红。
  #
  # ⚠️ 这一格已从 PR 那一条挪到这里（业主口径：「只是判断环境的，不要每次都判断，
  # 这个环境不会经常改动」）。**挪的是节奏，不是撤账**：这一格在 PR 上每次跑要
  # 13.8s（逐格读数见 `COMFYAPP_CI_GATES` 那段），而它问的是**节点事实** ——
  # 一次 PR 改不动 PATH、改不动 winget。今天卡住每日那一跑的三条基线红里就有一条
  # 长在这一族上（`ci-toolchain-selfcheck`），「每次都判」换到的是噪声而不是结论。
  # 留在 PR 上的那一半（`check-pnpm-available.mjs`）随安装格一起交给
  # GA：那一问仍然有人答，只是换了一个 runner。
  - name: 每日工具链自证
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      # ── 编码探针（头注第 6 条那件事的**常读读数**）──
      # 前四行中文分别由四层吐出：PS 自己（写它自己的编码）、cmd（console CP）、
      # node（UTF-8）、以及**绕过控制台对象、直接以 CP936 字节写 stdout** 的那一行。
      # 哪一行在平台侧可读，就说明**平台在那一层用的是什么编码** —— 乱码是「多层里
      # 哪一层断的」这件事，只看一行日志永远分不开。
      Write-Output "编码探针·PS 原生：中文一二三"
      cmd /c "echo 编码探针·CMD：中文一二三"
      node -e "console.log('编码探针·NODE：中文一二三')"
      # 第 4 行是**决定性的那一条**：前两轮读数已经否掉「控制台代码页」
      # 与「宿主 ANSI 代码页」两个嫌疑人，剩下「解码端写死 CP936」这一种。
      # 这一行可读 ⇒ 就是它，仓库侧「逐 stage 以 CP936 出口」这条出路成立；
      # 这一行仍乱 ⇒ 还没找对层，继续往上（判读见头注第 6 条）。
      $gbk=[Text.Encoding]::GetEncoding(936); $b=$gbk.GetBytes("编码探针·GBK 出口：中文一二三`n"); [Console]::OpenStandardOutput().Write($b,0,$b.Length); [Console]::OpenStandardOutput().Flush()
      # 逻辑在 scripts/ci-toolchain-selfcheck.mjs —— **不在这里就地写 PowerShell**。
      #
      # 这一步原先是一段 ~70 行就地 PowerShell（探 Python、用 winget 当场装、
      # 打印「这个账号看得见什么」）。问题不在它写得对不对，而在**配置里的逻辑
      # 一条判据都测不到它** —— `.cnb.yml` 只在平台上跑，本地一个执行者都没有，
      # 于是它只能靠「推上去看看红不红」验（实测红过好几轮）。
      #
      # 现在是 scripts/ci-toolchain-selfcheck.mjs：
      #   · 候选表回到唯一一处（src/lib/process/python-candidates.ts）——
      #     此前它探的面与门禁探的面不是同一份，两边各判一次「没有」；
      #   · 这一步**能被单测直接跑**（tests/ci-toolchain-selfcheck.test.ts）；
      #   · 失败时的取证（执行账号、PATH、四个安装位置的命中情况）一并搬进脚本，
      #     并给出「位置命中而命令探不到 ⇒ 改账号 PATH，别重复装」这条分岔。
      # 仍会红：缺 git / node（不在 engines.node 内）/ pnpm / Python 时非零退出。
      # 清单与判读顺序见 docs/standards/13-提交与-code-review.md §13.5.3.5。
      #
      # **第一件事是把控制台输出编码钉成 UTF-8**（治平台日志中文乱码那一跳）。
      # 平台抓取 stage 输出用的是宿主 ANSI 代码页（中文 Windows 上是 CP936），
      # 而 Node / pnpm 无条件写 UTF-8 —— 于是本机打的每一个非 ASCII 字符在日志里
      # 都是乱码（`工具链自证通过 ✓` → `宸ュ叿閾捐嚜璇侀€氳繃 鉁?`），而 PowerShell
      # 自己打的字是好的（它按控制台的编码写字节）。这一句把那两边重新对齐。
      # 放在**最前**：后面的每一步都在打这种字，先把编码钉住再说话。
      # `chcp` / `[Console]::OutputEncoding` 改的是**控制台对象**上的设置，
      # 同一控制台里的进程共享它 —— 所以它在第一步设、后面的 stage 都受益。
      # 它恒退 0（纠正动作与读数，不是判据），机制见 scripts/ci-console-encoding.mjs。
      # ⚠️ 两条各包一层 `ci-cp936-exit`：先钉住控制台编码（让 PowerShell 把 Node 的
      # UTF-8 **解对**），再由外壳把它以 **CP936** 写回给平台。
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-console-encoding.mjs --apply
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs
  # 与 PR 那格同一份实现（`ci-install-deps.mjs`：先自证 pnpm 起得来，再按语义判
  # 要不要装）。判定与命令行**必须与 PR 那格逐字相同** —— 这不是风格：判据
  # `tests/no-platform-ci-config.test.ts` 的 `CROSS_LANE_SCRIPT_MIRRORS` 比命令行、
  # env 赋值与 `timeout` 三样，同一份脚本长在两条流水线上各配一份 env，
  # 就是两条流水线各自漂（§12.12 的孪生形态）。
  #
  # ⚠️ **这一格现在不接槽，而那是那条判据上唯一登记过的例外**：
  # 接槽把作业里的 `node_modules` 整体接成**指向项目根之外**的 junction，而 Turbopack 对
  # 这一条有硬要求 —— 每日那一跑后面背着 `每日生产构建`，它当场
  # `Symlink [project]/node_modules is invalid, it points out of the filesystem root`（13.8s 就死，
  # 连带 skip 掉 ESLint / 浏览器 / 全量E2E / 全量单测四格）。PR 那一格不构建，所以同一条链
  # 在 PR 上从来没有被它的消费者拒绝过（push 那一格同理，开关已拨过去）。
  # ⚠️ **这条限制现在是「没验过」而不是「无解」**：官方
  # `experimental.turbopackAdditionalRoots` 那扇门装进 `next.config.js`（只在
  # `COMFY_CI_SLOT=1` 时登记槽根），可这一档从不置那个开关 ⇒ **那份 mitigation 在每日档上
  # 一次都没有被执行过**。撤这条限制要先拿一次真构建验它承重，不能拿「配置在场」当「验过了」。
  # 两臂读数（同一台机、同一份 master，唯一变量就是这一行 env）见规范 §13.5.3.4.3 与
  # `docs/audits/2026-10-21-timing-baseline-refs-volume.md`：接槽命中 13.8s、不接槽 48.8s（暖）。
  # ⇒ 代价是**每天多付 ~35s**，换来的是整条每日档有一个能构建的工作区 —— 槽是优化不是前提。
  # 例外不是「可以随便漂」：判据钉死「另一侧必须置着 `COMFY_CI_SLOT`、每日这一侧一个字都不许出现」，
  # 其余各行仍然逐字相同；改这条形状要走判据，不能只改这里。
  - name: 每日安装依赖
    # 与 push 那一格 `安装依赖` 同一条链 ⇒ 同一个墙钟。`timeout` 也在
    # 「逐字相同」的比对面里：这一行改成别的数，就是副本里第一份开始漂。
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  # ── 镜像出勤 / egress 立案（方案 B：保持承重 + 补自动执行者）──────
  #
  # `pnpm check:mirror-attendance` 早就在（`scripts/check-mirror-attendance.mjs`），
  # 三态 0/1/2、按**正文**认「已推 · 已派发」、逐形状里 `egress` 独立成键。但它此前是
  # **按需档**：三份清单里没有一格跑它 ⇒ 断流只能靠人手动敲一次或翻某条 PR 的日志才知道。
  # 这一格把「有人跑」变成事实，24h 窗口内出现 egress 就建单 / 在旧单追加读数（去重键在
  # 标题里，一条诉求一张单）。**它不改**镜像格与 `GitHub 判决回读 / 判定` 的承重口径
  # （那几个名字一个都不许摘）：断流时 PR 照旧会红，变的是红之前已有机器读数把
  # 「环境红 ≠ 内容红」写成 `environment-red=github-mirror-egress` 那一行。
  #
  # ⚠️ `--no-block` 是**必须**的，不是宽容：这格量的是节点出网（仓库改不了的事实），
  # 而它排在 `每日单元测试` / `每日全量E2E` 之前 —— 间歇性 egress 几乎天天有，做成会红的格
  # 就等于每天把后面整条每日链 skip 掉（§13.5.21）。非零折成退 0，但那句红话原样打在
  # 屏幕上并给可粘贴的手工出口，由 `tests/ci-mirror-egress-issue.test.ts` 钉住不许静默。
  # ⚠️ 判据自己**不重试也不判绿**：列表取不到 / 窗口没盖满 / 开着的单取不到 ⇒ 退 2「没结论」，
  # 一次都不写（§13.6.3）。退 2 不算「今天没有 egress」。
  #
  # 排在 `每日安装依赖` **之后**不是排版：`makeRunner()` 的 `cnbSpawn()` 要装完依赖才解析得到
  # 包真身（自托管 runner 宿主 PATH 上没有 `cnb`，五跑读数见 §13.10.16）；
  # 同一跑的 `PR 失败立案` 好得很，正因为它在依赖装好之后。排在 `每日单元测试` 之前则是
  # 「最后一条会红的格」那条顺序判据。它自己不红，也不许挪到那条之后。
  - name: 每日镜像出勤立案
    timeout: 5m
    script: |
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-mirror-egress-issue.mjs --no-block
  # ── GH workflows 的**真解析**（档位 ②：只挂每日档）────────────
  #
  # `check:ci-yaml` 只判三件：YAML 能解析、锚点 / 别名合法、CNB 每格有 `name` + `script`。
  # 它在 YAML 层全是合法字符串的那一类错里抓不到 GH Actions 的语义错（非法 `on:` /
  # 未知 step 键 / `uses` 形态 / 表达式语法）—— 那些要等平台起跑才红。这一格用
  # actionlint 补上这一层，**只判 `.github/workflows/*.yml`**；`.cnb.yml` 没有公开
  # schema，手写一份的维护成本高于它能抓到的错，仍走 `check:ci-yaml`。
  #
  # 取用**零网络**：二进制钉在节点常驻根（`ci-tools/actionlint-1.7.7`，与
  # 桌包工具同一条 `resolveToolRoot` 路），版本与 sha256 写在 `scripts/ci-actionlint.mjs`
  # 顶部。常驻根里没有 / 哈希不符 ⇒ 退 2 / 退 1 并在末行念出出口，**绝不现下** ——
  # 节点到 github.com 本就抖动，现下会把「今天取不到工具」伪装成「workflow 有错」。
  # 末行是结论（平台日志页只看得到末尾时仍读得到）。
  #
  # 为什么只挂每日档：`.cnb.yml` / workflows 的改动频率低（选档时的结论），
  # 而每条 PR 都付一格是另一笔账；真解析要的 actionlint 也只是这一件事在用。
  - name: 每日 YAML 真解析
    timeout: 5m
    script: |
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-actionlint.mjs
  - name: 每日 Python 可用性
    # ── **必须排在「每日单元测试」之前**（这条顺序随两格一起从 PR 那条搬来）──
    #
    # 套件里有一族用例（`tests/helpers/python-exe.ts` 的 `PYTHON_OK` 守卫、
    # `e2e/support/fake-comfyui-executor-env.mjs`、`scripts/check-app-port-vectors.cjs`）
    # 需要一个**真能起来**的解释器。缺件时它们按既有口径走 `env` 档跳过并登记 —— 也就是说
    # 这一步**不会让那一格变红**，只是少判几格。而「少判」在日志里是隐身的。
    #
    # 实测：这台节点上确实一个解释器都没有，而单测照样往下跑、
    # `Python 可用性` 排在**两小时之后** —— 于是「缺 Python」这件事要么永远看不到，
    # 要么在最贵的位置才看到：那一次 `单元测试` 跑到 2h24m 被 8640s 的墙钟上限掐断，
    # 整条流水线只留下 `timeout of 8640000ms exceeded`，一条失败原因都读不到。
    #
    # 判据那一份只有 `--python-only` 一个（`findPython` / `installPython` /
    # `pythonForensics`）；它与 `每日工具链自证` 不重复：那一步判**整机四件**且缺件即红，
    # 这一步只回答**解释器住哪** —— 绿时打一行版本号（把「E2E 到底用哪个解释器」变成
    # 可读读数），缺件时打取证并**非零退出**（红在能指路的位置）。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --python-only
  # ── Python 探针读数（两条链各自的结论，**只打印、不阻断**）──
  #
  # `每日 Python 可用性` 用的那条链（`findPython` 起**裸名字**，Windows 交给 CreateProcess
  # 按 PATH 解析）与 E2E 前置用的那条链（`resolvePython` 手工扫 PATH × PATHEXT、再对
  # **绝对路径**起一次）是「同一台机器上哪个解释器能跑」的两个不同实现。实测出过
  # 相反结论（一次实测：`Python 可用性` 绿、`E2E 关键流程` 报
  # 「PATH 上没有可用的 Python」）—— 而**只看一边的日志分不出是哪一边错**。
  #
  # `scripts/python-probe.mjs` 把两边的读数都打，退出码恒为 0：它是**打印**、
  # 不是判据（判据那一份只有 `--python-only` 一个）。它已随 `Python 可用性`
  # 一起从 PR 那一条挪来（同一口径：判的是节点，不是这次改动），而它排在解释器
  # 判据之后、`每日全量E2E` 之前 —— 那才是这两份结论互相要看着的位置。
  - name: 每日 Python 探针读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/python-probe.mjs
  - name: 每日同步数据库表结构
    # 库里要有表：套件里读库的那几条在没有库时的形态是「连不上」，看起来像业务故障
    # （§9.1 那格「页面 200、接口 500」的同一族误诊）。`db-push.mjs` 复核真建出表。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/db-push.mjs
  # ── 每日新鲜度账（主体=master；判据本体与 PR 那格逐字相同）────────────────
  #
  # 这一格是 `scripts/freshness-gate.mjs` 的**每日执行者**（判据一字未改，仍与
  # `.githooks/pre-commit` 的 D 组「每档都有主」同一份，§13.5.17 同款）。
  # 它从 PR 那一条撤到这里（主体分权）。
  #
  # ⚠️ **env 那一行是这一格存在的理由**：主体=master ⇒ 判据读的是**主干的账**
  # （`FRESHNESS_TRACKS[*].subject` 现在三档都是 `master`；机器分支
  # `ci/freshness-ledger` 上是那份权威副本）。PR 上下文读的是同一份账，
  # 判的却是「这台机器 / 主干怎么被调度」，不是任何一次 PR 的缺陷 ——
  # 所以 PR 那一格撤了，主体这一栏不许省。
  #
  # ⚠️ **位置**：必须排在任何会刷新账的跑法脚本之前（`每日生产构建` /
  # `每日全量E2E` / `每日单元测试` 三格跑绿后会刷新自己那笔账；同一分支的 stage
  # 共享同一个工作区 ⇒ 排在它后面时读到的是「刚被这一次运行改过的账」，
  # 「账是旧的」永远判不出来）。
  - name: 每日新鲜度账
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/freshness-gate.mjs
    env:
      # 主体=master（`scripts/freshness-ledger.mjs` 的 `contextSubject()`：空 ⇒ "pr"，
      # 写错的值直接抛）。这一行是这一格与 PR 那格**唯一**的差别。
      COMFY_CI_SUBJECT: "master"
    # 秒级；给 5m 只是「卡死要早报」那条量级余量（判据本身远小于它，不需要更宽）。
    timeout: 5m
  # ── 全量单测**不在这里**：它排在整份清单的最后 ──
  # 理由是业主那句「最容易出问题的放最后」：这一档是这条流水线上唯一会因**这台机的
  # 负载**而单条超时的格子（实测：775 份里 1 份红在
  # `Test timed out in 30000ms`，而同一时刻另一份检出在跑全量 vitest），
  # 排在中间就等于让一单条抖动决定后面三格跑不跑 —— 那三格至今零执行记录。
  # 原文与预算注释在 `.daily-gates` 末尾。顺序由判据钉住（不许回到中间）。
  # 入口是**跑法脚本**，不是裸命令：
  # 裸 `pnpm run build` 会让这一步的绿只落在日志里、`scripts/.artifact-freshness.json`
  # 一个字不变。外面这一层（`ci-daily-build.mjs`）多出来的只有事件身份与镜像读数，
  # 判据与记账仍然是 `artifact-run.mjs` 那一份。
  - name: 每日生产构建
    # 控制台编码先钉住（头注第 6 条 / `ci-cp936-exit.mjs`），与其余每一格同形。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-daily-build.mjs
    # ── 构建缓存槽（机制与实测见 `scripts/ci-build-cache-slot.mjs` 头注）──
    #
    # 这一格跑的是**生产构建**（每日那格是这台节点上**唯一每天都会发生的构建**；单跑口是同一份
    # 脚本的副本，两格正文必须逐字相同）。runner 每个作业都新建一个带流水线 id 的工作区目录
    # （形态由 `工作区复用读数` 定死）⇒ Turbopack 的持久缓存每次都从零开始。
    # 实测（同机同源三跑，`next build` 自报的编译段）：**冷** 95s ／ **暖**（用上一个工作区
    # 留下的常驻目录）14.9s —— 省的是整个编译段。
    #
    # ⚠️ **开关默认关**（`COMFY_CI_BUILD_CACHE`），只有构建这两格置着它。理由与依赖面那套槽同源：
    # 先让判据在场，再把开关拨过去（规范 §13.5.25）。机制本身是**失败即退回**的：槽根算不出、
    # 空间不够、槽被别人占着 —— 任一成立就只打一行读数、照常构建（缓存是加速，不是前提）。
    env:
      COMFY_CI_BUILD_CACHE: "1"
      COMFY_CI_SUBJECT: "master"
    # 30m：这一格跑的就是 `next build` + 数产物 + 冒烟。实测 118s / 131.0s（两次暖跑），
    # 而 `next build` 在冷
    # 节点上比读数慢得多，但真挂死必须早报 —— 一天的预算只有这一条，卡满 2h 墙钟
    # 等于当天这一跑没有结论。与 `artifact-run.mjs` 的 `ARTIFACT_TIMEOUT_MS` 同量级。
    # ⚠️ 它**没有并发旋钮**，这是刻意的（规范 §13.5.21）：`next build`
    # 的 worker 数由构建器自己按机器定，没有一个「按核数收敛」的键；`NODE_OPTIONS`
    # 那类改的是内存上限、不是并发 —— 拿它冒充降载就是换一个东西。这条路径上
    # **唯一真能控负载**的手段是「别让两条流水线同时压同一台机」
    # （`lock.cancel-in-progress` + 按 PR 分锁，见 §13.5.3.10）。
    timeout: 30m
  # ── ESLint 零警告（每天一次；已从 PR 那条流水线撤到这里）─────────
  #
  # 它在 PR 上是**唯一一个真的会挂满预算**的静态判据：两次现场都不是「规则报错」，
  # 而是这一步始终没跑完 —— 一次挂到 8640s（节点被别的流水线压死），
  # 一次挂满 20m（命令口径写成了 `eslint .`，全仓冷跑；那一格现在
  # 跑的是 `pnpm run lint`，理由写在那段注释里）。
  #
  # 撤档的理由与 `每日生产构建` / `每日单元测试` 逐字相同（§13.5.21 / §13.5.23）：
  # 它是这台机上仅有的几档**起一堆子进程**的格子之一（类型感知规则要真起 ts 宿主），
  # 而节点只有一台、平台不给并发旋钮 ⇒ 并行 PR 下它的墙钟读数不可信。红的地方也
  # 不是「这次改动违规」，而是「这台机当时腾不出核」。
  #
  # ⚠️ 这**不是**把 lint 整个挪出 PR 这一档：`oxfmt 格式` / `格式化提交分离` /
  #   一批 `check-*.cjs` 仍在 PR 上，`tsc --noEmit` 也在 —— 只有这一格撤，
  #   因为只有它同时满足「起一堆子进程」与「本地有等价执行者」两条。
  #
  # 判据钉住的两半（`tests/no-platform-ci-config.test.ts`）：
  #   · 它**不在** PR 那一条的清单里，且在 `COMFYAPP_CI_DISABLED_GATES` 里留名
  #     （停用 ≠ 删除：`.gates` 里那段原文必须还在）；
  #   · 这一格必须在每日清单里，且 `script` 与 `.gates` 里那段注释原文的 `script`
  #     行**逐字同形**（漂移的形态是「一边改了另一边没改」）。
  - name: 每日 ESLint 零警告
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- pnpm run lint
    # 冷跑（这条路径上 `--cache` 恒定失效：缓存键含工作区的绝对路径，而平台每个作业
    # 都是新目录，见 `.gates` 里那段）实测：本机 8 核 ≈311s；节点侧历史上热跑
    # 256~274s、被压死时挂满过 8640s。给 30m 与 `每日生产构建` 同档 —— 一天只有这
    # 一跑，卡死要早报，而「跑得完的形态」与它差一个量级。
    timeout: 30m
  # ── 每日全量 E2E 的前提格：浏览器 ──────────────────────────────────
  # 与 PR 那格 `浏览器安装` 同一份实现（`ci-toolchain-selfcheck.mjs --playwright-only`），
  # 所以**两行 env 也必须一起带**：下载根与连接超时是实测读数换来的，
  # 只镜像命令行不镜像 env 时，「Playwright 换版本的那个
  # 早上」定时那一跑会从默认根去取那 120 MiB —— 而默认根在这台节点上取不到，
  # 红只在第二天 01:00 出现。镜像判据现在两处都比（命令行 + `env` 的赋值行）。
  # 幂等：落点已有那一件时这一格是 1~5s（实测）。
  # ── 浏览器安装（这是**唯一**的执行者：PR 上那一格撤到这里）──
  #
  # 撤的理由与 `每日工具链自证` 同一条：它判的是**这台节点能不能到下载根、浏览器在不在
  # 盘上**，一次 PR 改不动这两件事；而 `E2E 关键流程` 早已撤到 `每日全量E2E`，
  # PR 上没有任何一步再用浏览器 —— 那一格剩下的唯一作用只是「替第二天暖缓存」，
  # 那不该由每个 PR 付费。
  # 判据仍然钉住这件事的两半：这一格必须在 `每日全量E2E` **之前**，
  # 且 script / env 与当初 PR 上那一格**逐字同形**（镜像键与套接字超时是两个实测读数，
  # 抄错一处就回到「到不了」那一档，见下面那两段注释）。
  - name: 每日浏览器安装
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --playwright-only
    env:
      # **这两行是实测读数换来的**。
      #
      # 先撞的是 30s 的**套接字**超时（`NET_DEFAULT_TIMEOUT`）—— 那不等于「CDN 不通」，
      # 是「这一次没量完」。可把它放宽到 120s 之后**照旧超时**（`timed out after 120000ms`），
      # 于是结论变了：这台节点**真的到不了** `cdn.playwright.dev`。180 MiB 的包在
      # 这样一条链路上无论等多久都不会到。
      #
      # 所以换镜像 —— 走 `PLAYWRIGHT_DOWNLOAD_HOST`（Playwright 自己的环境变量，
      # 不引第二套机制）。选 npmmirror 的 Playwright 二进制镜像是因为**它真能供上这一件**：
      # 实测它按同一段路径回 HTTP 200，且 15s 内收到了 99 MiB。
      #
      # **为什么这一行只能是「外面给的」**：Playwright 自己的三个内置镜像**全同族**
      # （`cdn.playwright.dev` / `playwright.download.prss.microsoft.com`），
      # 这台节点出不去这一族时它 `retryCount = 5` 的「回退」等于没有 ——
      # 实测逐字打了 5 次同一个域名，然后 `Download failure, code=1`。
      # 也就是说这一档**推不出来**，只能由这里给：给上之后
      # `runPlaywrightInstall()` 就只用它（不再陪 Playwright 挨个试不通的那三档）。
      #
      # ⚠️ **这个值是给这台节点用的，换网络要跟着换**。平台侧 env 能覆盖它；
      # 本地不设就回到 Playwright 的默认行为（`playwrightHostsToTry` 的判据）。
      # 选它是因为它是 Playwright 点名的镜像键，而不是本仓发明的那一套；
      # 真要换（内网代理、别的镜像站）改这一行即可。
      #
      # ⚠️ 这两行与判据无关：判据仍是「装完真起一次浏览器」（`--playwright-only` 的复验）。
      # 镜像只是把「到得了」这件事从宿主机身上挪到一个到得了的地方。
      # 而这一步有**两条**通道：先自己分片取（不依赖这个根到得了大 body），
      # 失败才原样交给 `playwright install`（那时才用得上下面这两行）。
      #
      # ⚠️ **「很慢」要分两层看，换源只治其中一层**（用户那句诉求）。
      # 换源治的是「从哪儿取」；`playwright install` 自己那份下载**没有续传**
      # （`browserFetcher.ts` 每次失败 `unlink(zipPath)` 从头来），所以慢链路上一换
      # 源也照样卡在大 body 上 —— 那一层由本仓的分片自取（`fetchUrlResumable`）治。
      # 也就是说：**换源不是唯一的慢因，也不是判据**；判据始终是「装完真起一次」。
      # 三个候选根的顺序同步调过（`PLAYWRIGHT_HOST_CANDIDATES` 把 npmmirror 排前），
      # 好处是「没配根的环境（本地 / 别的节点）也先试离得近的源」。
      PLAYWRIGHT_DOWNLOAD_HOST: "https://cdn.npmmirror.com/binaries/playwright"
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
      # ⚠️ **这里不写 `PLAYWRIGHT_BROWSERS_PATH`** —— 它在**流水线级** env 里
      # （见 `.common` 那段「落点」）。理由与当初**不同**，两段都要留着：
      #   · 当初是因为容器那个 `/ms-playwright` 在 Windows 宿主上不存在 —— 写了它等于
      #     让落点判据去一个空目录找东西，「装好了」与「一件都没有」在日志里逐字同形；
      #   · 现在是因为**这一格与 `每日全量E2E` 那一格必须看同一个落点** —— 写在某一格
      #     的 `env:` 里，装的那一格看得到、跑 E2E 的那一格看不到，仍然是「装好了，
      #     探不到」。流水线级 env 是**所有格都能看到**的那一层。
      #
      # 判据钉住这件事的两半：`tests/ci-dev-drive-root.test.ts` 判「那三行在流水线级
      # env 里」，`tests/ci-image-identity.test.ts` 判「不是容器那个路径」。
      # 实测首次要下 ~100+ MiB（chromium + chromium-headless-shell 两件）。给 20m：
      # 冷节点 + 慢链路够用，而卡死（CDN 真的不通）时也能在 20m 报出来，不必等满平台
      # 默认的 2h 墙钟。**不是放宽判据** —— 预算只管多久放弃。
    timeout: 20m
  # ── 全量 E2E（每天一次；这一格是 `FRESHNESS_TRACKS.e2e` 的执行者）──────
  #
  # 为什么要在每日档跑**整档**：本地那一层从 不再要求自证（`ciStage`
  # 那一栏，规范 §11.8 / §13.5.23），而 PR 上的 `E2E 关键流程` 只跑 `@critical` 子集 ——
  # `isWholeTrackRun` 明写子集**不构成整档凭证**。没有这一格，「整档 e2e 今天能不能
  # 全过」就从一台有人推代码才判得出来的机器，变成一个谁都不判的空白。
  # （档里现在有多少条，问 `pnpm exec playwright test --list`，别抄在这里 ——
  # 抄死的数字已经漂过一轮。）
  #
  # ⚠️ **不许带任何收窄参数**（`--grep` / 指到单个 spec）：带了就会**绿着不记账**，
  #   而日志与账面看起来与真跑过一模一样 —— 那正是这一族最坏的静默形态。
  #   判据把这一条钉在 `script` 上（只扫命令行，不扫注释：注释里正当地要写这句话）。
  #
  # 跑法：`e2e-run.mjs` 自己起 webServer（`pnpm dev`，零 `PNPM_START` ⇒ 不依赖构建产物，
  #   这一格因此与 `每日生产构建` **各自独立**：构建坏了不影响端到端链路的结论）。
  # 45m：本地整档是十几分钟量级，而节点上是冷工作区 + 现场编译；与 `每日单元测试`
  #   同一档预算口径（卡死要早报，一天只有这一跑）。
  - name: 每日全量E2E
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/e2e-run.mjs
    # ⚠️ 这一行 env 是**产物前提的声明**，不是调档偏好：webServer 起的是 `pnpm start`，
    # 而 `.next` 里那份产物来自排在前面的 `每日生产构建`（同一分支的 stage 共享工作区）。
    # 旧形态下这件事靠 `playwright.config.ts` 里那句 `CI || PNPM_START` 推断，而它把
    # 「是不是 CI」与「有没有产物」绑成了一件 —— PR 那条撤掉构建之后就是这么红的
    # （实测一次：`Could not find a production build` ⇒ webServer 180s 超时）。
    # 现在写在一句话里，顺序判据也钉住「`每日生产构建` 必须排在这一格之前」。
    env:
      COMFY_E2E_SERVER: start
      COMFY_CI_SUBJECT: "master"
    timeout: 45m
  # ── API 文档生成与自检（每天一次；已从 push 撤到这一档）──────────
  #
  # 为什么不再在 PR/合并侧即时判：这一格判的是「typedoc 全量生成后产物
  # 可不可用」，与「这次改动能不能过」是两问。旧面按 `entryPoints` 算，
  # `scripts/publish-desktop-bundle.mjs` 这一型「被 tests import 进程序」的文件漏在外面
  # ⇒ 静默跳格（「入口面漏文件」型漏判）；改成从 typedoc 解析根派生的同源面之后，触发率从 **40%**
  # 升到 **98%**（回放同 40 次 master 改动）。而它在 CI 上中位 **40.9s**（p95 136.8s）、
  # 占 140.2s 串行流水线的 **30.6%** —— 每个 PR 都付这一笔，只换来「文档站今天能不能
  # 生成」的答案。降到这里之后：**不再在 PR 侧即时判**，最晚次日 01:00 暴露，
  # **暴露窗口 ≤24h**。
  #
  # ⚠️ 失败**不许掉进静默**：定时那一跑（GA `.github/workflows/daily.yml` 的 schedule）
  #   红了即那次 daily 红 job；CNB 的手动 / API 那一跑则由**整份清单最前面**那格
  #   `每日失败立案` 在下一跑立案（`--lane 每日生产构建`）—— 与既有 daily 失败同一条通道。
  #
  # 位置：排在 `每日全量E2E` **之后**、`每日单元测试` **之前**。不是随手放的：
  #   `每日单元测试` 必须是整份清单里**最后一个会红的格**（业主口径「最容易出问题的放最后」，
  #   判据 `tests/no-platform-ci-config.test.ts`），所以这一格只能进在它之前；而它与 E2E
  #   互不依赖 —— 那一格红了 skip 掉这一格的代价只是「今天没有 API 文档结论」。
  #
  # ⚠️ 这一格**不带 `ifModify`**：每日档是「重跑一遍」的语义，按改动面跳过就不是每日档了
  #   （§13.5.23；反向判据在 `tests/ci-incremental-gates.test.ts` 的 `MUST_ALWAYS_RUN`）。
  # 触发面本身没有收窄：`docsApiTriggerGlobs()` 保持不变，仍是从 typedoc tsconfig 派生的
  # 同源定义 —— 改的只是「谁在什么时候调用它」。
  # ⚠️ 不带 `--autofix`：产物不进 git，没有「自动修完再提交」的对象。
  - name: 每日 API 文档生成与自检
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-docs-api.cjs
  # ── 全量单测（每天一次；为什么不在 PR 上跑，见上面 `COMFYAPP_CI_DAILY_GATES` 那段）──
  #
  # ⚠️ **它排在整份清单里所有「会红的格」的最后**（业主口径：「最容易出问题的放最后，然后
  # 执行过的就不用重复执行了」）。这一格是这条流水线上唯一会因**这台机的负载**而单条超时的格子 ——
  # 实测：775 份里只 1 份红，红在 `Test timed out in 30000ms`，
  # 而同一时刻另一份检出（`comfy-app-t3-branch2`）在跑全量 vitest、又一份在跑全量 eslint。
  # 它排在中间时，那一单条抖动就把 `每日生产构建` / `每日浏览器安装` / `每日全量E2E`
  # 三格一起 skip 掉（那三格至今零执行记录）。挪到最后之后，同一跑里那三格先拿到结论，
  # 不必为了单测的抖动把前面几格重付一次。
  # 顺序有判据：`tests/no-platform-ci-config.test.ts` 钉「每日单元测试 之后只允许跟
  # 覆盖率上报（报告型尾巴）」—— 它后面的那一格是报告型、非关键，不会因它 skip 掉前面的格。
  - name: 每日单元测试
    # 入口是**跑法脚本**，不是裸 vitest（与 `每日生产构建` 同一条
    # 理由）：它内部就是 `pnpm run test:coverage`，外面那一跳是**记账** ——
    # 跑绿刷新 `scripts/.full-suite-freshness.json`，本地「改了就当天跑」那条判据与
    # 这一档读的是同一份事实。裸写 vitest 时这一档的绿只落在日志里、账面一个字不变。
    #
    # ⚠️ **必须整档跑**：`isWholeTrackRun` 会把「透传了 `--grep` / 指到单个文件」的
    #   绿判成**不构成整档凭证**、当场不记账。并发不进 `extra` 的同一条理由写在
    #   `planRun` 的注释里（塞错位置 = 每一次都绿而不记账）。
    #
    # 这一档还打**分文件耗时榜**（前 10 + 合计 + 中位，junit 落仓库内的
    # `node_modules/.cache/`，与钩子那侧共用 `parseJunitXml`）—— 它顺带回答「这台机上跑全量时
    # 哪几份在吃时间」，而那个数此前只在本地账本里有。只算测试阶段，用来排序不当 stage 墙钟。
    # ⚠️ 落点**不是** `os.tmpdir()`：那样拼出来的是 `--outputFile.junit=C:\…`，而 PowerShell
    #   宿主会在第一个冒号处把它切成两个参数，切剩的一截变成 vitest 的位置过滤器 ——
    #   这一档首跑 12.6s 红、后面三档全 skipped 就是这么来的（边界表在
    #   `scripts/launcher-core/shell.mjs` 的 `PS_UNSAFE_ARG_RE`）。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/full-suite-run.mjs
    env:
      COMFY_CI_SUBJECT: "master"
    # 45m：`full-suite-run.mjs` 自己的墙钟预算是 30 分钟（`FULL_SUITE_TIMEOUT_MS`），
    # stage 预算必须**大于**它，否则先被平台掐的是 stage，而那一刀不带
    # 「被预算砍 vs 判据红」的分流话术（`classifyOutcome`）。
    # ⚠️ 两次读数把这条预算钉在很窄的带里：安静机器 827s（755 文件
    #   全量绿），而**满载机器 2466s**（同规模、41 分钟）—— 后者已经
    #   贴着 45m 的 stage 墙钟。而那一跑里 30 分钟的内部预算**并没有掐住它**
    #   （vitest 自己跑完了全程），也就是「被预算砍」那一档话术在这里没有执行者 ——
    #   这一格排到最后之后，被掐的代价不再是「后面三格没了」，但仍要修（见任务：
    #   `full-suite-run.mjs` 的 timeoutMs 在 Windows 上是否真收得掉子树）。
    timeout: 45m

  # ── 覆盖率上报：已从 PR 档挪到每日档（接在 每日单元测试 之后）──────────
  #
  # PR 档上的 `受影响用例` / `固定结构用例` 两测试格撤到每日全量单测后，PR 上不再有产出
  # coverage/lcov.info 的格子，这一格在 PR 上只会「报告不在 → 自己跳过」静默空转；而
  # 每日档的 `每日单元测试` 跑 `pnpm run test:coverage`，同一 job、同一工作区产出 lcov，
  # 这一格接在它后面把它交给平台的上报通道。它是**报告型**（不判任何东西，报告不在时跳过
  # 而不判红），没有 `ifModify`。顺序：必须落在 每日单元测试 之后（见上面那条注释与
  # `tests/no-platform-ci-config.test.ts`「每日单元测试 之后只允许跟 覆盖率上报」那条判据）。
  - name: 覆盖率上报
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-coverage-report.mjs

# ── 单跑口：三档重档各自一条，前提自动带上 ────────────────────────────────
#
# 每档两条流水线（手点 + API），两条都引用**同一张整表锚点**：
# 「单独验一次某一档」此前只能等 01:00 或整档手点，而修完东西想立刻复验一次的人
# 不该为另外九格付费。六条定义都在文件末尾那个**已有的** `master:` 块里 ——
# 这里不再开第二个 `master:`（同名顶层键会让 YAML 静默丢掉前一处，crontab 那条
# 就是这么没的；判据 `topLevelKeys()` 现在也判这件事）。前提集的取证与
# 「每日名 ⇄ 单跑名」的对照见 `scripts/ci-oneshot-gates.mjs` 与规范 §13.5.23。
# ⚠️ 单跑那一跑**不是每日档的出勤**：它只证「这一档现在过不过」，
# 不许被读成「今天定时那一跑跑过了」（「单跑 ≠ 每日出勤」那条区分在这里同样成立）。

# ── 单跑那三张清单：整表锚点，格名每张都自带目标档前缀 ───────────────────────
#
# 为什么不用「序列元素级别的别名」（`- *stage_daily_install`）：那种写法必须把列表项拆成
# 两行（`- &anchor` 换行 `name: X`），而本仓有**六份各自独立的 `.cnb.yml` stage 解析器**
# （`ci-autofix-duties` / `ci-env-probe` / `ci-container-plan` / `ci-image-identity` /
# `ci-incremental-gates` / `no-platform-ci-config`），它们认的都是 `- name: X` 这一行形状。
# 实测代价：平台「受影响用例」那一格红三处（「解析出的 stage 数比 `script:` 少 6」、
# 某格「解析不出内容」），而每条红的真实原因都指不到「形状」上 —— 读起来像判据坏了。
# 探针本身是过的（平台确实会展开并执行元素级别名），
# **所以这不是能力问题，是这份配置的解析面付不起** —— 结论：不改行形状。
#
# 换成的代价写在明处：前提格的正文在这份文件里有多份（安装那格三份）。它由一条判据钉住
# ——「每个 `单跑<档>·X` 的 script / env / timeout 必须与 `每日X` 那格逐字相同」，
# 与 PR 那侧 ↔ 每日那侧「同一份脚本两条流水线」用的是同一个办法（这套判据抓到过同型漂移）。
#
# 为什么名字要带目标档前缀：`stageBlock()` / `pipelineStageNames()` 是按**名字**在文本里
# 取块的，两格重名就让「读的是哪条流水线的哪一格」变成解析器的运气。安装那一格出现在
# 三张表里 ⇒ 三个不同的名字；不然「逐字相同」那条判据只会比到第一次出现的那份，
# 后面两份漂移得静悄悄。
#
# 为什么每张表都带前提：每次构建都是全新 job 目录、`node_modules` 恒不在场
# （`工作区复用读数` 两跑实测），只跑目标那一格会红在「找不到 next / 连不上库 / 没有浏览器」——
# 那是**已知的假红**。逐档前提集与理由的一份出处：`scripts/ci-oneshot-gates.mjs`。
.oneshot-build: &oneshot_build
  - name: 单跑构建·安装依赖
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 单跑构建·同步数据库表结构
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/db-push.mjs
  - name: 单跑构建·生产构建
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-daily-build.mjs
    # ── 构建缓存槽（机制与实测见 `scripts/ci-build-cache-slot.mjs` 头注）──
    #
    # 这一格跑的是**生产构建**（每日那格是这台节点上**唯一每天都会发生的构建**；单跑口是同一份
    # 脚本的副本，两格正文必须逐字相同）。runner 每个作业都新建一个带流水线 id 的工作区目录
    # （形态由 `工作区复用读数` 定死）⇒ Turbopack 的持久缓存每次都从零开始。
    # 实测（同机同源三跑，`next build` 自报的编译段）：**冷** 95s ／ **暖**（用上一个工作区
    # 留下的常驻目录）14.9s —— 省的是整个编译段。
    #
    # ⚠️ **开关默认关**（`COMFY_CI_BUILD_CACHE`），只有构建这两格置着它。理由与依赖面那套槽同源：
    # 先让判据在场，再把开关拨过去（规范 §13.5.25）。机制本身是**失败即退回**的：槽根算不出、
    # 空间不够、槽被别人占着 —— 任一成立就只打一行读数、照常构建（缓存是加速，不是前提）。
    env:
      COMFY_CI_BUILD_CACHE: "1"
      COMFY_CI_SUBJECT: "master"
    timeout: 30m
.oneshot-e2e: &oneshot_e2e
  - name: 单跑E2E·安装依赖
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 单跑E2E·同步数据库表结构
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/db-push.mjs
  - name: 单跑E2E·浏览器安装
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --playwright-only
    env:
      PLAYWRIGHT_DOWNLOAD_HOST: "https://cdn.npmmirror.com/binaries/playwright"
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
    timeout: 20m
  - name: 单跑E2E·全量E2E
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/e2e-run.mjs
    env:
      COMFY_E2E_SERVER: start
      COMFY_CI_SUBJECT: "master"
    timeout: 45m
.oneshot-unit: &oneshot_unit
  - name: 单跑单测·安装依赖
    # ⚠️ 这一格的真身是**上面 push 那一档的 `安装依赖`**，不是 `每日安装依赖`
    # （注册表 `scripts/ci-oneshot-gates.mjs` 里这一行登记了 `source`）。为什么允许换真身：
    # 「能不能接依赖缓存槽」判的是**这一档后面有没有会真构建的格子**（那条线由
    # `BUILD_CONSUMER_MARKERS` 执行者判），不是档名 —— 这一档后面只有 `单跑单测·全量单测`
    # （`full-suite-run.mjs`，vitest 不是 Turbopack 消费者；同一类消费者在 PR 档的
    # `受影响用例` 上早已在接槽形态下每跑都绿 —— **不是 push 档**，那份清单里没有测试格）。
    # 反过来 `单跑构建` / `打包` 两档**不许**跟着改：它们后面有真构建格
    # （判据按现役配置扫过一遍：`打包·安装依赖` 出现这枚键会当场红）。
    # 收益的读数不写在这里（跨天不可引用、且并发在场时墙钟不可读）：`pnpm ship --stage-log
    # <sn> 安装依赖` 现取，规范 §13.5.3.4.3 是那份出处。
    env:
      COMFY_CI_SLOT: "1"
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 单跑单测·全量单测
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/full-suite-run.mjs
    env:
      COMFY_CI_SUBJECT: "master"
    timeout: 45m

# ── 壳工具链那一对环境变量：`CARGO_HOME` + `RUSTUP_HOME`────────────
#
# 为什么要有它：runner 走**服务账号会话**（`orange-runner` 是 `LocalSystem`），它的 `Path`
# 与开发者会话不是同一份 —— `CARGO_HOME` 在这台机上是**用户级**变量，`G:\.cargo\bin` 也只在
# 用户级 `Path` 上。所以流水线里凡是要点 cargo 的格，都必须**自己把这两个值带进场**；
# 否则那一格看到的就是「一台没装 Rust 的机器」（与 Python / pnpm 那两次是同一条岔路）。
#
# 为什么收成一个锚点而不是写两遍（§12.12）：这一对是**这台节点**的事实、出现在三处
# （`重档静态判据` + 桌面成品包那两格），写成三份的那一刻就是它们开始漂的那一刻 ——
# 而漂的那一形有实测读数：桌包那一档新加的两格没带这对值，第二格 2.2s 就红、
# 后面三格整片 `skipped`，当天没有成品包。
#
# 为什么必须**成对**给：cargo 本体是 rustup 的代理（`G:\.cargo\bin\cargo.exe`），代理要
# `RUSTUP_HOME` 才解析得到工具链 —— 只给 `CARGO_HOME` 时实测
# `could not create home directory …\.rustup: 拒绝访问`（PR 首跑实测现场）。
#
# ⚠️ 换节点要跟着换这两个值（与上面 TEMP / PLAYWRIGHT_BROWSERS_PATH 同一档）。
.cargo-env: &cargo_env
  CARGO_HOME: "G:\\.cargo"
  RUSTUP_HOME: "C:\\Users\\yuedu\\.rustup"

# ── 桌包那一档：装依赖 → 打真安装包 → 发布到常驻目录 ────────────────
#
# **为什么是独立一条**：业主口径「每日档另开一条独立流水线真打桌面成品包」，而它不进
# `.daily-gates` 那张表（那张表里只有每日自己的格，`COMFYAPP_CI_DAILY_GATES` 一个字没改）。
# 两件事各自要结论：每日那一条答「master 今天能不能构建出来」，这一条答「今天的安装包在哪儿」。
# 并成一条的代价不是「慢」，是**每一格每日档都要为一次 cargo 编译排队**，而且桌包红了
# 会把同一跑里排在它后面的每日格一起 skip 掉 —— 那正是「一格带走一片」那一族的形态。
#
# **这一档不重抄任何判据**（§12.18 复用优先）：`pnpm tauri build` 的 `beforeBuildCommand`
# 就是 `node scripts/build-desktop.mjs`，而它内部那条 `pnpm build` 链带着产物级两道防线
# （`check-standalone-contents.cjs` 数两层产物 / `check-bundle-budget.cjs` 体积棘轮，
# AGENTS 硬规则 17/18）。所以**发布只能排在它绿之后** —— 这里没有第二条打桌包的路。
#
# ── 实测读数（同一次运行内分段计时、本机实测；量具纪律见 §13.6.4.1）────────
#
# | 段 | 入口 | 读数 |
# | --- | --- | --- |
# | 产物装配 | `build-desktop.mjs` 的 `1/4`→`4/4` | **225.9s**（其中 `1/4` 那条 `pnpm build` 链 152.9s、`2/4` 组装 static 72.8s、`3/4` sidecar 100.4 MB 0.2s） |
# | Rust 编译 | cargo 自报 | 暖 **3m12s**（194.7s）／ 冷（`cargo clean` 之后整棵依赖树）**5m01s** |
# | 打包段（msi） | WiX candle + light | **151.4s** ⇒ 成品 `ComfyAPP_0.1.0_x64_en-US.msi` **84.86 MiB** |
# | 总墙钟 | `pnpm tauri build` | **579.2s**（退 0，那一跑只出 msi 一种目标） |
# | 发布段 | `publish-desktop-bundle.mjs` | **1.5s**（拷 84.9 MiB + 写 manifest + 指针 + 轮转） |
#
# ⚠️ **打包段（nsis）今天没有读数 = 没有结论，不是「不需要」**：那一格要现下两件 GitHub
# release 资产（`nsis-3.13.zip` ≈1.3 MiB、`nsis_tauri_utils.dll` ≈0.05 MiB），本机实测两次
# 都落在 `failed to bundle project: timeout: global`（一次 zip 下完、dll 超时；一次连 zip
# 都在 21.8s 超时；随后 18:27 那一跑 `github.com:443` 直接连不上）。**更坏的一件事**：
# tauri 判定缓存目录不完整时会先把 `%LOCALAPPDATA%\tauri\NSIS` **整个删掉**再下 —— 于是
# 一次网络抖动会把这台机的工具缓存也一并清走（`WixTools314` 那一侧不受影响，它在
# msi 那一格是热的）。这两条都记在本单的落地说明里，不写成「以后一定绿」。
#
# · **不接构建缓存槽**（`COMFY_CI_BUILD_CACHE` 这一档不置）：那个开关在 `artifact-run.mjs`
#   这一侧生效，而这条链的构建是 tauri 的 `beforeBuildCommand` 直接跑 `pnpm build` ——
#   在这里写它等于在日志里谎称「接了常驻缓存」。要接是另一件事（`src-tauri/target` 也
#   同样不在任何槽里，冷编译那 5m01s 就是这么来的）。
# · **成品不落工作区**：工作区每跑新建、收尾整目录删（`ci-build-cache-slot.mjs` 头注实测），
#   所以「留 2 份」这件事只能由发布那一格往常驻根做，根目录名由 `pnpm store path` 所在卷推导。
# · **timeout 取的是平台档，不是预估**：下面每一格的数都在上面那张表里有对应的实测段，
#   取的是「实测段之和」量级之上的整数档；没有读数的那一格（nsis 打包）不单独设预算，
#   它跟着 `打包·桌面成品构建` 那一格的总墙钟走。
#   ⚠️ 与每日档同一条口径：**并发在场时墙钟不可读**（§13.6.4.1）—— 这一档会把这台 16 核机
#   压到满载（cargo + light 各占一片），别拿它的耗时去校准别的档。
.package-gates: &package_gates
  - name: 打包·安装依赖
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 打包·壳工具链自证
    # 只答「cargo / rustc 在不在」。这一格在三秒内给答案，而缺件时的报错会长在两分钟之后
    # 的 cargo 段里（`cargo: The term 'cargo' is not recognized` 混在 tauri 的输出里，
    # 那一刻安装依赖的账已经花完）。壳工具链**不是** pnpm 依赖，这一跑不顺手装任何东西。
    #
    # ⚠️ 这一格要的那一对变量（`env: *cargo_env`）只有一半用场：探针是按名字起 `cargo` 的，
    # 所以还得把 `$env:CARGO_HOME\bin` 前置到 `Path` —— 只给变量而 PATH 上没有它，
    # 得到的仍是 2.2 秒就红的那一形（实测读数）。
    env: *cargo_env
    timeout: 5m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $env:Path = "$env:CARGO_HOME\bin;$env:Path"
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --rust-only
  - name: 打包·桌包工具预置
    # nsis 那一格要的两件 GitHub release 资产，**不在这条链上现下**（bundler 的下载预算实测
    # 在 22–23s，而本机直连取那份 zip 要 48.4s ⇒ 红的是网络、看起来像链坏了；镜像键实测
    # 29.5s，仍在那条预算之上，所以配镜像不是结案）。这一格从常驻根的工具镜像补缓存，
    # 补不上就退 **2「没有结论」**并念出出口 —— 放行给 bundler 去撞预算，得到的是一跑看不懂的白跑。
    # 读数：空缓存 + 这一格补齐 ⇒ `tauri bundle` 只出 nsis 那一个目标用时 131.8s、成品 62.32 MiB、
    # 日志里没有 `Downloading` / `Recreating it`。
    timeout: 5m
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/tauri-tools-cache.mjs
  - name: 打包·NSIS 工具现场读数
    # 桌包档每一次死在 `Running makensis … / Unable to start child process, error 0x2`，
    # 而前一格「桌包工具预置」逐字报「必需件齐全」。两格对同一棵树给出互相矛盾的结论：
    # 预置判 `%LOCALAPPDATA%` 拼出来的 `tauri\NSIS`，bundler 走 SHGetKnownFolderPath
    # （§7.7 记着「不读 LOCALAPPDATA 环境变量」），LocalSystem 会话里两者未必同值。
    #
    # **这一格只加读数、不改判据、不猜修法**（恒退 0）：把 ensure 侧原值、bundler 侧
    # known folder、两处 makensis.exe 的 Test-Path / Length / 真跑 /VERSION / 整树文件数
    # 与进程账号一次打出来，下一次红就能定性分叉（口径与 §7.7 那句待复核的话对齐）。
    # 逻辑在 `scripts/ci-nsis-tool-probe.mjs` —— 不在配置里就地写 PowerShell，
    # 与 `镜像身份` / `工作区复用读数` 同一条：配置里的逻辑一条判据都测不到它。
    # 顺序也是判据的一部分：排在 `pnpm tauri build` 之后 = 那一刻 bundler 已经撞完了。
    timeout: 5m
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-nsis-tool-probe.mjs
  - name: 打包·桌面成品构建
    # 整条链：`beforeBuildCommand`（`build-desktop.mjs` → `pnpm build` → 数产物 → 体积护栏）
    # → cargo release 编译 → bundle（nsis + msi）。判据一个字都不在这里重写，也不带 `--no-bundle`
    # —— 那一带就等于回到「只有 app.exe，没有安装包」的原点（§7.0 那张表今天的形态）。
    #
    # ⚠️ 同样要那一对变量 **并且**把 `$env:CARGO_HOME\bin` 前置到 `Path`：这一格是
    # `pnpm tauri build`，它按名字 spawn `cargo` —— 变量只是「工具链住哪」，
    # PATH 上没有那个代理，就还是「变量在、命令找不到」那一形。
    env: *cargo_env
    timeout: 30m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $env:Path = "$env:CARGO_HOME\bin;$env:Path"
      node scripts/ci-cp936-exit.mjs -- pnpm tauri build
  - name: 打包·发布到常驻目录
    # 落 `<常驻根>/<sha-构建号>` 一个目录 + `manifest.json` + `latest.txt` 指针，轮转留 2 份。
    # 退出码三态：0 发布完成 / 1 没有成品（构建那一格没打出来）/ 2 **没有结论**（问不出常驻根、
    # 或目标卷空间不够）。后两档都不许退 0 —— 「今天没有新包」与「没能把包放出去」必须逐字不同。
    timeout: 5m
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/publish-desktop-bundle.mjs

# ── 这里曾有一条「格式修复的委托回写」流水线（已整条摘除）──────────
#
# 形状是：`oxfmt 格式` 那一格判红 ⇒ `ci-format-fixup.mjs --check --autofix` 就地写文件、
# 复判全绿 ⇒ 再 `cnb build start-build --event api_trigger_formatfix` 把回写委托给一条
# **可信事件**的流水线（`--delegate`，它自己直推 PR 源分支，`--sha` 与 ls-remote 实时头
# 做幂等闸）。它当时解决的是「PR 事件的令牌推不动」（现场：护栏一条没错，
# 建好修复提交后 push 被拒）。
#
# 今天它被**整条摘掉**（业主口径 本地判 + 本地修，CI 只判），
# 因为委托那一跳在这类事件上恒发不出去 —— 实测一次 build 的 `oxfmt 格式`
# 那格念的是：
#
#   [format-fixup] × start-build 退了 0 但读不回 sn —— 委托没发出去（403 / scope 不足那一族）
#   status: 403 · errcode: 10023
#   errmsg: "The token's authorization scope does not match this request.
#            Missing required scopes: repo-cnb-trigger:rw"
#
# ⇒ 需要的是 `repo-cnb-trigger:rw`，而 PR 事件那把令牌只有 `repo-code:r`，**没有开关可改**。
# 于是这条链的设计前提（「换执行口就能推」）在唯一需要它的事件类型上不成立，
# 每次格式红都要白跑一次委托、再把同一个红交回给人。
# 判与修都挪到 `.githooks/pre-commit` 的 D0（同一份 `check-format.cjs --staged`）。
#
# 如果哪天要把它接回来（前提是先给 CI 配上带触发权限的单独令牌），
# 恢复的不该只是这两段 YAML：**委托发的出去之前，PR 那一格不许再挂 `--autofix`** ——
# 「就地修好但回不去」正是让陈旧在 CI 上隐形的那一格（同型事故，别再来一次）。

# ── PR 失败立案：这一跑红了 ⇒ 把红变成**看得见**的东西─────────────
#
# 这一档是 **Pipeline 级**的 `endStages`（不是 `stages` 里的一格），所以它是独立锚点、
# 由 `pull_request` 那条流水线以 `<<: *pr_fail_stage` 引入。
#
# 补的是什么：`pull_request` 是一天里跑得最多的那条，而它的红**没有任何通知**。
# 平台没有「构建结束 → 主动打你」的通用回调（`cnb event get-events` 只能主动拉、
# 也不含 build 事件），所以今天知道它红的只有两种人：当场盯着 `pnpm ship` 的
# （它轮询到终态才收工）、以及事后去翻构建列表的。其余时候「红了」=「没发生」。
#
# 为什么不是「挂个 IM 推送插件」：这条件路径上**没有 Docker**（头注第 1 条：带
# `image:` 的 stage 70ms 就红 `Runner does not enable Docker`），插件镜像还默认要出网。
# 所以那一档在本仓今天没有执行者，写进来只是一条会红或永远不响的格。这条走的是
# 同一件事的另一个落点：**PR 的评论区就是通知面** —— 它进列表、有未读、能 @ 人，
# 不需要任何新凭据，也不需要人先去看某个群。
#
# ── 形态：它是 `endStages`，不是 `stages` 的最后一格 ────────────────────
#
# 平台原生就有这一档（官方 `zh/build/grammar.md` §endStages 原文）：
#
#   「当流水线 prepare 阶段成功，**无论 stages 是否成功，endStages 都将执行**。
#     且 endStages 是否成功**不影响流水线状态**（即 endStages 失败，流水线状态也可能是成功）。」
#
# 这两句正好对上这一格的两条要求，而且**不用**任何没被验证过的条件语法：
#   · 「无论 stages 是否成功都执行」—— 本仓 `stages` 是串行链，前面哪里一红后面整片
#     `skipped`（实测：`受影响用例` 红 ⇒ 它后面 23 格全是 skipped），
#     所以「红了要有人知道」这件事**不能长在 `stages` 里**；
#   · 「不影响流水线状态」—— 这一格自己坏掉不该把一跑绿变红（那会让「它挂了」与
#     「这一跑红了」在读数上长得一样）。
#
# ⚠️ 走过的那条弯路留着当读数：先写成 `stages` 最后一格 + `run: always()`，实测
# 两次那一格仍是 `skipped` —— 本仓 `.cnb.yml`
# 里**没有任何一处 `when:` / `fail()` / 条件表达式**可供依赖，而 `if:` 这个键不在
# Stage 的配置项表里（`grammar.md`）。所以「红也要跑」只有平台自己那一档是真有执行者的。
#
# ⚠️ 也**没有** `run:` 这个键：`.cnb.yml` 的 Stage / Pipeline 配置项表里都没有它，
# 写成 `run: always()` 会被当成未知字段静默忽略（那一格就退回「上一格红了就 skipped」，
# 而屏幕上什么都不会说）。「红也要跑」在本仓只有这一档 `endStages` 是真有执行者的形态。
#
# ⚠️ 但**不是 `failStages`**：那一档只在「正常流程失败」时执行，于是「这一跑绿了」
# 与「这一格自己挂了」两种形态会一起消失，而后者正是最该被看见的（它等于这一格
# 从此不再报红，而账面全绿）。`endStages` 两种都跑，代价是绿的时候也会跑一次只读：
# 三次读命令 + 判定「绿的 ⇒ 无事可立」，与 `每日失败立案` 同量级。
#
# 其余两条形态决定：
#   · **不带 `ifModify`**：它判的是这一跑的状态，不是某几棵树的文本。任何收窄都可能
#     把「真正红了的那一类改动」筛掉，而那正是它唯一的用途。
#   · **带 `--no-block`**：理由与 `每日失败立案` 逐字相同（自己坏掉不拦路，但失败时
#     照打红话与手工出口，由 `tests/ci-pr-failure-issue.test.ts` 钉住不许静默）。
#
# 判决链一个字都不在这里重写：定性是 `ci-build-readout.mjs` 的 `classifyBuildOutcome()`
# （与 `pnpm ship --diagnose` / 每日档同一份），取数是它的 `fetchBuildList()` +
# `check-daily-attendance.mjs` 的 `fetchBuildDetails()`，写单是 `ship-issue-new.mjs`。
# ⚠️ 判「红没红」只认 `fetchBuildDetails()` 那份**逐格读数**：这一格挂在 `endStages`，
# 列表里当前这一跑的构建级 `status` 恒 `pending`（要等整条流水线收尾才落终态），
# 拿它当门槛就是恒真 ⇒ 一张单都写不出来（现场：桌包档连红六次、
# 立案格每次都只念一句「还没到终态」）。逐格还在跑 / 详情取不到落成 `running` /
# `unknown`，由既有 `decideAction()` 判「不构成结论 ⇒ 不写」，没有第二套判据。
# 落点按「有没有人能收」分两档：`CNB_PULL_REQUEST_IID` 在场上 ⇒ 评论在那张 PR 下
# （一条诉求一张单，不另开单）；认不出来 ⇒ 按格名去重建单。取舍与两种形状都在
# `scripts/ci-pr-failure-issue.mjs` 头注里，这里不重抄。
.pr-fail-stage: &pr_fail_stage
  endStages:
    - name: PR 失败立案
      script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-pr-failure-issue.mjs --no-block
      # 5m：三次读命令（列表 / 逐格详情 / 逐格日志，后者最多三格）+ 一次写 + 一次回读。
      # 与 `每日失败立案` 同量级（实测那条 1.6s）。给 5m 是留给节点冷启动与平台慢响应，
      # 不是给「让它多试几次」—— 取不到读数时它**不重试也不写**，退 2 由话术说出来。
      timeout: 5m
    # ── 令牌权限读数：这一跑的 `CNB_TOKEN` 够得着哪些能力 ────────────
    #
    # 与每日档那一格**同一个入口与同一份理由**（那边写着为什么、为什么排在这里）。
    # `endStages` 里的顺序不是执行顺序的保证（平台并发/顺序由平台定），所以这里不靠
    # 「读数在前」传达什么 —— 它只是与每日档同形，读的人不必在两处用两套心智模型。
    #
    # 5m：14 条只读请求**并发**跑（实测本机合计 0.45s）、零写命令。与每日那一格同量级。
    - name: 令牌权限读数
      script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-token-scopes.mjs
      timeout: 5m
    # ── `GitHub 镜像同步` 不在这一档了───────────────────────────────
    #
    # 它前移进主列（`.gates` 里 `缓存槽读数` 之后），为什么搬与「搬的是位置、不是那句不承重」
    # 都写在那一格的锚点上。这里留一行是因为这一档剩下的两格**必须留在 `endStages`**：
    # 它们的本职是「红也要跑」（平台 grammar：无论 stages 是否成功，endStages 都将执行），
    # 挪进主列就会被那一次红一起 skip 掉 —— 而立案格要的正是红的时候才有用。

# ── 桌面成品包那一档的失败立案──────────────────────────────────────
#
# 这一档为什么也要有：桌包那两个触发口（下面 `crontab: 0 3 * * *` 与 `web_trigger_package`）
# 此前**只**引了 `*common` —— 没有 `endStages` 立案格。于是 02:00 那一跑红了之后，
# 知道这件事的唯一办法是去翻构建列表：实测一次那一跑红在
# `打包·壳工具链自证`、后面三格整片 `skipped`，当天没有成品包，而账上一张单都没有。
#
# 形态与 PR 那一格逐字同族（`endStages` 而不是 `stages` 的最后一格；理由见上面那个锚点），
# 入口也是**同一个脚本**加一个 `--lane package`：
#   · 那份读写链（定性 / 取逐格 / 摘录失败行 / 建单 → 补标签 → 独立回读）只写了一次，
#     这里不抄第二份（§12.12）；
#   · `--lane` 是「我就是这一档的立案口」的**显式声明** —— 不给它，脚本按老规矩把非
#     `pull_request` 事件判成「不归本格管」（那一刀是对 push / 定时那些「没有 PR 可挂」
#     的跑的保护，今天仍然要留着）；
#   · 这一档**写不写得动**是另一件事、答案是「写得动」：桌包那一跑挂在 `crontab` /
#     手点这两个事件上（不在「不可信事件」那一族），案上那两张桌包单就是
#     `crontab: 0 1 * * *` 那一跑自己建出来的。PR 那一族今天只有 `repo-code:r`
#     ，那是平台按事件可信度分配的口径、本仓改不动 ——
#     与本锚点是两种不同的形状，别拿同一句话概括。
#
# 去重键跟着 `--lane` 走 ⇒ 标题是 `ci(package): 桌包档红在「…」`，与 PR 那一族互不相混。
#
# ⚠️ 立案格跑了却一句结论都没写，是这一档曾经**常态化失效**的形状：
# 桌包档曾连红六次、`makensis 0x2`，立案格每跑都只念「状态是 pending ⇒
# 还没到终态」。根因不在桌包、在立案格自己：`endStages` 执行时列表里本跑的构建级
# `status` 恒 `pending`，那道「等终态」的门槛恒真。修法见上面的判决链那一段 ——
# 判红改认逐格读数，列表这一侧只用来认「这一跑是谁 / 事件是什么」。
.package-fail-stage: &package_fail_stage
  endStages:
    - name: 桌包失败立案
      script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-pr-failure-issue.mjs --no-block --lane package
      # 与 `PR 失败立案` 同一量级（三次读命令 + 一次写 + 一次回读）。
      timeout: 5m
    # 令牌权限读数：与 PR 那一格同一个入口、同一份理由。
    - name: 令牌权限读数
      script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-token-scopes.mjs
      timeout: 5m

# ── push 档（master 合并复核）的失败立案─────────────────────────
#
# 这一档为什么也要有：push 档此前**只**引了 `*common` —— 没有 `endStages` 立案格。
# 于是 master 合并复核红了之后，知道这件事的唯一办法是去翻构建列表：曾有一批
# 漏登记 §13.1 一格，PR 全绿、合并全绿，master 上的 `doc:check` 红了 ≈20 分钟才被
# 另一条分支的一次性探针撞见（立案格就是为这一形设的）。
#
# 形态与 PR / 桌包那两格逐字同族（`endStages` 而不是 `stages` 的最后一格；理由见
# 上面那个锚点），入口也是**同一个脚本**加一个 `--lane push`：
#   · 那份读写链（定性 / 取逐格 / 摘录失败行 / 建单 → 补标签 → 独立回读）只写了一次，
#     这里不抄第二份（§12.12）；
#   · `--lane` 是「我就是这一档的立案口」的显式声明 —— 不给它，脚本按老规矩把非
#     `pull_request` 事件判成「不归本格管」。
# 去重键跟着 `--lane` 走 ⇒ 标题是 `ci(push): push 档红在「…」`，与 PR / 桌包两族互不相混。
.push-fail-stage: &push_fail_stage
  endStages:
    - name: push 失败立案
      script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-pr-failure-issue.mjs --no-block --lane push
      # 与 `PR 失败立案` 同一量级（三次读命令 + 一次写 + 一次回读）。
      timeout: 5m
    # 令牌权限读数：与 PR / 桌包那两格同一个入口、同一份理由。
    - name: 令牌权限读数
      script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-token-scopes.mjs
      timeout: 5m

.gates: &gates
  # ── 环境类前提三格从这一条上撤到**每日档**（`COMFYAPP_CI_DAILY_GATES`）──
  # 撤的是节奏、不是账：`工具链自证` / `Python 可用性` / `Python 探针读数` 现在各有
  # 一名每日档里的同名执行者（`每日工具链自证` / `每日 Python 可用性` /
  # `每日 Python 探针读数`），判据双向核对（少了执行者就红，见
  # `tests/no-platform-ci-config.test.ts` 那条「撤下来的每一格必须有每日的对应」）。
  # 为什么它们不属于「每个 PR 都判」：三份脚本问的都是**节点事实**（PATH、winget/scoop
  # 装没装、解释器住哪），一次 PR 改不动它们。薄化之后这一档**不再装依赖**
  # （GA 的 `安装依赖` step 接管），所以「这台机跑不动整条链吗」也不再是这一档的问题；
  # 留在这里的只剩平台读数与判决链（逐项归属见本锚点顶部那段）。逐格代价与这次决定的
  # 原文见 `COMFYAPP_CI_GATES` 上面那段与 §13.5.23。
  # ── 镜像身份（**读数，恒不退非零**）──
  #
  # 这一步回答的是上一版答不出的那一格：**这台机器长自哪张镜像、哪一版**。
  #
  # 自托管这条路上「镜像」没有被声明的地方（`pipeline.docker.image` 不生效，
  # 见头注第 1 条），所以镜像的用法是**宿主侧**的：装机时 `docker pull` 一张钉了
  # 版本标签的节点镜像、按它装好，再把身份钉进两个机器级环境变量。缺了这一步，
  # 「这台节点跑的是哪一版工具链」只能靠翻上一次的红色日志反推 —— 而工具链清单
  # 反复红，根因正是**环境是隐形的**（§13.5.3.5）。
  #
  # ⚠️ 它是**读数**、不是判据，三条理由：
  #   · 本仓的工具链靠**断言**守（`工具链自证` 判四件、`环境前提` 判版本下限）——
  #     那些是实际能力，镜像是期望身份，两者不一致时以能力为准；
  #   · **没有标识不等于这台机器不对**：裸装机是本路径的历史形态，第一次接进节点
  #     的一跑不该被一条与新事实无关的红拦住；
  #   · 「标签 / digest 对不对得上镜像库」本进程判不了 —— 构建容器里没有 docker。
  #
  # 所以它只做三件事：把磁盘上真有什么（OS / 内核）与声明的身份一起打出来、
  # 把「标签没钉版本 / digest 拼错」写成读数、以及**没有标识时给出下一动作**。
  # 逻辑在 `scripts/ci-image-identity.mjs` —— 不在配置里就地写 PowerShell，
  # 理由与 `工具链自证` 逐字相同（配置里的逻辑一条判据都测不到它）。
  - name: 镜像身份
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-image-identity.mjs

  # ── `Python 可用性` / `Python 探针读数` 已经不在这一条上──
  #
  # 两格的**理由与事故**跟着它们搬到了每日档（`每日 Python 可用性` /
  # `每日 Python 探针读数`，见 `.daily-gates` 里那两段），这里只留一句「为什么撤」：
  # 这两份脚本问的是**这台节点上解释器住哪、哪条链起得来** —— 一次 PR 改不动 PATH、
  # 改不动 winget 装没装，而它们每次跑都要在 PR 上占一格排队位。撤下之后仍然有人判
  # 同一件事：`每日单元测试` 之前必有 `每日 Python 可用性`（顺序有判据），
  # 而 PR 侧「跑不动整条链」那一问 交给 GA 的 `安装依赖` step（这一档此后
  # 不装依赖，也就不再有一条会因 pnpm 解析面而红的链）。

  # ── 工作区复用读数（**读数，恒不退非零**）──
  #
  # 本文件头注第 4 条把「每次构建都是全量 clone、没有配置能省掉它」写成了这条路径的
  # 固定成本。那个结论有**数字**（`Prepare` ≈31.5s，规范 §13.5.20 那张预算表），但从来
  # 没有**机制读数** —— 平台在这台宿主机上到底是哪一种：
  #
  #   ① 每次新建一个 job 目录、`git init` + 从零 fetch（那 31.5s 是「从零搬对象库」）；
  #   ② 复用同一目录、只做增量 fetch（那 31.5s 的大头是 checkout 落盘，不是网络）；
  #   ③ 目录复用但 `.git` 每次被重建（常驻已经有一半，缺的是别把对象库清掉）。
  #
  # **首跑读数（这一档自己的那一跑）已经把它定成 ①**，而且是靠
  # 路径自己说的、不靠对照：工作区目录名带着本次流水线的 id ——
  # `…\runner\<repoId>\<流水线 id>-001~<随机段>\workspace` ⇒ 每次构建一个新目录；`.git`
  # 与 `.git/FETCH_HEAD` 出现在 59s / 58s 前（与那一跑 `Prepare` 的 35.5s 同量级）、HEAD
  # detached、`refs/heads` 零条、浅克隆 false、对象库 **57168 KiB ≈ 56 MiB**（**不是**开发
  # 机上那 130 MiB —— 那一份含 99 个 pack、22178 个松散对象与所有本地分支，CI 取的是协商
  # 后的单 ref；本仓此前把两个数混成一处写过，这里按读数订正）。同一跑里 `node_modules` /
  # `.next` / `coverage` / `playwright-report` **四个都不在场** ⇒ 第二格也定了：安装与生产
  # 构建都从冷态起，那两笔（59s / 131s）比克隆本身大。
  #
  # 三种形态各有各的出路，而**没有任何一处日志能把它们分开** —— 于是「要不要动平台那个
  # 检出开关」（Pipeline 级 `git.enable: false`，官方语义「指定是否拉取代码」）这一问
  # 只能靠猜。这一档就是把那一格变成可见读数；它同时读**第二格**：`node_modules` /
  # `.next` 在构建开始时是不是冷的 —— 若冷，这条路径上交的就不止克隆那 31.5s，还有
  # 「安装从零起」与「冷缓存 next build」两笔，而那两笔比克隆大一个量级。
  #
  # 逻辑在 `scripts/ci-workspace-probe.mjs` —— 不在这里就地写 PowerShell，理由与
  # `工具链自证` 逐字相同：配置里的逻辑一条判据都测不到它。
  #
  # ⚠️ 账本跨构建对照要**两跑**才成立，所以**它自己那一跑**报「未定」—— 这不是缺陷，是
  # 这一档刻意不肯拿一次观测猜结论。而「是哪一种形态」这件事第一跑就答得出来：路径形状 +
  # `.git` 的出生时间已经足够（见上面的读数），账本要补的是「会不会有一天变成另一种」。
  # 账本写在**工作区之外**（`COMFYAPP_CI_PROBE_DIR`，缺省退宿主 `LOCALAPPDATA`；实测落点
  # 在 `C:\WINDOWS\system32\config\systemprofile\AppData\Local\` —— 这一跑的执行账号是
  # SYSTEM，与 §13.5.3.5 那条「Python 装在 yuedu 会话里、SYSTEM 够不着」同源）：写进检出
  # 目录就成了未跟踪文件、被结构门禁那一套判，而这一档要的恰恰是「跨检出存活」。
  # 判红的事一件都不做 —— 它判的是这台机器怎么被调度，那不是任何一次 PR 的缺陷。
  #
  # 第二跑自证了这条链：账本里已有上一跑那条，新跑的 job 目录换成了新的
  # `<流水线 id>-001~<随机段>\workspace` ⇒ 它自己印出「结论·①每次新目录」。它同时暴露了
  # 对照行的一处「读了等于没读」：平台把每个 job 都检出成 `…\<流水线 id>~<随机段>\workspace`，
  # 最后一段**恒等于 `workspace`**，只取 basename 时两跑并排一模一样 —— 有区分度的那一半在
  # 父目录，故现在由 `jobLabel()` 取「父目录名 + 最后一段」，判据钉住「两个不同 job 的标签必须
  # 不同」。与这一档开头那句是同一类病：**读数落在日志里读不出来，与没有读数等价**。
  - name: 工作区复用读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-workspace-probe.mjs
    # 秒级（几次 git 调用 + 几个 stat）。给 5m 与 `新鲜度账` 同款：只是「卡死要早报」的
    # 量级余量，判据本身远小于它。
    timeout: 5m

  # ── 缓存槽读数（恒不退非零）──
  # 只回答三问：有没有槽、该落哪个键、这一跑与它的关系是 `reuse` / `install-into-slot` /
  # `no-cache` 中哪一档。键刻意复用 `ci-deps-face.mjs` 的 `pnpmInstallFingerprint` ——
  # 两处各算一份 sha 的漂移形态是「缓存命中判断」与「碰了依赖面就得真装」不再一致，
  # 那时的表现是依赖不对但门禁全绿。
  #
  # ⚠️ 这一格**只读数、不碰盘**：动作在执行档 `scripts/ci-slot-apply.mjs`，而它由
  # `COMFY_CI_SLOT=1` 才拨 —— 开关的落点在 push / 单跑那几档的安装格（本格不置它，
  # 两格各判一件事：这里回答「会不会命中」，那里执行「命中就接」）。机制与开关分两批推，
  # 理由同 §13.5.25 那条纪律：那一格每次构建都要过，键算错一次的代价是所有 PR 装不上。
  # 薄化后 PR 档不再装依赖，这一格只回答「假如这一档装，会命中哪一档」——
  # 读数本身仍是平台事实（槽根由 `pnpm store path` 决定），所以留下。
  #
  # **这里一个路径都不写**：槽根由 `resolveCacheRoot` 在作业时问
  # `pnpm store path`（同一条 cwd、同一条解析面，所以就是那次 install 真正会用的 store），
  # 取它所在卷下的 `ci-cache/<包名>`。写死盘符曾经把这台机器坑在什么位置上，见
  # §13.5.3.4.3 里「runner 换盘」那一段。
  - name: 缓存槽读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-cache-slot.mjs
    # 与上面那格同量级（几次 stat）。秒级的事给 5m 只为「卡死要早报」。
    timeout: 5m

  # ── GitHub 镜像同步（**停用**）──
  #
  # 自托管节点到 github.com:443 的出网间歇不通，而「判断推送成功没成功」正是这格
  # 半天判不出来的那一层。按 #3378 后续指令：推送与派发整个挪到平台池那条同名
  # 流水线（`pull_request` 的第二条），本格停用 —— 原文按注释形态逐字留在下面，
  # 恢复动作 = 取消注释 → 名字挪回 `COMFYAPP_CI_GATES` → 从 `DISABLED_GATES` 删。
  # ⚠️ 停用后「后续流程走不通」不再由这格判：GA 没跑起来 / 没送回结论 ⇒
  # `GA 回调结论回读` 站内回读撑到 45m 预算、超时即红（fail-closed），承重锚不变。
  #
  # 双远端镜像（cnb 主）的推送跳：推 HEAD 到 `wuxianyuedu/comfy-app` 的 `cnb-pr-<IID>` 专属
  # ref，再补一跳 `git lfs push`（不带 --all，只推该 ref 可达且远端还没有的对象 —— 镜像仓若
  # 只有字体指针，GitHub 侧 `lfs: true` 的 checkout 会拿指针文件跑出假红），最后
  # `repository_dispatch` 派发，GitHub 侧 workflow 按**同一笔 sha** 起跑 —— 两边判同一份
  # 树，读数才对得上账。
  #
  # ⚠️ 它从 `endStages` 前移到这里，改的是**起跑时机**：平台对 endStages 的语义是
  # 「stages 跑完才执行」。薄化前这条流水线实测整跑 **2546s**（一次全绿跑的逐格
  # 读数：`固定结构用例` 873.2s / `Install dependencies` 446.4s / `受影响用例` 350.2s /
  # `重档静态判据` 345.3s），于是 GitHub 那一跑最早只能在一个多小时之后开始（那几格
  # 那几格已随薄化撤到 GA，见 `.gates` 顶部那段）。前移到主列开头，它吃的是
  # `Prepare` 之后那份已就位的树 —— 且必须排在下面所有读数之前：GA 越早起跑，
  # 末尾那格 45m 的判决等待越可能在预算内拿到结论。
  #
  # ⚠️ 前移**未改承重性**，且已把它翻成 **fail-closed**：主列的退码
  # 是承重的 —— 某一格 `error` 会把排在它后面的格整片 `skipped`（本仓把同一条约束写成判据：
  # 「每日链里必须有一格排在所有可能红的格之前」，`tests/no-platform-ci-config.test.ts`）。
  # 之前这一跳因 GitHub egress 不稳（实测 `Failed to connect to github.com port 443 after
  # 21114 ms`，另有令牌被拒 / LFS 缺件 / 自家钩子拦四形三类）而临时带
  # `--readout`：内部三态照打点、对外恒不退非零，与上面 `镜像身份` / `工作区复用读数` /
  # `缓存槽读数` 同一族。**现在 `--readout` 已摘除**，推不出去/派发失败就退非零、直接拦下 PR 合并。
  # 原来那句「它坏了既不许把门禁的红洗成绿，也不许把自己的红叠进门禁的账」在这里**正是承重语义本身**
  # —— 翻承重后这半句从「死规矩」变成「活判据」。
  #
  # egress 间歇断流不再致命：三跳 git 调用各自带超时并对 egress 类失败带退避重试
  # （脚本探活与内容推送共用 `PUSH_RETRY_BUDGET_MS 240s`、两跳各至多 10 次 /
  # LFS `LFS_PUSH_RETRY_BUDGET_MS 60s`、至多 5 次），真实抖动下重试几次即通
  # （实测一次 8.5s 派发成功、重试 1 次）；只有**持续**不通 /
  # 令牌被拒才真正退非零。
  #
  # 令牌那一系一字未动：`GITHUB_MIRROR_TOKEN`（平台侧注入，仓库外配置）缺席/被拒 ⇒ 内部判
  # 「没跑起来」留读数，翻承重后**这个读数现在折成流水线的红（即拦合）** —— 这正是 fail-closed
  # 要的：推不出去 = 这跑没判过 = 不许合。令牌值一个字节都不回显
  # （脚本内先脱敏，硬规则 17）。
  # ⚠️ 这一格的**结论会落在工作区的 `.comfy-ci/mirror-dispatch.json`**：
  # 主列末尾的 `GitHub 判决回读` 读它，从而在「本跑根本没派发」时不再空转满 45m。
  # 两格共用一个工作区（本流水线单 job 串行），所以这一跳只是一次写文件 + 一次读文件。
  # 落盘失败不影响本格三态（回读格读不到就退回「自己猜」的老行为）。
# - name: GitHub 镜像同步
#   # --await-hosted：先等托管机实验格的结果 —— refs 回读见本跑 HEAD 即
#   # 跳过推送（托管机那条影子流水线已推送并派发，本格只落回执），预算
#   # （HOSTED_AWAIT_BUDGET_MS 300s）到点没见才走下面的正常推送（兜底语义不变）。
#   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-github-mirror-push.mjs --await-hosted
#   # 三跳 git 调用各自带超时：内容推送与回读共用一份 240s 墙钟预算（不再探活，
#   # 预算从推送第一刀起算；至多 10 次、退避 5s→50s）、LFS 整档 60s（至多 5 次）——
#   # 同一份阶梯、两档窗口，常量与理由在 `scripts/ci-mirror-retry-policy.mjs` 与
#   # `ci-mirror-wire-budget.mjs`。没有限时就得吃 git 自己那个 21s 的 connect 超时，
#   # 而那一形过去只被念成「令牌活不活」。
#   # 15m 是外框（外框从 10m 抬）：最坏账 300s（等托管机）+ 240s（推送）+ 60s（回读）
#   # + 60s（LFS）≈ 660s —— 抬的是外框，判据与预算一个字没动。
#   timeout: 15m
#
  # ── 环境前提（**必须排在 `GitHub 判决回读` 之前**）──
  #
  # 上面三步答的是「四件工具在不在」「解释器住哪」，这一步答的是它们旁边那**三格**：
  #
  #   ① **在，但版本不够** —— 解释器低于本仓写明的下限 Python 3.10；
  #   ② **配置配错了** —— `.cnb.yml` 里有 host 侧 PowerShell（5.1）认不了的语法面；
  #   ③ **浏览器那一格的前提** —— 落点上有没有那一件；没有的话，**下载根通不通**。
  #
  # 三格的共同形态正是那句「别等到执行几十分钟后才发现环境不行」：
  # 第 ① 格**不会让哪一步变红**（门禁的 Python 侧以「探测不到」的名义退出比对、
  # 几条真跑的用例走 `env` 档跳过并登记 —— 与「装好了」在日志里逐字同形），
  # 第 ② 格红在**几十步之后**（GA 那边 `安装依赖` 那段 PowerShell 自己），
  # 第 ③ 格红在**整条流水线的倒数第二步**（`浏览器安装`）；
  # 而第 ②③ 格在跑到那一步之前会先把预算是花掉 —— 实测第 ③ 格就是「前面三十步
  # 全绿、二十几分钟之后卡在下载上」（两次实测）。
  # 薄化后这一档不再装依赖，第 ② 格的对象是 GA 的安装 step；这里保留
  # 第 ①②③ 三问是因为它们问的都是**这台节点**的事实（GA 的 runner 是另一台机器）。
  #
  # 判据不重写：解释器怎么找走 `ci-toolchain-python.mjs` 的 `findPython()`（与
  # `Python 可用性` 同一份候选表、同一个探针），`.cnb.yml` 的语法面复用
  # `tests/no-platform-ci-config.test.ts` 导出那一份（本地钩子与平台侧同一条判据），
  # 浏览器那一格复用 `ci-toolchain-browser.mjs` 的 `browserExecutableExists()` /
  # `playwrightReachabilityVerdicts()`（与 `浏览器安装` 同源 —— 打印与判据共用
  # 同一次结论，不造第二轮子）。
  # 逻辑在 `scripts/ci-env-probe.mjs` —— **不在这里就地写 PowerShell**，理由与
  # `工具链自证` 逐字相同：配置里的逻辑一条判据都测不到它。
  # 代价几秒（浏览器那格最坏是 4 个候选 × 8s 的 HEAD 串行），它只 import `node:*`，
  # 因此在这一档（此后不再有安装格）排在任何长等待之前都能立刻给出结论。
  #
  # ⚠️ 第 ③ 格**只在前置判定**（它是判据、要快），与 `浏览器安装` 失败分支那份
  # 「四个域全量一遍供人定位」的取证刻意不同 —— 后者是失败之后给人看的现场。
  # 也**不**在这里替 `浏览器安装` 去装：探测到「都不通」时的出路在人不在仓
  # （换根 / 配代理 / 预装进落点），这一步的作用是把结论提前，不是代办。
  - name: 环境前提
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-env-probe.mjs

  # ── 薄化：GA 承接的 24 格从 PR 档撤出 ──
  #
  # 撤的是**执行者**，不是判据：`.github/workflows/pr-gate.yml` 在同一个 PR 事件上逐格跑
  # 同一批入口（镜像仓侧的 runner 不在这台 Windows 节点上），而这一档的结论已经改成
  # 「镜像格派发 → 回读 GA 判决 → 判定格承重」—— GA 红，这一条就红。两边同时跑等于把
  # 同一结论算两遍，而 PR 档的墙钟正是这台节点最紧的共享资源（§13.5.21）。
  #
  # 逐项归属（撤出格 → 现在的执行者 / 结论在哪读）：
  #   分支守卫                  → pr-gate.yml `分支守卫` job
  #   提交声明核对              → pr-gate.yml `提交声明核对` job
  #   同步数据库表结构          → pr-gate.yml `同步数据库表结构` job
  #   类型检查                  → pr-gate.yml `类型检查` job
  #   标题行让位 / 文件结构硬规则 / 跨平台动作对照 / import 别名统一 / ComfyUI 端口口径 /
  #   内联样式注入 / 跨文件重复块 / 函数长度 TS / 函数长度 Rust / 模块循环依赖 /
  #   端口推导跨语言一致性 / CHANGELOG 碎片 / 主题色扫描 / UI/逻辑分离 / lib Node-only 声明
  #                             → pr-gate.yml `静态判据` job（同一条命令、逐格 step）
  #   oxfmt 格式                → pr-gate.yml `oxfmt 格式` step（`check-format.cjs --changed`）
  #   格式化提交分离 / 零消费导出 → 原本就在复合格 `重档静态判据` 里，随该格一并到
  #                             pr-gate.yml `重档静态判据` job（`ci-heavy-gates.mjs`）
  #   重档静态判据              → pr-gate.yml `重档静态判据` job
  #   Install dependencies      → 各 job 自己的 `安装依赖` step；PR 档此后没有吃
  #                             `node_modules` 的格，这一格装完也没人用（446s/PR）
  #
  # 留在这一档的两类（它们**不在** GA 覆盖面上，摘了就没有执行者）：
  #   · 平台读数：镜像身份 / 工作区复用读数 / 缓存槽读数 / 环境前提（问的都是这台节点的事实，
  #     GA 的 runner 是另一台机器，读数在那里没有对象）；
  #   · 判决：GA 回调结论回读（站内读 GA 送回的 status，承重退码）。转正
  #     （§13.5.33）后，出站轮询的 `GitHub 判决回读` / 日志分块 ×3 /
  #     `GitHub 判决判定` 五格停用，原文按注释形态留在下面供回退。
  #   · 派发（`GitHub 镜像同步`）：同日挪到平台池那条流水线 ——
  #     自托管节点出网不稳，不再由它推 github.com；下游判不下去由回读格超时判红。
  #
  # ⚠️ 恢复动作不是「取消注释」：这些格的真身现在在 `pr-gate.yml`，要回到这一档得
  # **两处同批**改（删 GA 的 step + 把 stage 加回这里并登记进 `COMFYAPP_CI_GATES`），
  # 判据 `tests/no-platform-ci-config.test.ts` 的总账会当场点名只改一边的形态。
  #
  # ⚠️ 下面这段**不是**薄化撤出的一部分：`单元测试` 是 就停用（并发 PR 会
  # 把带超时的读数变成不可信的红，§13.5.21），原文一直以注释形态留在这里供恢复 ——
  # 它恰好落在那 24 格说过的那段文本里，整段替换时必须一起搬出来，**别顺手删掉**。

  # ── ESLint（**临时撤到每日档**；本段与下一段都是停用原文，别删）──
  #
  # 每日那一档的名字是 `每日 ESLint 零警告`，命令与这里**逐字相同**（判据
  # `tests/no-platform-ci-config.test.ts` 的 `PR_MOVED_TO_DAILY` 钉住这一对：
