  #
  # 用户的要求原话：「生产构建改为定时任务，每天 1 次」，后来又是「生产构建放到每日档」。
  # 这两句把「**在哪跑**」「**什么时候跑**」与「**谁替这次改动背书**」三件事分开了，
  # 而本仓此前把前两件事合成了一件：
  #
  #   · `pull_request` 上原来那一格「生产构建」回答的是「**这次改动**能不能构建出来」——
  #     它随每一次推送跑，一天推十次就跑十次，而今天没推代码就一次都不跑。
  #     **这一格撤了**：同一份 `pnpm run build` 链在本地已经有一笔必须还的账
  #     （`新鲜度账` 那一步读 `FRESHNESS_TRACKS.artifact.dirty`），PR 上再跑一次是第二个
  #     执行者、不是第二份信息，而它是这台机上仅有的两档无并发旋钮的重档之一。
  #     「这次改动能不能构建」自此由**本地那笔账**答，代价与边界见规范 §13.5.23；
  #   · 这一条回答的是「**master 的 HEAD 今天能不能构建出来 / 全量单测能不能过**」——
  #     一天一条，与今天有没有人提交无关。
  #
  # 为什么后者是一件**独立**的事（不是同一条判据的重复）：
  #   · `next build` 的结论不只由源码决定：锁文件与 typedoc 的对不上、上游 advisory、
  #     Playwright 的下载根、节点上的 Python 解释器都会在某个早上变掉。PR 上那些
  #     「今天没人推」的日子，这些一概看不见。
  #   · 空转的形态是**最贵**的那种：构建链坏了两周而没人推代码，谁都不知道。
  #     PR 上跑那一格的时候，它要等**下一次有人提交**才炸出来，而那时已经很难分清
  #     是不是他改坏的；撤掉之后看见它的时机换成第二天 01:00 —— 两者都晚，区别是
  #     定时那一跑的归因不用猜（跑的就是 master 的 HEAD，那两周的账全在这一条上）。
  #
  # ── 形态：能机械导出的就与 PR 那条共用，不导出的一字不差地写清楚 ─────────
  #
  # · `<<: *common` —— runner / lock / env 与另外两条流水线**同一份锚点**。
  #   尤其 `runner.namespace: group` + `tags`：漏掉它这条会静默回落到计费的平台池，
  #   而定时任务是一天一条、**不会有人盯着**的那一类（形态判据见
  #   `tests/no-platform-ci-config.test.ts`：三条流水线的 `<<: *anchor` 引用数必须是 3）。
  # · 事件键是 `"crontab: 0 1 * * *"`（官方 `zh/build/crontab.md`）：
  #   平台按 `Asia/Shanghai` 解释，即**每天 01:00**。这个点换过两次：`0 4` →
  #   `0 2` →（同日业主再拍）`0 0`。
  #   挑 04:00 那句理由是「离有人开工还有几个小时，红了有人在上班时看见」——它漏了半个前提：
  #   **这台机在那个时刻得醒着**（节点就是这台开发笔记本，夜里睡眠是默认状态而不是异常）。
  #   实测查得到的 5 次派发 0 次跑完：两次根本没落到这台机（`Prepare` 0.3s error、平台侧
  #   `labels: []`），一次睡满 3.0h 被 8640s 墙钟上限掐掉而**同格末尾仍打「通过 ✓」**。
  #   按四个早晨的睡眠窗口逐晚核过 ⇒ **04:00 缺勤 2 次、02:00 缺勤 1 次**：往前挪是在提高出勤率，
  #   不是在修前提。取证、逐晚数据与复现命令只有一份出处（在案单里），这里不重抄。
  #   挪到 `00:00` 换的是「人还没收工」那一侧：查得到的四晚入睡时刻是 00:37 / 07:09 / 06:09 /
  #   04:00:36 ⇒ **那四个夜里 00:00 那一刻机器都醒着**，出勤这一格它确实赢。
  #   ⚠️ 但样本只有四晚（有一次 02:00 缺勤的入睡时刻没查到），**别把它读成保证**；
  #   ⚠️ 代价是同一句论证里的另一半分：`00:00` 也正是这台机**最可能还在被人用**的时刻，
  #   而 §13.5.21 把重档放到每日那一跑的理由恰恰是「没有并发的 PR、机器是空的」。
  #   这两条前提在这里对冲（出勤 ↑ 换 空机 ↓）⇒ 那一跑变慢**不再等于判据回归**，
  #   先按 §13.5.3.10 那张叠读数量具表定性；而「红了谁第一时间看见」也从「上班时」
  #   挪到「当天还坐在这台机前的时候」。
  #   ⚠️ 当年那半句「又避开整点那一档」没有做到（分钟段就是 `0`），这次不把它抄过来当依据。
  #   ⚠️ 「几点」本身没有判据在守：`tests/no-platform-ci-config.test.ts` 只认「分钟段与小时段是
  #   单值」= 每天一次，不认具体小时 ⇒ 漂了这个数字不会有任何红。改它就连这段注释一起改。
  #   但「**有没有执行**」现在有判据了：`pnpm check:daily-attendance`
  #   答「上一次每日派发在窗口内跑成了什么样」，退 0 出勤 / 1 缺勤 / 2 没结论或取不到读数。
  #   它按 `crontab:` **前缀**认事件（就是为了让上面那次换时刻不打红它），先天限制也写在那里：
  #   睡过去的那一次不会有任何执行者当场判出来，只能被下一次核对读成「已经 N 小时没绿过」。
  # · **执行身份 = 最后修改本配置并推送的人**（官方原文的负责人机制）。所以这条
  #   流水线红了，找的是那个人 —— 这也是它比 PR 那条更需要写清楚「怎么重跑」的原因。
  #
  # ── 跑的是七格，每一格的入口都是**跑法脚本**而不是裸命令 ──────────────────
  #
  # 这份清单从「只跑一格」起家，后来加上全量单测、挪档把构建变成
  # **唯一**一处、「新鲜度都交 CI 跑」再补上 `每日浏览器安装` + `每日全量E2E`，
  # 于是它现在是「四格前提（安装 / Python / 建库 / 浏览器）+ 三档重档（单测 / 构建 /
  # 全量 E2E）」—— 也正是 `FRESHNESS_TRACKS` 那三档在平台侧的执行者。前提那几格不是装饰：
  # 每次构建都是全新 job 目录、`node_modules` 恒不在场（`工作区复用读数` 两跑实测，
  # 形态①），缺了它们这一条会在 01:00 以「找不到 next / 连不上库 / Executable doesn't
  # exist」的形态红 —— 而它一天只红这一次，等于当天没结论。
  #
  # `node scripts/ci-daily-build.mjs` 就是 `artifact-run.mjs`（同一个判据、同一份记账）
  # 外面一层**只属于定时那一跑**的壳：打事件身份、打一次工具链镜像读数、把退出码转出去。
  # 判据一个字都没在这里重写 —— 重写一遍得到的就是「两条产物链各自漂」（§12.12）。
  #
  # ⚠️ **不在这里跑全套门禁**：那是 `pull_request` 那条流水线的事。定时任务的价值是
  # 「一天一次、结论稳定」，而不是「把 PR 的门禁换个时间再跑一遍」——
  # 后者只会让节点每天多背一条十几分钟的流水线，换来一堆与今天改动无关的红。
master:
  # PR 端的全套门禁：PR 不合并就不该结束，这里一步不省。
  pull_request:
    # ── 质量门禁（平台池 · #3478 起）─────────────────────────────
    #
    # 主列的判据全部在 GA（`pr-gate.yml` 五个 job），CNB 这一侧只剩「站内回读 GA 送回
    # 的结论」+「红了立案」两件纯 API 动作 —— 不吃 `node_modules`、不碰 Windows 特性，
    # 自托管节点的算力与缓存对它们已经没有对象（#3474 评估：主列只剩一格时，留在
    # 自托管的唯一理由是惯性）。整条迁平台池后**自托管节点退出 PR 路径**：
    # PR 期间开发机零打扰，代价是平台池 1 核 × 分钟级（与镜像出口同量级，
    # #3429 四档实测无核数敏感度）。
    #
    # 这是对 #1993「门禁主列永远自托管」的显式推翻：那条决定的射程是主列还扛着
    # 三十七格重判据的时代（核时计费 + 并发挤占），判据走光之后顾虑随之消失；
    # 「GA 回调没终态 ⇒ 判红」的 fail-closed 承重锚一字未动（§13.6「PR 跑绿才合并」）。
    #
    # 形态与两条镜像出口同族（平台池标签、自带 runner / docker / lock、不吃 `*common`、
    # 无 PowerShell 前缀与 cp936 外壳）—— 由 `tests/no-platform-ci-config.test.ts`
    # 的质量门禁段逐条钉住；`cnb` 通道（立案格要的）由这份 Dockerfile 预装（#3457）。
    #
    # ⚠️ 锁仍叫 `pr-$CNB_PULL_REQUEST_IID`：它是这把钥匙现在唯一的用户
    # （镜像出口用 `mirror-pr-$IID`，两把不共用 —— 同 key + cancel-in-progress 会把
    # 并行的另一条掐掉，#2114 同款）。
    - name: 质量门禁
      runner:
        # 平台池 = 云托管 Linux 节点（不写 namespace: group 就是它）。
        tags:
          - cnb:arch:amd64
        # 站内轮询 + 立案都是网络 IO 动作，CPU 密集部分只有 node 启动；
        # 与镜像出口同一份四档实测结论（#3429）⇒ 取核时最小的 1 核。
        cpus: 1
      docker:
        build:
          dockerfile: .cnb/ci-image/Dockerfile
          versionBy: .cnb/ci-image/Dockerfile
      lock:
        key: pr-$CNB_PULL_REQUEST_IID
        cancel-in-progress: true
      stages: *gates
      endStages:
        - name: PR 失败立案
          script: node scripts/ci-pr-failure-issue.mjs --no-block
          # 5m：三次读命令（列表 / 逐格详情 / 逐格日志，后者最多三格）+ 一次写 + 一次回读。
          # 取不到读数时它**不重试也不写**，退 2 由话术说出来（形态理由见上方立案叙述块）。
          timeout: 5m

    # ── GitHub 镜像同步（平台池 · 正式出口）──────────
    #
    # 自托管节点到 github.com:443 的出网间歇不通（实测一次：重试 6 次耗 203s 全败、整格红、判决格整片 skipped），而平台池的腾讯云侧是另一条出网路径、稳。
    # 按 #3378 后续指令：自托管主列那格停用，推送与派发**整个**由这一条
    # 承担 —— 不装依赖、分钟级、单格。
    #
    # 实验期的两个旗标随转正一起摘掉：
    #   · `--once`（四跳各只试一次、不重试）⇒ 恢复缺省的重试档：egress 抖动下按
    #     `PUSH_RETRY_BUDGET_MS` / `LFS_PUSH_RETRY_BUDGET_MS` 退避重试，只有持续不通才交账；
    #   · `--readout`（退码恒 0）⇒ 退码生效：推不出去 / 派发失败即非零。
    # ⚠️ 退码承重**不**等于「靠判断推送成功拦合」：这一条在平台池、不在 `质量门禁`
    # 的 `pull_request` build 里；后续流程走不通（GA 没跑起来 / 没送回结论）由 `质量门禁`
    # 的 `GA 回调结论回读` 超时判红兜住（§13.6 承重锚不变）。
    #
    # ⚠️ 锁**不**共用 `pr-$CNB_PULL_REQUEST_IID`：锁是跨流水线的，同一把 key +
    # cancel-in-progress 会把并行的「质量门禁」那条掐掉（同款死因）。
    # 实验期的双派发竞态窗随自托管兜底推送一起消失：现在只有一个写者。
    - name: GitHub 镜像同步（平台池）
      # 流水线名带「（平台池）」后缀：与 `质量门禁` 里那条**停用的同名 stage**
      # 区分开，也和 #3346 实验期的名字划清。下面的 stage 仍叫 `GitHub 镜像同步` ——
      # `check:mirror-attendance` / `每日镜像出勤立案` 按格名认出勤，换机器不换名，
      # 出勤读数才不断档。
      runner:
        # 平台池 = 云托管 Linux 节点（不写 namespace: group 就是它；主列的 runnerShape
        # 判据仍按 `.common` 锚点读，不受这一条影响）。
        tags:
          - cnb:arch:amd64
        # 这一格是网络 IO 动作（git 探活 / 推送 / LFS / 派发），CPU 密集部分只有
        # node 启动与 git 压缩；平台池缺省 8 核（memory = 核数 × 2 GiB）对它过配，
        # 而核时计费 = 核数 × 时长 ⇒ 显式取 1 核。实测 1 / 2 / 4 / 8 核四档的
        # 格耗时都在 egress 抖动区间内、无核数敏感度（读数与 sn 记在案单里），
        # 故取核时最小的那一档。
        cpus: 1
      docker:
        # git-lfs 预装进镜像：平台按这份 Dockerfile 构建临时镜像并按 versionBy 缓存
        # （文件不变就不重建）—— 取代原先「每跑 apt-get 装一遍」的那一格。
        build:
          dockerfile: .cnb/ci-image/Dockerfile
          versionBy: .cnb/ci-image/Dockerfile
      lock:
        key: mirror-pr-$CNB_PULL_REQUEST_IID
        cancel-in-progress: true
      imports:
        - https://cnb.cool/moon-read/GITHUB_MIRROR_TOKEN/-/blob/main/envs.yml
      stages:
        - name: GitHub 镜像同步
          script: node scripts/ci-github-mirror-push.mjs
          # 10m 外框包住最坏账（推送 240s + 回读 + LFS 60s）与冷启动余量；
          # 与自托管主列那格同一份重试预算（常量在 `ci-mirror-retry-policy.mjs`）。
          timeout: 10m

  # 合并后的 push：**不重跑全套**（全套是 PR 那条的事；「不引入新代码」的前提依旧 ——
  # 合并提交由平台按**已被门禁验过的源分支 SHA** 生成）。树级校验档已撤（文档链两格
  # 挪 GA `master-gate.yml` 同名 step），合并形态复核的真正防线仍是平台分支保护。
  #
  # 镜像出口（平台池）是 push 事件下唯一的流水线：它不是树级校验、不吃
  # `node_modules`，只把合并后的 HEAD 推成镜像仓的 master。镜像令牌只被它读取。
  push:
    - name: GitHub master 镜像（平台池）
      # 与 PR 档的「GitHub 镜像同步（平台池）」同一形态：自托管节点到 github.com
      # 的出网不稳，推送与 LFS 整个挪到平台池（腾讯云侧另一条出网路径）。
      # 这一条不是门禁主列，是**出口动作**：把合并后的 HEAD 推成镜像仓的
      # `refs/heads/master`（`--force`，镜像语义是「跟住」），供那边 daily /
      # package-desktop 的 schedule 与 master-gate 的 push 判同一棵树。
      #
      # `--readout` 已摘：原先读数档把 1/2 折成 0，平台那格恒绿、失败只留在
      # 日志正文里，要靠 `push 失败立案` 回读日志补立案。现在退码生效，
      # 推不出去 / LFS 送不到即非零，失败直接落进这一格的 error 状态。
      # ⚠️ 不与 `master 合并复核` 共用锁：两件事各自要结论，一把锁只挡
      # 「同一件事被重复排队」。`cancel-in-progress: true` 是「同时只留最新那一推」
      # —— 镜像是 force-push 的幂等「跟住」，后一笔必然覆盖前一笔，让旧的那一跑
      # 继续推没有新信息。
      #
      # 承重 / 兜底：push 不拦合并。失败出口 = 本流水线自己的 error 落进 push build
      # （`push 失败立案` 读逐格读数；它挂在**本条**的 endStages，与本格同跑），
      # 加上每日 `镜像漂移判据`（跨仓匿名 ls-remote、`always()`）兜「之后没人再推」。
      runner:
        # 平台池 = 云托管 Linux 节点（不写 namespace: group 就是它）。
        tags:
          - cnb:arch:amd64
        # 与 PR 出口同一份网络 IO 动作（git 探活 / 推送 / LFS，`--master` 只是不派发），
        # CPU 密集部分只有 node 启动与 git 压缩；平台池缺省 8 核（memory = 核数 × 2 GiB）
        # 对它过配，而核时计费 = 核数 × 时长 ⇒ 显式取 1 核。依据是 #3429 在 PR 出口上的
        # 1 / 2 / 4 / 8 核四档实测：格耗时都在 egress 抖动区间内、无核数敏感度，
        # 同一脚本同一性质 ⇒ 结论适用，取核时最小的那一档。
        cpus: 1
      docker:
        build:
          dockerfile: .cnb/ci-image/Dockerfile
          versionBy: .cnb/ci-image/Dockerfile
      lock: *lock_push_mirror
      imports:
        - https://cnb.cool/moon-read/GITHUB_MIRROR_TOKEN/-/blob/main/envs.yml
      # 立案格与镜像出口同跑（#3378 起内联在这一条的 endStages）。`--lane push`
      # 显式声明「我就是这一档的立案口」，红也要跑的语义由平台 endStages 保证。
      # ⚠️ 这一条在**平台池 Linux 容器**里：脚本要用 `sh` 语法，不许带自托管那句
      # `$enc=[Text.Encoding]::UTF8; …`（那是 Windows PowerShell，sh 会把它拆成
      # `=[Text.Encoding]::UTF8: not found` 当场退 127，#3453）。同理不包
      # `ci-cp936-exit.mjs` —— CP936 转码是中文 Windows 自托管那一跳的事，Linux 上
      # 该外壳直接直通，包着只是多一层无用的壳。立案脚本的 `cnb` 通道由本条
      # `docker.build` 的 Dockerfile 预装（见 `.cnb/ci-image/Dockerfile`）。
      endStages:
        - name: push 失败立案
          script: node scripts/ci-pr-failure-issue.mjs --no-block --lane push
          timeout: 5m
      stages:
        - name: GitHub master 镜像
          script: node scripts/ci-github-mirror-push.mjs --master
          # 10m 外框包住最坏账（推送 240s + 回读 + LFS 60s）与冷启动余量；
          # 与 PR 出口同一份重试预算（常量在 `ci-mirror-retry-policy.mjs`）。
          timeout: 10m

  # ── 触发口：CNB 只作触发入口，构建执行全部在 GA（ISSUE #3504）──────────────
  #
  # #3504 之前，这一批触发口在自托管 Windows 节点上**本地执行**同一份重清单
  # （`*daily_gates` / `*oneshot_*` / `*package_gates`，三张锚点随本批整体退役）——
  # 而同样的构建内容 GA 侧早有执行者：`daily.yml` / `package-desktop.yml` 的
  # schedule，与本批新增的 `oneshot-build.yml` / `oneshot-e2e.yml` / `oneshot-unit.yml`。
  # 现在每条触发口只剩**一个动作**：把按下那一刻的 master HEAD 派发到 GA 的对应
  # workflow（`scripts/ci-ga-dispatch.mjs --preset <名>`）。实际构建一格都不在本机跑。
  #
  # 形态与两条镜像出口同族（平台池 Linux 容器、自带 runner / docker / imports、
  # 不吃 `*common`、无 PowerShell 前缀与 cp936 外壳）：派发要出站 `api.github.com`，
  # 而自托管节点到 github.com:443 的出网间歇不通 —— 镜像推送与派发早在 #3418 就
  # 为此迁到平台池（腾讯云侧另一条出网路径），本批沿用同一判断。
  #
  # ⚠️ 派发脚本先等 sha 在镜像仓可见再派发（push 镜像那一跳有分钟级延迟）；
  # 预算内没等到就退 1 并指路「GitHub master 镜像（平台池）」—— 宁可红在这里，
  # 不派一个 GA 检不出的 sha。204 ⇒ 送达；GA 侧跑红跑绿不归触发口判。
  # ⚠️ 触发面只剩镜像仓 master：web 按钮本就 `reg: ^master$`（`.cnb/web_trigger.yml`）；
  # API 口的 `--branch` 也只认 master（镜像仓没有别的分支可派）——
  # 这是 #3504 的能力收敛：以前能在本机跑任意 CNB 分支，现在只有镜像跟得住的 master。
  #
  # preset ⇄ workflow 的对应关系在 `scripts/ci-ga-trigger-map.mjs`（单一出处），
  # 由 `tests/ci-ga-trigger-map.test.ts` 双向核对：触发口的 `--preset` 必须在注册表里、
  # 注册表的 workflow 文件必须真实存在且带 `workflow_dispatch`。
  # 事件键名与流水线名一个都没改（`.cnb/web_trigger.yml` 的按钮、
  # `check-daily-attendance` 的每日类事件识别都按名字认，换名是另一笔账）。
  # 锁按触发类各留一把 —— 现在挡的是「同一件事被重复派发排队」；
  # GA 侧的同名并发组挡「两跑同时压 runner」，两面互为对方的那一半。
  #
  # 随构建执行一并退役的还有三样，各自的承接写在退役处：
  #   · `每日失败立案` —— GA daily.yml 自带「失败立案」step（CNB 单子，#3436 同通道），
  #     CNB 侧那份立案的对象（本机执行的每日跑）已不存在；派发口自己红会直接落在
  #     流水线列表上。
  #   · `每日镜像出勤立案` / `每日令牌权限读数` —— 二者要 `cnb` CLI（node_modules 里）
  #     或节点常驻根的工具二进制，而触发口不再装依赖；出网信号由镜像出口的红 +
  #     GA daily.yml 的「镜像漂移判据」接住。两个脚本保留为手动档（npm script 直跑）。
  #   · `每日 YAML 真解析`（actionlint）—— 同因（二进制钉在节点常驻根，平台池容器里
  #     没有）。workflows 的真解析改由 `tests/ci-ga-trigger-map.test.ts` 的结构判据 +
  #     GA 侧 runner 自身的 workflow 校验接住。
  web_trigger_daily:
    - <<: *ga_dispatch
      name: 每日档（手动触发）
      lock: *lock_daily
      stages:
        - name: GA 派发·每日档
          script: node scripts/ci-ga-dispatch.mjs --preset daily
          # 10m 外框包住等 sha 可见的默认预算（360s）与冷启动余量；与镜像出口同量级。
          timeout: 10m

  api_trigger_daily:
    - <<: *ga_dispatch
      name: 每日档（API 触发）
      lock: *lock_daily
      stages:
        - name: GA 派发·每日档
          script: node scripts/ci-ga-dispatch.mjs --preset daily
          timeout: 10m

  # 单跑三档：粒度保留（只在 GA 侧各跑一档，不为另外几格付费），
  # 事件键 / 流水线名 / 锁与退役前逐字相同 —— 变的只有「格清单」变「派发一格」。
  web_trigger_build:
    - <<: *ga_dispatch
      name: 单跑生产构建（手动触发）
      lock: *lock_oneshot_build
      stages:
        - name: GA 派发·单跑生产构建
          script: node scripts/ci-ga-dispatch.mjs --preset build
          timeout: 10m

  web_trigger_e2e:
    - <<: *ga_dispatch
      name: 单跑全量E2E（手动触发）
      lock: *lock_oneshot_e2e
      stages:
        - name: GA 派发·单跑全量E2E
          script: node scripts/ci-ga-dispatch.mjs --preset e2e
          timeout: 10m

  web_trigger_unit:
    - <<: *ga_dispatch
      name: 单跑全量单测（手动触发）
      lock: *lock_oneshot_unit
      stages:
        - name: GA 派发·单跑全量单测
          script: node scripts/ci-ga-dispatch.mjs --preset unit
          timeout: 10m

  # 桌包那一档：成品落点随之换形 —— GA `package-desktop.yml` 产 artifact（14 天，
  # 按 run 取）+ 滚动 nightly Release（每天都指向最新一份），不再是本机常驻目录的
  # 「留 2 份」（runner 是即弃机，回写开发机既没有通道也不该有）。
  # `*package_fail_stage`（桌包失败立案）随本批退役：立案脚本的执行者与它的对象
  # （本机执行的桌包跑）一起消失；GA 桌包失败目前落在 GA run 页面（自动立案是后续账）。
  web_trigger_package:
    - <<: *ga_dispatch
      name: 桌面成品包（手动触发）
      lock: *lock_package
      stages:
        - name: GA 派发·桌面成品包
          script: node scripts/ci-ga-dispatch.mjs --preset package
          timeout: 10m

  api_trigger_package:
    - <<: *ga_dispatch
      name: 桌面成品包（API 触发）
      lock: *lock_package
      stages:
        - name: GA 派发·桌面成品包
          script: node scripts/ci-ga-dispatch.mjs --preset package
          timeout: 10m

  api_trigger_e2e:
    - <<: *ga_dispatch
      name: 单跑全量E2E（API 触发）
      lock: *lock_oneshot_e2e
      stages:
        - name: GA 派发·单跑全量E2E
          script: node scripts/ci-ga-dispatch.mjs --preset e2e
          timeout: 10m

  api_trigger_build:
    - <<: *ga_dispatch
      name: 单跑生产构建（API 触发）
      lock: *lock_oneshot_build
      stages:
        - name: GA 派发·单跑生产构建
          script: node scripts/ci-ga-dispatch.mjs --preset build
          timeout: 10m

  api_trigger_unit:
    - <<: *ga_dispatch
      name: 单跑全量单测（API 触发）
      lock: *lock_oneshot_unit
      stages:
        - name: GA 派发·单跑全量单测
          script: node scripts/ci-ga-dispatch.mjs --preset unit
          timeout: 10m


  # ── 这里曾有第四个 API 口：`api_trigger_formatfix`（已摘除）─────────
  #
  # 它存在的唯一理由是「`oxfmt 格式` 那一格在 PR 事件上推不动，要换一个可信事件做回写口」。
  # 整条链已被摘掉，而摘它的证据正是这一口**没等到自己的前提**：
  # 委托那一跳本身也要权限，实测 `start-build` 回
  # `403 / errcode 10023 / Missing required scopes: repo-cnb-trigger:rw` ——
  # PR 类事件的令牌只有 `repo-code:r`，而平台没有 YAML 开关能翻上去（「换执行口就能推」
  # 「换执行口就能推」只对**被委托的那一条**成立，发起委托的那一跳照样被拒）。
  # 判与修现在都在本地（`.githooks/pre-commit` 的 D0 跑 `check-format.cjs --staged`），
  # 平台那一格只判。要恢复回写能力，前提是先给 CI 配上带触发权限的单独令牌，
  # 并且记住：**委托发不出去之前，PR 那一格不许再挂 `--autofix`**（就地修 + 回不去
  # = 让陈旧隐形的那一格，同型事故）。

  # ── GA 回调（已转正）────────────────────────────────
  #
  # 目标：把「CNB 出站轮询 GitHub conclusion」换成「GA 入站推送结论」。探针
  # 验过两件：① 一条绑 `sha=PR 预合并 sha` 的 `api_trigger` build，
  # 其终态会挂进 `GET /pulls/{n}/commit-statuses`（context 前缀
  # `cnb/api_trigger_ga_verdict/...`）；② `--env` 注入生效。于是 GA 跑完用自己
  # 的令牌调一次 `POST /{repo}/-/build/start` 即可，自托管机一台都不必碰
  # github.com。
  #
  # **已转正**：`质量门禁` 的 `GA 回调结论回读`（§13.5.33 逐笔对账）站内读这条
  # status，折成 `pull_request` build 的退码 —— 出站轮询 GitHub conclusion 的
  # 老主列五格已停用，双写消失，§13.6「PR 跑绿才合并」的承重仍在这条 build
  # 上（不换成「靠 api_trigger context 拦合」那条没坐实的路）。
  #
  # ⚠️ 流水线 `name` **不改名**：commit-status 的 context 含这段名字，改名会让
  # 「同一条 context 后写覆盖前写」的读数与历史现场对不上。名字里「骨架·休眠」
  # 是落地那一刻的称谓，只指「不接承重主列」；回调 build 本身一直由 GA 收尾
  # job 自动起，不是「没人发它就不跑」。
  #
  # **单写者，不再需要占位腿**：`GA_ROLE=placeholder` 那一半与 `*lock_ga_verdict`
  # 的 cancel 竞态设计随转正一起退役 —— fail-closed 改由 `GA 回调结论回读` 自己
  # 承担：主列那条 `pull_request` build 活到 GA 出结论，超时 / status 缺席即判红。
  # 那条锁仍留着：同一个 PR 连派发几次时，后一条 callback 掐掉前一条，避免
  # 旧结论覆盖新结论（后写覆盖前写仍成立，只是不再分两个角色）。
  #
  # 判定**内联在下面的 stage script** 里，不引用 `scripts/` 下任何入口：
  # `git.enable: false` 时工作区没有代码（绑预合并 sha 必须关检出 —— 不关的话
  # clone 服务只 fetch master，`checkout` 直接 `fatal: reference is not a tree`，
  # 探针实测过的死因）。配套脚本放在**发回调的 GA 侧**
  # （`scripts/ci-ga-verdict-callback.mjs`）与只读对账入口
  # （`scripts/ci-ga-verdict-placeholder.mjs`），不在这一档里跑。
  #
  # 三态（fail-closed）：`GA_VERDICT` 明确是绿词（success/neutral/skipped）
  # ⇒ exit 0；是红词或缺席 ⇒ exit 1；`GA_ROLE` 不是 callback ⇒ exit 2
  # （没判过 ≠ 判过）。
  #
  # **日志身份读数**：`env` 里除 `GA_VERDICT` / `GA_ROLE` / `GA_PR_NUMBER` 外，
  # `scripts/ci-ga-verdict-callback.mjs` 还带 `GA_CALLBACK_SHA=<预合并 sha>` ——
  # 这条短 build 绑的是哪笔，CNB 侧日志自己念得出来，不必跳去 GA run 页面翻。
  # `CNB_COMMIT` 一并打印作交叉核对：文档没给 `api_trigger*` 事件的取值保证，
  # 两者不一致时以 `GA_CALLBACK_SHA` 为准并明写 `mismatch`，别把绑错的 sha
  # 读成「平台又合成了一棵新树」。只加日志，不改三态退码与 `GA_VERDICT` 折叠。
  api_trigger_ga_verdict:
    - <<: *common
      name: GA 判决回调（骨架·休眠）
      lock: *lock_ga_verdict
      git:
        enable: false
      stages:
        - name: GA 结论判定
          # 全 ASCII 日志：`git.enable: false` 时工作区没有
          # `scripts/ci-cp936-exit.mjs`，包不了那层转码；这一格自己不写中文，
          # CP936 对 ASCII 逐字通过，乱码面从源头就不存在。
          # PS 5.1 原生写法（`-contains` / 无 `?.` `??`），与头注第 3、6 两条
          # 和 §13.5.3.4.1 的解析期判据对齐。
          script: |
            $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
            $role = [string]$env:GA_ROLE
            $sha = [string]$env:GA_CALLBACK_SHA
            $pr = [string]$env:GA_PR_NUMBER
            $cnbSha = [string]$env:CNB_COMMIT
            $short = $sha
            if ($short.Length -gt 8) { $short = $short.Substring(0, 8) }
            $cnbShort = $cnbSha
            if ($cnbShort.Length -gt 8) { $cnbShort = $cnbShort.Substring(0, 8) }
            $match = 'match'
            if ($sha -ne '' -and $cnbSha -ne '' -and $sha -ne $cnbSha) { $match = 'mismatch' }
            Write-Host "[ga-verdict] callback sha=$sha (short=$short) pr=$pr role=$role"
            Write-Host "[ga-verdict] callback cnb_commit=$cnbSha (short=$cnbShort) sha_check=$match"
            if ($role -ne 'callback') {
              Write-Host "[ga-verdict] role is not callback, inconclusive (not a pass)"
              exit 2
            }
            $v = ([string]$env:GA_VERDICT).ToLower()
            $green = @('success', 'neutral', 'skipped') -contains $v
            if ($green) {
              Write-Host "[ga-verdict] callback conclusion=$v sha=$short -> success"
              exit 0
            }
            Write-Host "[ga-verdict] callback conclusion=$v sha=$short -> failure"
            exit 1
          timeout: 5m
