# 门禁清单。
# ⚠️ 它**没有**「清单逐条核对」那类判据捧着 —— `tests/cnb-pipeline-gates.test.ts` 已随
# 旧版 `.cnb.yml` 一并删除（#623），本 PR 不复活它（它锁的是旧版那三十步与上报插件，
# 两样在自托管上都不成立）。守着这份文件的现有判据是 `tests/no-platform-ci-config.test.ts`
# 那一条**形态**判据（分支键 / `namespace: group` / 非空 `tags` / 两个事件键 /
# lock.cancel-in-progress / 停用登记）—— **条目本身的增删仍不报错**，
# 所以这里的每一步都要靠人逐条核对。
#
# ── 增量：哪些 stage 可以在「本次改动没碰到它的扫描面」时跳过（ISSUE #1981）──
#
# 用户的质疑是「CI 里的检查能否增量，而不是没有改动也重跑」。答案是 stage 级的
# `ifModify`（CNB 官方语法手册 `zh/build/grammar.md` 的 `#stage-ifmodify`）：
# 变更文件一个都不落在给定 glob 内 ⇒ 这一步不执行。它**支持 PR 触发的事件**
# （官方原文：「PR 触发的事件，统计 PR 中的变更文件」），正是本流水线要跑的那一类。
# 语义与本地钩子那一层（`scripts/gate-scan-read.cjs` 的 `skipUnlessStagedTouches()`）
# **逐字同义** —— 也就是说，平台侧终于和本地用同一套扫描面在说话。
#
# 两条安全边界（都是「宁可多跑」的方向）：
#   · **新建分支的 push 事件忽略 `ifModify`**（没有对比基准）⇒ 全部照跑；
#   · **没有 `ifModify` 的 stage 就是默认档 = 任何改动都跑** —— 本文件里绝大多数
#     stage 都在这一档，包括每一条全库级不变量与全部前提步骤。
#
# ⚠️ 还有**两种**收窄不在 `ifModify` 这一档（它们的前半是前提，跳不得）：
#   · `Install dependencies` 的**装的那一跳** —— 依赖面（锁文件 / `package.json` /
#     `pnpm-workspace.yaml` / `next.config.js`）一项都没碰就不装，判定在
#     `scripts/ci-install-deps.mjs`（`pnpm` 自证照旧每次都跑，判据见 §13.5.20）；
#   · `prettier 格式` 的**扫描面** —— `src/**` + `.storybook/**` 是手写 glob，
#     与 `check-format.cjs` 的 `IGNORE_GLOBS` 是两件事（`IGNORE_GLOBS` 是**排除**面）。
#     ⚠️ 但 `IGNORE_GLOBS` 增删目录时**必须同批回来看这两行**；
#   · 判据脚本**自己的触发面** —— `API 文档生成物与源同步` 的 globs 由
#     `check-docs-api.cjs` 的 `INPUT_RES` 机械反推，不手抄第二份。
#
# ⚠️ **「哪几条被收窄了」只有一处出处**：`scripts/ci-incremental-gates.mjs` 的
# `INCREMENTAL_GATES`（每条都写着它守的是哪份脚本、为什么这条收窄安全）。
# 两个方向都由 `tests/ci-incremental-gates.test.ts` 判（登记表里每条 ⇒ 配置里必须
# 逐字带着那组 `ifModify`；配置里带 `ifModify` 的 ⇒ 必须在登记表里），
# 该判据在固定清单里、每次提交都跑。**别在这里直接给一个 stage 加 `ifModify`** ——
# 那会在两处各写一份「收窄名单」，而漂了之后「哪一份是真的」没有判据能回答。
# 随手自查：`pnpm run check:ci-incremental`（= `node scripts/ci-incremental-gates.mjs --check`）。
#
# 判定门槛（哪类能进登记表、哪类绝对不行）逐条写在 `scripts/ci-incremental-gates.mjs`
# 的文件头；口径与边界见规范 §13.5.18。
# ── 每日那七格：定时与手动触发**共用这一份**（`.daily-gates` 锚点）────────────
#
# 为什么做成锚点而不是两处各写一遍：这条清单现在有**三个触发口** ——
# ① `"crontab: 0 4 * * *"`（每天 04:00，无人值守）；② `web_trigger_daily`
# （人在页面上手点，按钮定义在 `.cnb/web_trigger.yml`）；③ `api_trigger_daily`
# （CLI / API：`cnb build start-build --event api_trigger_daily`，服务端只认
# `api_trigger` 前缀，所以那个按钮**点不动**自动化这条路 —— 见下面那格的注释）。
# 三条跑的是**同一件事**：
# 「现在就把这份清单跑一遍」。写成几份的时刻就是它们开始各漂的时刻（哪天给每日档加一格、
# 忘了加到手点那条，「手点一遍每日档」得到的就不是每天 04:00 那一跑）——
# §12.12 的孪生形态，只是它长在配置里。判据钉的是「三条解析出来的 stage 名单**逐字相同**
# 且等于 `COMFYAPP_CI_DAILY_GATES`」（`tests/no-platform-ci-config.test.ts`）。
#
# 与 `.gates`（PR 那三十七格）同理，这里也刻意**不带 `ifModify`**：这七格是「重跑一遍」
# 的语义，按改动面跳过就不是每日档了。
.daily-gates: &daily_gates
  # ── 前提三格：script 行与 PR 那条流水线上的同名档**逐字相同** ──────────
  # 为什么不共用 YAML 锚点：`pipelineStageNames()` / `stageBlock()` 是按名字在文本里
  # 取块的，两格重名会让「哪一条流水线的读数」变成解析器的运气。所以这里各起一个
  # 带「每日」前缀的名字，而**由判据钉住它的 script 与 PR 那一格逐字相同**
  # （`tests/no-platform-ci-config.test.ts`）—— 漂移的形态是「一边改了另一边没改」，
  # 那正是这份清单里所有「只许一处」的判据在挡的东西。
  # ── 工具链自证（自托管特有：没有 docker 镜像兜底，装没装由这一步说了算）──
  # 这段是本文件存在的**前提**，不是可选的自检：宿主机缺 Node / pnpm / git 时，
  # 后面每一步都会以看不懂的方式失败（`pnpm: not recognized`、corepack 拉版本超时），
  # 排障成本远高于在这里花三秒正面回答。失败即非零退出 —— 它必须会红。
  #
  # ⚠️ 2026-10-19 从 PR 那一条挪到这里（业主口径：「只是判断环境的，不要每次都判断，
  # 这个环境不会经常改动」）。**挪的是节奏，不是撤账**：这一格在 PR 上每次跑要
  # 13.8s（逐格读数见 `COMFYAPP_CI_GATES` 那段），而它问的是**节点事实** ——
  # 一次 PR 改不动 PATH、改不动 winget。今天卡住每日那一跑的三条基线红里就有一条
  # 长在这一族上（`ci-toolchain-selfcheck`），「每次都判」换到的是噪声而不是结论。
  # 留在 PR 上的那一半是 `Install dependencies` 里的 `check-pnpm-available.mjs` ——
  # 它判的是「这台机跑不动整条链吗」，那才是每个 PR 都需要有人回答的问题。
  - name: 每日工具链自证
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      # ── 编码探针（头注第 6 条那件事的**常读读数**）──
      # 前四行中文分别由四层吐出：PS 自己（写它自己的编码）、cmd（console CP）、
      # node（UTF-8）、以及**绕过控制台对象、直接以 CP936 字节写 stdout** 的那一行。
      # 哪一行在平台侧可读，就说明**平台在那一层用的是什么编码** —— 乱码是「多层里
      # 哪一层断的」这件事，只看一行日志永远分不开。
      Write-Output "编码探针·PS 原生：中文一二三"
      cmd /c "echo 编码探针·CMD：中文一二三"
      node -e "console.log('编码探针·NODE：中文一二三')"
      # 第 4 行是**决定性的那一条**（2026-10-16 晚加）：前两轮读数已经否掉「控制台代码页」
      # 与「宿主 ANSI 代码页」两个嫌疑人，剩下「解码端写死 CP936」这一种。
      # 这一行可读 ⇒ 就是它，仓库侧「逐 stage 以 CP936 出口」这条出路成立；
      # 这一行仍乱 ⇒ 还没找对层，继续往上（判读见头注第 6 条）。
      $gbk=[Text.Encoding]::GetEncoding(936); $b=$gbk.GetBytes("编码探针·GBK 出口：中文一二三`n"); [Console]::OpenStandardOutput().Write($b,0,$b.Length); [Console]::OpenStandardOutput().Flush()
      # 逻辑在 scripts/ci-toolchain-selfcheck.mjs —— **不在这里就地写 PowerShell**。
      #
      # 这一步原先是一段 ~70 行就地 PowerShell（探 Python、用 winget 当场装、
      # 打印「这个账号看得见什么」）。问题不在它写得对不对，而在**配置里的逻辑
      # 一条判据都测不到它** —— `.cnb.yml` 只在平台上跑，本地一个执行者都没有，
      # 于是它只能靠「推上去看看红不红」验（#1959 第二、三轮各红过一次）。
      #
      # 现在是 scripts/ci-toolchain-selfcheck.mjs：
      #   · 候选表回到唯一一处（src/lib/process/python-candidates.ts）——
      #     此前它探的面与门禁探的面不是同一份，两边各判一次「没有」；
      #   · 这一步**能被单测直接跑**（tests/ci-toolchain-selfcheck.test.ts）；
      #   · 失败时的取证（执行账号、PATH、四个安装位置的命中情况）一并搬进脚本，
      #     并给出「位置命中而命令探不到 ⇒ 改账号 PATH，别重复装」这条分岔。
      # 仍会红：缺 git / node（不在 engines.node 内）/ pnpm / Python 时非零退出。
      # 清单与判读顺序见 docs/standards/13-提交与-code-review.md §13.5.3.5。
      #
      # **第一件事是把控制台输出编码钉成 UTF-8**（ISSUE #1959 的日志乱码）。
      # 平台抓取 stage 输出用的是宿主 ANSI 代码页（中文 Windows 上是 CP936），
      # 而 Node / pnpm 无条件写 UTF-8 —— 于是本机打的每一个非 ASCII 字符在日志里
      # 都是乱码（`工具链自证通过 ✓` → `宸ュ叿閾捐嚜璇侀€氳繃 鉁?`），而 PowerShell
      # 自己打的字是好的（它按控制台的编码写字节）。这一句把那两边重新对齐。
      # 放在**最前**：后面的每一步都在打这种字，先把编码钉住再说话。
      # `chcp` / `[Console]::OutputEncoding` 改的是**控制台对象**上的设置，
      # 同一控制台里的进程共享它 —— 所以它在第一步设、后面的 stage 都受益。
      # 它恒退 0（纠正动作与读数，不是判据），机制见 scripts/ci-console-encoding.mjs。
      # ⚠️ 两条各包一层 `ci-cp936-exit`：先钉住控制台编码（让 PowerShell 把 Node 的
      # UTF-8 **解对**），再由外壳把它以 **CP936** 写回给平台（ISSUE #1977）。
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-console-encoding.mjs --apply
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs
  # 与 PR 那格同一份实现（`ci-install-deps.mjs`：先自证 pnpm 起得来，再按语义判
  # 要不要装）。判定与命令行**必须与 PR 那格逐字相同** —— 这不是风格：判据
  # `tests/no-platform-ci-config.test.ts` 比的就是「命令行 + env 赋值」两组字面，
  # 同一份脚本长在两条流水线上各配一份 env，就是两条流水线各自漂（§12.12 的孪生形态）。
  #
  # ⚠️ **这一格现在不接槽，而那是那条判据上唯一登记过的例外**（ISSUE #2081，2026-10-21）：
  # 接槽把作业里的 `node_modules` 整体接成**指向项目根之外**的 junction，而 Turbopack 对
  # 这一条有硬要求 —— 每日那一跑后面背着 `每日生产构建`，它当场
  # `Symlink [project]/node_modules is invalid, it points out of the filesystem root`（13.8s 就死，
  # 连带 skip 掉 ESLint / 浏览器 / 全量E2E / 全量单测四格）。PR 那一格不构建，所以同一条链
  # 在 PR 上从来没有被它的消费者拒绝过。
  # 两臂读数（同一台机、同一份 master，唯一变量就是这一行 env）见规范 §13.5.3.4.3 与
  # `docs/audits/2026-10-21-timing-baseline-refs-volume.md`：接槽命中 13.8s、不接槽 48.8s（暖）。
  # ⇒ 代价是**每天多付 ~35s**，换来的是整条每日档有一个能构建的工作区 —— 槽是优化不是前提。
  # 例外不是「可以随便漂」：判据钉死「PR 那一侧必须置着 `COMFY_CI_SLOT`、每日这一侧一个字都不许出现」，
  # 其余各行仍然逐字相同；改这条形状要走判据，不能只改这里。
  - name: 每日安装依赖
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 每日 Python 可用性
    # ── **必须排在「每日单元测试」之前**（这条顺序原来是 PR 上的，2026-10-19 随两格一起搬来）──
    #
    # 套件里有一族用例（`tests/helpers/python-exe.ts` 的 `PYTHON_OK` 守卫、
    # `e2e/support/fake-comfyui-executor-env.mjs`、`scripts/check-app-port-vectors.cjs`）
    # 需要一个**真能起来**的解释器。缺件时它们按既有口径走 `env` 档跳过并登记 —— 也就是说
    # 这一步**不会让那一格变红**，只是少判几格。而「少判」在日志里是隐身的。
    #
    # 实测（`cnb-jt3-1k5071kou`）：这台节点上确实一个解释器都没有，而单测照样往下跑、
    # `Python 可用性` 排在**两小时之后** —— 于是「缺 Python」这件事要么永远看不到，
    # 要么在最贵的位置才看到：那一次 `单元测试` 跑到 2h24m 被 8640s 的墙钟上限掐断，
    # 整条流水线只留下 `timeout of 8640000ms exceeded`，一条失败原因都读不到。
    #
    # 判据那一份只有 `--python-only` 一个（`findPython` / `installPython` /
    # `pythonForensics`）；它与 `每日工具链自证` 不重复：那一步判**整机四件**且缺件即红，
    # 这一步只回答**解释器住哪** —— 绿时打一行版本号（把「E2E 到底用哪个解释器」变成
    # 可读读数），缺件时打取证并**非零退出**（红在能指路的位置）。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --python-only
  # ── Python 探针读数（两条链各自的结论，**只打印、不阻断**）──
  #
  # `每日 Python 可用性` 用的那条链（`findPython` 起**裸名字**，Windows 交给 CreateProcess
  # 按 PATH 解析）与 E2E 前置用的那条链（`resolvePython` 手工扫 PATH × PATHEXT、再对
  # **绝对路径**起一次）是「同一台机器上哪个解释器能跑」的两个不同实现。实测出过
  # 相反结论（`cnb-g36-1k50hvu52`：`Python 可用性` 绿、`E2E 关键流程` 报
  # 「PATH 上没有可用的 Python」）—— 而**只看一边的日志分不出是哪一边错**。
  #
  # `scripts/python-probe.mjs` 把两边的读数都打，退出码恒为 0：它是**打印**、
  # 不是判据（判据那一份只有 `--python-only` 一个）。2026-10-19 随 `Python 可用性`
  # 一起从 PR 那一条挪来（同一口径：判的是节点，不是这次改动），而它排在解释器
  # 判据之后、`每日全量E2E` 之前 —— 那才是这两份结论互相要看着的位置。
  - name: 每日 Python 探针读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/python-probe.mjs
  - name: 每日同步数据库表结构
    # 库里要有表：套件里读库的那几条在没有库时的形态是「连不上」，看起来像业务故障
    # （§9.1 那格「页面 200、接口 500」的同一族误诊）。`db-push.mjs` 复核真建出表。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/db-push.mjs
  # ── 全量单测**不在这里**：它排在整份清单的最后 ──
  # 理由是业主那句「最容易出问题的放最后」：这一档是这条流水线上唯一会因**这台机的
  # 负载**而单条超时的格子（实测 `cnb-b0l-1k59op66t`：775 份里 1 份红在
  # `Test timed out in 30000ms`，而同一时刻另一份检出在跑全量 vitest），
  # 排在中间就等于让一单条抖动决定后面三格跑不跑 —— 那三格至今零执行记录。
  # 原文与预算注释在 `.daily-gates` 末尾。顺序由判据钉住（不许回到中间）。
  # 入口是**跑法脚本**（ISSUE #1979 的口径）：
  # 裸 `pnpm run build` 会让这一步的绿只落在日志里、`scripts/.artifact-freshness.json`
  # 一个字不变。外面这一层（`ci-daily-build.mjs`）多出来的只有事件身份与镜像读数，
  # 判据与记账仍然是 `artifact-run.mjs` 那一份。
  - name: 每日生产构建
    # 控制台编码先钉住（头注第 6 条 / `ci-cp936-exit.mjs`），与其余每一格同形。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-daily-build.mjs
    # 30m：这一格跑的就是 `next build` + 数产物 + 冒烟。实测 118s
    # （`cnb-eus-1k5058g8l`）/ 131.0s（`cnb-ln5-1k540cfn1`），而 `next build` 在冷
    # 节点上比读数慢得多，但真挂死必须早报 —— 一天的预算只有这一条，卡满 2h 墙钟
    # 等于当天这一跑没有结论。与 `artifact-run.mjs` 的 `ARTIFACT_TIMEOUT_MS` 同量级。
    # ⚠️ 它**没有并发旋钮**，这是刻意的（ISSUE #1993 / 规范 §13.5.21）：`next build`
    # 的 worker 数由构建器自己按机器定，没有一个「按核数收敛」的键；`NODE_OPTIONS`
    # 那类改的是内存上限、不是并发 —— 拿它冒充降载就是换一个东西。这条路径上
    # **唯一真能控负载**的手段是「别让两条流水线同时压同一台机」
    # （`lock.cancel-in-progress` + 按 PR 分锁，见 §13.5.3.10）。
    timeout: 30m
  # ── ESLint 零警告（每天一次；2026-10-19 从 PR 那条流水线撤到这里）─────────
  #
  # 它在 PR 上是**唯一一个真的会挂满预算**的静态判据：两次现场都不是「规则报错」，
  # 而是这一步始终没跑完 —— `cnb-jt3-1k5071kou` 挂到 8640s（节点被别的流水线压死），
  # `cnb-hpl-1k5a0s6ss` 挂满 20m（命令口径写成了 `eslint .`，全仓冷跑；那一格现在
  # 跑的是 `pnpm run lint`，理由写在那段注释里）。
  #
  # 撤档的理由与 `每日生产构建` / `每日单元测试` 逐字相同（§13.5.21 / §13.5.23）：
  # 它是这台机上仅有的几档**起一堆子进程**的格子之一（类型感知规则要真起 ts 宿主），
  # 而节点只有一台、平台不给并发旋钮 ⇒ 并行 PR 下它的墙钟读数不可信。红的地方也
  # 不是「这次改动违规」，而是「这台机当时腾不出核」。
  #
  # ⚠️ 这**不是**把 lint 整个挪出 PR 这一档：`prettier 格式` / `格式化提交分离` /
  #   一批 `check-*.cjs` 仍在 PR 上，`tsc --noEmit` 也在 —— 只有这一格撤，
  #   因为只有它同时满足「起一堆子进程」与「本地有等价执行者」两条。
  #
  # 判据钉住的两半（`tests/no-platform-ci-config.test.ts`）：
  #   · 它**不在** PR 那一条的清单里，且在 `COMFYAPP_CI_DISABLED_GATES` 里留名
  #     （停用 ≠ 删除：`.gates` 里那段原文必须还在）；
  #   · 这一格必须在每日清单里，且 `script` 与 `.gates` 里那段注释原文的 `script`
  #     行**逐字同形**（漂移的形态是「一边改了另一边没改」）。
  - name: 每日 ESLint 零警告
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- pnpm run lint
    # 冷跑（这条路径上 `--cache` 恒定失效：缓存键含工作区的绝对路径，而平台每个作业
    # 都是新目录，见 `.gates` 里那段）实测：本机 8 核 ≈311s；节点侧历史上热跑
    # 256~274s、被压死时挂满过 8640s。给 30m 与 `每日生产构建` 同档 —— 一天只有这
    # 一跑，卡死要早报，而「跑得完的形态」与它差一个量级。
    timeout: 30m
  # ── 每日全量 E2E 的前提格：浏览器 ──────────────────────────────────
  # 与 PR 那格 `浏览器安装` 同一份实现（`ci-toolchain-selfcheck.mjs --playwright-only`），
  # 所以**两行 env 也必须一起带**：下载根与连接超时是那两次读数换来的
  # （`cnb-gt1-1k513ill4` 起），只镜像命令行不镜像 env 时，「Playwright 换版本的那个
  # 早上」定时那一跑会从默认根去取那 120 MiB —— 而默认根在这台节点上取不到，
  # 红只在第二天 04:00 出现。镜像判据现在两处都比（命令行 + `env` 的赋值行）。
  # 幂等：落点已有那一件时这一格是 1~5s（实测 `cnb-cdt-1k51s6mf1`）。
  # ── 浏览器安装（2026-10-19 起这是**唯一**的执行者：PR 上那一格撤到这里）──
  #
  # 撤的理由与 `每日工具链自证` 同一条：它判的是**这台节点能不能到下载根、浏览器在不在
  # 盘上**，一次 PR 改不动这两件事；而 `E2E 关键流程` 早已撤到 `每日全量E2E`，
  # PR 上没有任何一步再用浏览器 —— 那一格剩下的唯一作用只是「替第二天暖缓存」，
  # 那不该由每个 PR 付费。
  # 判据仍然钉住这件事的两半：这一格必须在 `每日全量E2E` **之前**，
  # 且 script / env 与当初 PR 上那一格**逐字同形**（镜像键与套接字超时是两个实测读数，
  # 抄错一处就回到「到不了」那一档，见下面那两段注释）。
  - name: 每日浏览器安装
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --playwright-only
    env:
      # **这两行是实测读数换来的**（`cnb-gt1-1k513ill4`）。
      #
      # 先撞的是 30s 的**套接字**超时（`NET_DEFAULT_TIMEOUT`）—— 那不等于「CDN 不通」，
      # 是「这一次没量完」。可把它放宽到 120s 之后**照旧超时**（`timed out after 120000ms`），
      # 于是结论变了：这台节点**真的到不了** `cdn.playwright.dev`。180 MiB 的包在
      # 这样一条链路上无论等多久都不会到。
      #
      # 所以换镜像 —— 走 `PLAYWRIGHT_DOWNLOAD_HOST`（Playwright 自己的环境变量，
      # 不引第二套机制）。选 npmmirror 的 Playwright 二进制镜像是因为**它真能供上这一件**：
      # 实测它按同一段路径回 HTTP 200，且 15s 内收到了 99 MiB。
      #
      # **为什么这一行只能是「外面给的」**：Playwright 自己的三个内置镜像**全同族**
      # （`cdn.playwright.dev` / `playwright.download.prss.microsoft.com`），
      # 这台节点出不去这一族时它 `retryCount = 5` 的「回退」等于没有 ——
      # 实测逐字打了 5 次同一个域名，然后 `Download failure, code=1`。
      # 也就是说这一档**推不出来**，只能由这里给：给上之后
      # `runPlaywrightInstall()` 就只用它（不再陪 Playwright 挨个试不通的那三档）。
      #
      # ⚠️ **这个值是给这台节点用的，换网络要跟着换**。平台侧 env 能覆盖它；
      # 本地不设就回到 Playwright 的默认行为（`playwrightHostsToTry` 的判据）。
      # 选它是因为它是 Playwright 点名的镜像键，而不是本仓发明的那一套；
      # 真要换（内网代理、别的镜像站）改这一行即可。
      #
      # ⚠️ 这两行与判据无关：判据仍是「装完真起一次浏览器」（`--playwright-only` 的复验）。
      # 镜像只是把「到得了」这件事从宿主机身上挪到一个到得了的地方。
      # 而这一步有**两条**通道：先自己分片取（不依赖这个根到得了大 body），
      # 失败才原样交给 `playwright install`（那时才用得上下面这两行）。
      #
      # ⚠️ **「很慢」要分两层看，换源只治其中一层**（用户那句诉求）。
      # 换源治的是「从哪儿取」；`playwright install` 自己那份下载**没有续传**
      # （`browserFetcher.ts` 每次失败 `unlink(zipPath)` 从头来），所以慢链路上一换
      # 源也照样卡在大 body 上 —— 那一层由本仓的分片自取（`fetchUrlResumable`）治。
      # 也就是说：**换源不是唯一的慢因，也不是判据**；判据始终是「装完真起一次」。
      # 三个候选根的顺序同步调过（`PLAYWRIGHT_HOST_CANDIDATES` 把 npmmirror 排前），
      # 好处是「没配根的环境（本地 / 别的节点）也先试离得近的源」。
      PLAYWRIGHT_DOWNLOAD_HOST: "https://cdn.npmmirror.com/binaries/playwright"
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
      # ⚠️ **这里不写 `PLAYWRIGHT_BROWSERS_PATH`**：它只在「浏览器装在镜像里」那一档
      # 成立（`/ms-playwright` 在 Windows 宿主上不存在）。宿主机直跑时落点判据按
      # `%LOCALAPPDATA%` 推 —— 写了它等于让判据去一个空目录找东西，「装好了」与
      # 「一件都没有」在日志里逐字同形。
      # 实测首次要下 ~100+ MiB（chromium + chromium-headless-shell 两件）。给 20m：
      # 冷节点 + 慢链路够用，而卡死（CDN 真的不通）时也能在 20m 报出来，不必等满平台
      # 默认的 2h 墙钟。**不是放宽判据** —— 预算只管多久放弃。
    timeout: 20m
  # ── 全量 E2E（每天一次；这一格是 `FRESHNESS_TRACKS.e2e` 的执行者）──────
  #
  # 为什么要在每日档跑**整档**：本地那一层从 2026-10-19 起不再要求自证（`ciStage`
  # 那一栏，规范 §11.8 / §13.5.23），而 PR 上的 `E2E 关键流程` 只跑 `@critical` 子集 ——
  # `isWholeTrackRun` 明写子集**不构成整档凭证**。没有这一格，「80 条 spec 今天能不能
  # 全过」就从一台有人推代码才判得出来的机器，变成一个谁都不判的空白。
  #
  # ⚠️ **不许带任何收窄参数**（`--grep` / 指到单个 spec）：带了就会**绿着不记账**，
  #   而日志与账面看起来与真跑过一模一样 —— 那正是这一族最坏的静默形态。
  #   判据把这一条钉在 `script` 上（只扫命令行，不扫注释：注释里正当地要写这句话）。
  #
  # 跑法：`e2e-run.mjs` 自己起 webServer（`pnpm dev`，零 `PNPM_START` ⇒ 不依赖构建产物，
  #   这一格因此与 `每日生产构建` **各自独立**：构建坏了不影响端到端链路的结论）。
  # 45m：本地整档是十几分钟量级，而节点上是冷工作区 + 现场编译；与 `每日单元测试`
  #   同一档预算口径（卡死要早报，一天只有这一跑）。
  - name: 每日全量E2E
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/e2e-run.mjs
    # ⚠️ 这一行 env 是**产物前提的声明**，不是调档偏好：webServer 起的是 `pnpm start`，
    # 而 `.next` 里那份产物来自排在前面的 `每日生产构建`（同一分支的 stage 共享工作区）。
    # 旧形态下这件事靠 `playwright.config.ts` 里那句 `CI || PNPM_START` 推断，而它把
    # 「是不是 CI」与「有没有产物」绑成了一件 —— PR 那条撤掉构建之后就是这么红的
    # （`cnb-ob4-1k5828a36`：`Could not find a production build` ⇒ webServer 180s 超时）。
    # 现在写在一句话里，顺序判据也钉住「`每日生产构建` 必须排在这一格之前」。
    env:
      COMFY_E2E_SERVER: start
    timeout: 45m
  # ── 全量单测（每天一次；为什么不在 PR 上跑，见上面 `COMFYAPP_CI_DAILY_GATES` 那段）──
  #
  # ⚠️ **它排在整份清单的最后**（业主口径：「最容易出问题的放最后，然后执行过的就不用
  # 重复执行了」）。这一格是这条流水线上唯一会因**这台机的负载**而单条超时的格子 ——
  # 实测 `cnb-b0l-1k59op66t`：775 份里只 1 份红，红在 `Test timed out in 30000ms`，
  # 而同一时刻另一份检出（`comfy-app-t3-branch2`）在跑全量 vitest、又一份在跑全量 eslint。
  # 它排在中间时，那一单条抖动就把 `每日生产构建` / `每日浏览器安装` / `每日全量E2E`
  # 三格一起 skip 掉（那三格至今零执行记录）。挪到最后之后，同一跑里那三格先拿到结论，
  # 不必为了单测的抖动把前面几格重付一次。
  # 顺序有判据：`tests/no-platform-ci-config.test.ts` 钉「这一格是每日清单的最后一条」。
  - name: 每日单元测试
    # 入口是**跑法脚本**，不是裸 vitest（ISSUE #1979 的口径，与 `每日生产构建` 同一条
    # 理由）：它内部就是 `pnpm run test:coverage`，外面那一跳是**记账** ——
    # 跑绿刷新 `scripts/.full-suite-freshness.json`，本地「改了就当天跑」那条判据与
    # 这一档读的是同一份事实。裸写 vitest 时这一档的绿只落在日志里、账面一个字不变。
    #
    # ⚠️ **必须整档跑**：`isWholeTrackRun` 会把「透传了 `--grep` / 指到单个文件」的
    #   绿判成**不构成整档凭证**、当场不记账。并发不进 `extra` 的同一条理由写在
    #   `planRun` 的注释里（塞错位置 = 每一次都绿而不记账）。
    #
    # 这一档还打**分文件耗时榜**（前 10 + 合计 + 中位，junit 落仓库内的
    # `node_modules/.cache/`，与钩子那侧共用 `parseJunitXml`）—— 它顺带回答「这台机上跑全量时
    # 哪几份在吃时间」，而那个数此前只在本地账本里有。只算测试阶段，用来排序不当 stage 墙钟。
    # ⚠️ 落点**不是** `os.tmpdir()`：那样拼出来的是 `--outputFile.junit=C:\…`，而 PowerShell
    #   宿主会在第一个冒号处把它切成两个参数，切剩的一截变成 vitest 的位置过滤器 ——
    #   这一档首跑 12.6s 红、后面三档全 skipped 就是这么来的（`cnb-2in-1k589j0kp`，
    #   边界表在 `scripts/launcher-core/shell.mjs` 的 `PS_UNSAFE_ARG_RE`）。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/full-suite-run.mjs
    # 45m：`full-suite-run.mjs` 自己的墙钟预算是 30 分钟（`FULL_SUITE_TIMEOUT_MS`），
    # stage 预算必须**大于**它，否则先被平台掐的是 stage，而那一刀不带
    # 「被预算砍 vs 判据红」的分流话术（`classifyOutcome`）。
    # ⚠️ 两次读数把这条预算钉在很窄的带里：安静机器 827s（`cnb-eus-1k5058g8l`，755 文件
    #   全量绿），而**满载机器 2466s**（`cnb-b0l-1k59op66t`，同规模、41 分钟）—— 后者已经
    #   贴着 45m 的 stage 墙钟。而那一跑里 30 分钟的内部预算**并没有掐住它**
    #   （vitest 自己跑完了全程），也就是「被预算砍」那一档话术在这里没有执行者 ——
    #   这一格排到最后之后，被掐的代价不再是「后面三格没了」，但仍要修（见任务：
    #   `full-suite-run.mjs` 的 timeoutMs 在 Windows 上是否真收得掉子树）。
    timeout: 45m

.gates: &gates
  # ── 2026-10-19：环境类前提三格从这一条上撤到**每日档**（`COMFYAPP_CI_DAILY_GATES`）──
  # 撤的是节奏、不是账：`工具链自证` / `Python 可用性` / `Python 探针读数` 现在各有
  # 一名每日档里的同名执行者（`每日工具链自证` / `每日 Python 可用性` /
  # `每日 Python 探针读数`），判据双向核对（少了执行者就红，见
  # `tests/no-platform-ci-config.test.ts` 那条「撤下来的每一格必须有每日的对应」）。
  # 为什么它们不属于「每个 PR 都判」：三份脚本问的都是**节点事实**（PATH、winget/scoop
  # 装没装、解释器住哪），一次 PR 改不动它们；留在这一条上的是
  # `Install dependencies` 里的 `check-pnpm-available.mjs` —— 「这台机跑不动整条链吗」
  # 才是每个 PR 都需要有人回答的那一问。逐格代价与这次决定的原文见
  # `COMFYAPP_CI_GATES` 上面那段与 §13.5.23。

  # ── 镜像身份（**读数，恒不退非零**；ISSUE #1993）──
  #
  # 这一步回答的是上一版答不出的那一格：**这台机器长自哪张镜像、哪一版**。
  #
  # 自托管这条路上「镜像」没有被声明的地方（`pipeline.docker.image` 不生效，
  # 见头注第 1 条），所以镜像的用法是**宿主侧**的：装机时 `docker pull` 一张钉了
  # 版本标签的节点镜像、按它装好，再把身份钉进两个机器级环境变量。缺了这一步，
  # 「这台节点跑的是哪一版工具链」只能靠翻上一次的红色日志反推 —— 而工具链清单
  # 反复红，根因正是**环境是隐形的**（§13.5.3.5）。
  #
  # ⚠️ 它是**读数**、不是判据，三条理由：
  #   · 本仓的工具链靠**断言**守（`工具链自证` 判四件、`环境前提` 判版本下限）——
  #     那些是实际能力，镜像是期望身份，两者不一致时以能力为准；
  #   · **没有标识不等于这台机器不对**：裸装机是本路径的历史形态，第一次接进节点
  #     的一跑不该被一条与新事实无关的红拦住；
  #   · 「标签 / digest 对不对得上镜像库」本进程判不了 —— 构建容器里没有 docker。
  #
  # 所以它只做三件事：把磁盘上真有什么（OS / 内核）与声明的身份一起打出来、
  # 把「标签没钉版本 / digest 拼错」写成读数、以及**没有标识时给出下一动作**。
  # 逻辑在 `scripts/ci-image-identity.mjs` —— 不在配置里就地写 PowerShell，
  # 理由与 `工具链自证` 逐字相同（配置里的逻辑一条判据都测不到它）。
  - name: 镜像身份
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-image-identity.mjs

  # ── `Python 可用性` / `Python 探针读数` 已经不在这一条上（2026-10-19）──
  #
  # 两格的**理由与事故**跟着它们搬到了每日档（`每日 Python 可用性` /
  # `每日 Python 探针读数`，见 `.daily-gates` 里那两段），这里只留一句「为什么撤」：
  # 这两份脚本问的是**这台节点上解释器住哪、哪条链起得来** —— 一次 PR 改不动 PATH、
  # 改不动 winget 装没装，而它们每次跑都要在 PR 上占一格排队位。撤下之后仍然有人判
  # 同一件事：`每日单元测试` 之前必有 `每日 Python 可用性`（顺序有判据），
  # 而 PR 侧「跑不动整条链」那一问由下面 `Install dependencies` 里的
  # `check-pnpm-available.mjs` 接着（它判的是 host 解析面，与上面那条不是一条链，
  # 也不该被压成一条）。

  # ── 工作区复用读数（**读数，恒不退非零**）──
  #
  # 本文件头注第 4 条把「每次构建都是全量 clone、没有配置能省掉它」写成了这条路径的
  # 固定成本。那个结论有**数字**（`Prepare` ≈31.5s，规范 §13.5.20 那张预算表），但从来
  # 没有**机制读数** —— 平台在这台宿主机上到底是哪一种：
  #
  #   ① 每次新建一个 job 目录、`git init` + 从零 fetch（那 31.5s 是「从零搬对象库」）；
  #   ② 复用同一目录、只做增量 fetch（那 31.5s 的大头是 checkout 落盘，不是网络）；
  #   ③ 目录复用但 `.git` 每次被重建（常驻已经有一半，缺的是别把对象库清掉）。
  #
  # **第一跑读数（`cnb-f3v-1k57a1o1l`，这一档自己的那一跑）已经把它定成 ①**，而且是靠
  # 路径自己说的、不靠对照：工作区目录名带着本次流水线的 id ——
  # `…\runner\<repoId>\cnb-f3v-1k57a1o1l-001~c5g\workspace` ⇒ 每次构建一个新目录；`.git`
  # 与 `.git/FETCH_HEAD` 出现在 59s / 58s 前（与那一跑 `Prepare` 的 35.5s 同量级）、HEAD
  # detached、`refs/heads` 零条、浅克隆 false、对象库 **57168 KiB ≈ 56 MiB**（**不是**开发
  # 机上那 130 MiB —— 那一份含 99 个 pack、22178 个松散对象与所有本地分支，CI 取的是协商
  # 后的单 ref；本仓此前把两个数混成一处写过，这里按读数订正）。同一跑里 `node_modules` /
  # `.next` / `coverage` / `playwright-report` **四个都不在场** ⇒ 第二格也定了：安装与生产
  # 构建都从冷态起，那两笔（59s / 131s）比克隆本身大。
  #
  # 三种形态各有各的出路，而**没有任何一处日志能把它们分开** —— 于是「要不要动平台那个
  # 检出开关」（Pipeline 级 `git.enable: false`，官方语义「指定是否拉取代码」）这一问
  # 只能靠猜。这一档就是把那一格变成可见读数；它同时读**第二格**：`node_modules` /
  # `.next` 在构建开始时是不是冷的 —— 若冷，这条路径上交的就不止克隆那 31.5s，还有
  # 「安装从零起」与「冷缓存 next build」两笔，而那两笔比克隆大一个量级。
  #
  # 逻辑在 `scripts/ci-workspace-probe.mjs` —— 不在这里就地写 PowerShell，理由与
  # `工具链自证` 逐字相同：配置里的逻辑一条判据都测不到它。
  #
  # ⚠️ 账本跨构建对照要**两跑**才成立，所以**它自己那一跑**报「未定」—— 这不是缺陷，是
  # 这一档刻意不肯拿一次观测猜结论。而「是哪一种形态」这件事第一跑就答得出来：路径形状 +
  # `.git` 的出生时间已经足够（见上面的读数），账本要补的是「会不会有一天变成另一种」。
  # 账本写在**工作区之外**（`COMFYAPP_CI_PROBE_DIR`，缺省退宿主 `LOCALAPPDATA`；实测落点
  # 在 `C:\WINDOWS\system32\config\systemprofile\AppData\Local\` —— 这一跑的执行账号是
  # SYSTEM，与 §13.5.3.5 那条「Python 装在 yuedu 会话里、SYSTEM 够不着」同源）：写进检出
  # 目录就成了未跟踪文件、被结构门禁那一套判，而这一档要的恰恰是「跨检出存活」。
  # 判红的事一件都不做 —— 它判的是这台机器怎么被调度，那不是任何一次 PR 的缺陷。
  #
  # 第二跑（`cnb-f5b-1k57bgqol`）自证了这条链：账本里已有上一跑那条，新跑的 job 目录换成
  # `cnb-f5b-1k57bgqol-001~ttf\workspace` ⇒ 它自己印出「结论·①每次新目录」。它同时暴露了
  # 对照行的一处「读了等于没读」：平台把每个 job 都检出成 `…\<流水线 id>~<随机段>\workspace`，
  # 最后一段**恒等于 `workspace`**，只取 basename 时两跑并排一模一样 —— 有区分度的那一半在
  # 父目录，故现在由 `jobLabel()` 取「父目录名 + 最后一段」，判据钉住「两个不同 job 的标签必须
  # 不同」。与这一档开头那句是同一类病：**读数落在日志里读不出来，与没有读数等价**。
  - name: 工作区复用读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-workspace-probe.mjs
    # 秒级（几次 git 调用 + 几个 stat）。给 5m 与 `新鲜度账` 同款：只是「卡死要早报」的
    # 量级余量，判据本身远小于它。
    timeout: 5m

  # ── 缓存槽读数（ISSUE #2022 第二步；恒不退非零）──
  # 只回答三问：有没有槽、该落哪个键、这一跑与它的关系是 `reuse` / `install-into-slot` /
  # `no-cache` 中哪一档。键刻意复用 `ci-deps-face.mjs` 的 `pnpmInstallFingerprint` ——
  # 两处各算一份 sha 的漂移形态是「缓存命中判断」与「碰了依赖面就得真装」不再一致，
  # 那时的表现是依赖不对但门禁全绿。
  #
  # ⚠️ 这一格**只读数、不碰盘**：动作在执行档 `scripts/ci-slot-apply.mjs`，而它由
  # `COMFY_CI_SLOT=1` 才拨 —— 开关的落点在下面那格 `Install dependencies`（本格不置它，
  # 两格各判一件事：这里回答「会不会命中」，那里执行「命中就接」）。机制与开关分两批推，
  # 理由同 §13.5.25 那条纪律：那一格每次构建都要过，键算错一次的代价是所有 PR 装不上。
  #
  # **这里一个路径都不写**：槽根由 `resolveCacheRoot` 在作业时问
  # `pnpm store path`（同一条 cwd、同一条解析面，所以就是那次 install 真正会用的 store），
  # 取它所在卷下的 `ci-cache/<包名>`。写死盘符曾经把这台机器坑在什么位置上，见
  # §13.5.3.4.3 里「runner 换盘」那一段。
  - name: 缓存槽读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-cache-slot.mjs
    # 与上面那格同量级（几次 stat）。秒级的事给 5m 只为「卡死要早报」。
    timeout: 5m

  # ── 环境前提（**必须排在 `Install dependencies` 之前**，ISSUE #1959）──
  #
  # 上面三步答的是「四件工具在不在」「解释器住哪」，这一步答的是它们旁边那**三格**：
  #
  #   ① **在，但版本不够** —— 解释器低于本仓写明的下限 Python 3.10；
  #   ② **配置配错了** —— `.cnb.yml` 里有 host 侧 PowerShell（5.1）认不了的语法面；
  #   ③ **浏览器那一格的前提** —— 落点上有没有那一件；没有的话，**下载根通不通**。
  #
  # 三格的共同形态正是 ISSUE #1959 里那句「别等到执行几十分钟后才发现环境不行」：
  # 第 ① 格**不会让哪一步变红**（门禁的 Python 侧以「探测不到」的名义退出比对、
  # 几条真跑的用例走 `env` 档跳过并登记 —— 与「装好了」在日志里逐字同形），
  # 第 ② 格红在**几十步之后**（`Install dependencies` 那段 PowerShell 自己），
  # 第 ③ 格红在**整条流水线的倒数第二步**（`浏览器安装`）；
  # 而第 ②③ 格在跑到那一步之前会先把预算是花掉 —— 实测第 ③ 格就是「前面三十步
  # 全绿、二十几分钟之后卡在下载上」（`cnb-gt1-1k513ill4` / `cnb-g9d-1k515kvrq`）。
  #
  # 判据不重写：解释器怎么找走 `ci-toolchain-python.mjs` 的 `findPython()`（与
  # `Python 可用性` 同一份候选表、同一个探针），`.cnb.yml` 的语法面复用
  # `tests/no-platform-ci-config.test.ts` 导出那一份（本地钩子与平台侧同一条判据），
  # 浏览器那一格复用 `ci-toolchain-browser.mjs` 的 `browserExecutableExists()` /
  # `playwrightReachabilityVerdicts()`（与 `浏览器安装` 同源 —— 打印与判据共用
  # 同一次结论，不造第二轮子）。
  # 逻辑在 `scripts/ci-env-probe.mjs` —— **不在这里就地写 PowerShell**，理由与
  # `工具链自证` 逐字相同：配置里的逻辑一条判据都测不到它。
  # 代价几秒（浏览器那格最坏是 4 个候选 × 8s 的 HEAD 串行），跑在**任何依赖安装
  # 之前**（它只 import `node:*`，那时 `node_modules` 还没有）。
  #
  # ⚠️ 第 ③ 格**只在前置判定**（它是判据、要快），与 `浏览器安装` 失败分支那份
  # 「四个域全量一遍供人定位」的取证刻意不同 —— 后者是失败之后给人看的现场。
  # 也**不**在这里替 `浏览器安装` 去装：探测到「都不通」时的出路在人不在仓
  # （换根 / 配代理 / 预装进落点），这一步的作用是把结论提前，不是代办。
  - name: 环境前提
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-env-probe.mjs

  # ── 安装 ──
  # 门禁用 pnpm（AGENTS 硬规则 1：npm 11 在本项目解析 typescript 别名链会崩）。
  # --frozen-lockfile 保证装的就是锁文件里的版本。
  # 刻意**不**开 corepack enable：自托管宿主机上 pnpm 是预装的，corepack 在
  # 非交互环境里为解析 packageManager 去拉版本会挂住；裸 `pnpm -v` 的上一步
  # 已经证明它可用。
  #
  # ⚠️ **依赖面没动就跳过「装」那一跳**（ISSUE #1981 收尾）：
  # `ifModify` 只能整步跳过，而本步前一半（`check-pnpm-available.mjs`）是**前提**
  # 步骤（跳过它 = 后面几十步都建立在一个没验过的解析面上）。所以收窄放在**步内**：
  # 锁文件与依赖面（`pnpm-workspace.yaml` / `next.config.js` / 补丁目录）一个都没碰时，
  # `node_modules` 本来就在、`--frozen-lockfile` 是一次空操作 —— 这一跳省掉的是
  # pnpm 自己那几秒（实测 59~61s 的绝大部分是后面的 `postinstall` 里那几条
  # node 脚本与缓存刷新，见 §13.5.20）。`pnpm` 自证照旧每次都跑。
  - name: Install dependencies
    env:
      # 开关（ISSUE #2022 第二步，机制见 §13.5.3.4.3）：**这一跑开始走槽**。
      # 走与不走都由 `ci-install-deps.mjs` 自己打印（`✓ 走缓存槽（reuse）` /
      # `走缓存槽（install-into-slot）` / `槽未接管（原因）⇒ 照常装`），所以三档收益的
      # 读数是从它自己的那句话里取的，不是从「这格变快了」倒推的。
      # 该比的两侧在同一格内就有：未命中那一跑量的就是冷装本身，命中那一跳根本没发生
      # （同日三档实测外加一条普通装对照都在规范 §13.5.3.4.3 末那张表里，跨天不可引用）。
      # ⚠️ **只有这一格置它，每日那一格按策略不接**（ISSUE #2081：每日后面背着
      # `每日生产构建`，接槽形态下 Turbopack 拒指向项目根之外的 node_modules 链）——
      # 那是 `tests/no-platform-ci-config.test.ts` 里 `DAILY_ENV_ONLY_ON_PR` 登记的**唯一**
      # 例外，理由与两臂读数见「每日安装依赖」上面那段。回退 = 摘掉这里这一行**并同批**把
      # 该键从那份名单里删掉：只动一边会被那条判据当场点名（名单过期）。
      COMFY_CI_SLOT: "1"
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      # 动依赖面前先自证一件事：**这个宿主真的起得来 pnpm** —— 而它正好是这一步
      # 的全部动作。放在这里而不是更早的 stage，是因为这条判据**在更早的位置上做不
      # 出来**：`工具链自证` 那份探针刻意按形态解析（corepack 摆在盘上的 pnpm 有三个
      # 形态，Node 只起得来其中一个，见 §2.1.1），而这一句走的是 host 自己的解析面 ——
      # 两者不是同一条链，也不该被压成一条（脚本自己写着理由：判据全在
      # `scripts/launcher-core/corepack.mjs`，它是薄壳）。
      #
      # 顺序要紧：**判在装之前**。装失败之后再判，红的位置就与原因分开了 —— 而
      # 「pnpm 起不来」这条链上此前每一轮都是这个形态（第一步绿、几十步之后才以一个
      # 看不懂的错收场，实测见 §13.5.3.6）。这里 1 秒就能问出来，且它跑在
      # `Install dependencies` 本来的位置上，代价是零。
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      # 这一跳按语义判，不按「有没有 ifModify」判：空转的安装不该被跑，
      # 而前提步骤不该被跳。判定口径与理由全在脚本头注（唯一实现）。
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs

  # ── 分支保护 ──
  # 守在最前：分支不对时后续检查的结果最后都会被丢弃（与 pre-commit 同序）。
  # 与 .githooks/pre-commit 用的是**同一个** scripts/check-branch-guard.cjs，
  # 不另写一份「CI 专用」的分支名判断（会漂移的判据只许定义一次）。
  # --target master 由配置写死传入：判定要的是**分支名**，而流水线里的
  # CNB_PULL_REQUEST_TARGET_SHA 是 sha —— 拿它当 branch 用会静默失效。
  - name: 分支守卫
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-branch-guard.cjs --pr-check --target master

  # ── 提交声明核对（平台侧的第二个执行者，ISSUE #2070）──
  #
  # 判的是「提交信息里那句『§x.y 照旧保留』在那次提交的树里是不是真在」。这一格的
  # 存在理由不是再判一遍，而是**换一个执行者**：本地那一段（`premerge-check.mjs` 的
  # `claims` 段）只在推送那一刻跑一次，而它过去取的是**最近一次提交** —— 假声明长在
  # 批次里较早那笔上时恰好看不见（`ad81a912` 就是这么进的主干：那句话在它自己的树里
  # 不成立，`docs/standards/13` / `AGENTS.md` / `.githooks/pre-commit` 里都没有
  # §13.5.13 / §13.6.3 两节，后来才被补回来）。
  #
  # 两件事同批做掉，判据本体一字未改：
  #   · 扫描面从「最近一笔」改成 `<分叉点>..HEAD` = **本次带进来的那一批**；
  #   · 取不到分叉点时那一段记 **2（没跑起来）并说明**，不再折成 0（绿的）。
  #
  # 平台上这一格跑的是**同一个入口**（`--only=claims`），不是第二份实现 ——
  # 「目标那条线」在这里的来源是 `CNB_PULL_REQUEST_TARGET_SHA`（这台节点只 fetch
  # 协商后的单 ref，未必有 `origin/master` 这个引用名；`受影响用例` 用的是同一个），
  # 分叉点仍然要算 `merge-base`，不拿尖端充数。
  #
  # 代价（本机实测）：没有声明的提交只值一次 `git log`，30 笔 14 秒；贵的是**真带
  # 声明**的那几笔（单条约 49 秒，要对每一节 `ls-tree` + 逐份 `git show`），
  # 而一条 PR 通常 0~1 笔。墙钟给 10 分钟兜那一头。
  - name: 提交声明核对
    timeout: 10m
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/premerge-check.mjs --only=claims

  # ── 新鲜度账判决（平台侧的第二个执行者，ISSUE #1979）──
  #
  # 与本仓 `.githooks/pre-commit` 的 D 组「每档都有主」跑的是**同一份**判据
  # （`scripts/freshness-gate.mjs`，判据一字未改，只是多了一个执行者，§13.5.17 同款）。
  #
  # 为什么值得在平台侧再判一次：本地那一步只有在「提交那一刻」才会响，而平台侧是
  # **每条 PR** 都过一遍 —— 于是「这个 PR 的源分支上账是旧的」会在合并之前被机器说出来，
  # 而不是等到某个人下一次本地提交才被拦（那一次对应的修订号已经不是这个 PR 的了）。
  #
  # ⚠️ **位置必须在这条流水线的「跑法脚本」之前**，而且不是风格问题：跑法脚本
  # （`artifact-run.mjs` / `full-suite-run.mjs`）跑绿之后**会刷新自己那笔账**
  # （`scripts/.artifact-freshness.json` / `.full-suite-freshness.json`），而同一分支的
  # stage 共享同一个工作区 —— 排在它后面时这一步读到的是**刚被这一次运行改过的账**，
  # 于是「源分支上账是旧的」这件事**永远判不出来**（判据在场、结论恒放行，
  # 正是本仓最不能有的形态）。判据在 `tests/doc-check-hook-wiring.test.ts`：它把
  # 「PR 清单里凡刷新账的档都排在这一步之后」判成一条，而**此刻 PR 上一格都没有** ——
  # `生产构建` / `单元测试` / `E2E 关键流程` 三格都在每天 04:00 那一条（其中 E2E 那一格
  # 是 2026-10-19 被同一件事挤出去的，见下面那段），所以这一步读到的是源分支带进来的那份账，
  # 比原来判得更纯。纯文本 + 几次 git 调用、
  # 零依赖，放在这个位置代价是零。
  - name: 新鲜度账
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/freshness-gate.mjs
    # 秒级；给 5m 只是「卡死要早报」这条量级余量（判据本身远小于它，不需要更宽）。
    timeout: 5m

  # ── 建库 ──
  # 走 scripts/db-push.mjs —— 它复核库里到底有没有表，失败即非零退出。
  # 后面的 E2E 要真的读到库（见 e2e/smoke.spec.ts 的「数据库链路」一组），
  # 故必须放在最前。
  - name: 同步数据库表结构
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/db-push.mjs

  # ── 类型 / 静态检查 ──
  #
  # 「类型 / 静态检查」这一段的顺序里**没有先后约束**（都只读工作区、互不依赖），
  # 唯一一条有位置约束的是 `新鲜度账`（必须排在任何会刷新账的跑法脚本之前，见那一格）。
  - name: 类型检查
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node_modules/.bin/tsc --noEmit

  # ── 受影响用例（2026-10-20 新增；它的两个本地执行者同日撤销）──────────────
  #
  # 判的是「固定清单 + 这个 PR 改动牵扯到的用例」（`scripts/affected-tests.mjs` 的
  # 清单 + `run-affected-tests.mjs` 的启动与超时话术）——**判决链一个字没改**，
  # 换的只是执行者：`.githooks/pre-commit` 的 C 组与 `.githooks/pre-push` 的
  # `unitTests` 段同日撤掉（理由见那一格脚本的头注：本地这一跳在共享机上的失效形态
  # 是 forks worker 调度超时，不是用例红；实测拦下一次、隔离复跑 1116 条全绿）。
  #
  # ⚠️ 它**不是** `单元测试` 那一格（全量 + 覆盖率 + 整档凭证）的替代：那一格按
  #   §13.5.21 仍在每日档（`每日单元测试`），这一格跑的是**增量面**（本检出实测
  #   88 个用例文件 / 1116 条、几分钟量级），不刷 `整档凭证`、也不判覆盖率门槛。
  #
  # ⚠️ 入口是**跑法脚本**（`ci-affected-tests.mjs`），不是裸 vitest：它负责算改动面
  #   （PR 事件用平台给的 `CNB_PULL_REQUEST_TARGET_SHA` 三点 diff）、按
  #   `ci-load.mjs` 的现场核数收敛并发（`COMFY_PRECOMMIT_MAX_WORKERS`）、把退出码
  #   三态转出去。拿不到改动面 ⇒ 退 2（没判 ≠ 绿，§13.6.2）。
  #
  # ⚠️ 与其它格一样带 `ci-cp936-exit.mjs`：这一格红的时候要读的正是 vitest 的
  #   中文输出（哪几条超时、哪几条未校验）。
  #
  # 45m：本地同一条链 4 worker 实测约 3.5 分钟，而节点是冷工作区 + 现场编译，
  # 且并行 PR 会叠加（`lock` 只掐同一 PR 的旧跑）。与 `每日单元测试` 同档预算口径
  # —— 卡死要早报，而真跑得完的形态离它还有一个量级。
  - name: 受影响用例
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-affected-tests.mjs
    timeout: 45m

  # ── ESLint 零警告（ISSUE #2022 起恢复；停用期间的历史与两条恢复条件见下面这段）──
  # 停用期的理由（2026-10-16）：它跑得通，但那一轮它在每一格 E2E 调绿的提交里都重跑一遍，
  # 节点侧 256~274s 而**没有新信息** —— 因为当时本地钩子的 B 组每条提交都在跑同一条
  # `pnpm run lint`。**那个前提今天反转了**：钩子默认只跑 D0 形态档，本地不再跑它，
  # 于是这一格从「重复」变成「唯一执行者」。
  # 当初的两条恢复条件现在都成立：① E2E 那两格已绿；② 平台日志中文可读 —— 依据是同一台
  # 节点上 `工作区出处` 那格的读数在流水线日志里逐字可读（`[工作区出处] 出处·红 HEAD=…`），
  # 而那条通道就是下面这层 `ci-cp936-exit.mjs`（它把子进程按 UTF-8 输出，退出码原样透传）。
  # ⚠️ 恢复时**必须一起带上那层包裹**：不带它，红的时候读到的又是 GBK 乱码，
  # 而「读不出原因」正是当初退回它的那一半理由。
  #
  # ⚠️ **命令口径只有一处**（2026-10-19 订正）：这一格跑 `pnpm run lint`，**不是**
  #   `eslint .`。扫描范围（白名单目录）与参数（`--max-warnings 0` / `--cache`）收在
  #   `package.json` 的 `lint` 脚本里 —— 本地钩子的 B 组、`scripts/quality-gate.mjs`、
  #   `quality-gate.ps1` 用的都是它，这里是第四个（也是唯一一个曾经没跟上的）调用点。
  #
  #   现场（`cnb-hpl-1k5a0s6ss`）：`eslint . --max-warnings 0` 在全仓上跑满 20m、
  #   **零输出**被平台掐断（`Finished, code: 1` 来自强杀，不是规则报错）。两处口径差的
  #   两半都在那一跑里量得出来：同一跑 `类型检查` 77.3s、`重档静态判据`（本地串行实测
  #   125s）都不超两分钟，而 `eslint .` 既多扫 `docs/**` 与仓库其它 `.ts/.js` 面，
  #   又没有 `--cache` ⇒ 每个文件都按类型感知规则从头算一遍。
  #
  #   ⚠️ `--cache` 在这条路径上**恒定失效，这是已知且刻意不修的**：缓存键含
  #   `eslint.config.js` 的绝对路径，而平台每个作业都是新目录（`工作区复用读数` 已把
  #   形态定成 ①）⇒ 路径每跑都换。让它热起来要常驻工作区，而那件事的前提是
  #   `工作区出处` 那套判据先成立（见 `scripts/ci-workspace-provenance.mjs` 头注）。
  #   所以脚本里那个 `--cache` 的实际收益只在「本地同一条命令跑两次」这一档，
  #   别把节点侧的墙钟按热缓存估。
  # 命令口径已经收到 `pnpm run lint`（上面那段），但这一格**仍然撤到每日档**
  # （2026-10-19，与 `生产构建` / `单元测试` 同一档、同一个理由）：
  #
  #   · 它是这台机上仅有的几档**起一堆子进程**的格子之一（类型感知规则要真起
  #     `typescript` 宿主），而节点只有一台、没有并发旋钮 ⇒ 并行 PR 会让它的墙钟
  #     读数不可信（§13.5.21）。现场已经有过两次：`cnb-jt3-1k5071kou` 挂到 8640s，
  #     `cnb-hpl-1k5a0s6ss` 挂满 20m —— 两次都不是「规则报错」；
  #   · 与 `生产构建` 同一条取舍：PR 那一格回答的是「这次改动能不能过 lint」，
  #     而那件事在本地有执行者（`pnpm run lint` 一条命令、钩子的 B 组），
  #     平台侧再跑一遍是第二个执行者、不是第二份信息。
  #
  # 每日那一档的名字是 `每日 ESLint 零警告`，命令与这里**逐字相同**（判据
  # `tests/no-platform-ci-config.test.ts` 的 `PR_MOVED_TO_DAILY` 钉住这一对：
  # PR 清单里不许再有它、每日清单里必须有那一格、那一格点的仍是 `pnpm run lint`）。
  #
  # 恢复动作：取消下面三行注释 → 名字挪回 `COMFYAPP_CI_GATES` → 从 `COMFYAPP_CI_DISABLED_GATES`
  # 删掉 → 删掉 `.daily-gates` 里的 `每日 ESLint 零警告` 与 `COMFYAPP_CI_DAILY_GATES` 里的名字。
  # - name: ESLint 零警告
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- pnpm run lint
  #   # 实测 114s（本机 8 核，热缓存）/ 256~274s（自托管节点）。而 `cnb-jt3-1k5071kou` 上它
  #   # 挂到 **8640s**（2h24m）被 Job 上限掐掉 —— 那是节点被压死、这一步根本没在算。
  #   # 给 20m 是「量级余量」：真跑得完的形态差两个数量级，而卡死的形态 20m 就能
  #   # 报出来，不再白等两小时。**不是放宽判据**，判据本身一字未动。
  #   #
  #   # ⚠️ 这条线**不是**用来兜「口径写宽了」的：上面那段那次 `eslint .` 就正好落在里面
  #   #   —— 它挂了整整 20m 才被掐断，而不是当场红。预算按设计只回答「卡死没有」。
  #   timeout: 20m

  # ── 测试（**临时停用**，ISSUE #1959）──
  #
  # ⚠️ 这一步现在是**注释掉的**：宿主侧测试环境还没就绪（Windows 自托管节点上
  # Python 只进了 `yuedu` 会话、构建用的 `SYSTEM` 账号够不着；另有一批跑真子进程的
  # 用例在慢宿主上超预算），先把它摘掉让流水线能往下走，**等测试流程好了再加回来**。
  #
  # 停用这件事有两半、缺一半就会变成「静默删除」：
  #   · 本条目按注释形态留在这里（**别删** —— 恢复动作就是取消注释）；
  #   · 名字从 `env.COMFYAPP_CI_GATES` 摘掉、挪进 `env.COMFYAPP_CI_DISABLED_GATES`。
  # 判据 `tests/no-platform-ci-config.test.ts` 会把「停用」与「删除」分开判：
  # 只在 `DISABLED_GATES` 里登记、且这段注释仍在，才算停用；否则当场点名。
  #
  # 原来的形态（恢复时照抄下面这块，并把名字挪回 `GATES`、从 `DISABLED_GATES` 删掉）：
  #
  #   全量 vitest 只跑**一遍**（`test:coverage` 一次运行即产出覆盖率报告，
  #   判据强度不变，阈值仍由 vitest.config.ts 的目录阈值守着）。
  #
  #   **并发由 `scripts/ci-load.mjs` 按**现场核数**算（ISSUE #1993 / 规范 §13.5.21），
  #   不是写死的 4，也不吃配置里那个 8**：这条件路径与本地跑不是同一种负载。
  #   ① 宿主机 16 逻辑核（无 docker、整机可用），vitest 若照默认铺开就有 ~15 个 worker；
  #   ② `--coverage` 给每个文件都加一层插桩（本机实测同样两文件 6.2s → 9.2s，约 +50% CPU）；
  #   ③ 这一套里有大量**真起子进程**的用例（git / node / prettier / PowerShell），超订的
  #      那一份直接从「等 CPU」变成「等子进程」—— 表现是 `Test timed out in 30000ms`，
  #      而单跑全绿。**这正是本仓已经量过的那一格**（规范 §11.13）：同一套、同一台机器，
  #      `maxWorkers=8` 在负载下仍出争用形态的红，`--maxWorkers=4` 才拿到「560 文件全绿」。
  #   降并发是**降负载**，不是放宽判据 —— 用例、预算、覆盖率阈值一个字不动；
  #   与 `.githooks/pre-commit` 的 C 组同一条理由（AGENTS 硬规则里那句
  #   「降负载的杠杆是并发，不是预算」）。代价是墙钟变长，这是这条路径上买得到的唯一交换。
  #
  #   ⚠️ **为什么不再写死 4**：`runner.cpus` 在自托管上是无效旋钮（官方文档原文见文件头
  #   第 2 条），平台也不给「同时跑几条」的旋钮 —— 那么配置里那个常数就与「这台机现在
  #   几个核」**没有任何联系**。节点换规格、或同一台机上多了第二条流水线时，它照旧按
  #   16 核铺开，现场形态是「既不推进也不报错」。现在由 `scripts/ci-load.mjs` 从
  #   `CNB_CPUS` 与 `os.availableParallelism()` 读现场核数、按「一个 worker 至少 4 核」
  #   折算（唯一出处，判据见 `tests/ci-load.test.ts`；人还能用
  #   `COMFY_CI_MAX_WORKERS=1` 再压一档）。
  #
  #   ⚠️ **恢复时入口写 `scripts/full-suite-run.mjs`，不是裸 vitest**（ISSUE #1979）：
  #   它内部是 `pnpm run test:coverage`（= `vitest run --coverage`，见 `planRun()`），
  #   而外面多出来的那一跳是**记账** —— 跑绿即刷新 `scripts/.full-suite-freshness.json`。
  #   裸写 vitest 时这一步的绿只落在日志里、账面上一个字不变，本地「改了就当天跑」
  #   那条判据照旧拦人（判据与账是两件事，两个执行者要读到同一份事实）。
  #   本档在平台侧**必须整档跑**（不带 `--grep` / 不指单个文件）：`isWholeTrackRun`
  #   会把「透传了参数的绿」判成**不构成整档凭证**、当场不记账。
  #   用法与边界见 scripts/full-suite-run.mjs 头注与规范 §13.5.4。
  #
  # ⚠️ 这一格**留在注释形态 = 停用**（名字在 `COMFYAPP_CI_DISABLED_GATES` 里，两处同批才成立）。
  #   本批一度把它取消注释当「重档挪到 CI」的承接者，随后撞上并行会话那条决定：会自己起
  #   一堆子进程的那两档只在每天 04:00 那一跑（§13.5.21）—— 同一台机上并行 PR 会把带超时的
  #   读数变成不可信的红，而它跑绿还要刷 `整档凭证`，拿并发下的绿去刷那张账比不刷更坏。
  #   ⇒ **全量**单测归 `每日单元测试`；**增量**那一档（受影响用例）2026-10-20 起由本文件里的
  #   `受影响用例` 一格执行（跑增量面、不刷整档凭证），本地两个执行者同日撤销。
  #   恢复前提：平台能给这一格一条不与并行 PR 争抢的执行环境（那才是这条决定的边界，不是判据）。
  # - name: 单元测试
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/full-suite-run.mjs
  # 实测 827s（`cnb-eus-1k5058g8l`，755 文件全量绿）；本机 `--maxWorkers=4` 实测
  # 198s。而 `cnb-did-1k50659np` 上它挂到 **8640s**（2h24m）才被掐掉，留下的
  # 只有 `timeout of 8640000ms exceeded` —— 一条失败原因都读不到。
  # 给 45m：真跑得完的形态差三倍余量，卡死的形态 45m 报出来。
  # timeout: 45m

  # ── 结构 / 一致性硬规则（与 .githooks/pre-commit 同一批脚本）──
  # ⚠️ `ifModify` 的第一处示例（本档共 17 处，全部登记在
  # `scripts/ci-incremental-gates.mjs`）：它只扫 `src/components` + `src/app`，
  # 本次改动一个文件都没落在这两处时跳过。**每加一处都必须同批登记** ——
  # 判据 `tests/ci-incremental-gates.test.ts` 双向核对，机制见上面 `.gates` 头注。
  - name: 标题行让位
    ifModify:
      - src/components/**
      - src/app/**
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-title-bar-clearance.cjs

  # 收窄（ISSUE #2010）：它扫的是**盘上的某一组目录**，不是整仓 —— 根目录里散落的
  # 入口脚本（R9 的第一形态）与 git 临时状态文件（第二形态）只可能出现在**仓库根**，
  # 而 src/lib 的子域纪律（R13/R14）只可能被 `src/lib` 的目录改动破坏。这几处一个
  # 都没碰时，「文件名 / 归属 / 注释流水 / 控制字符」这些判据不可能变。
  #
  # ⚠️ 与上面那些只扫 `src/**` 的判据不同，它的形态更复杂，所以 globs 点得更宽：
  #   · 根级 `*.ps1 / *.bat / *.cmd / *.vbs / *.ts / *.tsx` —— R9 判的是「根目录里
  #     多了个本该归 tools/ 的入口」，面就是根目录本身（不经 `src` / `scripts`）；
  #   · `src/**` —— R1–R5 / R10–R12 的扫描根（`SCAN_ROOTS` 之一）；
  #   · `scripts/**` + `tools/**` —— R7 / R8 的扫描根（含中文的 .ps1 必须 BOM）。
  # 代价写在明处：**新增一条以别的目录为扫描根的规则时，必须同批回来看这一行**
  # （否则改那个目录不会触发本步）。登记与理由的唯一出处是
  # `scripts/ci-incremental-gates.mjs`。
  - name: 文件结构硬规则
    ifModify:
      - "*.ps1"
      - "*.bat"
      - "*.cmd"
      - "*.vbs"
      - "*.ts"
      - "*.tsx"
      - src/**
      - scripts/**
      - tools/**
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-file-structure.cjs

  - name: 跨平台动作对照
    ifModify:
      - package.json
      - tools/**
      - scripts/**
      - src-tauri/**
      - README.md
      - docs/standards/launch-and-build.md
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-ps1-consistency.mjs

  - name: import 别名统一
    ifModify:
      - src/**
      - e2e/**
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-import-alias.cjs

  - name: ComfyUI 端口口径
    ifModify:
      - src/lib/comfyui/**
      - src/lib/app-settings/**
      - src/lib/endpoints.ts
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-comfyui-port-contract.cjs

  - name: 内联样式注入
    ifModify:
      - src/**
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-inline-style.cjs

  - name: 跨文件重复块
    ifModify:
      - src/**
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-code-duplication.cjs

  - name: 函数长度 TS
    ifModify:
      - src/**
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-function-length.cjs

  - name: 函数长度 Rust
    ifModify:
      - src-tauri/src/**
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-rust-function-length.cjs

  - name: 模块循环依赖
    ifModify:
      - src/**
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-circular-deps.cjs

  # 收窄（ISSUE #1993）：它判的是「同一份向量 ⇄ 四侧实现」的一致性，四侧实现各有落点
  # （`scripts/app-port.mjs` / `app_port.py` / `app-port.ps1` / `src-tauri/src/single_instance.rs`），
  # 而向量只有一份（`tests/fixtures/app-port-vectors.json`）。这几处一个都没碰时，
  # 「四侧对同一路径给出同一端口」这件事不可能变 —— 它不读 `src/**` 的其余部分。
  - name: 端口推导跨语言一致性
    ifModify:
      - scripts/app-port.mjs
      - scripts/app-port.ps1
      - scripts/app_port.py
      - scripts/check-app-port-vectors.cjs
      - scripts/check-app-port-vectors.py
      - scripts/check-app-port-vectors.ps1
      - src-tauri/src/single_instance.rs
      - tests/fixtures/app-port-vectors.json
