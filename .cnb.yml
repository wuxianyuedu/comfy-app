# CNB 云原生构建流水线 —— 跑在**根组织自托管 Windows 节点**上（ISSUE #1959）
#
# 这份配置是 ISSUE #623「平台侧用不起、配置删除」的**一次决策反转**，反转的
# 依据是一条前提被推翻：自托管 Runner 走宿主机、不参与核时计费。官方文档
# （docs.cnb.cool/zh/build/build-node.html「限制」一节）原文：
#
#   「自定义 Runner 默认不开启 Docker 能力，构建脚本直接运行在宿主机上，因此：
#     runner.cpus 配置无效……不参与核时计费。」
#
# 而 #623 的全部推理都建立在计费上（160 核时/月 ÷ 8 核 = 一个月约二十次 PR）。
# 计费项没了，那条结论对这条件路径不再成立。**但反转的不只是「能不能跑」**，
# 还有下面这几条形态变化 —— 它们才是这份文件与旧版差别最大、也最容易踩的地方。
#
# ── 与旧版（Linux 平台池 + docker.image）的五条形态差异 ──────────────────
#
# 1. **没有 docker，工具链必须预装在宿主机上**。旧版靠 `docker.image: node:24`
#    提供 Node，这条路在自托管上失效（`pipeline.docker.image` 不会生效）。
#    因此本文件**不声明任何 docker / image / volumes**，而是把「宿主机该有什么」
#    变成第一条流水线步骤去**验**（见下「工具链自证」）—— 环境要求写进配置里
#    没人读，写成会红的断言才有人管。
#
# 2. **`runner.cpus` 无效，故不声明**。旧版写 `cpus: 8` 是为了「避免分配到的节点
#    规格随扩缩容变化把耗时读成回归」，而自托管上整机资源直接可用、这个键被忽略；
#    留着它只会让人以为核数被控制了。
#
# 3. **脚本语言是 PowerShell，不是 POSIX sh**。自托管 Windows 上 stage script
#    默认走 PowerShell，旧的 `rm -rf` / `mkdir -p` / `diff -q` / `>/dev/null` 一律
#    不成立（`rm` 是 Remove-Item 的别名，但没有 `-rf`；`mkdir -p` 会被当成字面参数）。
#    本文件里凡涉及文件系统 / 分支流程的地方都写成 PowerShell 原生的样子。
#
# 4. **OverlayFS 不可用，秒级克隆降级为普通 git clone**。每一次构建都是全量 clone，
#    这是这条件路径的固定成本，没有配置能省掉它。
#
# 5. **节点离线会静默改派**。文档原文：节点「离线、被临时禁用，或资源使用达到上限」
#    时系统会自动尝试重新分配到其他可用节点，实在没有才失败。在自托管这一档上
#    「其他可用节点」就是计费的平台池 —— 于是最坏情况是**悄悄花回核时**，而没有任何
#    报错。诊断靠日志里那一行 `runner.namespace` / 实际标签，见 §13.5.3 的「怎么确认
#    真的跑在自托管上」。
#
# ── 两条流水线：谁在什么事件上跑 ────────────────────────────────────────
#
#   质量门禁        pull_request（不合并就不该结束）
#   master 合并复核  push（只复核「确实是 PR 合并进来的」，不重跑全套）
#
# push 不重跑全套的理由与旧版相同（合并提交由平台按**已验过的源分支 SHA** 生成、
# 不引入新代码），但今天它不再是「省额度」，而是「省一遍没有新信息的运行时间」。
#
# ⚠️ **`&common` 锚点里刻意不含 stages**：`<<: *pipeline` 会把 stages 一起带过去，
# 那正是「push 也跑整套门禁」的来源（详见 git 历史里 55bc9b36 的立案说明）。
# 覆盖根键时锚点里的键会被整体替换，故每个事件都写出完整形态。

.common: &common
  runner:
    # group = 当前仓库所属根组织下的自托管构建节点（不是平台公共池）。
    # 漏掉这一行会退化成平台池 —— 那时核时重新开始计费，而配置看起来完全一样。
    namespace: group
    # 「与」关系：列出的每个 tag 都必须出现在节点标签上。当前节点声明的标签是 win。
    tags:
      - win
  retries: 0
  env:
    # 与旧版对齐：构建机上没有真实密钥，用占位值过 src/env.js 的校验。
    # BETTER_AUTH_SECRET 必须一并注入 —— SKIP_ENV_VALIDATION 只绕过 src/env.js，
    # 绕过不了 better-auth 自己的生产校验（缺失 → 退回 DEFAULT_SECRET 抛错 →
    # createTRPCContext() 抛错 → 所有 authedProcedure 全灭，设置页整页读不出来）。
    # 该值只用于构建期冒烟，不参与任何真实部署。
    SKIP_ENV_VALIDATION: "1"
    BETTER_AUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
    # 避免 corepack 在非交互环境下为拉取 pnpm 版本而等待输入。
    CI: "true"

# 门禁清单。
# ⚠️ 它**没有**「清单逐条核对」那类判据捧着 —— `tests/cnb-pipeline-gates.test.ts` 已随
# 旧版 `.cnb.yml` 一并删除（#623），本 PR 不复活它（它锁的是旧版那三十步与上报插件，
# 两样在自托管上都不成立）。守着这份文件的现有判据只有 `tests/no-platform-ci-config.test.ts`
# 那一条**形态**判据（分支键 / `namespace: group` / 非空 `tags` / 两个事件键），
# **条目本身的增删不报错** —— 所以这里的每一步都要靠人逐条核对，别指望它会红。
.gates: &gates
  # ── 工具链自证（自托管特有：没有 docker 镜像兜底，装没装由这一步说了算）──
  # 这段是本文件存在的**前提**，不是可选的自检：宿主机缺 Node / pnpm / git 时，
  # 后面每一步都会以看不懂的方式失败（`pnpm: not recognized`、corepack 拉版本超时），
  # 排障成本远高于在这里花三秒正面回答。失败即非零退出 —— 它必须会红。
  - name: 工具链自证
    script: |
      $ErrorActionPreference = "Stop"
      Write-Host "== OS =="
      cmd /c ver
      Write-Host "== git =="
      git -v
      Write-Host "== node =="
      node -v
      # engines.node = ^22.22.2 || ^24.15.0 || >=26.0.0（与旧版同一口径）
      Write-Host "== pnpm =="
      pnpm -v
      Write-Host "== python =="
      # Python 是门禁链的真实依赖，不是可选件：scripts/check-app-port-vectors.cjs
      # 要调 scripts/check-app-port-vectors.py 做四语言一致性比对，几处用例拿它验
      # zip 包（python 的 zipfile 是最严格的解压端）。缺了它的形态是**静默少判**
      # 而不是报错 —— 那一侧会被 check-app-port-vectors.cjs 归进 `missing` 档、
      # 「以这台机器探测不到 Python 的名义」退出四向比对；`log-run-layout` 与
      # `logs/diagnostics/route` 则直接 `spawnSync python3 ENOENT`；
      # E2E `@critical` 的假 comfy-cli 就是一个 Python 包，没有解释器时执行器起不来。
      #
      # **探测面必须与门禁同口径**（#1959 第二轮首跑现场：这一步曾写成裸的一行
      # `python -V`，而这台机器上 `python3` / `python` 都没有 —— 于是第 8 秒就在这里
      # 红掉、排在后面的 27 个 stage 一个都没跑，红的位置与门禁要回答的问题无关）。
      # 依次试 `python3` / `python` / `py`，第一个答得上的算过；Windows 上 `py` 带
      # `-3`（裸 `py` 是「列出已装版本」并退非零）。
      $python = $null
      foreach ($cand in @("python3", "python", "py")) {
        if (-not (Get-Command $cand -ErrorAction SilentlyContinue)) { continue }
        # 真起一次进程取版本 —— Microsoft Store 的占位别名 `python.exe` 在盘上、
        # 但 `--version` 退非零，那正是要判的形态（命令在、不是可用解释器）。
        # `try` 与 `2>&1` 都要：`$ErrorActionPreference = "Stop"` 会把原生命令的
        # 非零退出不当地抬成终止错误，这里必须按「退出码」判而不是按异常判。
        $pyArgs = if ($cand -eq "py") { @("-3", "--version") } else { @("--version") }
        try {
          $out = & $cand @pyArgs 2>&1
          $code = $LASTEXITCODE
        } catch { $out = $_.Exception.Message; $code = 1 }
        if ($code -eq 0) { $python = $cand; Write-Host "$cand : $out"; break }
        Write-Host "$cand 在盘上但 --version 退 $code（不是可用解释器）" -ForegroundColor Yellow
      }

      # 找不到就**当场装**（自托管最大的成本是「这台机器要自己维护」，而它不会因为
      # 少装了什么就报错 —— 只好把「既判也装」写在这里）。winget 是 Windows 11 自带的，
      # 按用户安装不需要管理员权限。
      if (-not $python) {
        Write-Host "== Python：未发现，尝试用 winget 安装（按用户，无需管理员）=="
        # winget 本身不在（老版本 / 精简镜像）或装失败都不该在这里抛 —— 失败要让下面
        # 那条「装完仍找不到」的判定去说，而不是让一个 `CommandNotFoundException`
        # 把话术顶掉（`$ErrorActionPreference = "Stop"` 下它照样会终止脚本）。
        # winget 常常在盘上但**不在这个会话的 PATH 上**（`WindowsApps` 那条按用户
        # 追加的路径要新会话才生效，而构建用户往往是非交互的）。先按标准落点再找一遍 ——
        # 实测这台节点就是这一档（`Get-Command winget` 找不到，可 `WindowsApps` 里有）。
        # ⚠️ **不许用空条件运算符**（问号接点号，C# 7 / PowerShell 7 才有）——
        # 自托管默认宿主是 Windows PowerShell 5.1，它不认这个语法，整段会以
        # 「表达式或语句中包含意外的标记」当场报错（实测：这一跑就是这么红的）。
        # `Get-Command` 找不到时会返回 $null 并把错误吞在 `-ErrorAction` 里，
        # 取 `.Source` 因此要先判空。
        $found = Get-Command winget -ErrorAction SilentlyContinue
        $winget = $null
        if ($found) { $winget = $found.Source }
        if (-not $winget) {
          $cand = Join-Path $env:LOCALAPPDATA "Microsoft\WindowsApps\winget.exe"
          if (Test-Path $cand) { $winget = $cand }
        }
        try {
          if ($winget) {
            Write-Host "（用 $winget 安装）"
            & $winget install --id Python.Python.3.12 --scope user --silent `
              --accept-package-agreements --accept-source-agreements
          } else {
            Write-Host "（盘上也没找到 winget，跳过自动安装）"
          }
        } catch {
          Write-Host "（winget 安装失败：$($_.Exception.Message)）"
        }
        # 新装的可执行文件会落进用户 PATH，而**本进程的环境早于安装**：
        # 按默认安装根各再找一遍，不要指望当前会话的 PATH 自己刷新。
        $roots = @(
          (Join-Path $env:LOCALAPPDATA "Programs\Python"),
          (Join-Path $env:ProgramFiles "Python")
        )
        foreach ($root in $roots) {
          if (-not (Test-Path $root)) { continue }
          foreach ($name in @("python", "python3")) {
            $hit = Get-ChildItem -Path $root -Filter "$name.exe" -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
            if ($hit) { $python = $hit.FullName; break }
          }
          if ($python) { break }
        }
      }

      if (-not $python) {
        # 失败即非零退出 —— 这一步的全部意义就是「会红」，见文件头第 1 条。
        # 红的同时必须给出**下一动作**：这台机器上「装了 Python 却没进 PATH」
        # 与「压根没装」在 PowerShell 里长得一模一样，而两者的处置不同。
        #
        # 所以先把**这个执行账号到底看得见什么**打出来 —— 这一跑就是取证现场。
        # 触发它的现场（#1959 第三轮）：同一台机器上有人在自己的会话里跑出
        # `python -V` → `Python 3.12.2`，而这里报「一个都没有」。两者不矛盾，
        # 是**执行身份不同** —— Runner 以服务/代理账号跑、用的是机器 PATH，而
        # python.org 安装包的默认选项「Install for me only」只写进**安装者那个
        # 用户的** PATH。两种情形（装过但这个账号看不见 / 真的没装）在日志里逐字
        # 同形，处置却相反：位置命中而探测不到命令 ⇒ 改这个账号的 PATH，**别重复装**；
        # 位置也没命中 ⇒ 才是这台机真没装。少了这份打印，两者都只能猜。
        Write-Host "---- python 探测现场（供定位，非报错）----"
        Write-Host "执行账号: $([System.Security.Principal.WindowsIdentity]::GetCurrent().Name)"
        Write-Host "PATH 条目:"
        $env:PATH -split ";" | Where-Object { $_ } | ForEach-Object { Write-Host "  $_" }
        Write-Host "常见安装位置在盘上的（有则说明装过、只是这个账号 PATH 里没有）:"
        # 比上面那次回找多两个根（ProgramFiles(x86) 与 machine-wide 的 ProgramData）——
        # 取证要覆盖「别人装在了哪」，而不只是「我们指望它装在哪」。
        $hits = @()
        foreach ($p in @(
          (Join-Path $env:LOCALAPPDATA "Programs\Python"),
          (Join-Path $env:ProgramFiles "Python"),
          "${env:ProgramFiles(x86)}\Python",
          "$env:ALLUSERSPROFILE\Python"
        )) {
          $found = Get-ChildItem -Path $p -ErrorAction SilentlyContinue -Directory |
            Select-Object -ExpandProperty FullName
          if ($found) { $hits += $found }
        }
        if ($hits.Count -eq 0) { Write-Host "  （一个都没找到 —— 更像「这台机真的没装」）" }
        else { $hits | ForEach-Object { Write-Host "  $_" } }
        Write-Host "----------------------------------------"
        Write-Host "!! 宿主机上没有可用的 Python（试过 python3 / python / py，自动安装也没成）" -ForegroundColor Red
        Write-Host ""
        Write-Host "   **平台侧人工动作**（与「节点标签要对得上 runner.tags」同一类）：" -ForegroundColor Yellow
        Write-Host "   在这台自托管节点上装 Python 3（≥3.10），并确认它在这个构建用户的 PATH 上。"
        Write-Host "   用 python.org 安装包时勾选「Add python.exe to PATH」；"
        Write-Host "   只有 py 启动器（Store 版）也算 —— 本步会认它（带 -3）。"
        Write-Host "   装完重跑本流水线即可，其余步骤都不需要再动。"
        Write-Host ""
        Write-Host "   为什么不让它「少判就算了」：E2E @critical 的主链路（登录 → 建项目 →"
        Write-Host "   出图）走的就是一个 Python 包（假 comfy-cli），没有解释器时那几条用例"
        Write-Host "   只会以「执行器起不来」失败 —— 与其让它们以看不懂的方式红，不如在这里"
        Write-Host "   正面回答。清单与背景见 docs/standards/13-提交与-code-review.md §13.5.3.5。"
        exit 1
      }

  # ── 安装 ──
  # 门禁用 pnpm（AGENTS 硬规则 1：npm 11 在本项目解析 typescript 别名链会崩）。
  # --frozen-lockfile 保证装的就是锁文件里的版本。
  # 刻意**不**开 corepack enable：自托管宿主机上 pnpm 是预装的，corepack 在
  # 非交互环境里为解析 packageManager 去拉版本会挂住；裸 `pnpm -v` 的上一步
  # 已经证明它可用。
  - name: Install dependencies
    script: |
      $ErrorActionPreference = "Stop"
      pnpm install --frozen-lockfile

  # ── 分支保护 ──
  # 守在最前：分支不对时后续检查的结果最后都会被丢弃（与 pre-commit 同序）。
  # 与 .githooks/pre-commit 用的是**同一个** scripts/check-branch-guard.cjs，
  # 不另写一份「CI 专用」的分支名判断（会漂移的判据只许定义一次）。
  # --target master 由配置写死传入：判定要的是**分支名**，而流水线里的
  # CNB_PULL_REQUEST_TARGET_SHA 是 sha —— 拿它当 branch 用会静默失效。
  - name: 分支守卫
    script: node scripts/check-branch-guard.cjs --pr-check --target master

  # ── 建库 ──
  # 走 scripts/db-push.mjs —— 它复核库里到底有没有表，失败即非零退出。
  # 后面的 E2E 要真的读到库（见 e2e/smoke.spec.ts 的「数据库链路」一组），
  # 故必须放在最前。
  - name: 同步数据库表结构
    script: node scripts/db-push.mjs

  # ── 类型 / 静态检查 ──
  - name: 类型检查
    script: node_modules/.bin/tsc --noEmit

  - name: ESLint 零警告
    script: node_modules/.bin/eslint . --max-warnings 0

  # ── 测试 ──
  # 全量 vitest 只跑**一遍**（`test:coverage` 一次运行即产出覆盖率报告，
  # 判据强度不变，阈值仍由 vitest.config.ts 的目录阈值守着）。
  #
  # **显式 `--maxWorkers=4`，不是配置里那个 8**：这条件路径与本地跑不是同一种负载。
  # ① 宿主机 16 逻辑核（无 docker、整机可用），vitest 若照默认铺开就有 ~15 个 worker；
  # ② `--coverage` 给每个文件都加一层插桩（本机实测同样两文件 6.2s → 9.2s，约 +50% CPU）；
  # ③ 这一套里有大量**真起子进程**的用例（git / node / prettier / PowerShell），超订的
  #    那一份直接从「等 CPU」变成「等子进程」—— 表现是 `Test timed out in 30000ms`，
  #    而单跑全绿。**这正是本仓已经量过的那一格**（规范 §11.13）：同一套、同一台机器，
  #    `maxWorkers=8` 在负载下仍出争用形态的红，`--maxWorkers=4` 才拿到「560 文件全绿」。
  # 取 4 是**降负载**，不是放宽判据 —— 用例、预算、覆盖率阈值一个字不动；
  # 与 `.githooks/pre-commit` 的 C 组同一个数、同一条理由（AGENTS 硬规则里那句
  # 「降负载的杠杆是并发，不是预算」）。代价是墙钟变长，这是这条路径上买得到的唯一交换。
  - name: 单元测试
    script: node_modules/.bin/vitest run --coverage --maxWorkers=4

  # ── 结构 / 一致性硬规则（与 .githooks/pre-commit 同一批脚本）──
  - name: 标题行让位
    script: node scripts/check-title-bar-clearance.cjs

  - name: 文件结构硬规则
    script: node scripts/check-file-structure.cjs

  - name: 跨平台动作对照
    script: node scripts/check-ps1-consistency.mjs

  - name: import 别名统一
    script: node scripts/check-import-alias.cjs

  - name: ComfyUI 端口口径
    script: node scripts/check-comfyui-port-contract.cjs

  - name: 内联样式注入
    script: node scripts/check-inline-style.cjs

  - name: 跨文件重复块
    script: node scripts/check-code-duplication.cjs

  - name: 函数长度 TS
    script: node scripts/check-function-length.cjs

  - name: 函数长度 Rust
    script: node scripts/check-rust-function-length.cjs

  - name: 模块循环依赖
    script: node scripts/check-circular-deps.cjs

  - name: 端口推导跨语言一致性
    script: node scripts/check-app-port-vectors.cjs

  - name: CHANGELOG 碎片
    script: node scripts/check-changelog-fragments.cjs

  - name: 主题色扫描
    script: node scripts/check-theme-colors.cjs

  - name: UI/逻辑分离
    script: node scripts/check-ui-logic-separation.cjs

  - name: lib Node-only 声明
    script: node_modules/.bin/vitest run tests/lib-node-only-declarations.test.ts

  - name: prettier 格式
    script: node scripts/check-format.cjs

  - name: 格式化提交分离
    script: node scripts/check-reformat-only.cjs

  - name: core 骨架单一事实源
    script: node_modules/.bin/vitest run tests/single-logger-channel.test.ts tests/container-single-access.test.ts tests/core-spine-single-source.test.ts

  - name: 零消费导出
    script: node scripts/check-dead-exports.cjs

  - name: core 出口纪律与基类纯度
    script: node_modules/.bin/vitest run tests/core-barrel-entry-discipline.test.ts tests/repository-base-purity.test.ts

  # ── 构建与产物 ──
  # `pnpm build` 内部已经串了 next build → 剥私有输入 → 数产物 → 冒烟，
  # 不再另拼一遍（与 §13.5.3 那张表里记的同一入口）。
  - name: 生产构建
    script: pnpm run build

  # ── E2E（仅 @critical 关键流程）──
  - name: E2E 关键流程
    script: node scripts/e2e-run.mjs --grep @critical

master:
  # PR 端的全套门禁：PR 不合并就不该结束，这里一步不省。
  pull_request:
    - <<: *common
      name: 质量门禁
      stages: *gates

  # 合并后的 push：不重跑全套。合并提交由平台按**已被门禁验过的源分支 SHA**
  # 生成，不引入新代码；保留的这条是形态复核 —— 落到 master 的必须是 PR 合并
  # 形态。若出现非合并提交（本地 --no-verify 就能做到），说明有变更绕过了 PR
  # 与门禁，那要拦下。
  push:
    - <<: *common
      name: master 合并复核
      stages:
        - name: 合并形态复核
          script: node scripts/check-branch-guard.cjs --merge-commit
