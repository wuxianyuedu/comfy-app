  #   ⚠️ 代价是同一句论证里的另一半分：`00:00` 也正是这台机**最可能还在被人用**的时刻，
  #   而 §13.5.21 把重档放到每日那一跑的理由恰恰是「没有并发的 PR、机器是空的」。
  #   先按 §13.5.3.10 那张叠读数量具表定性；而「红了谁第一时间看见」也从「上班时」
  #   ⚠️ 当年那半句「又避开整点那一档」没有做到（分钟段就是 `0`），这次不把它抄过来当依据。
  #   ⚠️ 「几点」本身没有判据在守：`tests/no-platform-ci-config.test.ts` 只认「分钟段与小时段是
  # 判据一个字都没在这里重写 —— 重写一遍得到的就是「两条产物链各自漂」（§12.12）。
  # ⚠️ **不在这里跑全套门禁**：那是 `pull_request` 那条流水线的事。定时任务的价值是
master:
  # PR 端的全套门禁：PR 不合并就不该结束，这里一步不省。
  pull_request:
    # ── 质量门禁（平台池 · #3478 起）─────────────────────────────
    # 自托管节点的算力与缓存对它们已经没有对象（#3474 评估：主列只剩一格时，留在
    # ⚠️ 锁仍叫 `pr-$CNB_PULL_REQUEST_IID`：它是这把钥匙现在唯一的用户
    - name: 质量门禁
      runner:
        # 平台池 = 云托管 Linux 节点（不写 namespace: group 就是它）。
        tags:
          - cnb:arch:amd64
        # 站内轮询 + 立案都是网络 IO 动作，CPU 密集部分只有 node 启动；
        # 与镜像出口同一份四档实测结论（#3429）⇒ 取核时最小的 1 核。
        cpus: 1
      docker:
        build:
          dockerfile: .cnb/ci-image/Dockerfile
          versionBy: .cnb/ci-image/Dockerfile
      lock:
        key: pr-$CNB_PULL_REQUEST_IID
        cancel-in-progress: true
      stages: *gates
      endStages:
        - name: PR 失败立案
          script: node scripts/ci-pr-failure-issue.mjs --no-block
          # 5m：三次读命令（列表 / 逐格详情 / 逐格日志，后者最多三格）+ 一次写 + 一次回读。
          # 取不到读数时它**不重试也不写**，退 2 由话术说出来（形态理由见上方立案叙述块）。
          timeout: 5m

    # ── GitHub 镜像同步（平台池 · 正式出口）──────────
    # 按 #3378 后续指令：自托管主列那格停用，推送与派发**整个**由这一条
    # 平台池流水线承担（判据由 `tests/no-platform-ci-config.test.ts` 的质量门禁段
    # 逐条钉住；「GA 回调没终态 ⇒ 判红」的 fail-closed 承重锚一字未动，§13.6）。
    # ⚠️ 锁**不**共用 `pr-$CNB_PULL_REQUEST_IID`：锁是跨流水线的，同一把 key +
    - name: GitHub 镜像同步（平台池）
      # 流水线名带「（平台池）」后缀：与 `质量门禁` 里那条**停用的同名 stage**
      # 区分开，也和 #3346 实验期的名字划清。下面的 stage 仍叫 `GitHub 镜像同步` ——
      # `check:mirror-attendance` / `每日镜像出勤立案` 按格名认出勤，换机器不换名，
      # 出勤读数才不断档。
      runner:
        # 平台池 = 云托管 Linux 节点（不写 namespace: group 就是它；主列的 runnerShape
        # 判据仍按 `.common` 锚点读，不受这一条影响）。
        tags:
          - cnb:arch:amd64
        # 这一格是网络 IO 动作（git 探活 / 推送 / LFS / 派发），CPU 密集部分只有
        # node 启动与 git 压缩；平台池缺省 8 核（memory = 核数 × 2 GiB）对它过配，
        # 而核时计费 = 核数 × 时长 ⇒ 显式取 1 核。实测 1 / 2 / 4 / 8 核四档的
        # 格耗时都在 egress 抖动区间内、无核数敏感度（读数与 sn 记在案单里），
        # 故取核时最小的那一档。
        cpus: 1
      docker:
        # git-lfs 预装进镜像：平台按这份 Dockerfile 构建临时镜像并按 versionBy 缓存
        # （文件不变就不重建）—— 取代原先「每跑 apt-get 装一遍」的那一格。
        build:
          dockerfile: .cnb/ci-image/Dockerfile
          versionBy: .cnb/ci-image/Dockerfile
      lock:
        key: mirror-pr-$CNB_PULL_REQUEST_IID
        cancel-in-progress: true
      imports:
        - https://cnb.cool/moon-read/GITHUB_MIRROR_TOKEN/-/blob/main/envs.yml
      stages:
        - name: GitHub 镜像同步
          script: node scripts/ci-github-mirror-push.mjs
          # 10m 外框包住最坏账（推送 240s + 回读 + LFS 60s）与冷启动余量；
          # 与自托管主列那格同一份重试预算（常量在 `ci-mirror-retry-policy.mjs`）。
          timeout: 10m

  # 合并后的 push：**不重跑全套**（全套是 PR 那条的事；「不引入新代码」的前提依旧 ——
  push:
    - name: GitHub master 镜像（平台池）
      # 与 PR 档的「GitHub 镜像同步（平台池）」同一形态：自托管节点到 github.com
      # ⚠️ 不与 `master 合并复核` 共用锁：两件事各自要结论，一把锁只挡
      # 承重 / 兜底：push 不拦合并。失败出口 = 本流水线自己的 error 落进 push build
      runner:
        # 平台池 = 云托管 Linux 节点（不写 namespace: group 就是它）。
        tags:
          - cnb:arch:amd64
        # 与 PR 出口同一份网络 IO 动作（git 探活 / 推送 / LFS，`--master` 只是不派发），
        # CPU 密集部分只有 node 启动与 git 压缩；平台池缺省 8 核（memory = 核数 × 2 GiB）
        # 对它过配，而核时计费 = 核数 × 时长 ⇒ 显式取 1 核。依据是 #3429 在 PR 出口上的
        # 1 / 2 / 4 / 8 核四档实测：格耗时都在 egress 抖动区间内、无核数敏感度，
        # 同一脚本同一性质 ⇒ 结论适用，取核时最小的那一档。
        cpus: 1
      docker:
        build:
          dockerfile: .cnb/ci-image/Dockerfile
          versionBy: .cnb/ci-image/Dockerfile
      lock: *lock_push_mirror
      imports:
        - https://cnb.cool/moon-read/GITHUB_MIRROR_TOKEN/-/blob/main/envs.yml
      # 立案格与镜像出口同跑（#3378 起内联在这一条的 endStages）。`--lane push`
      # ⚠️ 这一条在**平台池 Linux 容器**里：脚本要用 `sh` 语法，不许带自托管那句
      # `=[Text.Encoding]::UTF8: not found` 当场退 127，#3453）。同理不包
      endStages:
        - name: push 失败立案
          script: node scripts/ci-pr-failure-issue.mjs --no-block --lane push
          timeout: 5m
      stages:
        - name: GitHub master 镜像
          script: node scripts/ci-github-mirror-push.mjs --master
          # 10m 外框包住最坏账（推送 240s + 回读 + LFS 60s）与冷启动余量；
          # 与 PR 出口同一份重试预算（常量在 `ci-mirror-retry-policy.mjs`）。
          timeout: 10m

  # ── 定时档的执行者已从这台机迁到 GitHub Actions ──────────────────────────────
  # ⚠️ 下面的手动 / API 触发口**刻意保留**：它们不自动触发，不占机器；只在有人
  # ⚠️ 也不留一条「空的 crontab」占位：平台不报错、只是永远不触发，而配置看上去

  # ── 手动触发那一条：与 01:37 那一跑**同一份七格**（按钮在 `.cnb/web_trigger.yml`）──
  # ⚠️ 两件事仍然不同，别把它们读成一件事：
  web_trigger_daily:
    - <<: *common
      name: 每日档（手动触发）
      lock: *lock_daily
      stages: *daily_gates

  # ── 第三个触发口：CLI / API —— 与上面两条**同一份七格** ──
  #   · **事件名不许改名成别的形状**：`api_trigger` 开头是**服务端的硬要求**，写成
  api_trigger_daily:
    - <<: *common
      name: 每日档（API 触发）
      lock: *lock_daily
      stages: *daily_gates

  # ── 单跑三档重档：手点 + API 各一条，两条引用同一张整表锚点 ────────────────
  # 两件事各自要有人答，所以各写一条 —— 而这两条**不许漂**，判据逐条比它们展开后的清单。
  # 前提是「引用得到同一张表」就够了；至于表里那些**副本**不许与每日那几格漂开，
  web_trigger_e2e:
    - <<: *common
      name: 单跑全量E2E（手动触发）
      lock: *lock_oneshot_e2e
      stages: *oneshot_e2e
  web_trigger_build:
    - <<: *common
      name: 单跑生产构建（手动触发）
      lock: *lock_oneshot_build
      stages: *oneshot_build
  web_trigger_unit:
    - <<: *common
      name: 单跑全量单测（手动触发）
      lock: *lock_oneshot_unit
      stages: *oneshot_unit
  # 桌包那一档的手点口：与 02:00 那一条**同一份 `*package_gates`**。
  web_trigger_package:
    - <<: [*common, *package_fail_stage]
      name: 桌面成品包（手动触发）
      lock: *lock_package
      stages: *package_gates
  # 桌包那一档的 API 口：与 `api_trigger_daily` 同构 —— 按钮要一双手，
  api_trigger_package:
    - <<: [*common, *package_fail_stage]
      name: 桌面成品包（API 触发）
      lock: *lock_package
      stages: *package_gates
  api_trigger_e2e:
    - <<: *common
      name: 单跑全量E2E（API 触发）
      lock: *lock_oneshot_e2e
      stages: *oneshot_e2e
  api_trigger_build:
    - <<: *common
      name: 单跑生产构建（API 触发）
      lock: *lock_oneshot_build
      stages: *oneshot_build
  api_trigger_unit:
    - <<: *common
      name: 单跑全量单测（API 触发）
      lock: *lock_oneshot_unit
      stages: *oneshot_unit

  # 并且记住：**委托发不出去之前，PR 那一格不许再挂 `--autofix`**（就地修 + 回不去

  # ── GA 回调（已转正）────────────────────────────────
  # **已转正**：`质量门禁` 的 `GA 回调结论回读`（§13.5.33 逐笔对账）站内读这条
  # 老主列五格已停用，双写消失，§13.6「PR 跑绿才合并」的承重仍在这条 build
  # ⚠️ 流水线 `name` **不改名**：commit-status 的 context 含这段名字，改名会让
  # `git.enable: false` 时工作区没有代码（绑预合并 sha 必须关检出 —— 不关的话
  api_trigger_ga_verdict:
    - <<: *common
      name: GA 判决回调（骨架·休眠）
      lock: *lock_ga_verdict
      git:
        enable: false
      stages:
        - name: GA 结论判定
          # 全 ASCII 日志：`git.enable: false` 时工作区没有
          # `scripts/ci-cp936-exit.mjs`，包不了那层转码；这一格自己不写中文，
          # CP936 对 ASCII 逐字通过，乱码面从源头就不存在。
          # PS 5.1 原生写法（`-contains` / 无 `?.` `??`），与头注第 3、6 两条
          # 和 §13.5.3.4.1 的解析期判据对齐。
          script: |
            $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
            $role = [string]$env:GA_ROLE
            $sha = [string]$env:GA_CALLBACK_SHA
            $pr = [string]$env:GA_PR_NUMBER
            $cnbSha = [string]$env:CNB_COMMIT
            $short = $sha
            if ($short.Length -gt 8) { $short = $short.Substring(0, 8) }
            $cnbShort = $cnbSha
            if ($cnbShort.Length -gt 8) { $cnbShort = $cnbShort.Substring(0, 8) }
            $match = 'match'
            if ($sha -ne '' -and $cnbSha -ne '' -and $sha -ne $cnbSha) { $match = 'mismatch' }
            Write-Host "[ga-verdict] callback sha=$sha (short=$short) pr=$pr role=$role"
            Write-Host "[ga-verdict] callback cnb_commit=$cnbSha (short=$cnbShort) sha_check=$match"
            if ($role -ne 'callback') {
              Write-Host "[ga-verdict] role is not callback, inconclusive (not a pass)"
              exit 2
            }
            $v = ([string]$env:GA_VERDICT).ToLower()
            $green = @('success', 'neutral', 'skipped') -contains $v
            if ($green) {
              Write-Host "[ga-verdict] callback conclusion=$v sha=$short -> success"
              exit 0
            }
            Write-Host "[ga-verdict] callback conclusion=$v sha=$short -> failure"
            exit 1
          timeout: 5m
