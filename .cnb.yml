    # 实测 118s（`cnb-eus-1k5058g8l`）。`pnpm run build` 内部串了
    # `next build` → 剥私有输入 → 数产物 → 冒烟，给 30m 是因为 `next build` 在
    # 冷节点上比实测读数慢得多，而不是因为它会挂。
    timeout: 30m

  # ── 浏览器安装（自托管节点是裸宿主机，没有镜像预装这一层）──
  #
  # `E2E 关键流程` 是这条流水线上**从来没有跑过**的一档（前几跑都断在 `单元测试`
  # 或 `生产构建`）。它第一次真跑到就红在浏览器缺件上，读数（`cnb-0rd-1k50unpnn`）：
  #
  #   期望的路径：…\ms-playwright\chromium_headless_shell-1243\…\chrome-headless-shell.exe
  #
  # 成因不是配置写错：**没有 docker 就没有「镜像里预装好浏览器」那层兜底**，而
  # `pnpm install` 不会拉 Playwright 的浏览器二进制（那是 `playwright install` 的事）。
  # 旧版 `docker.image: node:24` 那条路上这一格是白拿的，自托管把它还回来了。
  #
  # 为什么是「装」而不是「判红让人去装」：它与 Python 那一步的分工不同 —— 解释器可能
  # 在盘上、只是执行账号的 PATH 看不见（那要人改 PATH，所以 `--python-only` 探到就放行、
  # 探不到才红并给取证）；而浏览器二进制**只可能来自这一条命令**，机器上不存在
  # 「装了但探不到」的分支。所以这一步直接装。
  # 幂等：`playwright install` 对已存在的版本是 no-op。
  #
  # ⚠️ **判据是「东西落地了」，不是「这条命令退 0」**（ISSUE #1961）—— 这一步红过一次
  # 而**没人看得出来**，形态是这句：
  #
  #   （原文）Failed to install browsers
  #   （原文）Error: Request to https://cdn.playwright.dev/…/chrome-win64.zip timed out after 30000ms
  #   浏览器装不上（`playwright install` 退非零）…      ← 话术自己打出来了
  #   Finished, code: 0, duration: 31.1s                ← 而 stage 报绿（`main()` 的返回码被丢）
  #
  # 三个面各自修掉了（退码转出去 / 装完按落点复验 / 下载失败给读数），口径见
  # 规范 §13.5.3.5–§13.5.3.6。
  #
  # ⚠️ **这一格 2026-10-16 从停用清单恢复**（ISSUE #1966）。它此前被登记进
  # `COMFYAPP_CI_DISABLED_GATES`，依据是下面这条取证读数（`cnb-ve6-1k51jaudm`）：
  #
  #   内置族（cdn.playwright.dev）+ 30s  → 5 次 `timed out after 30000ms`、0 字节
  #   配着的 npmmirror 根 + 120s        → `timed out after 120000ms`、0 字节（`cnb-oqf-...`）
  #   失败分支的逐候选探测             → 三条都只取回**小段**字节（582 / 1889 / 442），
  #                                      即「连得上、也收得到开头」，而大 body 停住
  #
  # 当时的结论写成「这台节点一次取不回那 120 MiB ⇒ 这一格要绿只有这一个条件」，
  # 而规范 §13.5.3.5「订正 ⑩ 的那句推论」把它订正成**「一次取不完」**：条件确实在
  # 链路上，但「怎么取」是仓库能改的那一半 —— 这一步**内部**现在多了一条通道
  # （分片取字节 + 编排：片长自适应、断了从已落盘的字节接着来；实现与判据见规范
  # §13.5.3.5「第七跑」那一小节），不另起 stage。
  #
  # 所以恢复的依据**不是**「节点网络修好了」，而是**取法换掉了**。
  #
  # ⚠️ **恢复后的第一跑读数已经到了**（`cnb-7oo-1k51r518b`，2026-10-16）：
  #
  #   自取：从 https://cdn.npmmirror.com/binaries/playwright 分片取这一件（可续传）
  #   自取成功：…\ms-playwright\chromium_headless_shell-1243\…\chrome-headless-shell.exe
  #   playwright install → Downloading FFmpeg (playwright ffmpeg v1011) × 5 次
  #                        → timed out after 120000ms → Download failure
  #   浏览器装不上（`playwright install` 退非零）…   ← 而浏览器**已经装好了**
  #
  # 两件事各是一半：「取法换掉了」成立（119 MiB 的自取在这台节点上真走完了），
  # 而红的是**另一件** —— 老路不只装浏览器，还会顺手拉 **ffmpeg**（chromium 的依赖，
  # ~2.5 MB），那件在同一条链路上照旧 0 字节。所以这一步现在在自取成功之后**按落点
  # 复验一次**（同一个 `browserExecutableExists()`），通过就直接放行、不再交给老路：
  # 本档真正要的是 headless shell（复验找的就是它），而 ffmpeg 只有录视频才用得上
  # （`playwright.config.ts` 没开 `video`）。理由与判据在 `ci-toolchain-browser-seed.mjs`
  # 的头注（`ci-toolchain-browser.mjs` 正卡在 900 行的硬闸上，那段只有一行 + 指路）。
  #
  # 下一笔账：`E2E 关键流程` 的首跑读数（它在自托管路径上仍然一次都没有跑到过）。
  - name: 浏览器安装
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --playwright-only
    env:
      # **这两行是实测读数换来的**（`cnb-gt1-1k513ill4`）。
      #
      # 先撞的是 30s 的**套接字**超时（`NET_DEFAULT_TIMEOUT`）—— 那不等于「CDN 不通」，
      # 是「这一次没量完」。可把它放宽到 120s 之后**照旧超时**（`timed out after 120000ms`），
      # 于是结论变了：这台节点**真的到不了** `cdn.playwright.dev`。180 MiB 的包在
      # 这样一条链路上无论等多久都不会到。
      #
      # 所以换镜像 —— 走 `PLAYWRIGHT_DOWNLOAD_HOST`（Playwright 自己的环境变量，
      # 不引第二套机制）。选 npmmirror 的 Playwright 二进制镜像是因为**它真能供上这一件**：
      # 实测它按同一段路径回 HTTP 200，且 15s 内收到了 99 MiB。
      #
      # **为什么这一行只能是「外面给的」**：Playwright 自己的三个内置镜像**全同族**
      # （`cdn.playwright.dev` / `playwright.download.prss.microsoft.com`），
      # 这台节点出不去这一族时它 `retryCount = 5` 的「回退」等于没有 ——
      # 实测逐字打了 5 次同一个域名，然后 `Download failure, code=1`。
      # 也就是说这一档**推不出来**，只能由这里给：给上之后
      # `runPlaywrightInstall()` 就只用它（不再陪 Playwright 挨个试不通的那三档）。
      #
      # ⚠️ **这个值是给这台节点用的，换网络要跟着换**。平台侧 env 能覆盖它；
      # 本地不设就回到 Playwright 的默认行为（`playwrightHostsToTry` 的判据）。
      # 选它是因为它是 Playwright 点名的镜像键，而不是本仓发明的那一套；
      # 真要换（内网代理、别的镜像站）改这一行即可。
      #
      # ⚠️ 这两行与判据无关：判据仍是「装完真起一次浏览器」（`--playwright-only` 的复验）。
      # 镜像只是把「到得了」这件事从宿主机身上挪到一个到得了的地方。
      # 而恢复之后这一步有**两条**通道：先自己分片取（不依赖这个根到得了大 body），
      # 失败才原样交给 `playwright install`（那时才用得上下面这两行）。
      PLAYWRIGHT_DOWNLOAD_HOST: "https://cdn.npmmirror.com/binaries/playwright"
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
    # 实测首次要下 ~100+ MiB（chromium + chromium-headless-shell 两件）。给 20m：
    # 冷节点 + 慢链路够用，而卡死（CDN 真的不通）时也能在 20m 报出来，不必等满平台
    # 默认的 2h 墙钟。**不是放宽判据** —— 预算只管多久放弃。
    timeout: 20m

  # ── E2E（仅 @critical 关键流程）──
  #
  # 解释器这一格已由前面那步「Python 可用性」在**整条流水线的最前**答过（它也是
  # 本地 `pnpm test:e2e` 走 `scripts/e2e-run.mjs` 时的同一份判据），故这里不重判。
  # 浏览器那一格由上面那步「浏览器安装」答过（自托管没有镜像预装）。
  #
  # ⚠️ 这一格与 `浏览器安装` **同批恢复**（2026-10-16，ISSUE #1966）：它依赖那一格的
  # 浏览器二进制，浏览器装不上时它只会在 `next start` + Playwright 启动处报**同一个**
  # launch 失败 —— 停用它只是把红从倒数第三步挪到倒数第二步，判据强度一点没变。
  #
  # ⚠️ **第一跑读数**（`cnb-cdt-1k51s6mf1`，8.5s 红）：`--grep @critical` 里的那个
  # `@critical` **在命令行那一层就没了** —— Playwright 收到的是没有值的 `--grep`：
  #
  #     error: option '-g, --grep <grep>' argument missing
  #
  # 这不是本仓判据的事，是**命令形态**的事（同一行里 `node scripts/e2e-run.mjs`
  # 照常跑起来了）：`@` 开头的裸 token 在 Windows runner 的命令行上会被吃掉。
  # 所以这里写成 `--grep=@critical` —— `@` 不再是某个 token 的第一个字符，三种
  # shell（bash / cmd / PowerShell）下都原样传过去；本机怎么打不受影响。
  # 顺带记一笔：「停用期间看不见的东西」又多一类 —— 这一行此前从没被执行过，
  # 而它在本地是**永远绿的**（本地是 bash/PowerShell 直接调用，`@critical` 传得进去）。
  - name: E2E 关键流程
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/e2e-run.mjs --grep=@critical
    # 这一档在自托管路径上此前**从来没有跑过**（前几跑都断在 `单元测试` 或
    # `生产构建`）。它要起 `next start` + Playwright 浏览器、跑 `@critical`
    # （登录 → 建项目 → 出图），给的是与本地那一档同量级的预算。
    timeout: 30m

master:
  # PR 端的全套门禁：PR 不合并就不该结束，这里一步不省。
  pull_request:
    - <<: *common
      name: 质量门禁
      stages: *gates

  # 合并后的 push：不重跑全套。合并提交由平台按**已被门禁验过的源分支 SHA**
  # 生成，不引入新代码；保留的这条是形态复核 —— 落到 master 的必须是 PR 合并
  # 形态。若出现非合并提交（本地 --no-verify 就能做到），说明有变更绕过了 PR
  # 与门禁，那要拦下。
  push:
    - <<: *common
      name: master 合并复核
      stages:
        - name: 合并形态复核
          # ⚠️ 这一格是**唯一**没钉控制台编码的 stage（其余每个 `script` 都以
          # `$enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc;` 开头）。
          # 补上它**不改变今天的读数**（抓取端按宿主 ANSI 代码页解，钉什么都被它按
          # 936 读一遍），但它让这一步不再依赖「控制台代码页恰好是多少」这个**继承
          # 来的**状态 —— 那正是这台机器上刚刚变过一次的东西（936 → 65001）。
          script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-branch-guard.cjs --merge-commit
