  #
  # 下一笔账：`E2E 关键流程` 的首跑读数（它在自托管路径上仍然一次都没有跑到过）。
  #
  # ── 为什么这一格**不写** `image:`（两次实测推翻了前一版）──
  #
  # 前一版这一格（与下面 `E2E 关键流程`）写着任务级 `image: mcr.microsoft.com/
  # playwright:v1.63.0-noble`，想用官方镜像里**已经装好**的 headless shell 绕开
  # 「120 MiB 取不回来」那条链路问题。现场读了两次，两次都是同一个回话：
  #
  #     （原文）Runner does not enable Docker.      ← 70~109ms 就退出，容器都没起
  #
  # 平台文档（本文件头注第 1 条抄的就是它）：「自定义 Runner **默认不开启 Docker
  # 能力**，构建脚本直接运行在宿主机上」。这句话对**任何**要求平台起容器的东西都成立，
  # 与「写在 stage 上还是 Job 上」无关 —— 前一版按「Job 级是另一种机制」去读，两跑
  # 各用一种写法，各红一次，答案都是同一句。
  #
  # 于是这里回到**宿主机直跑**（不写 `image:` = 默认档，见头注第 1 条那条 ⚠️）：
  # 这一格照旧走它已经量过很多次的链路 —— 分片自取 + 落点复验（§13.5.3.5「第七跑」），
  # 那条链路在这台机上真的把 119 MiB 取完过。
  #
  # 长期看，这一格最省事的一条仍然是「**把浏览器预装进节点的落点**」：装过一次之后
