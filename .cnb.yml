# CNB 云原生构建流水线 —— 跑在**根组织自托管 Windows 节点**上（ISSUE #1959）
#
# 这份配置是 ISSUE #623「平台侧用不起、配置删除」的**一次决策反转**，反转的
# 依据是一条前提被推翻：自托管 Runner 走宿主机、不参与核时计费。官方文档
# （docs.cnb.cool/zh/build/build-node.html「限制」一节）原文：
#
#   「自定义 Runner 默认不开启 Docker 能力，构建脚本直接运行在宿主机上，因此：
#     runner.cpus 配置无效……不参与核时计费。」
#
# 而 #623 的全部推理都建立在计费上（160 核时/月 ÷ 8 核 = 一个月约二十次 PR）。
# 计费项没了，那条结论对这条件路径不再成立。**但反转的不只是「能不能跑」**，
# 还有下面这几条形态变化 —— 它们才是这份文件与旧版差别最大、也最容易踩的地方。
#
# ── 与旧版（Linux 平台池 + docker.image）的五条形态差异 ──────────────────
#
# 1. **没有 docker，工具链必须预装在宿主机上**。旧版靠 `docker.image: node:24`
#    提供 Node，这条路在自托管上不能当构建环境用（官方写「`pipeline.docker.image` 不会
#    生效」；探针的读数更准一句：**会**被执行，只是起不来 —— 见 §13.5.3.4.1.6）。
#    因此本文件**不声明 `docker:` 与 `volumes:`**，而是把「宿主机该有什么」
#    变成第一条流水线步骤去**验**（见下「工具链自证」）—— 环境要求写进配置里
#    没人读，写成会红的断言才有人管。
#
#    ⚠️ **「任务级 `image:` 能起容器」这条同样不成立（2026-10-17 读数订正）**：
#    `pipeline.docker.image` 失效之外，**任务级 `image:` 在这条路径上直接红** ——
#    实测 `cnb-cqk-1k550gpp2`（PR #2003 那一跑，源分支就是「给两格加 `image:`」那次）：
#
#      （原文）浏览器安装  error [70ms]  →  Runner does not enable Docker.
#
#    70 毫秒、脚本一行都没执行，于是带 `image:` 的 stage **必然**红 —— 但红的原因是
#    **平台没给这台 runner 开容器能力**，不是「这台机器上没有 docker daemon」。后半句
#    是上一版写错的因果：探针（`pipeline.docker.image` 那条码路）里 runner 真的执行了
#    `docker info`（退 0）与 `docker pull node:24`（退 0），死在它把 `docker run` 拼成了
#    Windows 容器形态（`-w c:\workspace`）。读数为啥与本仓结论同向、以及要谁做什么才能
#    改写回 `image:`，见规范 §13.5.3.4.1.6。
#    所以本仓的形态只有一档：**整条宿主机直跑，一格都不写 `image:`**。
#    判据在 `tests/ci-image-identity.test.ts`：进容器的 stage 名单必须是**空**的
#    —— 多一格就红，理由与那次读数一起写在 `scripts/ci-image-identity.mjs` 的头注。
#    （官方 `build-node.md` 只写了「`pipeline.docker.image` 等不会生效」，
#    `script-vs-plugin.md` 讲的是平台池那种形态；两句都真，只是它们**不构成**
#    「任务级 image 在这条路上可用」的推论 —— 那次 70ms 的红就是这条推论的反例。）
#
# 2. **`runner.cpus` 无效，故不声明**。旧版写 `cpus: 8` 是为了「避免分配到的节点
#    规格随扩缩容变化把耗时读成回归」，而自托管上整机资源直接可用、这个键被忽略；
#    留着它只会让人以为核数被控制了。
#
# 3. **脚本语言是 PowerShell，不是 POSIX sh**。自托管 Windows 上 stage script
#    默认走 PowerShell，旧的 `rm -rf` / `mkdir -p` / `diff -q` / `>/dev/null` 一律
#    不成立（`rm` 是 Remove-Item 的别名，但没有 `-rf`；`mkdir -p` 会被当成字面参数）。
#    本文件里凡涉及文件系统 / 分支流程的地方都写成 PowerShell 原生的样子。
#
# 4. **OverlayFS 不可用，秒级克隆降级为普通 git clone**。每一次构建都是全量 clone，
#    这是这条件路径的固定成本，没有配置能省掉它。
#
# 5. **节点离线会静默改派**。文档原文：节点「离线、被临时禁用，或资源使用达到上限」
#    时系统会自动尝试重新分配到其他可用节点，实在没有才失败。在自托管这一档上
#    「其他可用节点」就是计费的平台池 —— 于是最坏情况是**悄悄花回核时**，而没有任何
#    报错。诊断靠日志里那一行 `runner.namespace` / 实际标签，见 §13.5.3 的「怎么确认
#    真的跑在自托管上」。
#
# 6. **stage shell 是 PowerShell，而它的输出编码默认是 CP936**（2026-10-16 补）。
#    Node 往管道里写的是 UTF-8 字节，PowerShell 拿 `[Console]::OutputEncoding`
#    （中文 Windows 上 = CP936）去解，再按同一个编码吐回给平台 —— 于是**所有中文
#    日志在平台侧都是乱码**：现场 `[e2e-run] 璧� Playwright 鍓嶏細搴旂敤绔彛 绌�`
#    就是「UTF-8 被当 GBK 读了一遍」。平台自己那条错误行（`任务执行失败，返回码：1`）
#    是好好的，所以病不在平台解码侧，在 stage shell 这一层。
#    故**每个 stage 的脚本都以
#    `$enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc;` 开头**
#    （单行脚本用 `;` 接，块脚本写成第一行）；本地不受影响（本地直接调 node，
#    没有这一层转发）。⚠️ 这一句不是装饰：**红的时候最该读的那些行正好是中文**。
#
#    ⚠️⚠️ **但它不是全部，而且「抓取端按宿主 ANSI 代码页解码」这句推断已被证否**
#    （2026-10-16 晚两次探针读数，逐字相同）：
#
#      · 把控制台钉成 65001 之后，PS 原生 / cmd / node **三层的中文仍然同一种乱法**
#        ⇒ 解码端**不是**按当前控制台代码页解；
#      · 那台机的**宿主 ANSI 代码页已经换成 UTF-8**（系统区域设置里勾了「使用
#        Unicode UTF-8 提供全球语言支持」并重启过 —— 本文件读数行里那个值也从 936
#        变成了 65001），而乱码**一个字没变** ⇒ 解码端**也不是**按宿主 ANSI 代码页解。
#
#    同一份日志里还有一组更硬的对照：**runner 自己打的行（`script` 原文回显）是完好
#    中文**，而**子进程输出的每一行**都是「UTF-8 字节按 CP936 解」⇒ 解码发生在
#    **子进程输出那一跳**，而它用的编码是**不与宿主设置联动的 CP936**。
#
#    所以「机器侧改一处全好」这条路**不成立**（已经改过、也重启过，读数说没用）。
#    仓库侧只剩一条：**让每个字节以 CP936 出口**（逐 stage 转码）。本 stage 第 4 行探针
#    就是用来一次定死这件事的（直接以 CP936 字节写 stdout）。
#    `scripts/ci-console-encoding.mjs` 头注与规范 §13.5.3.5 记着读数与判读。
#
#    ⚠️⚠️ **那条出路 2026-10-16 晚已经有执行者了**（ISSUE #1977）：每个 stage 的命令
#    现在都包在 `scripts/ci-cp936-exit.mjs` 外面 ——
#
#      node scripts/ci-cp936-exit.mjs -- <真命令>
#
#    它起那条命令、把输出交给 PowerShell **按 936 重发**、再把退出码原样转出去。
#    两件事别搞混：**钉 65001 照旧要留**（它让 PS 把 Node 的 UTF-8 **读对**，是转码能
#    拿对字节的前提 —— 直接 `chcp 936` 会先毁掉解码，转出来的只是乱码换了个编码），
#    新增的只是「读对了之后再按 CP936 写回」那一跳。Node 没有 GBK 编码器
#    （`TextEncoder("gbk")` 静默落到 UTF-8），所以转码这一步只能是 PowerShell 的
#    `GetEncoding(936)`；判据由 Node 的 `TextDecoder("gbk")` 反向复算
#    （`tests/ci-cp936-exit.test.ts`）。
#    ⚠️ 写成 `$enc=…` 而不是直接 `[Console]::OutputEncoding=…` 是**被咬过**：
#    YAML 里 `[` 开头的纯量是**流式序列**，那样写整份文件解析不过
#    （prettier 的 YAML 解析器当场报 `SyntaxError: Unexpected scalar at node end`，
#    而平台侧只会表现为「流水线起不来」）。判 `.cnb.yml` 的语法用
#    `pnpm exec prettier --check .cnb.yml` —— 它带 YAML 解析器。
#
# ── 四条流水线：谁在什么事件上跑 ────────────────────────────────────────
#
#   质量门禁        pull_request（不合并就不该结束）
#   master 合并复核  push（只复核「确实是 PR 合并进来的」，不重跑全套）
#   每日生产构建     "crontab: 0 4 * * *"（每天 04:00；机器空着、没有并发 PR 时
#                    才拿得到的那一跑 —— 全量单测 / 构建 / 全量 E2E 都在这条上，
#                    口径见 §13.5.23。「今天 master 的 HEAD 行不行」与
#                    「这次改动能不能构建」是两个问题，而 2026-10-19 起第二个问题
#                    在平台侧没有执行者了：PR 那一条不再跑构建、也不跑端到端）
#   每日档（手动触发） web_trigger_daily（**同一份七格**，人想现在就知道答案时点一下；
#                    按钮定义在 `.cnb/web_trigger.yml`，与这里的事件键靠名字对上。
#                    它与定时那一条的**两处**不同 —— 执行身份是按按钮的人、
#                    取的是按下那一刻的 master HEAD —— 写在下面那一格上面）
#
# push 不重跑全套的理由与旧版相同（合并提交由平台按**已验过的源分支 SHA** 生成、
# 不引入新代码），但今天它不再是「省额度」，而是「省一遍没有新信息的运行时间」。
#
# ⚠️ **`&common` 锚点里刻意不含 stages**：`<<: *pipeline` 会把 stages 一起带过去，
# 那正是「push 也跑整套门禁」的来源（详见 git 历史里 55bc9b36 的立案说明）。
# 覆盖根键时锚点里的键会被整体替换，故每个事件都写出完整形态。

.common: &common
  runner:
    # group = 当前仓库所属根组织下的自托管构建节点（不是平台公共池）。
    # 漏掉这一行会退化成平台池 —— 那时核时重新开始计费，而配置看起来完全一样。
    #
    # ⚠️ **用户的决定（ISSUE #1993）：「永远不用平台池，容器用自托管节点上的」**。
    # 所以这一段**不是**可调项，而是两道必须同时在场的门：
    #   ① `namespace: group` —— 派到根组织的自托管节点，而不是公共池；
    #   ② `tags` 非空、且**不含** `cnb:arch:*` 那一族 —— 节点离线 / 满载时平台会
    #      **自动改派到其他可用节点**，而在这一档上「其他可用节点」就是平台池
    #      （头注第 5 条）。只写 ① 不够，改派发生时配置一个字都不会变。
    # 「用容器」的那一半落在**任务级 `image:`**（`pipeline.docker.image` 在这条路径上
    # 不生效，头注第 1 条）—— 池子是「跑在哪台机器」，容器是「这一格跑在什么环境里」，
    # 两件事，别混。判据：`tests/ci-container-plan.test.ts` 把这段形态与容器计划一起钉住。
    namespace: group
    # 「与」关系：列出的每个 tag 都必须出现在节点标签上。当前节点声明的标签是 win。
    tags:
      - win
  # 同一分支上并发只留一条：**这条是节点侧的止血，不是省时间**。
  #
  # 实测（ISSUE #1961）自托管节点只有一台，而这一轮里连着推了好几个提交，每个
  # `pull_request` 事件都起一条**全量**流水线，全落到同一台机上：
  #
  #   cnb-jt3-1k5071kou  ESLint 零警告  挂 8640s（同分支更早那跑 256s 跑过）
  #   cnb-did-1k50659np  单元测试       挂 8640s（2h24m）
  #   cnb-s61-1k50eo6p1  npc go         挂 start，整机不推进
  #
  # 几份 `--maxWorkers=4` 的 vitest + 几份 ESLint + 几份 `next build` 线性叠加，
  # 这台 16 核机被吃干净，**最先被挤掉的恰好是排队早的那条**：它拿不到 CPU，
  # 于是既不推进也不报错，直到撞上 2h 的 Job 上限。
  #
  # `cancel-in-progress: true` = 同 key 上新流水线到达时终止旧的。
  #
  # ⚠️ **`key` 必须显式写**，不能吃默认值（ISSUE #1981）。默认 key 是
  # `分支名-流水线名`，而 `pull_request` 事件下 `CNB_BRANCH` 取的是**目标分支名**
  # （官方 `build-in-env.md` §CNB_BRANCH：「合并类事件 → 目标分支名」）—— 于是
  # 「分支名」这一半在这个事件上恒等于 `master`，两件事同时坏了：
  #
  #   · **全仓 PR 共用一把锁** ⇒ 任意两条并行 PR 互相掐停（实测：PR #1980 把 #1982
  #     那条掐了）。代价不是「慢」，是**白跑一整条**；
  #   · 于是「同一分支只留最新那一跑」这条**想要的**语义在这里根本没被实现 ——
  #     留下的是「全仓只留最新那一跑」，而节点总共只有一台，等于把并行 PR 变成
  #     互斥排队（先跑的那条被终止，白跑）。
  #
  # 所以这里给一条**没有 `CNB_BRANCH` 的 key**，只用 `CNB_PULL_REQUEST_IID`
  # （PR 的仓库内编号，非 PR 事件上为空 ⇒ 那一刻它等于「不带这一半」）：
  #
  #   · `pull_request` ⇒ `pr-<PR 编号>` —— **每个 PR 互不相同**，不同 PR 之间再不相干；
  #     同一个 PR 里连着推几个提交仍然落回同一把锁（后一跑终止前一跑，这才是想要的粒度）；
  #   · `push`         ⇒ `pr-` —— 这一档只有一条流水线（`master 合并复核`），
  #     它本来就该是「一条就够」，不带分支名也不丢语义。
  #
  # 为什么不按「事件」分两档写（`pull_request` 用 `$CNB_PULL_REQUEST_IID`、`push` 用
  # `$CNB_DEFAULT_BRANCH`）：那要么靠平台侧的变量缺省为空来兜（没实据），要么把
  # `lock` 从锚点里搬出来在两档各写一份 —— 而两份锁配置漂了之后「哪一份是真的」
  # 没有判据能回答。留一条、用「非 PR 事件该变量无值」这条**有文档依据**的性质分叉，
  # 是本仓能拿到的唯一一份事实。
  #
  # 依据：`lock.key` 是官方点名**支持变量替换**的属性（`build/env.md` §支持变量替换
  # 那张表里有 `lock.key`）；`CNB_PULL_REQUEST_IID` 见 `build-in-env.md`（PR 仓库编号，
  # 非合并类事件触发时自然没有值）。⚠️ **刻意不用** `CNB_BRANCH`（正是它会退化成
  # 目标分支），也**不用** `CNB_PULL_REQUEST_ID`（PR 的**全局** ID，跨仓库才需要那个粒度）。
  #
  # 判据：`tests/no-platform-ci-config.test.ts` 的 `resolvePipelineLockKey()` 一族
  # —— 它要求 `lock.key` 存在、里头的 `${…}` 全在白名单内、`CNB_BRANCH` 不在其中，
  # 并把上面这份原文表达式**喂进一个自带的模拟替换器**跑出两种事件下的实际 key，
  # 断言「两条不同 PR 的 key 不同」「两条同 PR 的 key 相同」。口径见规范 §13.5.3.9。
  lock:
    key: pr-$CNB_PULL_REQUEST_IID
    cancel-in-progress: true
  retries: 0
  env:
    # 与旧版对齐：构建机上没有真实密钥，用占位值过 src/env.js 的校验。
    # BETTER_AUTH_SECRET 必须一并注入 —— SKIP_ENV_VALIDATION 只绕过 src/env.js，
    # 绕过不了 better-auth 自己的生产校验（缺失 → 退回 DEFAULT_SECRET 抛错 →
    # createTRPCContext() 抛错 → 所有 authedProcedure 全灭，设置页整页读不出来）。
    # 该值只用于构建期冒烟，不参与任何真实部署。
    SKIP_ENV_VALIDATION: "1"
    BETTER_AUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
    # 避免 corepack 在非交互环境下为拉取 pnpm 版本而等待输入。
    CI: "true"
    # 覆盖率 reporter 的安静档（ISSUE #1959）：`vitest` 的 `text` reporter 会把报告里
    # **每一个文件**打一行，450+ 行的表本身就有 ~90KB，而平台对单次构建日志的硬上限是
    # 102400 字节 —— 超了就只留一句 `The log length exceeds the limit(102400)`、
    # 后面全部截断，于是这一步看起来「跑完了」而失败原因一个字都看不到。
    # 置位后由 `vitest.config.ts` 切成 `text-summary`（几行汇总）：
    # **逐文件明细一份没少**（它本来就在落盘的 `lcov` / `json-summary` 里）。
    # ⚠️ 这一行是本档唯一的执行者 —— 不在任何 `script` 里（见规范 11 §11.7）。
    COMFYAPP_QUIET_COVERAGE: "1"
    # 本题解析器要用 `steps` 里**没有**的那几个东西（`steps` 会内联进工作区、
    # 被 checkout 抹掉，而 `env` 是 HEAD 的事）。判据按本键解析 `.cnb.yml`：
    #   · `PYTHON_PROBE` —— `scripts/python-probe.mjs`：逐个候选打印「这个命令起不起
    #     得来」。缺件时那几条用例走 `env` 档跳过（不会红），跳过的是哪几条只有它答得出。
    #   · `GATES` —— 本档的 stage 名有序清单。两条被判的约束都是实测出来的：
    #     ① `单元测试` 必须排在 `Python 可用性` 之后 —— `cnb-jt3-1k5071kou` 上它跑到
    #        **2h24m** 被 8640s 墙钟掐断（只留下 `timeout of 8640000ms exceeded`），
    #        而那一步**照旧会往下跑**（缺 Python 只让它少判几格）；
    #     ② `环境前提` 必须排在 `Install dependencies` 之前 —— 它答的就是「这次装得成
    #        装不成」的前提，排在后面等于把结论推到自己要解释的那一步后面。
    #     两条都不是风格。判据分别在 `tests/no-platform-ci-config.test.ts` 与
    #     `tests/ci-env-probe.test.ts`。
    #   · `DISABLED_GATES` —— **临时停用**的 stage 名清单（此刻是 `单元测试` /
    #     `ESLint 零警告`，理由逐条写在那个键旁边。两者在每日档上都有同名执行者：
