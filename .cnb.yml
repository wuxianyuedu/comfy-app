  # ── 构建与产物 ──
  # `pnpm build` 内部已经串了 next build → 剥私有输入 → 数产物 → 冒烟，
  # 不再另拼一遍（与 §13.5.3 那张表里记的同一入口）。
  - name: 生产构建
    script: pnpm run build
    # 实测 118s（`cnb-eus-1k5058g8l`）。`pnpm run build` 内部串了
    # `next build` → 剥私有输入 → 数产物 → 冒烟，给 30m 是因为 `next build` 在
    # 冷节点上比实测读数慢得多，而不是因为它会挂。
    timeout: 30m

  # ── 浏览器安装（自托管节点是裸宿主机，没有镜像预装这一层）──
  #
  # `E2E 关键流程` 是这条流水线上**从来没有跑过**的一档（前几跑都断在 `单元测试`
  # 或 `生产构建`）。它第一次真跑到就红在浏览器缺件上，读数（`cnb-0rd-1k50unpnn`）：
  #
  #   期望的路径：…\ms-playwright\chromium_headless_shell-1243\…\chrome-headless-shell.exe
  #
  # 成因不是配置写错：**没有 docker 就没有「镜像里预装好浏览器」那层兜底**，而
  # `pnpm install` 不会拉 Playwright 的浏览器二进制（那是 `playwright install` 的事）。
  # 旧版 `docker.image: node:24` 那条路上这一格是白拿的，自托管把它还回来了。
  #
  # 为什么是「装」而不是「判红让人去装」：它与 Python 那一步的分工不同 —— 解释器可能
  # 在盘上、只是执行账号的 PATH 看不见（那要人改 PATH，所以 `--python-only` 探到就放行、
  # 探不到才红并给取证）；而浏览器二进制**只可能来自这一条命令**，机器上不存在
  # 「装了但探不到」的分支。所以这一步直接装，装不上才红。
  # 幂等：`playwright install` 对已存在的版本是 no-op。
  - name: 浏览器安装
    script: node scripts/ci-toolchain-selfcheck.mjs --playwright-only
    # 实测首次要下 ~100+ MiB（chromium + chromium-headless-shell 两件）。给 20m：
    # 冷节点 + 慢链路够用，而卡死（CDN 不通）时也能在 20m 报出来，不必等满平台
    # 默认的 2h 墙钟。**不是放宽判据** —— 判据是「装完退 0」，预算只管多久放弃。
    timeout: 20m

  # ── E2E（仅 @critical 关键流程）──
  #
  # 解释器这一格已由前面那步「Python 可用性」在**整条流水线的最前**答过（它也是
  # 本地 `pnpm test:e2e` 走 `scripts/e2e-run.mjs` 时的同一份判据），故这里不重判。
  # 浏览器那一格由上面那步「浏览器安装」答过（自托管没有镜像预装）。
  - name: E2E 关键流程
    script: node scripts/e2e-run.mjs --grep @critical
    # 这一档在自托管路径上**从来没有跑过**（前几跑都断在 `单元测试` 或 `生产构建`），
    # 所以没有历史读数可依。它要起 `next start` + Playwright 浏览器、跑 `@critical`
    # （登录 → 建项目 → 出图），给的是与本地那一档同量级的预算。
    timeout: 30m

master:
  # PR 端的全套门禁：PR 不合并就不该结束，这里一步不省。
  pull_request:
    - <<: *common
      name: 质量门禁
      stages: *gates

  # 合并后的 push：不重跑全套。合并提交由平台按**已被门禁验过的源分支 SHA**
  # 生成，不引入新代码；保留的这条是形态复核 —— 落到 master 的必须是 PR 合并
  # 形态。若出现非合并提交（本地 --no-verify 就能做到），说明有变更绕过了 PR
  # 与门禁，那要拦下。
  push:
    - <<: *common
      name: master 合并复核
      stages:
        - name: 合并形态复核
          script: node scripts/check-branch-guard.cjs --merge-commit
