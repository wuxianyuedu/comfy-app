  #   而外面多出来的那一跳是**记账** —— 跑绿即刷新 `scripts/.full-suite-freshness.json`。
  #   裸写 vitest 时这一步的绿只落在日志里、账面上一个字不变，本地「改了就当天跑」
  #   那条判据照旧拦人（判据与账是两件事，两个执行者要读到同一份事实）。
  #   本档在平台侧**必须整档跑**（不带 `--grep` / 不指单个文件）：`isWholeTrackRun`
  #   会把「透传了参数的绿」判成**不构成整档凭证**、当场不记账。
  #   用法与边界见 scripts/full-suite-run.mjs 头注与规范 §13.5.4。
  #
  # ⚠️ 这一格**留在注释形态 = 停用**（名字在 `COMFYAPP_CI_DISABLED_GATES` 里，两处同批才成立）。
  #   本批一度把它取消注释当「重档挪到 CI」的承接者，随后撞上并行会话那条决定：会自己起
  #   一堆子进程的那两档只在每天 01:00 那一跑（§13.5.21）—— 同一台机上并行 PR 会把带超时的
