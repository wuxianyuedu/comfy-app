  # oxfmt 格式硬闸（规范 §13.5.1）：**从本地钩子挪到这里**（ISSUE #2010）。
  #
  # 判据一个字没改，挪的只是执行者 —— 与 §13.5.17 那三条文档面判据同一条口径：
  # **它的结论挡不住任何一次代码回归**。prettier 只格式化，格式漂了没有任何运行时
  # 症状，最坏后果是下一次 `--write` 产出一份与本次改动无关的全文件 diff（§13.7），
  # 而那一眼就看得出来、改回来也只是再跑一次格式化。它在**每一次提交**里的成本却是
  # 实测的：冷缓存 ~21s、热缓存 ~4.5s（钩子那一档带 `--staged`，但 `src/**` 是最高频
  # 的提交类别 —— 命中即扫全库，只省下「没碰到扫描面」那一半）。
  #
  # ⚠️ **不带 `--staged`**：平台侧的工作区就是这次要判的那份源码，`--staged` 在这里
  # 读的是「本次暂存」、恒为空 ⇒ 这一步会恒跳过（挂了等于没挂）。这与
  # `API 文档生成与自检` 那两条同一条处置，判据
  # `tests/doc-check-hook-wiring.test.ts` 双向钉住（钩子里没有 + 平台侧有且是全量档）。
  #
  # ⚠️ 紧邻的 `格式化提交分离` **不许跟着挪**：那条判的是「这次提交有没有把真实改动
  # 埋进几百个文件的重排里」，后果不可逆（blame 永久失真、squash 合并后本地再没有
  # 拆分的机会），它必须留在提交那一刻；prettier 那一条判的只是「文件现在干不干净」。
  #
  # 历史：它曾在这份清单里**被临时停用**（随 `ESLint 零警告` 一起让位给 E2E 调试，
  # 见 `COMFYAPP_CI_DISABLED_GATES` 的注释），本轮不是"恢复"而是"接管" —— 停用档的
  # 恢复条件（E2E 一绿 + 平台日志中文可读）与这条无关，钩子那边同时也撤了。
  - name: oxfmt 格式
    ifModify:
      - "src/**"
      - ".storybook/**"
    # 口径变更（ISSUE #2610，业主拍板 2026-10-29）：**这一格只判，不再修也不再委托**。
    # 此前它跑 `ci-format-fixup.mjs --check --autofix`：红 ⇒ 就地写文件 ⇒ 复判全绿 ⇒
    # 把修复提交委托给 `api_trigger_formatfix`（可信事件、令牌 rw）回写。实测这条路在
    # PR 事件上恒发不出去 —— 那一类事件的令牌只有 `repo-code:r`，`start-build` 当场
    # `403 / errcode 10023 / Missing required scopes: repo-cnb-trigger:rw`
    # （build `cnb-tb0-1k61hpvhf` 的 stage-25，2026-10-28），脚本 fail-closed 照旧退 1，
    # 于是「自动修」这一段每次都白走、还让人以为差一个权限就通了。
    # 修与判现在都落在**本地**：`.githooks/pre-commit` 的 D0 带 `--staged` 跑同一份
    # `check-format.cjs`，红了人就 `pnpm exec oxfmt <点名的文件>`（只点本次改的）。
    # 平台这一格留的是**第二层**：判据本体一字未改，判面用 `--changed`（改动面 ∩ 扫描面）
    # —— printWidth 80→100 起全库档对未迁移的存量恒红（见 check-format.cjs 文件头），
    # 平台这一格判的是「这次 PR 带来的那批」；基线取 `CNB_PULL_REQUEST_TARGET_SHA`
    # （changed-scope 的既有口径），合成 merge 提交上的对账也在那一层。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-format.cjs --changed

  # 收窄（ISSUE #1993）：它判的是「这次提交里有多少个文件只是被 prettier 重排过」，
  # 而判据本体是**逐文件跑 prettier**（每个改动过的源文件一次）。所以面就是
  # 「`SOURCE_RE` 认的扩展名在仓库里可能出现的那几棵树」—— 由 `stagedRoots()` 现算，
  # 这里写的是它现算的**上界**（顶层目录 + 根级配置名）；判宽只会少省几秒，判窄是漏判。

  # ── 文档面与上报这几格：**各自一格，各带自己的收窄**（2026-10-22 恢复执行者）────
  #
  # ⚠️ 2026-10-20 那一笔（`0c6c8897`）把这几格的原文注释掉了，理由是「收进聚合档」。
  # 但聚合档 `重档静态判据` 读的是**钩子注册表**（`.githooks/pre-commit` 的 `run` 步骤行），
  # 而其中那三条在 2026-10-16（`8d0d0b23`）就已经从钩子里撤走了 —— 两次搬动方向相反、
  # 在中间对穿 ⇒ 从 2026-10-20 起它们**一个执行者都没有**。
  # （`覆盖率上报` 从没进过钩子：它是 10-19 才被收进条目表的，而条目表不执行任何东西。）
  # 实测（平台日志 `cnb-n1k-1k5h6bnm6`）：`render-doc-placeholders` / `check-doc-references`
  # 零命中，`check-docs-api.cjs` 只命中它自己的单测 —— 脚本本身一次没跑。
  # 代价是实打实的：`docs/api/**` 在无人看管下漂了 32 份（`7aae1747` 等 5 笔 `src/lib`
  # 提交之后没人重生成）。那一族漂移在 ISSUE #2231 之后**不再有对象**了 ——
  # 产物已从 git 里搬走，见下面那一格。
  #
  # 处置：**恢复成各自的活 stage**，并给前两格挂上**按这一格算的收窄**。
  # 为什么不是「进聚合档 + 格内收窄」：平台的 `ifModify` 是**按整格**的，而复合执行者
  # 一条都不许挂（格内扫描面不同的判据一起静默放行 —— 见 `scripts/ci-incremental-gates.mjs`
  # 的 `COMPOUND_EXECUTORS`）。⇒ 要按条目收窄，就得让它自己占一格。
  #
  # 收窄的形状与理由只有一处出处：`scripts/ci-incremental-gates.mjs` 的 `INCREMENTAL_GATES`
  # （那里逐条写着「它守的是哪份脚本、为什么这条收窄是安全的」）。
  # ── 2026-10-28：文档链三格撤到 push 档（树级校验）────────────────────────────
  # `生成态文档与源同步` / `API 文档生成与自检` / `文档引用与权威源一致` 判的是
  # 「**合并后的树**」一致不一致，不是「这次改动」⇒ 每次合并判一次就够，不必每个 PR
  # 各判一遍。三格原文（入口、旗标、`ifModify`）整体搬到 `.push-stages` 锚点
  # （清单在 `COMFYAPP_CI_PUSH_GATES`，判据双向核对），判据一字未改。
  # ⚠️ `覆盖率上报` 从本档（PR）**挪到了每日档**（见 `*daily_gates` 末尾）：原来它读同跑
  # `受影响用例` 产出的 coverage/lcov.info，而 `受影响用例` / `固定结构用例` 两测试格
  # 2026-11-02 撤到每日全量单测后，PR 上不再有产出 lcov 的格子 ⇒ 这一格在 PR 上只会
  # 静默空转。每日档的 `每日单元测试` 跑 `pnpm run test:coverage`，同一 job 产出 lcov，
  # 这一格接在它后面上报。它仍是**报告型**（不判任何东西，报告不在时跳过而不判红），
  # 没有 `ifModify`。
  # ── 下面这几格**没有自己的 stage**：它们的执行者在别处 ──────────────────────
  #
  # 「停用 ≠ 删除」机制在**页内**的第四种形态（前三种见 `COMFYAPP_CI_DISABLED_GATES`
  # 那两条注释与上面那段「收进聚合档」）：这几格的名字**仍在 `COMFYAPP_CI_GATES` 里**
  # （它们没被停用，是换了执行者），但它们的原文是注释形态 —— 因为执行者是：
  #   · `格式化提交分离` / `零消费导出` ⇒ 复合档 `重档静态判据` 里的条目
  #     （执行面 = 钩子注册表，见 `scripts/ci-heavy-gates.mjs` 的头注）。
  #   · `core 骨架单一事实源` / `core 出口纪律与基类纯度` 已在 2026-11-02 随固定结构用例
  #     一道 retired（见 `GATE_TIER_LEDGER`）：它们的执行者正是固定结构清单，撤档后由
  #     `每日单元测试` 全量套件覆盖，不再有 PR 执行者，故这一条不再列在这里。
  # 恢复动作（真要拆回独立 stage）：取消注释 → 从复合档的条目表删掉同名条目。
  #
  # - name: 格式化提交分离
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-reformat-only.cjs
  # - name: 零消费导出
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-dead-exports.cjs
  # （`core 骨架单一事实源` / `core 出口纪律与基类纯度` 曾以同样的注释形态留在这里，
  #  2026-11-02 随固定结构用例一道 retired —— 它们不再是 PR 档的「换执行者」形态，
  #  改由 `每日单元测试` 全量套件覆盖，故此处不再列示例；见 `GATE_TIER_LEDGER`。）

  # ⚠️ **执行面是钩子注册表，不是条目表**（两轮合并之后的口径）：这一格跑的命令是
  # `node scripts/ci-heavy-gates.mjs`，而它读的正是 `.githooks/pre-commit` 里那些
  # `run "<标签>" <命令>` 步骤行 —— 也正是 `scripts/check-gate-executors.cjs` 认的出处
  # 之一。所以「把步骤从钩子里删掉」从来不是挪档的正确形态（那等于删执行者，而
  # `.cnb.yml` 不被台账认作执行者），正确形态是**步骤留在钩子里、由档位决定谁执行**。
  # `scripts/ci-heavy-gates.mjs` 里的 `HEAVY_GATES` 因此只剩**登记面**的角色（哪几条
  # 判据会自己改工作区 / 哪一格被收窄），不再是跑批清单。
  # 只剥那个「只看暂存区」的旗标（CI 没有暂存区，留着它判的是「空提交」= 一条恒绿的
  # 判据），参数一律不改 —— 改一个参数就是改判据。
  # 与上面几格同理带 cp936 那层：这一档红的时候必须读得出是哪一条判据、为什么。

  # ── 重档静态判据：一格，一次 job，内部按顺序逐条跑 ─────────────────────────
  #
  # 这一格取代了原来那 8 条各自独立的 stage。**判据一条没少**：每一条仍是原来那份
  # 脚本、原来那份参数，只是不再各占一个平台 stage。
  #
  # ⚠️ 2026-10-22 订正它的**成员名单**：原先记的是「那 8 条都收进了这一格」，而实际上
  # 这一格的执行面是**钩子注册表**（`.githooks/pre-commit` 的 `run` 步骤行）——
  # 那 8 条里有 4 条在 2026-10-16 就已经从钩子里撤走了，所以**这一格从来没跑过它们**
  # （2026-10-20 又把它们在配置里的原文注释掉 ⇒ 那 4 条彻底没有执行者）。
  # 现在：`生成态文档与源同步` / `API 文档生成与自检` / `覆盖率上报` /
  # `文档引用与权威源一致` 恢复成各自的活 stage（见上面那段）；这一格只跑**钩子里
  # 真有步骤行的那几条**（`格式化提交分离` / `零消费导出` / `CP936 字形登记` …），
  # 而 `core` 那两条由「受影响用例」格的固定清单执行。
  # 成员名单只有一处出处：`scripts/ci-heavy-gates.mjs` 的 `HEAVY_GATES`，而那一格
  # **自证**「表里每一条都被它真跑」（表与钩子对不上 ⇒ 判红，见那个文件的头注）。
  #
  # 为什么合（2026-10-19 的现场）：`cnb-hpl-1k5a0s6ss` 上 `ESLint 零警告` 一步撞到平台的
  # **20m stage 预算**被强杀（`任务超过最大执行时间而被强制关闭：20m0s`，脚本一行输出都没有），
  # 整条流水线后面三十格全 skipped。而同一台机、同一份工作区，`cnb-smq-1k59vlk3l` 上同一步
  # 是 305s 跑过的 —— 差的是**前面那二十几格各自付一次的 job 开销与盘上扫描**，不是 ESLint
  # 变慢了。也就是说：把判据一条条摊成 stage，每一格都在替**别的格**付重复成本。
  #
  # 合起来之后：本次 job 只付一次开销，条目在**进程内**串行（`scripts/ci-heavy-gates.mjs`），
  # 每条的墙钟、退出码、末若干行输出都打在同一份日志里 —— 红了照样一眼看出是哪一条，
  # 且不再是「一条红、后面全 skipped」的形态。
  #
  # ⚠️ **`ifModify` 收窄全部撤掉了**（复合执行者一条都不许挂）。理由：`ifModify` 是按
  # **整格**跳过的，一格装多条判据时它只能判成「本次没碰 → 全都不跑」，而那些判据的
  # 扫描面并不相同 —— 那正是本仓最不能有的形态（判据在场、结论静默变成放行）。
  # 现在格内**不跳**，代价是每次多跑几条秒级脚本；真要收窄要回到「按条目判扫描面」，
  # 不是按格 —— 而平台的 `ifModify` 只能按格算 ⇒ **需要收窄的判据不进这一格**，
  # 它自己占一格（上面那几格就是）。
  #
  # 判据与执行者的对应关系在 `scripts/ci-heavy-gates.mjs` 的条目表里，而那一格**自证**
  # 「表里每一条都被它真跑」—— 表与钩子对不上就判红（2026-10-20 那次就是这样溜过去的：
  # 表里写着、格子里没跑，而登记表之间互核全绿）。
  - name: 重档静态判据
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-heavy-gates.mjs
    # ── 壳门禁那一格（`桌面壳（改了 src-tauri 才跑）` → cargo test）要找得到 cargo ──
    # runner 走**服务账号会话**：它的 PATH 与 `~/.cargo` 都够不着开发者会话的工具链
    # （`CARGO_HOME` 是**用户级**变量，见 docs/guides/dev-drive-refs.md「Rust 依赖缓存」；
    # findCargo 的三处回退在此全空）。两个值**成对**给，缺一探针照样失败：
    # cargo 本体是 rustup 的代理（`G:\.cargo\bin\cargo.exe`），代理要 `RUSTUP_HOME`
    # 才解析得到工具链 —— 只给 CARGO_HOME 时实测
    # `could not create home directory …\.rustup: 拒绝访问`（ISSUE #2192 那条 PR 首跑现场）。
    #
    # ⚠️ 2026-10-28 起这两个值收进 `.cargo-env` 锚点（`#2549`）：桌面成品包那两格要的是
    # **同一对**（同一台节点、同一个原因），写成两份就是它们开始漂的那一刻 ——
    # 而今天那一跑的红恰好就是「那一档没带这对值」。换节点仍要跟着换。
    env: *cargo_env
    # 平台单 stage 默认预算 20m 是硬上限（实测强杀形态见上面那段），而这一格装的是原先
    # 那几条各自独立跑的东西 —— 它的**合理**墙钟应当与原几格的总和同级。
    timeout: 45m

  # ── GitHub 判决回读：主列末尾的**读数档**（ISSUE #3051 期望第 3 条的前半步）──
  #
  # 它回答一个问题：镜像格（主列开头那一格 `GitHub 镜像同步`）派发出去的那一笔
  # head_sha，GitHub Actions 那边跑完了没有、各 check 的结论是什么。轮询的是
  # `GET /repos/{owner}/{repo}/commits/{sha}/check-runs`，sha 的推导与镜像格同源
  # （同一笔 `CNB_PULL_REQUEST_IID` → 同一镜像 ref → 同一 head_sha）。
  #
  # 为什么排在**主列末尾**：镜像格一跑完 GitHub 那边才起跑，回读放得越靠后，
  # 留给 GitHub 完成的窗口越大；且本格只做 API 读数、零构建，挂在最后不会挡住
  # 任何一格的墙钟。轮询总预算 45 分钟（`POLL_BUDGET_MS`，取法见脚本文件头）——
  # 正常情况第一读就接近完整，预算耗尽按「没跑起来」exit 2 交账，**不判红**。
  #
  # ⚠️ **读数档**（`--readout`）：三态照常打点，退码恒 0 —— 它坏了既不许把门禁的
  # 红洗成绿，也不许把自己的红叠进门禁的账（与镜像格同一条规矩）。翻成承重档
  # 与摘镜像格的 `--readout` 同属 #3051 期望第 3 条，是另一批。
  #
  # ⚠️ 两件外部前提不落地，这一格永远只能交「没跑起来」（话术在脚本里会点名）：
  #   ① `GITHUB_MIRROR_TOKEN`（fine-grained PAT）追加 `checks: read`（只读）权限，
  #      并把新值同步进密钥仓库 `moon-read/GITHUB_MIRROR_TOKEN`（本流水线从那里
  #      imports）；
  #   ② 自托管节点到 `api.github.com:443` 的出网（与镜像格同一条 egress，它通这一格
  #      才有意义）。
  - name: GitHub 判决回读
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-github-verdict-read.mjs --readout
    # 包住 45m 轮询预算 + 进程开销；与 GitHub 侧最重格的外框同级。
    timeout: 60m

  # ── 构建与产物：**这一格 2026-10-18 起不在 PR 上跑了**（口径见 §13.5.23）──
  #
  # 旧形态（ISSUE #1979 立、#2010 补）：这里有一格 `生产构建`，跑 `artifact-run.mjs`
  # （内部就是 `pnpm run build`：next build → 剥私有输入 → 数产物 → 冒烟），
  # 实测 118s（`cnb-eus-1k5058g8l`）/ 131.0s（`cnb-ln5-1k540cfn1`，整条 12m14s 的 17.9%）。
  #
  # 撤掉它的理由**不是**「这一格判错了」，而是它在这里买不到第二份信息：
  #   · 这一档的机器执行者自 2026-10-19 起**整格都在每日那一条**（用户口径：「新鲜度都
  #     不要本地跑，都 CI 跑」）。本地 D0 那一步（`FRESHNESS_TRACKS.artifact`，它的
  #     `ciStage` 就指着下面的 `每日生产构建`）**只打读数、不再拦** —— 于是 PR 上这一跑
  #     与本地那笔账判的是**同一份 `pnpm run build` 链**，而两次都要付墙钟。
  #     判据一字未改，动的只有执行者（§13.5.17），口径与那条豁免的前提见 §11.8。
  #   · 它是这条线上仅有的两档**没有并发旋钮**的重档之一（另一档是全量单测）：
  #     `next build` 的 worker 数由构建器自己按机器定，`NODE_OPTIONS` 改的是内存不是并发
  #     （§13.5.21）。而不同 PR 之间仍然会叠加（`scripts/ci-load.mjs` 文件头），
  #     所以它在 PR 上的耗时是变量，**红了分不清是构建挂了还是机器被压死** ——
  #     §13.6.4 那一族在这条线上唯一的解法就是「别让两条流水线挤同一台机」。
  #
  # ⚠️ **代价写在明处，两条**：PR 上不再有任何机器执行者替你验构建，最晚 24 小时才知道；
  #   而撤掉本地自证要求之后**连「动了构建面就得当天自己跑」那道本地兜底也没有了**。
  #   接受它的理由与把全量单测放进每日档是同一条：那一跑判的就是同一份构建链，
  #   而机器空着时它才给得出可信墙钟。「构建链坏了两周而没人推代码」那种空转，
  #   正是每日档存在的理由 —— 那句话没有作废。
  #
  # 撤掉的是**这一格**，不是那三件仍在场的判据：`MUST_ALWAYS_RUN` 里 `生产构建` 这个名字
  # 刻意留着（谁把它加回来并挂上 `ifModify` 就红），`每日生产构建` 的入口与 `timeout`
  # 由 `tests/no-platform-ci-config.test.ts` 钉，「不许读到刚被自己刷新过的账」由
  # `tests/doc-check-hook-wiring.test.ts` 钉。

  # ── 浏览器安装（自托管节点是裸宿主机，没有镜像预装这一层）──
  #
  # `E2E 关键流程` 是这条流水线上**从来没有跑过**的一档（前几跑都断在 `单元测试`
  # 或 `生产构建`）。它第一次真跑到就红在浏览器缺件上，读数（`cnb-0rd-1k50unpnn`）：
  #
  #   期望的路径：…\ms-playwright\chromium_headless_shell-1243\…\chrome-headless-shell.exe
  #
  # 成因不是配置写错：**没有 docker 就没有「镜像里预装好浏览器」那层兜底**，而
  # `pnpm install` 不会拉 Playwright 的浏览器二进制（那是 `playwright install` 的事）。
  # 旧版 `docker.image: node:24` 那条路上这一格是白拿的，自托管把它还回来了。
  #
  # 为什么是「装」而不是「判红让人去装」：它与 Python 那一步的分工不同 —— 解释器可能
  # 在盘上、只是执行账号的 PATH 看不见（那要人改 PATH，所以 `--python-only` 探到就放行、
  # 探不到才红并给取证）；而浏览器二进制**只可能来自这一条命令**，机器上不存在
  # 「装了但探不到」的分支。所以这一步直接装。
  # 幂等：`playwright install` 对已存在的版本是 no-op。
  #
  # ⚠️ **判据是「东西落地了」，不是「这条命令退 0」**（ISSUE #1961）—— 这一步红过一次
  # 而**没人看得出来**，形态是这句：
  #
  #   （原文）Failed to install browsers
  #   （原文）Error: Request to https://cdn.playwright.dev/…/chrome-win64.zip timed out after 30000ms
  #   浏览器装不上（`playwright install` 退非零）…      ← 话术自己打出来了
  #   Finished, code: 0, duration: 31.1s                ← 而 stage 报绿（`main()` 的返回码被丢）
  #
  # 三个面各自修掉了（退码转出去 / 装完按落点复验 / 下载失败给读数），口径见
  # 规范 §13.5.3.5–§13.5.3.6。
  #
  # ⚠️ **这一格 2026-10-16 从停用清单恢复**（ISSUE #1966）。它此前被登记进
  # `COMFYAPP_CI_DISABLED_GATES`，依据是下面这条取证读数（`cnb-ve6-1k51jaudm`）：
  #
  #   内置族（cdn.playwright.dev）+ 30s  → 5 次 `timed out after 30000ms`、0 字节
  #   配着的 npmmirror 根 + 120s        → `timed out after 120000ms`、0 字节（`cnb-oqf-...`）
  #   失败分支的逐候选探测             → 三条都只取回**小段**字节（582 / 1889 / 442），
  #                                      即「连得上、也收得到开头」，而大 body 停住
  #
  # 当时的结论写成「这台节点一次取不回那 120 MiB ⇒ 这一格要绿只有这一个条件」，
  # 而规范 §13.5.3.5「订正 ⑩ 的那句推论」把它订正成**「一次取不完」**：条件确实在
  # 链路上，但「怎么取」是仓库能改的那一半 —— 这一步**内部**现在多了一条通道
  # （分片取字节 + 编排：片长自适应、断了从已落盘的字节接着来；实现与判据见规范
  # §13.5.3.5「第七跑」那一小节），不另起 stage。
  #
  # 所以恢复的依据**不是**「节点网络修好了」，而是**取法换掉了**。
  #
  # ⚠️ **恢复后的第一跑读数已经到了**（`cnb-7oo-1k51r518b`，2026-10-16）：
  #
  #   自取：从 https://cdn.npmmirror.com/binaries/playwright 分片取这一件（可续传）
  #   自取成功：…\ms-playwright\chromium_headless_shell-1243\…\chrome-headless-shell.exe
  #   playwright install → Downloading FFmpeg (playwright ffmpeg v1011) × 5 次
  #                        → timed out after 120000ms → Download failure
  #   浏览器装不上（`playwright install` 退非零）…   ← 而浏览器**已经装好了**
  #
  # 两件事各是一半：「取法换掉了」成立（119 MiB 的自取在这台节点上真走完了），
  # 而红的是**另一件** —— 老路不只装浏览器，还会顺手拉 **ffmpeg**（chromium 的依赖，
  # ~2.5 MB），那件在同一条链路上照旧 0 字节。所以这一步现在在自取成功之后**按落点
  # 复验一次**（同一个 `browserExecutableExists()`），通过就直接放行、不再交给老路：
  # 本档真正要的是 headless shell（复验找的就是它），而 ffmpeg 只有录视频才用得上
  # （`playwright.config.ts` 没开 `video`）。理由与判据在 `ci-toolchain-browser-seed.mjs`
  # 的头注（`ci-toolchain-browser.mjs` 正卡在 900 行的硬闸上，那段只有一行 + 指路）。
  #
  # 下一笔账：`E2E 关键流程` 的首跑读数（它在自托管路径上仍然一次都没有跑到过）。
  #
  # ── 为什么这一格**不写** `image:`（ISSUE #1993 续；两次实测推翻了前一版）──
  #
  # 前一版这一格（与下面 `E2E 关键流程`）写着任务级 `image: mcr.microsoft.com/
  # playwright:v1.63.0-noble`，想用官方镜像里**已经装好**的 headless shell 绕开
  # 「120 MiB 取不回来」那条链路问题。现场读了两次，两次都是同一个回话：
  #
  #     （原文）Runner does not enable Docker.      ← 70~109ms 就退出，容器都没起
  #
  # 平台文档（本文件头注第 1 条抄的就是它）：「自定义 Runner **默认不开启 Docker
  # 能力**，构建脚本直接运行在宿主机上」。这句话对**任何**要求平台起容器的东西都成立，
  # 与「写在 stage 上还是 Job 上」无关 —— 前一版按「Job 级是另一种机制」去读，两跑
  # 各用一种写法，各红一次，答案都是同一句。
  #
  # 于是这里回到**宿主机直跑**（不写 `image:` = 默认档，见头注第 1 条那条 ⚠️）：
  # 这一格照旧走它已经量过很多次的链路 —— 分片自取 + 落点复验（§13.5.3.5「第七跑」），
  # 那条链路在这台机上真的把 119 MiB 取完过。
  #
  # 长期看，这一格最省事的一条仍然是「**把浏览器预装进节点的落点**」：装过一次之后
  # 它再也不碰网络（`环境前提` 会打一行「落点已有那一件」，那也是这一档现在的常态）。
  # `scripts/ci-image-plan.mjs` 那份节点镜像计划里已经带着这一步。
  #
  # ⚠️ **「怎样才允许写回去」也写在这里**，因为判据只能判形态、判不了那台机器：
  # 当天花板上出现「节点开了容器能力」这件事实（平台侧开、或换了台开了容器的机器），
  # 两格可以一起改回 `image:`（**同批**改 `tests/ci-image-identity.test.ts` 的名单、
  # `tests/ci-container-plan.test.ts` 的落点判据、本节注释与 §13.5.3.4.1.3/§13.5.3.4.1.5）。
  # 在那之前写它是**确定会红**的一条，不是「待补读数」。
  #
  # 三条随之作废的边界（留着它们是为了下一次别再走一遍弯路）：
  #   ① `PLAYWRIGHT_BROWSERS_PATH: /ms-playwright` 只在镜像里成立（宿主上没有那个
  #      路径）—— 现在**不写**，落点判据回到它自己的口径（`playwrightBrowsersRoot()`
  #      在 Windows 宿主上按 `%LOCALAPPDATA%` 推）；
  #   ② 镜像标签（`-noble` 与 Playwright 版本同批升）随 `image:` 一起撤掉；
  #   ③ 「容器格共用一份命名卷」那条桥（`volumes:`）**没有容器就没有跨容器这回事**，
  #      一并撤掉 —— 它原本要治的「每格重下 120 MiB」在宿主机上不成立（同一块盘）。
  # ⚠️ 这一格 2026-10-19 从 PR 撤到每日档（`每日浏览器安装`，理由与逐字同形的
  # script/env 都在那一格的注释里）。撤的是节奏不是账：`E2E 关键流程` 早已撤到
  # `每日全量E2E`，PR 上没有任何一步再用浏览器，而「节点能不能到下载根」是一次 PR
  # 改不动的事实。判据两头都钉着（`tests/no-platform-ci-config.test.ts`）：
  # PR 清单里撤掉的每一格必须在每日清单里有同名执行者；`每日浏览器安装` 必须排在
  # `每日全量E2E` 之前。上面那段「为什么不写 `image:`」的历史留在原处 —— 它讲的是
  # 这条流水线的形态，不属于某一格。

  # ── 工作区出处（**排在所有会写工作区的档之后**，ISSUE #2022）──
  #
  # 判三格，档位不一样，理由在脚本头注那张表里（一句话版：①「跑的是哪份源码」与
  # ②「tracked 面被谁改过」判红，③「冒出来的未跟踪文件」只取数）。
  #
  # 为什么**现在**就要这一档：让 CI 每次都热态跑，真正卡住的不是缓存技术而是
  # 「工作区每跑都换一个目录」—— `tsbuildinfo` / eslint 缓存 / `.next` 的键里都带绝对路径，
  # 路径一换就逐条 miss（`工作区复用读数` 已把形态定成「每次新建目录」）。要常驻一棵树，
  # 前提是先有一句机器可验的「这棵树就是声明的那一份、而且没被登记之外的人写过」；
  # 那句话此刻还没有执行者，这一档就是它。而②在今天**已经有牙**：本仓唯一会自己改
  # 工作区的是那两档 `--check --autofix`，名单派生自 `scripts/ci-autofix-duties.mjs`
  # （`AUTOFIX_DUTIES` 的 `outputs`），别的东西动了 tracked 面就会在这里点名。
  #
  # 为什么**排最后**：它判的是「整跑下来工作区成了什么样」。放在中间，后面的写者还没出手，
  # 结论必然是「干净」—— 那是「看起来验过了」的形态，与没验等价。
  #
  # 为什么**不写 `ifModify`**：它判的是工作区的**状态**而不是某棵树的文本；任何一次
  # 收窄都可能把「真正动了源码的那一档」筛掉，而这一档要抓的恰恰就是那种事。
  #
  # 逻辑不在这里写：与 `工具链自证` / `工作区复用读数` 同一条口径 —— 配置里的逻辑
  # 一条判据都测不到它，判定全部在 `scripts/ci-workspace-provenance.mjs`
  # （`tests/ci-workspace-provenance.test.ts` 判它）。

  # ── `工作区出处` 也离开这一档了（2026-10-28，随文档链三格同批）──────────────
  # 它判的是「这次运行的事实」（哪份源码、谁写的盘上文件），不是「这次改动」——
  # 与 2026-10-19 撤 `工具链自证` / `Python 可用性` 那批同一条理由（「只判节点/运行
  # 事实的格子不再每个 PR 都判」）。原文搬到 `.push-stages` 锚点，判据一字未改。

  # ── E2E：这一格也离开 PR 了（2026-10-19，被上面那次挪档**逼出来的**，不是新决定）──
  #
  # 先记实测的形态（`cnb-ob4-1k5828a36`，`E2E 关键流程` 185.8s 红，前面 34 格全绿）：
  #
  #   [WebServer] Error: Could not find a production build in the '.next' directory.
  #   Error: Timed out waiting 180000ms from config.webServer.
  #
  # 病根不是这条 lane 写错了，是 `playwright.config.ts` 旧的那句 `CI || PNPM_START ⇒ pnpm start`
  # 把两件独立的事绑成了一件：「这是不是一条 CI」与「这个工作区里有没有构建产物」。
  # 撤掉 `生产构建` 之后前者仍然成立、后者不再成立 ⇒ 它去起一台没有产物的生产服务器。
  # （这一族叫「红在没人声明过的东西上」—— 机制与那条显式旋钮 `COMFY_E2E_SERVER` 的
  #  四条形状写在 `playwright.config.ts` 的 `resolveWebServerCommand()` 头注里。）
  #
  # 两条出路里选了第二条：
  #   · 把 PR 这一格改成现场编译档（`COMFY_E2E_SERVER=dev`）—— **不走**。这一档在这台节点上
  #     从来没有读数，而本文件旧注释记着它的历史形态：首屏要现场编译，冷启动远超 180s 的
  #     等待窗口，冒烟用例集体超时（ISSUE #1834 的现场）。把它放上来得到的是一条**大概会红、
  #     红了又说不清是链路还是负载**的 lane —— 那比没有 lane 更坏，因为它教的是一致地忽略红。
  #     抬 `timeout` 换绿被 §11.13 / §13.6.4 明令禁止，剩下的杠杆只有把并发再往下压，
  #     而那是在猜一个没有读数的数。
  #   · **整格挪到每日那一跑**（`每日全量E2E`，跑不带任何收窄参数的整档）—— 走这条。
  #     它排在 `每日生产构建` 之后，同一分支的 stage 共享同一个工作区 ⇒ 产物真的在，
  #     并显式声明 `COMFY_E2E_SERVER: start` 把这件事写在一句话里，而不是留给「它是 CI」去推。
  #
  # ⚠️ **覆盖面没有变小，只是变晚**：整档是 `@critical` 的**超集**（29 条子集跑过的一切
  #   整档都跑）。失去的是「合并之前有人替这次改动跑一遍端到端」—— 与构建、与全量单测
  #   同一个 24 小时的取舍，而这条是那一串里最后剩下的那一格。
  #
  # `浏览器安装` 与 `环境前提` 留在 PR 上，各自还有一件在做事：`浏览器安装` 是每日那格的
  # 镜像源（两行 env 由判据钉同形），而落点在同一个 `%LOCALAPPDATA%` 上、同一台机共享 ⇒
  # PR 跑一次等于替第二天早上暖一次缓存；`环境前提` 2.4s，把「这台节点能不能到下载根」
  # 在便宜的位置说出来，那句结论每日那一跑也要用。
  # `MUST_ALWAYS_RUN` 里 `E2E 关键流程` 这个名字**刻意留着**（同 `生产构建`：谁把它加回 PR
  # 并顺手挂 `ifModify` 就红）。

  # ── 定时那一跑：会自己起一堆子进程的那两档，每天一次（ISSUE #2010 / #2018）──────
  #
  # 用户的要求原话：「生产构建改为定时任务，每天 1 次」，后来又是「生产构建放到每日档」。
  # 这两句把「**在哪跑**」「**什么时候跑**」与「**谁替这次改动背书**」三件事分开了，
  # 而本仓此前把前两件事合成了一件：
  #
  #   · `pull_request` 上原来那一格「生产构建」回答的是「**这次改动**能不能构建出来」——
  #     它随每一次推送跑，一天推十次就跑十次，而今天没推代码就一次都不跑。
  #     **2026-10-18 起这一格撤了**：同一份 `pnpm run build` 链在本地已经有一笔必须还的账
  #     （`新鲜度账` 那一步读 `FRESHNESS_TRACKS.artifact.dirty`），PR 上再跑一次是第二个
  #     执行者、不是第二份信息，而它是这台机上仅有的两档无并发旋钮的重档之一。
  #     「这次改动能不能构建」自此由**本地那笔账**答，代价与边界见规范 §13.5.23；
  #   · 这一条回答的是「**master 的 HEAD 今天能不能构建出来 / 全量单测能不能过**」——
  #     一天一条，与今天有没有人提交无关。
  #
  # 为什么后者是一件**独立**的事（不是同一条判据的重复）：
  #   · `next build` 的结论不只由源码决定：锁文件与 typedoc 的对不上、上游 advisory、
  #     Playwright 的下载根、节点上的 Python 解释器都会在某个早上变掉。PR 上那些
  #     「今天没人推」的日子，这些一概看不见。
  #   · 空转的形态是**最贵**的那种：构建链坏了两周而没人推代码，谁都不知道。
  #     PR 上跑那一格的时候，它要等**下一次有人提交**才炸出来，而那时已经很难分清
  #     是不是他改坏的；撤掉之后看见它的时机换成第二天 01:00 —— 两者都晚，区别是
  #     定时那一跑的归因不用猜（跑的就是 master 的 HEAD，那两周的账全在这一条上）。
  #
  # ── 形态：能机械导出的就与 PR 那条共用，不导出的一字不差地写清楚 ─────────
  #
  # · `<<: *common` —— runner / lock / env 与另外两条流水线**同一份锚点**。
  #   尤其 `runner.namespace: group` + `tags`：漏掉它这条会静默回落到计费的平台池，
  #   而定时任务是一天一条、**不会有人盯着**的那一类（形态判据见
  #   `tests/no-platform-ci-config.test.ts`：三条流水线的 `<<: *anchor` 引用数必须是 3）。
  # · 事件键是 `"crontab: 0 1 * * *"`（官方 `zh/build/crontab.md`）：
  #   平台按 `Asia/Shanghai` 解释，即**每天 01:00**。这个点换过两次：`0 4` →（2026-10-22 上午）
  #   `0 2` →（同日业主再拍）`0 0`。
  #   挑 04:00 那句理由是「离有人开工还有几个小时，红了有人在上班时看见」——它漏了半个前提：
  #   **这台机在那个时刻得醒着**（节点就是这台开发笔记本，夜里睡眠是默认状态而不是异常）。
  #   实测查得到的 5 次派发 0 次跑完：两次根本没落到这台机（`Prepare` 0.3s error、平台侧
  #   `labels: []`），一次睡满 3.0h 被 8640s 墙钟上限掐掉而**同格末尾仍打「通过 ✓」**。
  #   按四个早晨的睡眠窗口逐晚核过 ⇒ **04:00 缺勤 2 次、02:00 缺勤 1 次**：往前挪是在提高出勤率，
  #   不是在修前提。取证、逐晚数据与复现命令只有一份出处：**ISSUE #2114**，这里不重抄。
  #   挪到 `00:00` 换的是「人还没收工」那一侧：查得到的四晚入睡时刻是 00:37 / 07:09 / 06:09 /
  #   04:00:36 ⇒ **那四个夜里 00:00 那一刻机器都醒着**，出勤这一格它确实赢。
  #   ⚠️ 但样本只有四晚（10-22 那次 02:00 缺勤的入睡时刻没查到），**别把它读成保证**；
  #   ⚠️ 代价是同一句论证里的另一半分：`00:00` 也正是这台机**最可能还在被人用**的时刻，
  #   而 §13.5.21 把重档放到每日那一跑的理由恰恰是「没有并发的 PR、机器是空的」。
  #   这两条前提在这里对冲（出勤 ↑ 换 空机 ↓）⇒ 那一跑变慢**不再等于判据回归**，
  #   先按 §13.5.3.10 那张叠读数量具表定性；而「红了谁第一时间看见」也从「上班时」
  #   挪到「当天还坐在这台机前的时候」。
  #   ⚠️ 当年那半句「又避开整点那一档」没有做到（分钟段就是 `0`），这次不把它抄过来当依据。
  #   ⚠️ 「几点」本身没有判据在守：`tests/no-platform-ci-config.test.ts` 只认「分钟段与小时段是
  #   单值」= 每天一次，不认具体小时 ⇒ 漂了这个数字不会有任何红。改它就连这段注释一起改。
  #   但「**有没有执行**」现在有判据了（ISSUE #2114 出路 1）：`pnpm check:daily-attendance`
  #   答「上一次每日派发在窗口内跑成了什么样」，退 0 出勤 / 1 缺勤 / 2 没结论或取不到读数。
  #   它按 `crontab:` **前缀**认事件（就是为了让上面那次换时刻不打红它），先天限制也写在那里：
  #   睡过去的那一次不会有任何执行者当场判出来，只能被下一次核对读成「已经 N 小时没绿过」。
  # · **执行身份 = 最后修改本配置并推送的人**（官方原文的负责人机制）。所以这条
  #   流水线红了，找的是那个人 —— 这也是它比 PR 那条更需要写清楚「怎么重跑」的原因。
  #
  # ── 跑的是七格，每一格的入口都是**跑法脚本**而不是裸命令 ──────────────────
  #
  # 「只跑一格」是 #2010 立这条时的形态；#2018 加上全量单测、2026-10-18 的挪档把构建变成
  # **唯一**一处、同日「新鲜度都交 CI 跑」再补上 `每日浏览器安装` + `每日全量E2E`，
  # 于是它现在是「四格前提（安装 / Python / 建库 / 浏览器）+ 三档重档（单测 / 构建 /
  # 全量 E2E）」—— 也正是 `FRESHNESS_TRACKS` 那三档在平台侧的执行者。前提那几格不是装饰：
  # 每次构建都是全新 job 目录、`node_modules` 恒不在场（`工作区复用读数` 两跑实测，
  # 形态①），缺了它们这一条会在 01:00 以「找不到 next / 连不上库 / Executable doesn't
  # exist」的形态红 —— 而它一天只红这一次，等于当天没结论。
  #
  # `node scripts/ci-daily-build.mjs` 就是 `artifact-run.mjs`（同一个判据、同一份记账）
  # 外面一层**只属于定时那一跑**的壳：打事件身份、打一次工具链镜像读数、把退出码转出去。
  # 判据一个字都没在这里重写 —— 重写一遍得到的就是「两条产物链各自漂」（§12.12）。
  #
  # ⚠️ **不在这里跑全套门禁**：那是 `pull_request` 那条流水线的事。定时任务的价值是
  # 「一天一次、结论稳定」，而不是「把 PR 的门禁换个时间再跑一遍」——
  # 后者只会让节点每天多背一条十几分钟的流水线，换来一堆与今天改动无关的红。
master:
  # PR 端的全套门禁：PR 不合并就不该结束，这里一步不省。
  pull_request:
    # 两个锚点写在一个合并键里：`*common` 是 runner / lock / env（三条流水线共用），
    # `*pr_fail_stage` 是**这一条流水线独有**的那一档 `endStages`（形态与理由见那个锚点）。
    # ⚠️ 不能写成两行 `<<:`：同一层出现两个同名键是**非法 YAML**（`yaml` 解析器当场
    # `Map keys must be unique`），而它坏掉的方式是静默的 —— 两个键里只有一个生效，
    # 看上去配置完全正常。形态判据按 `- <<: *x` 数锚点引用（`tests/no-platform-ci-config.test.ts`
    # 要求引用数等于带 `stages:` 的流水线数），所以流式写法不被那条判据认出来时，
    # **要改的是判据的解析面，不是把锚点拆回去**。
    - <<: [*common, *pr_fail_stage]
      name: 质量门禁
      # GitHub 镜像令牌（ISSUE #2978）：从密钥仓库 `moon-read/GITHUB_MIRROR_TOKEN`
      # 导入，供主列那一格「GitHub 镜像同步」的推送与派发读取（#3051 起它在 `.gates` 里，
      # 不在 `endStages` 了 —— 但取令牌这一跳仍然只有 PR 那条流水线需要）。密钥文件里必须声明
      # `allow_slugs: [moon-read/comfy-app-t3]` —— 默认只有密钥仓库管理员触发的
      # 流水线才读得到，而 PR 的触发者是各 PR 作者；声明后按规则校验、忽略触发者角色。
      imports:
        - https://cnb.cool/moon-read/GITHUB_MIRROR_TOKEN/-/blob/main/envs.yml
      stages: *gates

  # 合并后的 push：**不重跑全套**（全套是 PR 那条的事；「不引入新代码」的前提依旧 ——
  # 合并提交由平台按**已被门禁验过的源分支 SHA** 生成）。这一档 2026-10-28 起是
  # 「树级校验档」：形态复核 + 前提安装 + 文档链三格 + 工作区出处，判的是合并后的树
  # 一致不一致（清单与顺序在 `.push-stages` 锚点 / `COMFYAPP_CI_PUSH_GATES`，
  # 判据双向核对）。若出现非合并提交（本地 --no-verify 就能做到），说明有变更绕过了
  # PR 与门禁 —— `合并形态复核` 一格红，失败即停，后面全部 skipped。
  push:
    - <<: *common
      name: master 合并复核
      lock: *lock_push
      # 与 PR 那条同一枚镜像令牌（`GitHub master 镜像` 那一格要读它）。密钥文件里已声明
      # `allow_slugs: [moon-read/comfy-app-t3]`（声明理由见 `pull_request` 那条上面的注释），
      # push 事件的触发者按同一规则校验。
      imports:
        - https://cnb.cool/moon-read/GITHUB_MIRROR_TOKEN/-/blob/main/envs.yml
      stages: *push_stages

  # 每天一次的定时任务（官方 `zh/build/crontab.md`）：`0 0 * * *` = 每天 01:00
  # （平台时区 `Asia/Shanghai`）。分支键必须是**明确的单一分支名** —— 定时任务
  # 不支持 glob，挂多分支会静默失效。所以它挂在 `master:` 下，取的是 master 的 HEAD。
  #
  # ⚠️ 这一条的 stage 清单是 `env.COMFYAPP_CI_DAILY_GATES`（不是上面那份 `GATES`）：
  # 两份清单对应两条不同的事件，混成一份之后「谁在什么时候跑」就再也读不出来了。
  "crontab: 0 1 * * *":
    - <<: *common
      name: 每日生产构建
      lock: *lock_daily
      stages: *daily_gates

  # ── 桌包那一档的定时口（ISSUE #2503）：02:00，与上面那一条**错开两小时** ──────────
  #
  # 为什么错开、而不是紧接着：这一档会把这台机压到满载（cargo 一段 + WiX `light` 一段，
  # 而 `src-tauri/target` 不在任何缓存槽里 ⇒ 每跑都是整棵依赖树的冷编译）。01:00 那一跑
  # 的 `每日单元测试` 是「唯一会因这台机器的负载而红的格子」（业主口径把它排在最后），
  # 两跑叠在一起得到的不是两条结论，是一份不可信的读数（§13.6.4.1「并发在场时墙钟不可读」）。
  #
  # 为什么它**不吃 `*daily_gates`**：业主口径是「独立一档」。清单与锁都是自己的
  # （`.package-gates` / `.lock-package`，理由写在那两个锚点头注里）—— 判据
  # `tests/no-platform-ci-config.test.ts` 双向钉：桌包那几格不许出现在每日清单里，
  # 而定时与手点两个触发口必须引用同一个 `*package_gates`。
  #
  # `*package_fail_stage` 是这一档**独有**的那一格 `endStages`（ISSUE #2550：这一档红了
  # 以前没有任何自动立案口）。写法与 `pull_request` 那条同形 —— 两个锚点写在一个合并键里，
  # 拆成两行 `<<:` 是非法 YAML（理由见 `pull_request` 那条同一处注释）。
  "crontab: 0 3 * * *":
    - <<: [*common, *package_fail_stage]
      name: 桌面成品包
      lock: *lock_package
      stages: *package_gates

  # ── 手动触发那一条：与 01:00 那一跑**同一份七格**（按钮在 `.cnb/web_trigger.yml`）──
  #
  # 为什么要有它：每日档回答的是「master 的 HEAD 今天行不行」，而**想知道答案的人不该
  # 等到下一次定时那一跑** —— 刚合完一笔碰构建链的改动、或夜里那次红的东西修好了想立刻复验时，
  # 手点一下就有结论。它与定时那一条跑的是同一份 `*daily_gates`（见上面那个锚点的理由），
  # 所以这里不需要第二份 stage 清单，也不需要第二条 `*_GATES` 环境变量。
  #
  # ⚠️ 两件事仍然不同，别把它们读成一件事：
  #   · **执行身份**：定时那一跑是「最后改这份配置并推送的人」（官方负责人机制），
  #     手动这一跑是**按按钮的那个人** —— 红了先说清是谁发起的，再按「上一次绿的构建」
  #     取 master 的提交区间定位（同 `ci-daily-build.mjs` 头注那条）。
  #   · **取的是哪份代码**：两条都取**按下时刻的 master HEAD**。手点不是「重跑历史那一跑」，
  #     而是「以现在这份 master 再跑一遍」—— 想复现夜里那次红的现场，得先确认 master
  #     在那之后没动过。
  #   · `lock` 与定时那一条**同一把** `*lock_daily`（不是靠 `<<: *common` 落回 `pr-`，
  #     那正是 ISSUE #2114 的第二条死因），所以两条不会同时在同一台机上
  #     压一遍七格：01:00 那一跑还在跑时手点，会被新一跑掐掉旧的一跑（`cancel-in-progress`）。
  web_trigger_daily:
    - <<: *common
      name: 每日档（手动触发）
      lock: *lock_daily
      stages: *daily_gates

  # ── 第三个触发口：CLI / API —— 与上面两条**同一份七格** ──
  #
  # 为什么手点那个按钮还不够：按钮要**一双手**。实测踩到的形态是「修完想立刻复验」那一趟 ——
  # 改动已经进 master，而自动化这边既打不开那个按钮、服务端也**拒绝**用 CLI 发
  # `web_trigger_daily`（`start-build` 的 `--event` 只认 `api_trigger` 或其前缀，实测 400
  # `Event must be 'api_trigger' or start with 'api_trigger_'.`）。于是「四格依次过」这件事
  # 的机器证明只能等人手点，或等到第二天 01:00 —— 这两条都不是修法，是把这个洞留给下一个人。
  #
  # 与 `web_trigger_daily` 的三点差别，都在这段配置里，不写在注释之外的任何地方：
  #   · **没有按钮声明文件**：那个口靠 `.cnb/web_trigger.yml` 与事件名成对；这一条不需要，
  #     事件名本身就是 API 的入参（所以它也没有 `reg` 那一层「哪些分支显示按钮」的问题，
  #     分支由 `--branch` 给，缺省是主分支）。
  #   · **事件名不许改名成别的形状**：`api_trigger` 开头是**服务端的硬要求**，写成
  #     `daily_api` 之后这一条会永远没人能触发，而配置解析期一个字都不报 ——
  #     这一条由 `tests/no-platform-ci-config.test.ts` 判（判前缀，不判整串名字）。
  #   · **执行身份**是发命令的那个人（与手点同族，都不是「最后改这份配置并推送的人」）。
  #
  # `lock` 与上面两条同为一把 `*lock_daily` ⇒ 三条触发口共用一把锁，不会出现两个触发口
  # 在同一台机上同时压一遍七格（表现为后起的那一跑把前一跑 `cancel-in-progress` 掉）。
  api_trigger_daily:
    - <<: *common
      name: 每日档（API 触发）
      lock: *lock_daily
      stages: *daily_gates

  # ── 单跑三档重档：手点 + API 各一条，两条引用同一张整表锚点 ────────────────
  #
  # 为什么六条而不是三条：`web_trigger_*` 那个口**打不开自动化**（服务端只认 `api_trigger`
  # 前缀，实测 400 `Event must be 'api_trigger' or start with 'api_trigger_'`），而
  # `api_trigger_*` 那一口**没有按钮**（按钮靠 `.cnb/web_trigger.yml` 与事件名成对）。
  # 两件事各自要有人答，所以各写一条 —— 而这两条**不许漂**，判据逐条比它们展开后的清单。
  #
  # 为什么六条都很短：每条只有一个 `stages: *oneshot_xxx`，一格正文都不写。
  # 前提是「引用得到同一张表」就够了；至于表里那些**副本**不许与每日那几格漂开，
  # 由「逐字相同」那条判据负责（形态与否证的完整经过见上面 `.oneshot-*` 那段的头注）。
  #
  # 每档自己一把锁（`lock: *lock_oneshot_*`，理由与那份退化史实见上面 `.lock-daily` 那段）：
  # 同一档被连点两次仍然只留最新那一跑；不同档各跑各的，也不再与每日档 / `push` 互掐 ——
  # ISSUE #2114 记下的第二个死因（`pr-` 一把共用）到这里才算修掉，现场读数：
  # `cnb-lm1-1k5h1otqt` 跑到 244.06 秒被一次无关 push 掐掉。
  web_trigger_e2e:
    - <<: *common
      name: 单跑全量E2E（手动触发）
      lock: *lock_oneshot_e2e
      stages: *oneshot_e2e
  web_trigger_build:
    - <<: *common
      name: 单跑生产构建（手动触发）
      lock: *lock_oneshot_build
      stages: *oneshot_build
  web_trigger_unit:
    - <<: *common
      name: 单跑全量单测（手动触发）
      lock: *lock_oneshot_unit
      stages: *oneshot_unit
  # 桌包那一档的手点口（ISSUE #2503）：与 02:00 那一条**同一份 `*package_gates`**。
  #
  # 为什么要有它：成品包是「人现在要拿一个包」的东西，而定时那一跑给的是「昨天 02:00 的
  # master」。手点这一口取的是**按下时刻的 master HEAD** —— 与每日档那两条触发口同一条口径，
  # 不是「重跑历史那一跑」。锁与定时那一条共用 `*lock_package`（同一件事不排两次），
  # 而它**不与每日档互掐**：两件事各自要结论。
  # 立案那一口与定时那条同一份（同 `*package_fail_stage`，ISSUE #2550）—— 手点这一跑
  # 的红同样要有人看得见，按钮按下的人就是这一跑的执行身份。
  web_trigger_package:
    - <<: [*common, *package_fail_stage]
      name: 桌面成品包（手动触发）
      lock: *lock_package
      stages: *package_gates
  api_trigger_e2e:
    - <<: *common
      name: 单跑全量E2E（API 触发）
      lock: *lock_oneshot_e2e
      stages: *oneshot_e2e
  api_trigger_build:
    - <<: *common
      name: 单跑生产构建（API 触发）
      lock: *lock_oneshot_build
      stages: *oneshot_build
  api_trigger_unit:
    - <<: *common
      name: 单跑全量单测（API 触发）
      lock: *lock_oneshot_unit
      stages: *oneshot_unit

  # ── 这里曾有第四个 API 口：`api_trigger_formatfix`（ISSUE #2362 / #2365）─────────
  #
  # 它存在的唯一理由是「`oxfmt 格式` 那一格在 PR 事件上推不动，要换一个可信事件做回写口」。
  # 整条链已在 ISSUE **#2610** 里摘掉，而摘它的证据正是这一口**没等到自己的前提**：
  # 委托那一跳本身也要权限，2026-10-28 实测 `start-build` 回
  # `403 / errcode 10023 / Missing required scopes: repo-cnb-trigger:rw` ——
  # PR 类事件的令牌只有 `repo-code:r`，而平台没有 YAML 开关能翻上去（#2362 当年写的
  # 「换执行口就能推」只对**被委托的那一条**成立，发起委托的那一跳照样被拒）。
  # 判与修现在都在本地（`.githooks/pre-commit` 的 D0 跑 `check-format.cjs --staged`），
  # 平台那一格只判。要恢复回写能力请先看 ISSUE **#2551**（给 CI 配单独令牌那件事），
  # 并且记住：**委托发不出去之前，PR 那一格不许再挂 `--autofix`**（就地修 + 回不去
  # = 让陈旧隐形的那一格，ISSUE #2231 同型）。

  # ── 锁编排探针（ISSUE #2363）：三条**一次性**流水线，读数取完即**整段删掉** ─────
  #
  # ⚠️ 三条都**不吃 `*common`**（没有 `- <<: *common`），`runner: group + tags: cnb` 逐字
  # 抄在这里。两件事各自都是刻意的：
  #   · 那条锚点自带的 `lock.key: pr-$CNB_PULL_REQUEST_IID` 在 `api_trigger` 上没有值 ⇒
  #     三条探针会落回同一把字面 `pr-` 并**互相掐停**，测出来的「相交/错开」就不再是
  #     探针自己那把锁的读数（探针先得自己不成为变量）；
  #   · 而「每条流水线都要引用 `*common`」那条判据（`tests/no-platform-ci-config.test.ts`
  #     的 `runner 是锚点展开后…`）会因为这三条而红 —— 这三条是**一次性**的，所以不放开
  #     那条判据，改为一段**有期限的例外 + 自毁判据**：`PROBE_PIPELINES` / `PROBE_BY`
  #     在那一刻之前是允许的例外，过了那一刻用例会点名要求删掉这一段。到期自动转红的
  #     形状，是为了让「临时」两个字不靠人的记性。
  #
  # 为什么它们必须写进 `.cnb.yml`、而不能靠 `start-build --config` 内联：
  # `--config` 只覆盖**被选中的那条流水线**的内容，不替代整份配置 —— 事件名本身要先在
  # 配置里存在。实测两次（带 `--config` / 把 `config` 塞进 `--data` 请求体）都是同一句
  # `[CONFIG_EVENT_EMPTY] … no api_trigger_probe_a event config for branch master and $`。
  # 所以探针脚下这一份配置是**必要条件**，不是图省事。
  #
  # 挂在 `master:` 下而不是另开 `$:` 段：平台允许 Issue / NPC 事件挂 `$:`，但**本仓
  # 这份配置里没有那一层**，而 `master:` 重复出现会静默吃掉后面那一段（同文件已有判据
  # 在拦）。`api_trigger` 从任意分支都能触发这里的事件名，所以探针照样不必等合入 master
  # 就能起跑。
  #
  # ⚠️ 三条各自要答的问题（Issue 第 1 节）：
  #   · `probe-2363-a` —— 同 key、`cancel-in-progress: false` + `wait: true`。第二条到达时是
  #     **排队**（等第一条跑完再进）/ **跳过** / **照样并行**，只有时间线能分开它；
  #     注意 `wait` 与 `cancel-in-progress` **不能同时写**（官方 schema 原文），所以这里
  #     写的是 `cancel-in-progress: false` 这个显式值 + `wait: true`；
  #   · `probe-2363-b` —— **stage 级** `lock`（`wait: true`）。schema 认不认、认了之后
  #     是不是**只**串这一格而流水线其余部分照跑，是「只串行重档」那条出路的前提；
  #   · `probe-2363-c` —— 一条锁都不写，作**对照**：没有它，前两条的「相交/错开」
  #     分不清是锁造成的还是节点本来就排队。
  #
  # 休眠时**不会跑**（没有事件推它们）；代价是配置多一小段、以及上面那条判据的例外。
  # 取数/起跑入口：`node scripts/ci-probe-lock-readout.mjs --help`。
  api_trigger_probe_a:
    # ⚠️ 每项都必须写全 `name:` 六空格那一层 —— 判定「换了一条流水线」的解析器认的是
    # 这个名字键（`pipelineLockAssignments()`）；省掉它的坏形态是：这三条会被**算进上一条**
    # 的锁归属里，于是「同一把锁给了不同的 stage 清单」当场误报（实测过）。
    # ⚠️ `runner.tags` 必须是 `win`，**不是** `cnb` —— 逐字抄 `.common` 那段。写成
    # `cnb` 的现场读数（四跑全中）：Prepare 96ms 就红在
    # `Pipeline prepare error: No runner for namespace: group tags: cnb, cpus: -1`，
    # 一格都没跑、也没有任何「锁」的读数。这条是「抄 `runner` 而不引用锚点」要付的
    # 代价：锚点里那两个值一起被抄对，否则探针连起跑都做不到，而红的形态与锁无关。
    - name: 探针A（同 key · wait:true · cancel-in-progress:false）
      runner:
        namespace: group
        tags:
          - win
      lock: *lock_probe_a
      stages:
        - name: 探针A-填满时间窗
          script: |
            echo "[probe-a] start sn=$env:CNB_BUILD_SN t=$(Get-Date -Format o)"
            Start-Sleep -Seconds 90
            echo "[probe-a] end t=$(Get-Date -Format o)"
          timeout: 20m
  api_trigger_probe_b:
    - name: 探针B（stage 级 lock · wait:true）
      runner:
        namespace: group
        tags:
          - win
      stages:
        - name: 探针B-填满时间窗
          lock:
            key: probe-2363-b-stage
            wait: true
            timeout: 900
          script: |
            echo "[probe-b] start sn=$env:CNB_BUILD_SN t=$(Get-Date -Format o)"
            Start-Sleep -Seconds 90
            echo "[probe-b] end t=$(Get-Date -Format o)"
          timeout: 20m
  api_trigger_probe_c:
    - name: 探针C（对照 · 一条锁都不写）
      runner:
        namespace: group
        tags:
          - win
      stages:
        - name: 探针C-填满时间窗
          script: |
            echo "[probe-c] start sn=$env:CNB_BUILD_SN t=$(Get-Date -Format o)"
            Start-Sleep -Seconds 90
            echo "[probe-c] end t=$(Get-Date -Format o)"
          timeout: 20m
