  #   **并发由 `scripts/ci-load.mjs` 按**现场核数**算（规范 §13.5.21），
  #   不是写死的 4，也不吃配置里那个 8**：这条件路径与本地跑不是同一种负载。
  #   ① 宿主机 16 逻辑核（无 docker、整机可用），vitest 若照默认铺开就有 ~15 个 worker；
  #   ② `--coverage` 给每个文件都加一层插桩（本机实测同样两文件 6.2s → 9.2s，约 +50% CPU）；
  #   ③ 这一套里有大量**真起子进程**的用例（git / node / prettier / PowerShell），超订的
  #      那一份直接从「等 CPU」变成「等子进程」—— 表现是 `Test timed out in 30000ms`，
  #      而单跑全绿。**这正是本仓已经量过的那一格**（规范 §11.13）：同一套、同一台机器，
  #      `maxWorkers=8` 在负载下仍出争用形态的红，`--maxWorkers=4` 才拿到「560 文件全绿」。
  #   降并发是**降负载**，不是放宽判据 —— 用例、预算、覆盖率阈值一个字不动；
  #   与 `.githooks/pre-commit` 的 C 组同一条理由（AGENTS 硬规则里那句
  #   「降负载的杠杆是并发，不是预算」）。代价是墙钟变长，这是这条路径上买得到的唯一交换。
  #
  #   ⚠️ **为什么不再写死 4**：`runner.cpus` 在自托管上是无效旋钮（官方文档原文见文件头
  #   第 2 条），平台也不给「同时跑几条」的旋钮 —— 那么配置里那个常数就与「这台机现在
  #   几个核」**没有任何联系**。节点换规格、或同一台机上多了第二条流水线时，它照旧按
  #   16 核铺开，现场形态是「既不推进也不报错」。现在由 `scripts/ci-load.mjs` 从
  #   `CNB_CPUS` 与 `os.availableParallelism()` 读现场核数、按「一个 worker 至少 8 核」
  #   折算（16 核 ⇒ 2 个 worker；档位从 4 抬到 8 的理由与三条边界见规范 §13.5.21，
  #   `受影响用例` 一格占整条流水线七成格时，这一档买的是「单条流水线
  #   别占满整台机」，承诺的是峰值占用减半、不是墙钟方向（实测见规范里那两跑对照）。
  #   唯一出处，
  #   判据见 `tests/ci-load.test.ts`；人还能用
  #   `COMFY_CI_MAX_WORKERS=1` 再压一档）。
  #
  #   ⚠️ **恢复时入口写 `scripts/full-suite-run.mjs`，不是裸 vitest**：
