  - name: lib Node-only 声明
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node_modules/.bin/vitest run tests/lib-node-only-declarations.test.ts

  # prettier 格式硬闸（规范 §13.5.1）：**从本地钩子挪到这里**（ISSUE #2010）。
  #
  # 判据一个字没改，挪的只是执行者 —— 与 §13.5.17 那三条文档面判据同一条口径：
  # **它的结论挡不住任何一次代码回归**。prettier 只格式化，格式漂了没有任何运行时
  # 症状，最坏后果是下一次 `--write` 产出一份与本次改动无关的全文件 diff（§13.7），
  # 而那一眼就看得出来、改回来也只是再跑一次格式化。它在**每一次提交**里的成本却是
  # 实测的：冷缓存 ~21s、热缓存 ~4.5s（钩子那一档带 `--staged`，但 `src/**` 是最高频
  # 的提交类别 —— 命中即扫全库，只省下「没碰到扫描面」那一半）。
  #
  # ⚠️ **不带 `--staged`**：平台侧的工作区就是这次要判的那份源码，`--staged` 在这里
  # 读的是「本次暂存」、恒为空 ⇒ 这一步会恒跳过（挂了等于没挂）。这与
  # `API 文档生成物与源同步` 那两条同一条处置，判据
  # `tests/doc-check-hook-wiring.test.ts` 双向钉住（钩子里没有 + 平台侧有且是全量档）。
  #
  # ⚠️ 紧邻的 `格式化提交分离` **不许跟着挪**：那条判的是「这次提交有没有把真实改动
  # 埋进几百个文件的重排里」，后果不可逆（blame 永久失真、squash 合并后本地再没有
  # 拆分的机会），它必须留在提交那一刻；prettier 那一条判的只是「文件现在干不干净」。
  #
  # 历史：它曾在这份清单里**被临时停用**（随 `ESLint 零警告` 一起让位给 E2E 调试，
  # 见 `COMFYAPP_CI_DISABLED_GATES` 的注释），本轮不是"恢复"而是"接管" —— 停用档的
  # 恢复条件（E2E 一绿 + 平台日志中文可读）与这条无关，钩子那边同时也撤了。
  - name: prettier 格式
    ifModify:
      - "src/**"
      - ".storybook/**"
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-format.cjs

  # 收窄（ISSUE #1993）：它判的是「这次提交里有多少个文件只是被 prettier 重排过」，
  # 而判据本体是**逐文件跑 prettier**（每个改动过的源文件一次）。所以面就是
  # 「`SOURCE_RE` 认的扩展名在仓库里可能出现的那几棵树」—— 由 `stagedRoots()` 现算，
  # 这里写的是它现算的**上界**（顶层目录 + 根级配置名）；判宽只会少省几秒，判窄是漏判。

  # ── 收进聚合档的那几格：**原文以注释形态留在这里**，名字仍在 `COMFYAPP_CI_GATES` 里 ──
  #
  # 这是「停用 ≠ 删除」机制在**页内**的第三种形态（前两种见 `COMFYAPP_CI_DISABLED_GATES`
  # 那两条注释）：这几格的名字**仍在 `COMFYAPP_CI_GATES` 里**（它们没被停用，是换了执行者
  # —— 从「各自一格」换成下面那一格的条目），所以判据对它们的要求不是「名字进停用清单」，
  # 而是**原文 grep 得回来**：`tests/ci-incremental-gates.test.ts` / `ci-autofix-duties.test.ts`
  # 双向核对「登记过的条目 ⇒ 聚合档里真有那一行」「这里带 `--autofix` 的条目 ⇒ 登记过」。
  #
  # ⚠️ 别把这段当成「已经删了」的残留清理掉：抹掉它 = 「悄悄删掉」与「收进聚合档」在配置里
  # 重新变成同形，而那正是本仓花了两轮才分开的两件事。
  #
  # 恢复动作（真要拆回独立 stage）：取消注释 → 从下面聚合档的条目表删掉同名条目
  # → 若它带 `ifModify`，同批登记进 `scripts/ci-incremental-gates.mjs`。
  #
  # - name: 格式化提交分离
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-reformat-only.cjs
  # - name: 生成态文档与源同步
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/render-doc-placeholders.cjs --check --autofix
  # - name: API 文档生成物与源同步
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-docs-api.cjs --check --autofix
  # - name: 覆盖率上报
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-coverage-report.mjs
  # - name: 文档引用与权威源一致
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-doc-references.cjs
  # - name: core 骨架单一事实源
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node_modules/.bin/vitest run tests/single-logger-channel.test.ts tests/container-single-access.test.ts tests/core-spine-single-source.test.ts
  # - name: 零消费导出
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-dead-exports.cjs
  # - name: core 出口纪律与基类纯度
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node_modules/.bin/vitest run tests/core-barrel-entry-discipline.test.ts tests/repository-base-purity.test.ts

  # ⚠️ **执行面是钩子注册表，不是条目表**（两轮合并之后的口径）：这一格跑的命令是
  # `node scripts/ci-heavy-gates.mjs`，而它读的正是 `.githooks/pre-commit` 里那些
  # `run "<标签>" <命令>` 步骤行 —— 也正是 `scripts/check-gate-executors.cjs` 认的出处
  # 之一。所以「把步骤从钩子里删掉」从来不是挪档的正确形态（那等于删执行者，而
  # `.cnb.yml` 不被台账认作执行者），正确形态是**步骤留在钩子里、由档位决定谁执行**。
  # `scripts/ci-heavy-gates.mjs` 里的 `HEAVY_GATES` 因此只剩**登记面**的角色（哪几条
  # 判据会自己改工作区 / 哪一格被收窄），不再是跑批清单。
  # 只剥那个「只看暂存区」的旗标（CI 没有暂存区，留着它判的是「空提交」= 一条恒绿的
  # 判据），参数一律不改 —— 改一个参数就是改判据。
  # 与上面几格同理带 cp936 那层：这一档红的时候必须读得出是哪一条判据、为什么。

  # ── 重档静态判据：一格，一次 job，内部按顺序逐条跑 ─────────────────────────
  #
  # 这一格取代了原来的 10 条各自独立的 stage（`格式化提交分离` / `生成态文档与源同步` /
  # `API 文档生成物与源同步` / `覆盖率上报` / `文档引用与权威源一致` / `core 骨架单一事实源` /
  # `零消费导出` / `core 出口纪律与基类纯度` …）。**判据一条没少**：每一条仍是原来那份
  # 脚本、原来那份参数，只是不再各占一个平台 stage。
  #
  # 为什么合（2026-10-19 的现场）：`cnb-hpl-1k5a0s6ss` 上 `ESLint 零警告` 一步撞到平台的
  # **20m stage 预算**被强杀（`任务超过最大执行时间而被强制关闭：20m0s`，脚本一行输出都没有），
  # 整条流水线后面三十格全 skipped。而同一台机、同一份工作区，`cnb-smq-1k59vlk3l` 上同一步
  # 是 305s 跑过的 —— 差的是**前面那二十几格各自付一次的 job 开销与盘上扫描**，不是 ESLint
  # 变慢了。也就是说：把判据一条条摊成 stage，每一格都在替**别的格**付重复成本。
  #
  # 合起来之后：本次 job 只付一次开销，条目在**进程内**串行（`scripts/ci-heavy-gates.mjs`），
  # 每条的墙钟、退出码、末若干行输出都打在同一份日志里 —— 红了照样一眼看出是哪一条，
  # 且不再是「一条红、后面全 skipped」的形态。
  #
  # ⚠️ **`ifModify` 收窄全部撤掉了**（原来 `格式化提交分离` / `覆盖率上报` 各带一组）。
  # 理由：`ifModify` 是按**整格**跳过的，一格装十条判据时它只能判成「本次没碰 → 十条都不跑」，
  # 而那十条的扫描面并不相同 —— 那正是本仓最不能有的形态（判据在场、结论静默变成放行）。
  # 现在格内**不跳**，代价是每次多跑几条秒级脚本；真要收窄也要回到「按条目判扫描面」，
  # 不是按格。
  #
  # 判据与执行者的对应关系仍在 `scripts/ci-heavy-gates.mjs` 的条目表里，谁被删了在
  # 本地钩子那一档与 `tests/ci-heavy-gates.test.ts` 当场红（条目 ⇄ 脚本两向核对）。
  - name: 重档静态判据
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-heavy-gates.mjs
    # 平台单 stage 默认预算 20m 是硬上限（实测强杀形态见上面那段），而这一格装的是原先
    # 十条各自独立跑的东西 —— 它的**合理**墙钟应当与原十格的总和同级。给 45m 是因为
    # `生成态文档与源同步` 在红的时候要就地重渲染 30 份文档（`--autofix` 那一跳），
    # 冷节点上不是秒级；`覆盖率上报` 在没有报告时只打一行。
    timeout: 45m

  # ── 构建与产物：**这一格 2026-10-18 起不在 PR 上跑了**（口径见 §13.5.23）──
  #
  # 旧形态（ISSUE #1979 立、#2010 补）：这里有一格 `生产构建`，跑 `artifact-run.mjs`
  # （内部就是 `pnpm run build`：next build → 剥私有输入 → 数产物 → 冒烟），
  # 实测 118s（`cnb-eus-1k5058g8l`）/ 131.0s（`cnb-ln5-1k540cfn1`，整条 12m14s 的 17.9%）。
  #
  # 撤掉它的理由**不是**「这一格判错了」，而是它在这里买不到第二份信息：
  #   · 这一档的机器执行者自 2026-10-19 起**整格都在每日那一条**（用户口径：「新鲜度都
  #     不要本地跑，都 CI 跑」）。本地 D0 那一步（`FRESHNESS_TRACKS.artifact`，它的
  #     `ciStage` 就指着下面的 `每日生产构建`）**只打读数、不再拦** —— 于是 PR 上这一跑
  #     与本地那笔账判的是**同一份 `pnpm run build` 链**，而两次都要付墙钟。
  #     判据一字未改，动的只有执行者（§13.5.17），口径与那条豁免的前提见 §11.8。
  #   · 它是这条线上仅有的两档**没有并发旋钮**的重档之一（另一档是全量单测）：
  #     `next build` 的 worker 数由构建器自己按机器定，`NODE_OPTIONS` 改的是内存不是并发
  #     （§13.5.21）。而不同 PR 之间仍然会叠加（`scripts/ci-load.mjs` 文件头），
  #     所以它在 PR 上的耗时是变量，**红了分不清是构建挂了还是机器被压死** ——
  #     §13.6.4 那一族在这条线上唯一的解法就是「别让两条流水线挤同一台机」。
  #
  # ⚠️ **代价写在明处，两条**：PR 上不再有任何机器执行者替你验构建，最晚 24 小时才知道；
  #   而撤掉本地自证要求之后**连「动了构建面就得当天自己跑」那道本地兜底也没有了**。
  #   接受它的理由与把全量单测放进每日档是同一条：那一跑判的就是同一份构建链，
  #   而机器空着时它才给得出可信墙钟。「构建链坏了两周而没人推代码」那种空转，
  #   正是每日档存在的理由 —— 那句话没有作废。
  #
  # 撤掉的是**这一格**，不是那三件仍在场的判据：`MUST_ALWAYS_RUN` 里 `生产构建` 这个名字
  # 刻意留着（谁把它加回来并挂上 `ifModify` 就红），`每日生产构建` 的入口与 `timeout`
  # 由 `tests/no-platform-ci-config.test.ts` 钉，「不许读到刚被自己刷新过的账」由
  # `tests/doc-check-hook-wiring.test.ts` 钉。

  # ── 浏览器安装（自托管节点是裸宿主机，没有镜像预装这一层）──
  #
  # `E2E 关键流程` 是这条流水线上**从来没有跑过**的一档（前几跑都断在 `单元测试`
  # 或 `生产构建`）。它第一次真跑到就红在浏览器缺件上，读数（`cnb-0rd-1k50unpnn`）：
  #
  #   期望的路径：…\ms-playwright\chromium_headless_shell-1243\…\chrome-headless-shell.exe
  #
  # 成因不是配置写错：**没有 docker 就没有「镜像里预装好浏览器」那层兜底**，而
  # `pnpm install` 不会拉 Playwright 的浏览器二进制（那是 `playwright install` 的事）。
  # 旧版 `docker.image: node:24` 那条路上这一格是白拿的，自托管把它还回来了。
  #
  # 为什么是「装」而不是「判红让人去装」：它与 Python 那一步的分工不同 —— 解释器可能
  # 在盘上、只是执行账号的 PATH 看不见（那要人改 PATH，所以 `--python-only` 探到就放行、
  # 探不到才红并给取证）；而浏览器二进制**只可能来自这一条命令**，机器上不存在
  # 「装了但探不到」的分支。所以这一步直接装。
  # 幂等：`playwright install` 对已存在的版本是 no-op。
  #
  # ⚠️ **判据是「东西落地了」，不是「这条命令退 0」**（ISSUE #1961）—— 这一步红过一次
  # 而**没人看得出来**，形态是这句：
  #
  #   （原文）Failed to install browsers
  #   （原文）Error: Request to https://cdn.playwright.dev/…/chrome-win64.zip timed out after 30000ms
  #   浏览器装不上（`playwright install` 退非零）…      ← 话术自己打出来了
  #   Finished, code: 0, duration: 31.1s                ← 而 stage 报绿（`main()` 的返回码被丢）
  #
  # 三个面各自修掉了（退码转出去 / 装完按落点复验 / 下载失败给读数），口径见
  # 规范 §13.5.3.5–§13.5.3.6。
  #
  # ⚠️ **这一格 2026-10-16 从停用清单恢复**（ISSUE #1966）。它此前被登记进
  # `COMFYAPP_CI_DISABLED_GATES`，依据是下面这条取证读数（`cnb-ve6-1k51jaudm`）：
  #
  #   内置族（cdn.playwright.dev）+ 30s  → 5 次 `timed out after 30000ms`、0 字节
  #   配着的 npmmirror 根 + 120s        → `timed out after 120000ms`、0 字节（`cnb-oqf-...`）
  #   失败分支的逐候选探测             → 三条都只取回**小段**字节（582 / 1889 / 442），
  #                                      即「连得上、也收得到开头」，而大 body 停住
  #
  # 当时的结论写成「这台节点一次取不回那 120 MiB ⇒ 这一格要绿只有这一个条件」，
  # 而规范 §13.5.3.5「订正 ⑩ 的那句推论」把它订正成**「一次取不完」**：条件确实在
  # 链路上，但「怎么取」是仓库能改的那一半 —— 这一步**内部**现在多了一条通道
  # （分片取字节 + 编排：片长自适应、断了从已落盘的字节接着来；实现与判据见规范
  # §13.5.3.5「第七跑」那一小节），不另起 stage。
  #
  # 所以恢复的依据**不是**「节点网络修好了」，而是**取法换掉了**。
  #
  # ⚠️ **恢复后的第一跑读数已经到了**（`cnb-7oo-1k51r518b`，2026-10-16）：
  #
  #   自取：从 https://cdn.npmmirror.com/binaries/playwright 分片取这一件（可续传）
  #   自取成功：…\ms-playwright\chromium_headless_shell-1243\…\chrome-headless-shell.exe
  #   playwright install → Downloading FFmpeg (playwright ffmpeg v1011) × 5 次
  #                        → timed out after 120000ms → Download failure
  #   浏览器装不上（`playwright install` 退非零）…   ← 而浏览器**已经装好了**
  #
  # 两件事各是一半：「取法换掉了」成立（119 MiB 的自取在这台节点上真走完了），
  # 而红的是**另一件** —— 老路不只装浏览器，还会顺手拉 **ffmpeg**（chromium 的依赖，
  # ~2.5 MB），那件在同一条链路上照旧 0 字节。所以这一步现在在自取成功之后**按落点
  # 复验一次**（同一个 `browserExecutableExists()`），通过就直接放行、不再交给老路：
  # 本档真正要的是 headless shell（复验找的就是它），而 ffmpeg 只有录视频才用得上
  # （`playwright.config.ts` 没开 `video`）。理由与判据在 `ci-toolchain-browser-seed.mjs`
  # 的头注（`ci-toolchain-browser.mjs` 正卡在 900 行的硬闸上，那段只有一行 + 指路）。
  #
  # 下一笔账：`E2E 关键流程` 的首跑读数（它在自托管路径上仍然一次都没有跑到过）。
  #
  # ── 为什么这一格**不写** `image:`（ISSUE #1993 续；两次实测推翻了前一版）──
  #
  # 前一版这一格（与下面 `E2E 关键流程`）写着任务级 `image: mcr.microsoft.com/
  # playwright:v1.63.0-noble`，想用官方镜像里**已经装好**的 headless shell 绕开
  # 「120 MiB 取不回来」那条链路问题。现场读了两次，两次都是同一个回话：
  #
  #     （原文）Runner does not enable Docker.      ← 70~109ms 就退出，容器都没起
  #
  # 平台文档（本文件头注第 1 条抄的就是它）：「自定义 Runner **默认不开启 Docker
  # 能力**，构建脚本直接运行在宿主机上」。这句话对**任何**要求平台起容器的东西都成立，
  # 与「写在 stage 上还是 Job 上」无关 —— 前一版按「Job 级是另一种机制」去读，两跑
  # 各用一种写法，各红一次，答案都是同一句。
  #
  # 于是这里回到**宿主机直跑**（不写 `image:` = 默认档，见头注第 1 条那条 ⚠️）：
  # 这一格照旧走它已经量过很多次的链路 —— 分片自取 + 落点复验（§13.5.3.5「第七跑」），
  # 那条链路在这台机上真的把 119 MiB 取完过。
  #
  # 长期看，这一格最省事的一条仍然是「**把浏览器预装进节点的落点**」：装过一次之后
  # 它再也不碰网络（`环境前提` 会打一行「落点已有那一件」，那也是这一档现在的常态）。
  # `scripts/ci-image-plan.mjs` 那份节点镜像计划里已经带着这一步。
  #
  # ⚠️ **「怎样才允许写回去」也写在这里**，因为判据只能判形态、判不了那台机器：
  # 当天花板上出现「节点开了容器能力」这件事实（平台侧开、或换了台开了容器的机器），
  # 两格可以一起改回 `image:`（**同批**改 `tests/ci-image-identity.test.ts` 的名单、
  # `tests/ci-container-plan.test.ts` 的落点判据、本节注释与 §13.5.3.4.1.3/§13.5.3.4.1.5）。
  # 在那之前写它是**确定会红**的一条，不是「待补读数」。
  #
  # 三条随之作废的边界（留着它们是为了下一次别再走一遍弯路）：
  #   ① `PLAYWRIGHT_BROWSERS_PATH: /ms-playwright` 只在镜像里成立（宿主上没有那个
  #      路径）—— 现在**不写**，落点判据回到它自己的口径（`playwrightBrowsersRoot()`
  #      在 Windows 宿主上按 `%LOCALAPPDATA%` 推）；
  #   ② 镜像标签（`-noble` 与 Playwright 版本同批升）随 `image:` 一起撤掉；
  #   ③ 「容器格共用一份命名卷」那条桥（`volumes:`）**没有容器就没有跨容器这回事**，
  #      一并撤掉 —— 它原本要治的「每格重下 120 MiB」在宿主机上不成立（同一块盘）。
  # ⚠️ 这一格 2026-10-19 从 PR 撤到每日档（`每日浏览器安装`，理由与逐字同形的
  # script/env 都在那一格的注释里）。撤的是节奏不是账：`E2E 关键流程` 早已撤到
  # `每日全量E2E`，PR 上没有任何一步再用浏览器，而「节点能不能到下载根」是一次 PR
  # 改不动的事实。判据两头都钉着（`tests/no-platform-ci-config.test.ts`）：
  # PR 清单里撤掉的每一格必须在每日清单里有同名执行者；`每日浏览器安装` 必须排在
  # `每日全量E2E` 之前。上面那段「为什么不写 `image:`」的历史留在原处 —— 它讲的是
  # 这条流水线的形态，不属于某一格。

  # ── 工作区出处（**排在所有会写工作区的档之后**，ISSUE #2022）──
  #
  # 判三格，档位不一样，理由在脚本头注那张表里（一句话版：①「跑的是哪份源码」与
  # ②「tracked 面被谁改过」判红，③「冒出来的未跟踪文件」只取数）。
  #
  # 为什么**现在**就要这一档：让 CI 每次都热态跑，真正卡住的不是缓存技术而是
  # 「工作区每跑都换一个目录」—— `tsbuildinfo` / eslint 缓存 / `.next` 的键里都带绝对路径，
  # 路径一换就逐条 miss（`工作区复用读数` 已把形态定成「每次新建目录」）。要常驻一棵树，
  # 前提是先有一句机器可验的「这棵树就是声明的那一份、而且没被登记之外的人写过」；
  # 那句话此刻还没有执行者，这一档就是它。而②在今天**已经有牙**：本仓唯一会自己改
  # 工作区的是那两档 `--check --autofix`，名单派生自 `scripts/ci-autofix-duties.mjs`
  # （`AUTOFIX_DUTIES` 的 `outputs`），别的东西动了 tracked 面就会在这里点名。
  #
  # 为什么**排最后**：它判的是「整跑下来工作区成了什么样」。放在中间，后面的写者还没出手，
  # 结论必然是「干净」—— 那是「看起来验过了」的形态，与没验等价。
  #
  # 为什么**不写 `ifModify`**：它判的是工作区的**状态**而不是某棵树的文本；任何一次
  # 收窄都可能把「真正动了源码的那一档」筛掉，而这一档要抓的恰恰就是那种事。
  #
  # 逻辑不在这里写：与 `工具链自证` / `工作区复用读数` 同一条口径 —— 配置里的逻辑
  # 一条判据都测不到它，判定全部在 `scripts/ci-workspace-provenance.mjs`
  # （`tests/ci-workspace-provenance.test.ts` 判它）。
  - name: 工作区出处
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-workspace-provenance.mjs
    # 秒级（两次 git 调用 + 一次追加写）。给 5m 与 `工作区复用读数` 同款：只是
    # 「卡死要早报」的量级余量，判据本身远小于它。
    timeout: 5m

  # ── E2E：这一格也离开 PR 了（2026-10-19，被上面那次挪档**逼出来的**，不是新决定）──
  #
  # 先记实测的形态（`cnb-ob4-1k5828a36`，`E2E 关键流程` 185.8s 红，前面 34 格全绿）：
  #
  #   [WebServer] Error: Could not find a production build in the '.next' directory.
  #   Error: Timed out waiting 180000ms from config.webServer.
  #
  # 病根不是这条 lane 写错了，是 `playwright.config.ts` 旧的那句 `CI || PNPM_START ⇒ pnpm start`
  # 把两件独立的事绑成了一件：「这是不是一条 CI」与「这个工作区里有没有构建产物」。
  # 撤掉 `生产构建` 之后前者仍然成立、后者不再成立 ⇒ 它去起一台没有产物的生产服务器。
  # （这一族叫「红在没人声明过的东西上」—— 机制与那条显式旋钮 `COMFY_E2E_SERVER` 的
  #  四条形状写在 `playwright.config.ts` 的 `resolveWebServerCommand()` 头注里。）
  #
  # 两条出路里选了第二条：
  #   · 把 PR 这一格改成现场编译档（`COMFY_E2E_SERVER=dev`）—— **不走**。这一档在这台节点上
  #     从来没有读数，而本文件旧注释记着它的历史形态：首屏要现场编译，冷启动远超 180s 的
  #     等待窗口，冒烟用例集体超时（ISSUE #1834 的现场）。把它放上来得到的是一条**大概会红、
  #     红了又说不清是链路还是负载**的 lane —— 那比没有 lane 更坏，因为它教的是一致地忽略红。
  #     抬 `timeout` 换绿被 §11.13 / §13.6.4 明令禁止，剩下的杠杆只有把并发再往下压，
  #     而那是在猜一个没有读数的数。
  #   · **整格挪到每日那一跑**（`每日全量E2E`，跑不带任何收窄参数的整档）—— 走这条。
  #     它排在 `每日生产构建` 之后，同一分支的 stage 共享同一个工作区 ⇒ 产物真的在，
  #     并显式声明 `COMFY_E2E_SERVER: start` 把这件事写在一句话里，而不是留给「它是 CI」去推。
  #
  # ⚠️ **覆盖面没有变小，只是变晚**：整档是 `@critical` 的**超集**（29 条子集跑过的一切
  #   整档都跑）。失去的是「合并之前有人替这次改动跑一遍端到端」—— 与构建、与全量单测
  #   同一个 24 小时的取舍，而这条是那一串里最后剩下的那一格。
  #
  # `浏览器安装` 与 `环境前提` 留在 PR 上，各自还有一件在做事：`浏览器安装` 是每日那格的
  # 镜像源（两行 env 由判据钉同形），而落点在同一个 `%LOCALAPPDATA%` 上、同一台机共享 ⇒
  # PR 跑一次等于替第二天早上暖一次缓存；`环境前提` 2.4s，把「这台节点能不能到下载根」
  # 在便宜的位置说出来，那句结论每日那一跑也要用。
  # `MUST_ALWAYS_RUN` 里 `E2E 关键流程` 这个名字**刻意留着**（同 `生产构建`：谁把它加回 PR
  # 并顺手挂 `ifModify` 就红）。

  # ── 定时那一跑：会自己起一堆子进程的那两档，每天一次（ISSUE #2010 / #2018）──────
  #
  # 用户的要求原话：「生产构建改为定时任务，每天 1 次」，后来又是「生产构建放到每日档」。
  # 这两句把「**在哪跑**」「**什么时候跑**」与「**谁替这次改动背书**」三件事分开了，
  # 而本仓此前把前两件事合成了一件：
  #
  #   · `pull_request` 上原来那一格「生产构建」回答的是「**这次改动**能不能构建出来」——
  #     它随每一次推送跑，一天推十次就跑十次，而今天没推代码就一次都不跑。
  #     **2026-10-18 起这一格撤了**：同一份 `pnpm run build` 链在本地已经有一笔必须还的账
  #     （`新鲜度账` 那一步读 `FRESHNESS_TRACKS.artifact.dirty`），PR 上再跑一次是第二个
  #     执行者、不是第二份信息，而它是这台机上仅有的两档无并发旋钮的重档之一。
  #     「这次改动能不能构建」自此由**本地那笔账**答，代价与边界见规范 §13.5.23；
  #   · 这一条回答的是「**master 的 HEAD 今天能不能构建出来 / 全量单测能不能过**」——
  #     一天一条，与今天有没有人提交无关。
  #
  # 为什么后者是一件**独立**的事（不是同一条判据的重复）：
  #   · `next build` 的结论不只由源码决定：锁文件与 typedoc 的对不上、上游 advisory、
  #     Playwright 的下载根、节点上的 Python 解释器都会在某个早上变掉。PR 上那些
  #     「今天没人推」的日子，这些一概看不见。
  #   · 空转的形态是**最贵**的那种：构建链坏了两周而没人推代码，谁都不知道。
  #     PR 上跑那一格的时候，它要等**下一次有人提交**才炸出来，而那时已经很难分清
  #     是不是他改坏的；撤掉之后看见它的时机换成第二天 04:00 —— 两者都晚，区别是
  #     定时那一跑的归因不用猜（跑的就是 master 的 HEAD，那两周的账全在这一条上）。
  #
  # ── 形态：能机械导出的就与 PR 那条共用，不导出的一字不差地写清楚 ─────────
  #
  # · `<<: *common` —— runner / lock / env 与另外两条流水线**同一份锚点**。
  #   尤其 `runner.namespace: group` + `tags`：漏掉它这条会静默回落到计费的平台池，
  #   而定时任务是一天一条、**不会有人盯着**的那一类（形态判据见
  #   `tests/no-platform-ci-config.test.ts`：三条流水线的 `<<: *anchor` 引用数必须是 3）。
  # · 事件键是 `"crontab: 0 4 * * *"`（官方 `zh/build/crontab.md`）：
  #   平台按 `Asia/Shanghai` 解释，即**每天 04:00**。挑这个点的理由只有一条：
  #   它离「有人开工」还有几个小时，红了有人在上班时看见；而它又不在整点高峰上
  #   （最小调度间隔是 5 分钟，整点那一档是全平台最挤的位置）。
  # · **执行身份 = 最后修改本配置并推送的人**（官方原文的负责人机制）。所以这条
  #   流水线红了，找的是那个人 —— 这也是它比 PR 那条更需要写清楚「怎么重跑」的原因。
  #
  # ── 跑的是七格，每一格的入口都是**跑法脚本**而不是裸命令 ──────────────────
  #
  # 「只跑一格」是 #2010 立这条时的形态；#2018 加上全量单测、2026-10-18 的挪档把构建变成
  # **唯一**一处、同日「新鲜度都交 CI 跑」再补上 `每日浏览器安装` + `每日全量E2E`，
  # 于是它现在是「四格前提（安装 / Python / 建库 / 浏览器）+ 三档重档（单测 / 构建 /
  # 全量 E2E）」—— 也正是 `FRESHNESS_TRACKS` 那三档在平台侧的执行者。前提那几格不是装饰：
  # 每次构建都是全新 job 目录、`node_modules` 恒不在场（`工作区复用读数` 两跑实测，
  # 形态①），缺了它们这一条会在 04:00 以「找不到 next / 连不上库 / Executable doesn't
  # exist」的形态红 —— 而它一天只红这一次，等于当天没结论。
  #
  # `node scripts/ci-daily-build.mjs` 就是 `artifact-run.mjs`（同一个判据、同一份记账）
  # 外面一层**只属于定时那一跑**的壳：打事件身份、打一次工具链镜像读数、把退出码转出去。
  # 判据一个字都没在这里重写 —— 重写一遍得到的就是「两条产物链各自漂」（§12.12）。
  #
  # ⚠️ **不在这里跑全套门禁**：那是 `pull_request` 那条流水线的事。定时任务的价值是
  # 「一天一次、结论稳定」，而不是「把 PR 的门禁换个时间再跑一遍」——
  # 后者只会让节点每天多背一条十几分钟的流水线，换来一堆与今天改动无关的红。
master:
  # PR 端的全套门禁：PR 不合并就不该结束，这里一步不省。
  pull_request:
    - <<: *common
      name: 质量门禁
      stages: *gates

  # 合并后的 push：不重跑全套。合并提交由平台按**已被门禁验过的源分支 SHA**
  # 生成，不引入新代码；保留的这条是形态复核 —— 落到 master 的必须是 PR 合并
  # 形态。若出现非合并提交（本地 --no-verify 就能做到），说明有变更绕过了 PR
  # 与门禁，那要拦下。
  push:
    - <<: *common
      name: master 合并复核
      stages:
        - name: 合并形态复核
          # ⚠️ 这一格是**唯一**没钉控制台编码的 stage（其余每个 `script` 都以
          # `$enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc;` 开头）。
          # 补上它**不改变今天的读数**（抓取端按宿主 ANSI 代码页解，钉什么都被它按
          # 936 读一遍），但它让这一步不再依赖「控制台代码页恰好是多少」这个**继承
          # 来的**状态 —— 那正是这台机器上刚刚变过一次的东西（936 → 65001）。
          script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-branch-guard.cjs --merge-commit

  # 每天一次的定时任务（官方 `zh/build/crontab.md`）：`0 4 * * *` = 每天 04:00
  # （平台时区 `Asia/Shanghai`）。分支键必须是**明确的单一分支名** —— 定时任务
  # 不支持 glob，挂多分支会静默失效。所以它挂在 `master:` 下，取的是 master 的 HEAD。
  #
  # ⚠️ 这一条的 stage 清单是 `env.COMFYAPP_CI_DAILY_GATES`（不是上面那份 `GATES`）：
  # 两份清单对应两条不同的事件，混成一份之后「谁在什么时候跑」就再也读不出来了。
  "crontab: 0 4 * * *":
    - <<: *common
      name: 每日生产构建
      stages: *daily_gates

  # ── 手动触发那一条：与 04:00 那一跑**同一份七格**（按钮在 `.cnb/web_trigger.yml`）──
  #
  # 为什么要有它：每日档回答的是「master 的 HEAD 今天行不行」，而**想知道答案的人不该
  # 等到早上四点** —— 刚合完一笔碰构建链的改动、或夜里那次红的东西修好了想立刻复验时，
  # 手点一下就有结论。它与定时那一条跑的是同一份 `*daily_gates`（见上面那个锚点的理由），
  # 所以这里不需要第二份 stage 清单，也不需要第二条 `*_GATES` 环境变量。
  #
  # ⚠️ 两件事仍然不同，别把它们读成一件事：
  #   · **执行身份**：定时那一跑是「最后改这份配置并推送的人」（官方负责人机制），
  #     手动这一跑是**按按钮的那个人** —— 红了先说清是谁发起的，再按「上一次绿的构建」
  #     取 master 的提交区间定位（同 `ci-daily-build.mjs` 头注那条）。
  #   · **取的是哪份代码**：两条都取**按下时刻的 master HEAD**。手点不是「重跑历史那一跑」，
  #     而是「以现在这份 master 再跑一遍」—— 想复现夜里那次红的现场，得先确认 master
  #     在那之后没动过。
  #   · `lock` 与定时那一条**同一个 key**（`<<: *common`），所以两条不会同时在同一台机上
  #     压一遍七格：04:00 那一跑还在跑时手点，会被新一跑掐掉旧的一跑（`cancel-in-progress`）。
  web_trigger_daily:
    - <<: *common
      name: 每日档（手动触发）
      stages: *daily_gates

  # ── 第三个触发口：CLI / API —— 与上面两条**同一份七格** ──
  #
  # 为什么手点那个按钮还不够：按钮要**一双手**。实测踩到的形态是「修完想立刻复验」那一趟 ——
  # 改动已经进 master，而自动化这边既打不开那个按钮、服务端也**拒绝**用 CLI 发
  # `web_trigger_daily`（`start-build` 的 `--event` 只认 `api_trigger` 或其前缀，实测 400
  # `Event must be 'api_trigger' or start with 'api_trigger_'.`）。于是「四格依次过」这件事
  # 的机器证明只能等人手点，或等到第二天 04:00 —— 这两条都不是修法，是把这个洞留给下一个人。
  #
  # 与 `web_trigger_daily` 的三点差别，都在这段配置里，不写在注释之外的任何地方：
  #   · **没有按钮声明文件**：那个口靠 `.cnb/web_trigger.yml` 与事件名成对；这一条不需要，
  #     事件名本身就是 API 的入参（所以它也没有 `reg` 那一层「哪些分支显示按钮」的问题，
  #     分支由 `--branch` 给，缺省是主分支）。
  #   · **事件名不许改名成别的形状**：`api_trigger` 开头是**服务端的硬要求**，写成
  #     `daily_api` 之后这一条会永远没人能触发，而配置解析期一个字都不报 ——
  #     这一条由 `tests/no-platform-ci-config.test.ts` 判（判前缀，不判整串名字）。
  #   · **执行身份**是发命令的那个人（与手点同族，都不是「最后改这份配置并推送的人」）。
  #
  # `lock` 同样继承 `*common` ⇒ 三条触发口共用一把锁，不会出现两个触发口在同一台机上
  # 同时压一遍七格（表现为后起的那一跑把前一跑 `cancel-in-progress` 掉）。
  api_trigger_daily:
    - <<: *common
      name: 每日档（API 触发）
      stages: *daily_gates
