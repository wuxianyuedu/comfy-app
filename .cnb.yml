# CNB 云原生构建流水线 —— 跑在**根组织自托管 Windows 节点**上（ISSUE #1959）
#
# 这份配置是 ISSUE #623「平台侧用不起、配置删除」的**一次决策反转**，反转的
# 依据是一条前提被推翻：自托管 Runner 走宿主机、不参与核时计费。官方文档
# （docs.cnb.cool/zh/build/build-node.html「限制」一节）原文：
#
#   「自定义 Runner 默认不开启 Docker 能力，构建脚本直接运行在宿主机上，因此：
#     runner.cpus 配置无效……不参与核时计费。」
#
# 而 #623 的全部推理都建立在计费上（160 核时/月 ÷ 8 核 = 一个月约二十次 PR）。
# 计费项没了，那条结论对这条件路径不再成立。**但反转的不只是「能不能跑」**，
# 还有下面这几条形态变化 —— 它们才是这份文件与旧版差别最大、也最容易踩的地方。
#
# ── 与旧版（Linux 平台池 + docker.image）的五条形态差异 ──────────────────
#
# 1. **没有 docker，工具链必须预装在宿主机上**。旧版靠 `docker.image: node:24`
#    提供 Node，这条路在自托管上不能当构建环境用（官方写「`pipeline.docker.image` 不会
#    生效」；探针的读数更准一句：**会**被执行，只是起不来 —— 见 §13.5.3.4.1.6）。
#    因此本文件**不声明 `docker:` 与 `volumes:`**，而是把「宿主机该有什么」
#    变成第一条流水线步骤去**验**（见下「工具链自证」）—— 环境要求写进配置里
#    没人读，写成会红的断言才有人管。
#
#    ⚠️ **「任务级 `image:` 能起容器」这条同样不成立（2026-10-17 读数订正）**：
#    `pipeline.docker.image` 失效之外，**任务级 `image:` 在这条路径上直接红** ——
#    实测 `cnb-cqk-1k550gpp2`（PR #2003 那一跑，源分支就是「给两格加 `image:`」那次）：
#
#      （原文）浏览器安装  error [70ms]  →  Runner does not enable Docker.
#
#    70 毫秒、脚本一行都没执行，于是带 `image:` 的 stage **必然**红 —— 但红的原因是
#    **平台没给这台 runner 开容器能力**，不是「这台机器上没有 docker daemon」。后半句
#    是上一版写错的因果：探针（`pipeline.docker.image` 那条码路）里 runner 真的执行了
#    `docker info`（退 0）与 `docker pull node:24`（退 0），死在它把 `docker run` 拼成了
#    Windows 容器形态（`-w c:\workspace`）。读数为啥与本仓结论同向、以及要谁做什么才能
#    改写回 `image:`，见规范 §13.5.3.4.1.6。
#    所以本仓的形态只有一档：**整条宿主机直跑，一格都不写 `image:`**。
#    判据在 `tests/ci-image-identity.test.ts`：进容器的 stage 名单必须是**空**的
#    —— 多一格就红，理由与那次读数一起写在 `scripts/ci-image-identity.mjs` 的头注。
#    （官方 `build-node.md` 只写了「`pipeline.docker.image` 等不会生效」，
#    `script-vs-plugin.md` 讲的是平台池那种形态；两句都真，只是它们**不构成**
#    「任务级 image 在这条路上可用」的推论 —— 那次 70ms 的红就是这条推论的反例。）
#
# 2. **`runner.cpus` 无效，故不声明**。旧版写 `cpus: 8` 是为了「避免分配到的节点
#    规格随扩缩容变化把耗时读成回归」，而自托管上整机资源直接可用、这个键被忽略；
#    留着它只会让人以为核数被控制了。
#
# 3. **脚本语言是 PowerShell，不是 POSIX sh**。自托管 Windows 上 stage script
#    默认走 PowerShell，旧的 `rm -rf` / `mkdir -p` / `diff -q` / `>/dev/null` 一律
#    不成立（`rm` 是 Remove-Item 的别名，但没有 `-rf`；`mkdir -p` 会被当成字面参数）。
#    本文件里凡涉及文件系统 / 分支流程的地方都写成 PowerShell 原生的样子。
#
# 4. **OverlayFS 不可用，秒级克隆降级为普通 git clone**。每一次构建都是全量 clone，
#    这是这条件路径的固定成本，没有配置能省掉它。
#
# 5. **节点离线会静默改派**。文档原文：节点「离线、被临时禁用，或资源使用达到上限」
#    时系统会自动尝试重新分配到其他可用节点，实在没有才失败。在自托管这一档上
#    「其他可用节点」就是计费的平台池 —— 于是最坏情况是**悄悄花回核时**，而没有任何
#    报错。诊断靠日志里那一行 `runner.namespace` / 实际标签，见 §13.5.3 的「怎么确认
#    真的跑在自托管上」。
#
# 6. **stage shell 是 PowerShell，而它的输出编码默认是 CP936**（2026-10-16 补）。
#    Node 往管道里写的是 UTF-8 字节，PowerShell 拿 `[Console]::OutputEncoding`
#    （中文 Windows 上 = CP936）去解，再按同一个编码吐回给平台 —— 于是**所有中文
#    日志在平台侧都是乱码**：那行「起 Playwright 前」的读数（原文见
#    `e2e/support/preflight-ports.mjs` 文件头）在平台上呈现为 GBK 误读形态、
#    完全不可读，这就是「UTF-8 被当 GBK 读了一遍」的现场（ISSUE #2257：仓里不存
#    乱码字面 —— 手抄进来的那份已是二次转码产物，个别字节不可还原，不能冒充
#    「逐字」）。平台自己那条错误行（`任务执行失败，返回码：1`）
#    是好好的，所以病不在平台解码侧，在 stage shell 这一层。
#    故**每个 stage 的脚本都以
#    `$enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc;` 开头**
#    （单行脚本用 `;` 接，块脚本写成第一行）；本地不受影响（本地直接调 node，
#    没有这一层转发）。⚠️ 这一句不是装饰：**红的时候最该读的那些行正好是中文**。
#
#    ⚠️⚠️ **但它不是全部，而且「抓取端按宿主 ANSI 代码页解码」这句推断已被证否**
#    （2026-10-16 晚两次探针读数，逐字相同）：
#
#      · 把控制台钉成 65001 之后，PS 原生 / cmd / node **三层的中文仍然同一种乱法**
#        ⇒ 解码端**不是**按当前控制台代码页解；
#      · 那台机的**宿主 ANSI 代码页已经换成 UTF-8**（系统区域设置里勾了「使用
#        Unicode UTF-8 提供全球语言支持」并重启过 —— 本文件读数行里那个值也从 936
#        变成了 65001），而乱码**一个字没变** ⇒ 解码端**也不是**按宿主 ANSI 代码页解。
#
#    同一份日志里还有一组更硬的对照：**runner 自己打的行（`script` 原文回显）是完好
#    中文**，而**子进程输出的每一行**都是「UTF-8 字节按 CP936 解」⇒ 解码发生在
#    **子进程输出那一跳**，而它用的编码是**不与宿主设置联动的 CP936**。
#
#    所以「机器侧改一处全好」这条路**不成立**（已经改过、也重启过，读数说没用）。
#    仓库侧只剩一条：**让每个字节以 CP936 出口**（逐 stage 转码）。本 stage 第 4 行探针
#    就是用来一次定死这件事的（直接以 CP936 字节写 stdout）。
#    `scripts/ci-console-encoding.mjs` 头注与规范 §13.5.3.5 记着读数与判读。
#
#    ⚠️⚠️ **那条出路 2026-10-16 晚已经有执行者了**（ISSUE #1977）：每个 stage 的命令
#    现在都包在 `scripts/ci-cp936-exit.mjs` 外面 ——
#
#      node scripts/ci-cp936-exit.mjs -- <真命令>
#
#    它起那条命令、把输出交给 PowerShell **按 936 重发**、再把退出码原样转出去。
#    两件事别搞混：**钉 65001 照旧要留**（它让 PS 把 Node 的 UTF-8 **读对**，是转码能
#    拿对字节的前提 —— 直接 `chcp 936` 会先毁掉解码，转出来的只是乱码换了个编码），
#    新增的只是「读对了之后再按 CP936 写回」那一跳。Node 没有 GBK 编码器
#    （`TextEncoder("gbk")` 静默落到 UTF-8），所以转码这一步只能是 PowerShell 的
#    `GetEncoding(936)`；判据由 Node 的 `TextDecoder("gbk")` 反向复算
#    （`tests/ci-cp936-exit.test.ts`）。
#    ⚠️ 写成 `$enc=…` 而不是直接 `[Console]::OutputEncoding=…` 是**被咬过**：
#    YAML 里 `[` 开头的纯量是**流式序列**，那样写整份文件解析不过
#    （prettier 的 YAML 解析器当场报 `SyntaxError: Unexpected scalar at node end`，
#    而平台侧只会表现为「流水线起不来」）。判 `.cnb.yml` 的语法用
#    `pnpm exec prettier --check .cnb.yml` —— 它带 YAML 解析器。
#
# ── 四条流水线：谁在什么事件上跑 ────────────────────────────────────────
#
#   质量门禁        pull_request（不合并就不该结束）
#   master 合并复核  push（只复核「确实是 PR 合并进来的」，不重跑全套）
#   每日生产构建     "crontab: 0 1 * * *"（每天 01:00；机器空着、没有并发 PR、
#                    **且这台机那时刻醒着**才拿得到的那一跑（出勤实测见 ISSUE #2114）
#                    —— 全量单测 / 构建 / 全量 E2E 都在这条上，
#                    口径见 §13.5.23。「今天 master 的 HEAD 行不行」与
#                    「这次改动能不能构建」是两个问题，而 2026-10-19 起第二个问题
#                    在平台侧没有执行者了：PR 那一条不再跑构建、也不跑端到端）
#   每日档（手动触发） web_trigger_daily（**同一份七格**，人想现在就知道答案时点一下；
#                    按钮定义在 `.cnb/web_trigger.yml`，与这里的事件键靠名字对上。
#                    它与定时那一条的**两处**不同 —— 执行身份是按按钮的人、
#                    取的是按下那一刻的 master HEAD —— 写在下面那一格上面）
#
# push 不重跑全套的理由与旧版相同（合并提交由平台按**已验过的源分支 SHA** 生成、
# 不引入新代码），但今天它不再是「省额度」，而是「省一遍没有新信息的运行时间」。
#
# ⚠️ **`&common` 锚点里刻意不含 stages**：`<<: *pipeline` 会把 stages 一起带过去，
# 那正是「push 也跑整套门禁」的来源（详见 git 历史里 55bc9b36 的立案说明）。
# 覆盖根键时锚点里的键会被整体替换，故每个事件都写出完整形态。

.common: &common
  runner:
    # group = 当前仓库所属根组织下的自托管构建节点（不是平台公共池）。
    # 漏掉这一行会退化成平台池 —— 那时核时重新开始计费，而配置看起来完全一样。
    #
    # ⚠️ **用户的决定（ISSUE #1993）：「永远不用平台池，容器用自托管节点上的」**。
    # 所以这一段**不是**可调项，而是两道必须同时在场的门：
    #   ① `namespace: group` —— 派到根组织的自托管节点，而不是公共池；
    #   ② `tags` 非空、且**不含** `cnb:arch:*` 那一族 —— 节点离线 / 满载时平台会
    #      **自动改派到其他可用节点**，而在这一档上「其他可用节点」就是平台池
    #      （头注第 5 条）。只写 ① 不够，改派发生时配置一个字都不会变。
    # 「用容器」的那一半落在**任务级 `image:`**（`pipeline.docker.image` 在这条路径上
    # 不生效，头注第 1 条）—— 池子是「跑在哪台机器」，容器是「这一格跑在什么环境里」，
    # 两件事，别混。判据：`tests/ci-container-plan.test.ts` 把这段形态与容器计划一起钉住。
    namespace: group
    # 「与」关系：列出的每个 tag 都必须出现在节点标签上。当前节点声明的标签是 win。
    tags:
      - win
  # 同一分支上并发只留一条：**这条是节点侧的止血，不是省时间**。
  #
  # 实测（ISSUE #1961）自托管节点只有一台，而这一轮里连着推了好几个提交，每个
  # `pull_request` 事件都起一条**全量**流水线，全落到同一台机上：
  #
  #   cnb-jt3-1k5071kou  ESLint 零警告  挂 8640s（同分支更早那跑 256s 跑过）
  #   cnb-did-1k50659np  单元测试       挂 8640s（2h24m）
  #   cnb-s61-1k50eo6p1  npc go         挂 start，整机不推进
  #
  # 几份 `--maxWorkers=4` 的 vitest + 几份 ESLint + 几份 `next build` 线性叠加，
  # 这台 16 核机被吃干净，**最先被挤掉的恰好是排队早的那条**：它拿不到 CPU，
  # 于是既不推进也不报错，直到撞上 2h 的 Job 上限。
  #
  # `cancel-in-progress: true` = 同 key 上新流水线到达时终止旧的。
  #
  # ⚠️ **`key` 必须显式写**，不能吃默认值（ISSUE #1981）。默认 key 是
  # `分支名-流水线名`，而 `pull_request` 事件下 `CNB_BRANCH` 取的是**目标分支名**
  # （官方 `build-in-env.md` §CNB_BRANCH：「合并类事件 → 目标分支名」）—— 于是
  # 「分支名」这一半在这个事件上恒等于 `master`，两件事同时坏了：
  #
  #   · **全仓 PR 共用一把锁** ⇒ 任意两条并行 PR 互相掐停（实测：PR #1980 把 #1982
  #     那条掐了）。代价不是「慢」，是**白跑一整条**；
  #   · 于是「同一分支只留最新那一跑」这条**想要的**语义在这里根本没被实现 ——
  #     留下的是「全仓只留最新那一跑」，而节点总共只有一台，等于把并行 PR 变成
  #     互斥排队（先跑的那条被终止，白跑）。
  #
  # 所以这里给一条**没有 `CNB_BRANCH` 的 key**，只用 `CNB_PULL_REQUEST_IID`
  # （PR 的仓库内编号，非 PR 事件上为空 ⇒ 那一刻它等于「不带这一半」）：
  #
  #   · `pull_request` ⇒ `pr-<PR 编号>` —— **每个 PR 互不相同**，不同 PR 之间再不相干；
  #     同一个 PR 里连着推几个提交仍然落回同一把锁（后一跑终止前一跑，这才是想要的粒度）；
  #   · 非 PR 事件 ⇒ `pr-`（变量无值 ⇒ 等于「不带这一半」）—— 这一档**当年**只有一条
  #     流水线（`master 合并复核`），所以那句「不带分支名也不丢语义」在当时是真的。
  #
  # ⚠️ 那半句今天**不再成立**，而且是有害的：每日档三条触发口与单跑口六条都是
  # `<<: *common`，共用一把 `pr-` ⇒ 「一次无关的 master push 掐掉正在跑的按需复验」
  # 被当场验到两次（`cnb-5j9-1k5bc4p4u` / `cnb-lm1-1k5h1otqt`，逐秒对账见下面
  # `.lock-daily` 那一段与 ISSUE #2114）。修法不是改这句，而是**按触发类各写一把**：
  # 非 PR 的九条流水线现在都显式带 `lock: *lock_*`，`.common` 这一条退回到只管
  # `pull_request`（以及「没写覆盖时兜底」——而那种兜底现在会被判红，见下）。
  #
  # 为什么不按「事件」分两档写（`pull_request` 用 `$CNB_PULL_REQUEST_IID`、`push` 用
  # `$CNB_DEFAULT_BRANCH`）：那要么靠平台侧的变量缺省为空来兜（没实据，而这次坏的正是它），
  # 要么把 `lock` 在两档各写一份字面量 —— 两份锁配置漂了之后「哪一份是真的」没有判据能回答。
  # 现在的形状避开这两半：**定义各一份**（`.lock-push` / `.lock-daily` / `.lock-oneshot-*`，
  # 全是字面量 key、不带变量），流水线只**引用**；判据同时钉「每类一把、异类不相撞」
  # 与「非 PR 流水线不许靠继承兜底」。
  #
  # 依据：`lock.key` 是官方点名**支持变量替换**的属性（`build/env.md` §支持变量替换
  # 那张表里有 `lock.key`）；`CNB_PULL_REQUEST_IID` 见 `build-in-env.md`（PR 仓库编号，
  # 非合并类事件触发时自然没有值）。⚠️ **刻意不用** `CNB_BRANCH`（正是它会退化成
  # 目标分支），也**不用** `CNB_PULL_REQUEST_ID`（PR 的**全局** ID，跨仓库才需要那个粒度）。
  #
  # 判据：`tests/no-platform-ci-config.test.ts` 的 `resolveLockKey()` 与
  # `pipelineLockAssignments()` 一族 —— 它要求 `lock.key` 存在、里头的 `${…}` 全在白名单内、
  # `CNB_BRANCH` 不在其中，并把上面这份原文表达式**喂进一个自带的模拟替换器**跑出两种事件下的实际 key，
  # 断言「两条不同 PR 的 key 不同」「两条同 PR 的 key 相同」「九条非 PR 流水线分属四把类锁、
  # 且没有一条落回 `pr-`」。口径见规范 §13.5.3.10。
  #
  # ── 「同时最多跑几条」在这里**配不出来**（ISSUE #2953）────────────────────
  #
  # 问过一遍官方文档，答案分三层，别在这三处之间找第四个旋钮：
  #
  #   ① `lock` 的参数面是 `key` / `expires` / `timeout` / `cancel-in-progress` /
  #      `wait` / `cancel-in-wait`（`grammar.md#pipeline-lock`）。同一把 key 上只有
  #      「终止旧跑」与「排队等待」两种语义 —— **没有「最多 N 个并发」**，而且 `wait`
  #      只对**同一把 key** 生效，不同 PR 之间不会互相排队。
  #   ② `runner.cpus` 在自托管上无效（`build-node.md`「限制」节：宿主机直跑，资源限额
  #      由 Docker cgroups 实现）⇒ 它控制不了「一台机上同时几条」，只控制「一条想占几核」，
  #      在这条路径上一样是空的（头注第 2 条）。
  #   ③ 唯一真正的「同时运行流水线数上限」是**节点侧的配置**（`build-node.md`：节点
  #      「资源使用达到管理员为该节点配置的上限，如 CPU/内存、同时运行流水线数」才会改派），
  #      不在仓库的声明面里，也不是这里能改的。而且溢出的流水线会被**改派到其他可用节点**
  #      —— 在本仓这一档上那就是计费的平台池（头注第 5 条 / ISSUE #1993 那个决定）。
  #
  # ⇒ 仓库侧实际能调的只有两件，且都已落地：**锁的粒度**（上面这一把 + 下面 `.lock-*`
  #   那一族：「谁挡谁」）与**单条流水线内部的宽度**（`scripts/ci-load.mjs` 按现场核数
  #   折算 `--maxWorkers`，§13.5.21：「一条别把整台机占满」）。「整机同时最多 3 条、
  #   其余排队」差的那一格仍然空着，立案在 ISSUE #2953 —— 要补就得在仓库侧自建一条
  #   全局车道（平台不给队列原语），那是另一个决定，别在这一行偷偷实现。
  lock:
    key: pr-$CNB_PULL_REQUEST_IID
    cancel-in-progress: true
  retries: 0
  env:
    # 与旧版对齐：构建机上没有真实密钥，用占位值过 src/env.js 的校验。
    # BETTER_AUTH_SECRET 必须一并注入 —— SKIP_ENV_VALIDATION 只绕过 src/env.js，
    # 绕过不了 better-auth 自己的生产校验（缺失 → 退回 DEFAULT_SECRET 抛错 →
    # createTRPCContext() 抛错 → 所有 authedProcedure 全灭，设置页整页读不出来）。
    # 该值只用于构建期冒烟，不参与任何真实部署。
    SKIP_ENV_VALIDATION: "1"
    BETTER_AUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
    # 避免 corepack 在非交互环境下为拉取 pnpm 版本而等待输入。
    CI: "true"
    # ── 判据预算（vitest 的 testTimeout / hookTimeout）临时放宽 ×2（ISSUE #2959）──
    #
    # 业主口径（#2948 / #2959）：「把 CI 里测试的超时时长临时改长，避免负载红」。
    # 它与 §11.13 / §13.6.4 那两条「不许抬预算」直接对撞，所以这一行只买一件事：
    # **共享节点上并发跑时，一条用例不再因为「等子进程」而被判成 30s 超时**。
    #
    # 为什么只抬这一层（`.cnb.yml` 的 `timeout: 45m` 那几格、`full-suite-run.mjs` 的
    # 墙钟、Playwright 的 60s 一律不动）：那几处是「卡死多久有人知道」的护栏。
    # 实测它们本来就不承重（`受影响用例` 声明 45m，同一跑掐在 54.0 分钟），
    # 把它们改长买不到任何东西，只会把唯一的早期信号一起拆掉。
    #
    # ⚠️ **这一行就是「临时」这两个字的全部承重**：删掉它 = 恢复原状
    # （`vitest.config.ts` 的缺省乘数是 1，不设这个键时算出来的数就是 30_000 / 45_000）。
    # 别改成 3 以上 —— 上限就在那边，超了会落回 1 并在日志里说一句。
    # 生效时 vitest 启动会打一行 `[vitest] 判据预算临时放宽 ×2：…`，日志里读得出来。
    COMFY_TEST_TIMEOUT_SCALE: "2"
    # 覆盖率 reporter 的安静档（ISSUE #1959）：`vitest` 的 `text` reporter 会把报告里
    # **每一个文件**打一行，450+ 行的表本身就有 ~90KB，而平台对单次构建日志的硬上限是
    # 102400 字节 —— 超了就只留一句 `The log length exceeds the limit(102400)`、
    # 后面全部截断，于是这一步看起来「跑完了」而失败原因一个字都看不到。
    # 置位后由 `vitest.config.ts` 切成 `text-summary`（几行汇总）：
    # **逐文件明细一份没少**（它本来就在落盘的 `lcov` / `json-summary` 里）。
    # ⚠️ 这一行是本档唯一的执行者 —— 不在任何 `script` 里（见规范 11 §11.7）。
    COMFYAPP_QUIET_COVERAGE: "1"
    # 本题解析器要用 `steps` 里**没有**的那几个东西（`steps` 会内联进工作区、
    # 被 checkout 抹掉，而 `env` 是 HEAD 的事）。判据按本键解析 `.cnb.yml`：
    #   · `PYTHON_PROBE` —— `scripts/python-probe.mjs`：逐个候选打印「这个命令起不起
    #     得来」。缺件时那几条用例走 `env` 档跳过（不会红），跳过的是哪几条只有它答得出。
    #   · `GATES` —— 本档的 stage 名有序清单。两条被判的约束都是实测出来的：
    #     ① `单元测试` 必须排在 `Python 可用性` 之后 —— `cnb-jt3-1k5071kou` 上它跑到
    #        **2h24m** 被 8640s 墙钟掐断（只留下 `timeout of 8640000ms exceeded`），
    #        而那一步**照旧会往下跑**（缺 Python 只让它少判几格）；
    #     ② `环境前提` 必须排在 `Install dependencies` 之前 —— 它答的就是「这次装得成
    #        装不成」的前提，排在后面等于把结论推到自己要解释的那一步后面。
    #     两条都不是风格。判据分别在 `tests/no-platform-ci-config.test.ts` 与
    #     `tests/ci-env-probe.test.ts`。
    #   · `DISABLED_GATES` —— **临时停用**的 stage 名清单（此刻是 `单元测试` /
    #     `ESLint 零警告`，理由逐条写在那个键旁边。两者在每日档上都有同名执行者：
    #     `每日单元测试` / `每日 ESLint 零警告`）。
    #
    # **`COMFYAPP_CI_DISABLED_GATES` 是「停用」这件事的执行者，不是备注。**
    # 屏蔽一个 stage 的两半（注释掉 `.gates` 里的条目 + 从 `GATES` 摘名）**都不报错**：
    # 前者是 YAML 注释、后者只是数组少一项，于是「暂时屏蔽」与「永久删除」在配置里
    # 长得一模一样。这一键把它变回一句读得出来的事实，判据据此把两件事分开：
    #   · 不在 `GATES` 里、**也**不在本清单里 ⇒ 那是删除，判据当场点名；
    #   · 不在 `GATES` 里、但在本清单里 ⇒ 停用，判据放行、并要求条目仍在 `.gates`
    #     里以**注释形态**留着（可 grep 回原文），否则「加回来」就没有原文可依。
    # 恢复动作：`.gates` 里取消注释 → 把名字挪回 `GATES` → 从本清单删掉。
    # 判据见 `tests/no-platform-ci-config.test.ts` 的「停用登记」那两条。
    COMFYAPP_CI_PYTHON_PROBE: scripts/python-probe.mjs
    # 这一项**留在停用清单里，但理由换了**（ISSUE #2022 与并行会话那条每日档决定同批核对）：
    #   · 当初停 `单元测试` 的理由是「宿主侧够不着 Python」（ISSUE #1959）—— 那条**已不成立**
    #     （同一台节点的 `每日单元测试` 长期跑绿，`Python 可用性` / `Python 探针读数` 有读数），
    #     本批一度把它恢复成 PR 档；
    #   · 恢复之后撞上的是另一条**仍然成立**的决定：会自己起一堆子进程的那两档（全量单测、
    #     `next build`）只在每天 01:00 那一跑（§13.5.21 / #2018）—— 同一台机上并行 PR 会把
    #     带超时的读数弄成不可信的红，而 `full-suite-run.mjs` 跑绿还要刷 `整档凭证`
    #     （`.full-suite-freshness.json`）：拿一次并发下的绿去刷那张账，比不刷更坏。
    #   · 2026-10-19 把**增量那一档**临时安在本地推送那一跳（`check:premerge` 的
    #     `unitTests` 段）当过渡；**2026-10-20 也撤了** —— 本地这一跳在共享机上的失效
    #     形态是 forks worker 调度超时而不是用例红（实测拦下一次、隔离复跑 1116 条全绿）。
    #     增量档先改成 PR 上的 `受影响用例` 一格（跑增量面、不刷整档凭证、并发按
    #     `ci-load.mjs` 收敛）；2026-11-02 那一格连同 `固定结构用例` 也随 ISSUE #3052
    #     撤到每日全量单测（增量面是全量子集）。**全量**仍归 `每日单元测试`，这一格停用的理由没变。
    # ⇒ 所以「全量单测在 PR 这一跳的执行者」不是平台，是**每日那一跑**（见上面那条）；
    #   增量面（受影响用例）2026-11-02 起也没有 PR 级执行者了，由每日全量单测接住。
    #   这一格在 `.gates` 里以注释形态留着（可 grep 回原文）—— 判据把「停用」与「删除」分开判。
    # ⚠️ 这个键**保留而不删除**：它是「停用」这件事的执行者（判据见
    # `tests/no-platform-ci-config.test.ts` 的「停用登记」那两条）。
    COMFYAPP_CI_DISABLED_GATES: >-
      单元测试, ESLint 零警告, 新鲜度账
    # 「换了执行者」的登记（ISSUE #2227）：清单里那几个**以注释形态留在 `.gates` 里**的名字
    # （停用形态与换执行者形态在配置里长得一模一样 ⇒ 机器分不出两者），它们的执行者在这里
    # **机器可读**地登记一次。
    #
    # 登记的值是**入口路径**（`scripts/xxx.cjs` / `tests/xxx.test.ts`），不是执行者自己的
    # 定义 —— 判据 `scripts/check-gate-name-executors.mjs` 去执行面（复合档条目 / 固定清单
    # 用例 / 钩子步骤）核「这个路径真的会被跑」，**不抄第二份**（§12.12 / §12.18）。
    # 多个入口用 `|` 分隔；每一项形如 `名字=路径`。
    #
    # ⚠️ 这一格**必须**与 `COMFYAPP_CI_GATES` 双向对账：清单里的每个名字要么有自己的 stage、
    # 要么在这儿登记；而这儿登记的每个名字都要在清单里 —— 否则「执行者没了」与「换了执行者」
    # 在配置里分不开，账面全绿（这正是 ISSUE #2227 的现场）。
    COMFYAPP_CI_GATES_ELSEWHERE: >-
      格式化提交分离=scripts/check-reformat-only.cjs,
      零消费导出=scripts/check-dead-exports.cjs
    # 恢复动作照旧三步：`.gates` 里取消注释 → 名字挪回 `GATES` → 从本清单删掉。
    # `ESLint 零警告` 的**两段历史别读混**：
    #   · 2026-10-16 停过一次，理由是「本地 B 组每条提交都在跑同一条 lint」；那条前提随
    #     钩子降档**反转**，于是它按恢复动作回来了（带着 `ci-cp936-exit.mjs` 那层）；
    #   · 2026-10-19 又停一次，这次是**换档位**而不是「环境没就绪」：它是台上唯一真的会
    #     挂满预算的静态判据（`cnb-jt3-1k5071kou` 8640s、`cnb-hpl-1k5a0s6ss` 20m），
    #     与 `每日生产构建` / `每日单元测试` 同一条理由撤到每日档 —— 它起一堆子进程，
    #     并行 PR 下墙钟读数不可信（§13.5.21）。执行者换成 `.daily-gates` 里的
    #     `每日 ESLint 零警告`，判据一字未改（`pnpm run lint`，同一个脚本）。
    # ⚠️ 这套「停用 ≠ 删除」的机制**照旧有效**：名字在这儿 = 停用（条目必须以注释形态
    # 留在 `.gates` 里），不在 `GATES` 也不在这儿 = 删除，判据当场点名。
    # 判据见 `tests/no-platform-ci-config.test.ts` 那两条。
    #
    # 当初给恢复动作立的**两条条件**，到这一批都成立，逐条给出处：
    #
    #   ① `E2E 关键流程` 一绿 —— 已成立（2026-10-16，`cnb-h80-1k51ukj26`：整条流水线
    #      success，34 格，`浏览器安装` 0.7s / `E2E 关键流程` 51.3s）；
    #   ② 平台日志的中文可读 —— **由仓库侧那一跳解决**，不是等机器侧改：
    #      「控制台代码页 936 → 65001」与「宿主 ANSI 已 UTF-8 且重启过」两个嫌疑人
    #      都已被探针否掉（四行读数逐字未变），结论是解码发生在**子进程输出那一跳**，
    #      它用不与宿主联动的 CP936。所以出路只有一条：让字节在出口处就按 CP936 落
    #      —— 即 `scripts/ci-cp936-exit.mjs` 那层包裹。它已经在 `类型检查` 与
    #      `工作区出处` 两格上拿到第一手证据：后者的中文读数在平台日志里逐字可读
    #      （`[工作区出处] 出处·红 HEAD=… 而…`，两条构建都读得出来）。
    #      **带这一层的三格（`ESLint 零警告` / `单元测试` / `重档静态判据`）
    #      都带这层** —— 不带它，红的时候读到的又是 GBK 乱码。
    #      其中 `ESLint 零警告` 与 `单元测试` 2026-10-19 起在每日档上，那两格的
    #      `script` 同样带这层（`每日 ESLint 零警告` / `每日单元测试`）。
    #
    # ⚠️ `oxfmt 格式` 已从停用清单里出网（ISSUE #2010），但它不是按上面那套恢复动作
    # 回来的 —— 它是**从本地钩子挪过来接管**的（执行者关系变了），别拿上面两条条件去
    # 判断它。同一族的事实在 §13.5.25 又出现一次：本地钩子的 A/B/C/D 四档这一批整体
    # 挪到平台，走的也不是「停用/恢复」那套，而是「步骤留在钩子里当注册表、由档位决定
    # 谁执行」—— 因为 `check-gate-executors.cjs` 不认 `.cnb.yml` 是执行者。
    #
    # ⚠️ `浏览器安装` / `E2E 关键流程` 也曾在这份清单里（ISSUE #1966：这台节点一次
    # 取不回那 120 MiB），**2026-10-16 按恢复动作加回来了** —— 取消注释 → 名字挪回
    # 下面那一行 → 从本清单删掉，三件事同批做完。恢复的依据不是「节点网络修好了」，
    # 而是**取法换掉了**（分片自取：片长自适应、断了从已落盘的字节接着来），
    # 读数与判读见规范 §13.5.3.5 ⑩ 与 `.gates` 里那两段注释。
    COMFYAPP_CI_GATES: >-
      镜像身份, 工作区复用读数, 缓存槽读数, GitHub 镜像同步, 环境前提, Install dependencies, 分支守卫, 提交声明核对, 同步数据库表结构,
      类型检查, 标题行让位, 文件结构硬规则, 跨平台动作对照, import 别名统一, ComfyUI 端口口径, 内联样式注入, 跨文件重复块,
      函数长度 TS, 函数长度 Rust, 模块循环依赖, 端口推导跨语言一致性, CHANGELOG 碎片, 主题色扫描,
      UI/逻辑分离, lib Node-only 声明, oxfmt 格式, 格式化提交分离, 零消费导出, 重档静态判据, GitHub 判决回读
    # master 合并复核那条流水线（push 档）自己的 stage 清单 —— 第三份，按档登记。
    # 2026-10-28 起这一档从「只有合并形态复核一格」扩成「树级校验档」：判的是**合并后的
    # 树**一致不一致、这次运行的事实是什么，不是「这次改动能不能过」（那由 PR 档判），
    # 也不是「今天的 master 全量健康」（那由每日档判）。撤进来的四格入口与旗标一字未改，
    # 只是换了档位。`覆盖率上报` 不在 push 档（push 不跑测试，挪过去只会静默空转）；
    # 它 2026-11-02 从 PR 档挪到了**每日档**：每日单元测试 跑 `pnpm run test:coverage` 产出
    # lcov，这一格接在它后面上报（见 `COMFYAPP_CI_DAILY_GATES` 与 `*daily_gates` 末尾）。
    # 名字在这儿 = 那一格必须一字不差地出现在 `master 合并复核` 流水线里（判据
    # `tests/no-platform-ci-config.test.ts` 双向核对：缺一格红、多一格红）。
    #
    # 2026-11-02 起加 `GitHub master 镜像` 一格：它不是校验，是这一档的出口动作 ——
    # GitHub 侧的 schedule（daily / package-desktop）跑镜像仓的默认分支，CNB 的
    # master 不推过去它们就每天跑一棵旧树（理由全文在 `.push-stages` 里那格的注释上）。
    COMFYAPP_CI_PUSH_GATES: >-
      合并形态复核, GitHub master 镜像, 安装依赖, 生成态文档与源同步, API 文档生成与自检, 文档引用与权威源一致, 工作区出处
    # 定时那一跑（`master."crontab: …"`）自己的 stage 清单 —— **另一个流水线，另一份清单**。
    # 它刻意**不**与上面那一条共用：上面那份是「PR 上跑什么」，这一份是「每天跑什么」，
    # 而这两问的答案如今分在两处：会自己起一堆子进程的那两档（全量单测、`next build`）
    # 只在每天 01:00 这一跑，同一台机上并发 PR 会让它们的读数不可信（§13.5.21），
    # 机器空着才是唯一能拿到可信墙钟的时刻。逐条理由与两次决定（#2010 立每日档、
    # 2026-10-18 把构建与单测都收进来）见 §13.5.23。
    # 名字在这儿 = 那一格必须一字不差地出现在 crontab 流水线里（判据
    # `tests/no-platform-ci-config.test.ts` 双向核对：缺一格红、多一格红）。
    #
    # ── 为什么全量单测在**这一份**而不是 PR 那一份（ISSUE #2018 的口径）────────
    #
    # 用户点的问题是「可能负载假红的，能不能挪去 CI 执行」。答案是「能，但**不是
    # 放到 PR 那一条**」—— 这台节点上 CI 与本地钩子共用同一台 16 核机，所以「挪去 CI」
    # **不减少总负载**，它改变的是谁被假红卡住、以及重试的代价。而全量 vitest 恰好是
    # 这条流水线上唯一两档会自己起一堆子进程的之一（另一档是 `next build`），
    # `scripts/ci-load.mjs` 的文件头把这条边界写死了：
    #
    #   · **不同 PR 之间仍然会叠加**（`lock` 按 PR 分锁只掐同一 key 上的旧跑，平台不给
    #     「同时跑几条」的旋钮）—— 历史上三条全量流水线挤同一台机，`单元测试` 跑到
    #     **8640s 被墙钟掐断**，只留下一句 `timeout of 8640000ms exceeded`；
    #   · 套件里大量用例**真起子进程**（git / node / prettier / PowerShell），超订的那一份
    #     从「等 CPU」变成「等子进程」，形态就是 `Test timed out in 30000ms` 而单跑全绿。
    #
    # 放到每天 01:00 那一跑，这两个前提同时消失：**没有并发的 PR**、机器是空的，
    # 而这正是「负载读数不可信」这一族唯一的解法（抬超时预算与降门槛都被 §11.13 / §13.6.4
    # 明令禁止）。代价说在明处：最晚 24 小时才发现 —— 与 `生产构建` 那条是**同一个取舍**
    # （2026-10-18 起两档都只在这条上，PR 上一条都不剩），而本仓已有「每日档有主」那套新鲜度账（`daily-run.mjs` /
    # `test:coverage:tracked`）接得住它，红了第二天早上有人在。
    #
    # ⚠️ **这份清单同时是 `FRESHNESS_TRACKS` 三档的执行者**（2026-10-19 的口径：
    #   「新鲜度都不要本地跑，都 CI 跑」）：`每日单元测试` / `每日生产构建` /
    #   `每日全量E2E` 三格分别是 full / artifact / e2e 那一档登记在 `ciStage` 里的那一个。
    #   本地 D0 那一步据此**不再要求当天自证**（它仍然打读数、仍然判账面的形状），
    #   而这一格是那个豁免唯一的前提 —— 判据 `tests/no-platform-ci-config.test.ts`：
    #   **每一个非空 `ciStage` 都必须出现在这份清单里**。少了这一条，「本地不拦」就
    #   悄悄变成「谁都不跑」，而两边都是绿的。
    #
    # ⚠️ **前面五格是前提，不是装饰**：每次构建都是全新 job 目录、`node_modules` 恒不在场
    #   （`工作区复用读数` 两跑实测，形态①）。定时那一跑此前**只有构建那一格**，而
    #   `artifact-run.mjs` 跑的是 `pnpm run build` —— 它没有安装档就会在 01:00 以
    #   「找不到 next」的形态红。顺序有判据：安装必须先于任何吃 `node_modules` 的格子，
    #   而 `每日浏览器安装` 必须先于 `每日全量E2E`（缺件时 E2E 只红在 launch 那一跳，
    #   指不到真正缺的那一格）。
    #   2026-10-19 起这五格是 **工具链自证 / 安装 / Python 可用性 / Python 探针读数 /
    #   同步表结构** —— 前四格里的工具链与 Python 那两格是同日从 PR 撤进来的（下面那段）。
    #
    # ⚠️ **`每日单元测试` 排在这份清单的最后**（业主口径：「最容易出问题的放最后，
    #   然后执行过的就不用重复执行了」）。它不是「前提」也不是「重档优先」，它是这一条上
    #   唯一会因**这台机器的负载**而红的格子（套件里大量用例真起子进程，超订的那一份
    #   从等 CPU 变成等子进程 ⇒ `Test timed out in 30000ms`），而它排在中间时，一单条
    #   抖动就把 `每日生产构建` / `每日浏览器安装` / `每日全量E2E` 一起 skip 掉。
    #   顺序本身有判据（这一格必须是每日清单的最后一条），挪回中间会当场红。
    #
    # ⚠️ **只判节点事实的格子不再每个 PR 都判**（2026-10-19 的口径：「这个环境不会经常
    #   改动」）：`工具链自证` 13.8s、`Python 可用性` 2.8s、`Python 探针读数` 3.0s、
    #   `浏览器安装` 3.0s 从 PR 那份清单撤到这里，**每撤一格都必须同批在这份清单里
    #   加上同名的一格** —— 判据 `tests/no-platform-ci-config.test.ts` 逐格双向核对
    #   （PR 清单里不许再有它、每日清单里必须有它、且那一格点的仍是同一个入口与
    #   同一面旗标）。少了这条判据，「撤到每日档」与「悄悄删掉」在配置文件里逐字同形。
    #   留在 PR 上的那一问是「这台机跑不动整条链吗」，由 `Install dependencies` 里的
    #   `check-pnpm-available.mjs` 判 —— 它一秒就有答案，且每个 PR 都需要。
    COMFYAPP_CI_DAILY_GATES: >-
      每日失败立案, 每日令牌权限读数, 每日工具链自证, 每日安装依赖, 每日 Python 可用性,
      每日 Python 探针读数, 每日同步数据库表结构, 每日新鲜度账, 每日生产构建,
      每日 ESLint 零警告, 每日浏览器安装, 每日全量E2E, 每日单元测试, 覆盖率上报
    # ⚠️ `每日浏览器安装` 与 `每日全量E2E` 的相对顺序不许动：装那一件要下 ~120 MiB
    #   （分钟级），而判「装没装成」是零成本的。2026-10-19 起这一格是**唯一**的执行者
    #   （PR 上那一格同日撤到这里）—— 撤的理由是 PR 上再没有任何一步用浏览器
    #   （`E2E 关键流程` 早已撤成 `每日全量E2E`，两条出路的取舍写在 `.gates` 末尾那段），
    #   而它每次仍然要在 PR 上占一格排队位。同一台机、同一个账号，落点仍是
    #   `%LOCALAPPDATA%`，所以每日档跑过一次之后，节点上的缓存在下一次每日档时是热的。
    # ── 落点：把 CI 的临时目录与浏览器都放到开发盘（G:）────────────────────────
    #
    # 为什么写在这**一级**（流水线级 env）而不是某一格的 `env:`：这一组变量的作用面
    # 是**跨格**的 —— 浏览器装在 `每日浏览器安装` 那一格、跑在 `每日全量E2E` 那一格，
    # 两格必须看**同一个**落点。写在某一格里 ⇒ 那一格看得到、另一格看不到 ⇒
    # **装好了，探不到**（这两种红在日志里原本逐字同形，是本仓最贵的那类红）。
    # 判据：`tests/ci-dev-drive-root.test.ts` 钉「这三行必须在流水线级 env 里」。
    #
    # ⚠️ **这三个值是给这台自托管节点用的**：它的检出工作区在 `G:`（`ORANGE_RUNNER_DATA_DIR`
    # 指到那儿），而服务账号（systemprofile）的 `%LOCALAPPDATA%` 与 `%TEMP%` 落在 `C:` 上 ——
    # 于是「检出在开发盘、临时目录与浏览器在系统盘」是今天的事实。换节点要跟着换。
    # 落点与卷的实测读数见 `docs/guides/dev-drive-refs.md` 的「CI 侧」那节。
    #
    # `TEMP` / `TMP` **成对**写：Node 的 `os.tmpdir()` 只看 `TEMP`，而另一些工具只看
    # `TMP` —— 只写一个的形态是「一半的工具把临时文件写到了临时目录之外」。
    # 目录必须**事先存在**（`G:\Temp` 已在开发盘上建好）：临时根不存在时 Node 仍会
    # 把它当成临时目录返回，于是第一次写就 ENOENT —— 那不是「慢」，是「看不懂的红」。
    # `环境前提` 那一格会把它补出来并打印读数（幂等，缺了才建）。
    TEMP: "G:\\Temp"
    TMP: "G:\\Temp"
    # 浏览器落点：Playwright 自己的环境变量（不引第二套机制）。**装与判都只看它** ——
    # 判据 `playwrightBrowsersRoot()` 与 `browserExecutableExists()` 同源（实现住在
    # `scripts/ci-toolchain-browser-root.mjs`），所以这一行改了就同时改了两边。
    #
    # ⚠️ **不要把它挪进某一格的 `env:`** —— 理由见上面那段「为什么写在这一级」。
    # 也**不要**写成容器里那个 `/ms-playwright`：那是给镜像配的，在宿主上不存在，
    # 写了等于让落点判据去一个空目录找东西（判据 `tests/ci-image-identity.test.ts` 守这条）。
    PLAYWRIGHT_BROWSERS_PATH: "G:\\.cache\\ms-playwright"
    # ── 判决行的颜色：平台日志页那一屏也要带色（ISSUE #2755）──────────────────────
    #
    # 为什么**不是** `FORCE_COLOR`：那枚是全生态共识旗标，chalk / picocolors / oxfmt 的
    # anstyle 都读它 —— 挂上之后被聚合档**捕获后解析**的那份子进程输出会开始带色号，
    # 而 `lastLine()` / `looksSkipped()` / 90 字压缩三处都会把色号算进内容
    # （§13.5.29.1 那条边界写明的后果）。所以这枚只被本仓那一层认
    # （`scripts/ci-log.mjs` 的 `colorEnabled()`），第三方读不到它 ⇒ 子进程那一路
    # 天然仍是干净文本。
    #
    # 为什么写在这**一级**：它说的是「这台节点的日志页会渲染色号」，那是宿主的属性、
    # 不是某一格的属性 —— 写在某一格里，其余各格的判决行照旧全灰（同一族坑见上面
    # 「落点」那段：作用面跨格却写在格内 = 装好了，探不到）。
    #
    # ⚠️ 它压不过 `NO_COLOR`：`colorEnabled()` 里 `NO_COLOR` 仍是一票否决；`0` 按关算。
    # 当场读数：绿跑 build `cnb-gig-1k65nb59l` 的 stage-27 正文 64 行里只有 2 行带 ANSI，
    # 而那两行是平台自己的 `Runner` / `Finished` 前缀 —— 我们的 `[ok]` / `[skip]` 无色。
    COMFYAPP_CI_COLOR: "1"

# 门禁清单。
# ⚠️ 它**没有**「清单逐条核对」那类判据捧着 —— `tests/cnb-pipeline-gates.test.ts` 已随
# 旧版 `.cnb.yml` 一并删除（#623），本 PR 不复活它（它锁的是旧版那三十步与上报插件，
# 两样在自托管上都不成立）。守着这份文件的现有判据是 `tests/no-platform-ci-config.test.ts`
# 那一条**形态**判据（分支键 / `namespace: group` / 非空 `tags` / 两个事件键 /
# lock.cancel-in-progress / 停用登记）—— **条目本身的增删仍不报错**，
# 所以这里的每一步都要靠人逐条核对。
#
# ── 增量：哪些 stage 可以在「本次改动没碰到它的扫描面」时跳过（ISSUE #1981）──
#
# 用户的质疑是「CI 里的检查能否增量，而不是没有改动也重跑」。答案是 stage 级的
# `ifModify`（CNB 官方语法手册 `zh/build/grammar.md` 的 `#stage-ifmodify`）：
# 变更文件一个都不落在给定 glob 内 ⇒ 这一步不执行。它**支持 PR 触发的事件**
# （官方原文：「PR 触发的事件，统计 PR 中的变更文件」），正是本流水线要跑的那一类。
# 语义与本地钩子那一层（`scripts/gate-scan-read.cjs` 的 `skipUnlessStagedTouches()`）
# **逐字同义** —— 也就是说，平台侧终于和本地用同一套扫描面在说话。
#
# 两条安全边界（都是「宁可多跑」的方向）：
#   · **新建分支的 push 事件忽略 `ifModify`**（没有对比基准）⇒ 全部照跑；
#   · **没有 `ifModify` 的 stage 就是默认档 = 任何改动都跑** —— 本文件里绝大多数
#     stage 都在这一档，包括每一条全库级不变量与全部前提步骤。
#
# ⚠️ 还有**两种**收窄不在 `ifModify` 这一档（它们的前半是前提，跳不得）：
#   · `Install dependencies` 的**装的那一跳** —— 依赖面（锁文件 / `package.json` /
#     `pnpm-workspace.yaml` / `next.config.js`）一项都没碰就不装，判定在
#     `scripts/ci-install-deps.mjs`（`pnpm` 自证照旧每次都跑，判据见 §13.5.20）；
#   · `oxfmt 格式` 的**扫描面** —— `src/**` + `.storybook/**` 是手写 glob，
#     与 `check-format.cjs` 的 `IGNORE_GLOBS` 是两件事（`IGNORE_GLOBS` 是**排除**面）。
#     ⚠️ 但 `IGNORE_GLOBS` 增删目录时**必须同批回来看这两行**；
#   · 判据脚本**自己的触发面** —— `API 文档生成与自检` 的 globs 由
#     `check-docs-api.cjs` 的 `INPUT_RES` 机械反推，不手抄第二份。
#
# ⚠️ **「哪几条被收窄了」只有一处出处**：`scripts/ci-incremental-gates.mjs` 的
# `INCREMENTAL_GATES`（每条都写着它守的是哪份脚本、为什么这条收窄安全）。
# 两个方向都由 `tests/ci-incremental-gates.test.ts` 判（登记表里每条 ⇒ 配置里必须
# 逐字带着那组 `ifModify`；配置里带 `ifModify` 的 ⇒ 必须在登记表里），
# 该判据在固定清单里、每次提交都跑。**别在这里直接给一个 stage 加 `ifModify`** ——
# 那会在两处各写一份「收窄名单」，而漂了之后「哪一份是真的」没有判据能回答。
# 随手自查：`pnpm run check:ci-incremental`（= `node scripts/ci-incremental-gates.mjs --check`）。
#
# 判定门槛（哪类能进登记表、哪类绝对不行）逐条写在 `scripts/ci-incremental-gates.mjs`
# 的文件头；口径与边界见规范 §13.5.18。
# ── 每日那七格：定时与手动触发**共用这一份**（`.daily-gates` 锚点）────────────
#
# 为什么做成锚点而不是两处各写一遍：这条清单现在有**三个触发口** ——
# ① `"crontab: 0 1 * * *"`（每天 01:00，无人值守）；② `web_trigger_daily`
# （人在页面上手点，按钮定义在 `.cnb/web_trigger.yml`）；③ `api_trigger_daily`
# （CLI / API：`cnb build start-build --event api_trigger_daily`，服务端只认
# `api_trigger` 前缀，所以那个按钮**点不动**自动化这条路 —— 见下面那格的注释）。
# 三条跑的是**同一件事**：
# 「现在就把这份清单跑一遍」。写成几份的时刻就是它们开始各漂的时刻（哪天给每日档加一格、
# 忘了加到手点那条，「手点一遍每日档」得到的就不是每天 01:00 那一跑）——
# §12.12 的孪生形态，只是它长在配置里。判据钉的是「三条解析出来的 stage 名单**逐字相同**
# 且等于 `COMFYAPP_CI_DAILY_GATES`」（`tests/no-platform-ci-config.test.ts`）。
#
# 与 `.gates`（PR 那三十七格）同理，这里也刻意**不带 `ifModify`**：这七格是「重跑一遍」
# 的语义，按改动面跳过就不是每日档了。

# ── 锁按**触发类**分：`push` / `daily` / 单跑三档各一把 ────────────────────────
#
# `.common` 那条 `lock.key: pr-$CNB_PULL_REQUEST_IID` 的理由写在它自己的头注里（#1981：
# 平台默认 key 含 `CNB_BRANCH`，而合并类事件上它是**目标分支** ⇒ 全仓 PR 共用一把锁、
# 并行 PR 互相掐停）。PR 那一半今天照旧成立，这里一字未动。坏下来的是它**多出来的那半句**：
# `CNB_PULL_REQUEST_IID` 在非 PR 事件上没有值 ⇒ 所有非 PR 流水线落回同一把字面 `pr-`，
# 而写下那句前提的时候（#1981）全档只有**一条**非 PR 流水线（`master 合并复核`），
# 所以「不带分支名也不丢语义」当时是真的。
#
# 后来加的两批都用了 `<<: *common`，那句前提就没人回来改了：每日档三条触发口
# （定时 / 手点 / API）+ 单跑口六条 ⇒ 现在**九条**非 PR 流水线共用一把 `pr-`。
# 两次后果都是当场取到的读数，不是推演：
#
#   · `cnb-5j9-1k5bc4p4u`：前 9 格全绿，最后一格 `每日单元测试` **cancel** ——
#     终止时刻与两笔 master push 的 `createTime` 相差 3 秒（ISSUE #2114 出勤表第四行）；
#   · `cnb-lm1-1k5h1otqt`（`api_trigger_build`）：跑到第 **244.06 秒**被 `cancel`，
#     紧挨着的那次 push（`cnb-ndi-1k5h20bhg`，`2026-10-22T05:40:39.000Z`）与之差 **0.2 秒**。
#     被掐掉的不是「每天一次的无人值守」，而是**一个人为了排障刚点下去的按需复验** ——
#     它前面已经花了 244 秒装依赖，重跑一遍才能拿到结论。
#
# ⇒ 一把锁要挡的是「**同一件事**被重复排队」，不是「所有非 PR 的事」。
#   `master 合并复核` 掐掉正在跑的每日档 / 单跑，从来不是任何人的意图。
#
# 所以按触发类各给一把，键名一律是**字面量**（不带变量 ⇒ 不存在「某个事件上变量无值
# 就退化」这条路；#1981 那条教训正是别指望变量在某个事件上有值）：
#
#   · `push`     —— 仍然只有 `master 合并复核` 一条，它本来就该「一条就够」；
#                   ⚠️ 但它**不掐旧的那一跑**（`cancel-in-progress: false`，ISSUE #2396）：
#                   这一格判的是「落到 master 的是不是 PR 合并形态」，**逐提交**给读数，
#                   而被掐掉的那一跑等于没有读数；重跑它的成本整条只有 20~35 秒
#                   （大头是全量 clone 的 Prepare）⇒ 「互斥省时间」在这里没有收益，
#                   只留下「前一笔的读数被销毁」这一条代价。真出现两条排队时，
#                   逐笔复核也应当逐笔给结论（现场两对，间隔都在 12 秒内：
#                   `cnb-9qi-1k5qojle1` / `cnb-qta-1k5ptts6m` 被判 `cancel`，
#                   prepare 里的原文是 `The current pipeline is terminated`，
#                   而反过来那一跑写着 `the ongoing pipeline is terminated: cnb-9qi-…`）。
#   · `daily`    —— 定时 / 手点 / API 那三条**同一档**，「后起的掐掉先跑的」一字未改地保留
#                   （§13.5.3.10 想要的就是这份互斥：同一台机上不要同时压两遍那七格）；
#   · `oneshot-build` / `oneshot-e2e` / `oneshot-unit` —— 每档自己一把：同一档被连点两次
#                   仍然只留最新那一跑，而**不同档各跑各的** ——
#                   「我要复验构建」不再被别人的「我要复验 E2E」掐掉。
#
# ⚠️ 这里**新增**了一条平台事实：不同档的单跑从此可以同时在跑，而节点只有一台。
#   这不是拿并发换绿 —— PR 之间本来就各用一把 `pr-<iid>`、早就在叠加了；真要挡「整台机
#   一次只跑一条重档」得另做一条全局锁，那是另一个决定，写在这里而不是顺手做掉。
#
# 判据：`tests/no-platform-ci-config.test.ts` 的 `pipelineLockAssignments()` 与
# `resolveLockKey()` 一族 —— 按事件把每条流水线的**有效 key** 代出来，判
# 「同类的 key 相同、异类的 key 相异、任何一条都不与 `pr-<iid>` 撞」，
# 并逐条带坏形态的反向复算（含「有人忘了写覆盖 ⇒ 退回 `pr-`」那一种）。
.lock-push: &lock_push
  key: push
  # 唯一一把**排队而不终止**的类锁（ISSUE #2396，理由见上面 `push` 那一行）：
  # 这一格逐提交给读数，「只留最新那一笔」等于把前一笔的结论删掉。
  cancel-in-progress: false
.lock-daily: &lock_daily
  key: daily
  cancel-in-progress: true
.lock-oneshot-build: &lock_oneshot_build
  key: oneshot-build
  cancel-in-progress: true
.lock-oneshot-e2e: &lock_oneshot_e2e
  key: oneshot-e2e
  cancel-in-progress: true
.lock-oneshot-unit: &lock_oneshot_unit
  key: oneshot-unit
  cancel-in-progress: true
# 桌包那一档自己的锁（ISSUE #2503）。它**不与每日档共用**：两条档各有自己的格子
# （条数只以这份文件里的 `*daily_gates` 与 `*package_gates` 两个锚点为准，**不在注释里记账数**
# —— #2878 数到这一行时它写的两个数都已经漂过一轮了），共用一把就等于「手点一次桌包会把
# 当日那一跑的某一格掐掉」—— 而这两件事各自要
# 结论。`cancel-in-progress: true` 的语义在这一档上是「同一档连点两次只留最新那一跑」。
.lock-package: &lock_package
  key: package
  cancel-in-progress: true
# 探针 A 的锁（ISSUE #2363，一次性）。`cancel-in-progress: false` **就是被测的那个东西**：
# 第二条在第一条活着时到达，到底是排队、被跳过、还是照样并行 —— 写 `true` 等于把问题掐掉。
# 「锁按类分开」那一族的 R2（类锁必须带 `cancel-in-progress: true`）因此在这把锁上**刻意
# 不成立**，它是 `PROBE_PIPELINES` 那段有期限例外的一部分（判据与到期日见
# `tests/no-platform-ci-config.test.ts`），不是漏写。
.lock-probe-a: &lock_probe_a
  key: probe-2363-a
  cancel-in-progress: false
# ⚠️ 这里曾有 `.lock-formatfix`（`oxfmt 格式` 的委托回写口独占一把锁，ISSUE #2362/#2365）。
# 那个事件连同委托在 ISSUE #2610 里整条摘掉（PR 事件的令牌推不动、也触发不了可信事件），
# 所以这把锁没有引用者了 —— 留着它就是一条「在册而无人出勤」的配置（§13.5.x 那一族）。

# ── push 档（`master 合并复核`）的格子：树级校验档 ────────────────────────────
#
# 2026-10-28 起扩格（此前整条只有 `合并形态复核` 一格、20~35 秒）。撤进来的四格判的都是
# 「**合并后的树**一致不一致 / 这次运行的事实是什么」，不是「这次 PR 改了什么」——
# 那一类留在 PR 档（判据面在 `ci-incremental-gates.mjs` 的登记里逐条写着为什么收窄安全）。
# 2026-11-02 起的 `GitHub master 镜像` 是这一档里唯一的例外：它不校验树，是出口动作
# （把 master 镜像到 GitHub，那边的 schedule 才跑得到新树），取舍写在那格的注释里。
# 顺序有讲究：
#   · `合并形态复核` 排最前：形态不对（非合并提交）时后面全部 skipped，
#     别在没资格的工作区上花 typedoc 的钱；
#   · `GitHub master 镜像` 紧随其后：它不吃 node_modules，排在前提格之前没有成本；
#     排在它后面反而会让「文档链红了」连带「镜像不推」—— 那不是想要的对偶；
#   · `安装依赖` 是前提格：`API 文档生成与自检` 要跑 typedoc，而 push 是全新 job 目录、
#     `node_modules` 恒不在场（与每日档同一形态，理由见 `每日安装依赖` 那段）。
#     缺了它，这一档会以「找不到 typedoc」的形态红 —— 与每日档当年「找不到 next」同一族。
#     **这一格接槽**（ISSUE #2851）。判「哪一档能接」的那条线不是档名，是**后面有没有
#     `next build`**：接槽把作业的 `node_modules` 整棵接成指向项目根之外的 junction，而
#     Turbopack 对这一条有硬要求（每日那一档因此不接，理由与两臂读数见 `每日安装依赖` 上面那段）。
#     push 清单里没有构建格 ⇒ 那条限制与这一档无关。证伪不是靠推的：这四格在搬到 push 档之前
#     长在**接了槽的 PR 流水线**上，两臂（未命中建槽 / 命中）的逐格原值、以及「哪一格在哪一臂
#     因 `ifModify` 没被执行到」都记在规范 §13.5.3.4.3 —— 这里不抄数，抄一份就会漂第二次。
#     ⚠️ 收益的**预估同样不进正文**（§13.5.3.4.3 那条量具纪律）：落地后已按同一格回查，
#     原值与「两个方向都不许外推」那两句都在规范那一份出处里。
#   · 四格保持 PR 档时的**同一入口、同一旗标、同一 `ifModify`** —— 撤档不等于换判据。
#     `ifModify` 在 push 事件上的语义由平台按合并提交的差异面算；平台不认时恒跑，
#     方向是「多跑」不是「漏跑」，安全侧。
.push-stages: &push_stages
  - name: 合并形态复核
    # 这一格曾有「唯一没钉控制台编码」的历史（规范 §13.5.3.9）：补上那层 `$enc=…`
    # 不改变读数，但让它不依赖「控制台代码页恰好是多少」这个**继承来的**状态。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-branch-guard.cjs --merge-commit
  # ── GitHub master 镜像：这一档唯一的**出口动作**（不校验树）──────────────────
  #
  # 它要回答的事：GitHub 侧的 schedule（`.github/workflows/daily.yml` /
  # `package-desktop.yml`）跑的是镜像仓的**默认分支** —— CNB 的 master 不推过去，
  # 它们每天跑的就是一棵停在旧 SHA 的树，绿灯与「今天的 master 行不行」无关。
  # 所以每一次 master push 都要把 HEAD 推成那边的 `refs/heads/master`（`--force`：
  # 镜像语义是「跟住」，漏推之后下一推自己追平）。
  #
  # 排位：在 `合并形态复核` **之后**（形态不对的工作区整档 fail-stop，没资格的树不推）、
  # 在 `安装依赖` **之前**（推送只吃 git 与令牌，不吃 node_modules —— 早推早就位，
  # 也让后面几格校验红掉时镜像不跟着陪葬：树级校验红 ≠ master 不该被镜像）。
  #
  # `--readout` 与 PR 那一格 `GitHub 镜像同步` 同族同理由（#3051）：egress / 仓库 /
  # 令牌是**外部前提**，实测这条链路上撞过 `Failed to connect to github.com port 443`，
  # 前提没落地不许叠进树级校验的红；三态原值照旧逐行打在日志里。脚本那一侧的形态
  # （不派发、不需要 IID、`[mirror-master]` 前缀）见 `scripts/ci-github-mirror-push.mjs`
  # 文件头「--master」一节。令牌经 push 流水线的 `imports:` 注入（与 PR 那条同一枚）。
  - name: GitHub master 镜像
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-github-mirror-push.mjs --master --readout
    # 与 PR 那一格同一档外框：探活 30s×至多 3 次、推送 240s×至多 2 次都在脚本里各自
    # 限时并对 egress 类失败带退避重试（REMOTE_PROBE_TIMEOUT_MS / PUSH_TIMEOUT_MS /
    # PROBE_MAX_ATTEMPTS，2026-11-02 起 —— `cnb-pe2-1k6e1uhj8` 连续两跑死在探活 15s
    # 无回话，同日 19:47 同 runner 却探活通过，是间歇抖动不是硬阻断）。10m 是包住
    # 最坏墙钟（探活 ≈105s + 推送 ≈485s）与节点冷启动的余量。
    timeout: 10m
  - name: 安装依赖
    # 与 PR 那一格 `Install dependencies` 的**命令行 / env / timeout 三样都逐字相同**
    # （判据 `tests/no-platform-ci-config.test.ts` 的 `CROSS_LANE_SCRIPT_MIRRORS`）。
    # 同一份脚本长在几条流水线上各配一份 env，就是几条流水线各自漂（§12.12 的孪生形态，
    # 只是它长在配置里）。墙钟那一行是给 `ci-install-deps.mjs` 自己的 12m 预算留的余量，
    # 不是「抬 timeout 换绿」（#2360 / §11.13）。
    env:
      COMFY_CI_SLOT: "1"
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 生成态文档与源同步
    ifModify:
      - "docs/**"
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/render-doc-placeholders.cjs --check --autofix
  - name: API 文档生成与自检
    # 收窄面**不是手抄的，也不在这里记条数**：算的那一份是
    # `scripts/docs-api-input-closure.mjs`，核的那一份是 `tests/ci-incremental-gates.test.ts`
    # —— 闭包里多出任何一个文件、而这里没有它 ⇒ 当场红。别在这里手加一条（那正是
    # ISSUE #2223 的漏判形态）。要条数就问判据，别抄注释：这一行曾写着「17 条」而那份面是 18 条，
    # 而判据只比「面 ⇄ 闭包」、不读注释里的数字 —— 谁都不会因此红（ISSUE #2878）。
    # ⚠️ 产物面 `docs/api/**` 不在收窄面里（ISSUE #2231）；这一格不带 `--autofix`：
    # 产物不再进 git，没有「自动修完再提交」的对象，而「自动修 + 再判」正是让
    # 「产物陈旧」在 CI 上隐形的那一格（#2231 的现场：master 上差 9 处而平台报绿）。
    # 判据的形状见 `scripts/check-docs-api.cjs` 的文件头。
    ifModify:
      - "src/lib/**"
      - "src/server/**"
      - "src/trpc/**"
      - "typedoc.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-docs-api.cjs"
      - "scripts/typedoc-run.mjs"
      - "scripts/db-backup-core.mjs"
      - "scripts/db-push-core.mjs"
      - "scripts/db-schema-state.mjs"
      - "scripts/launcher-core/command-echo.mjs"
      - "scripts/launcher-core/shell.mjs"
      - "scripts/launcher-core/worktree.mjs"
      - "scripts/lockfile/lock-diff.d.mts"
      - "scripts/lockfile/lock-diff.mjs"
      - "src/config/custom-nodes.ts"
      - "src/env.js"
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-docs-api.cjs
  - name: 文档引用与权威源一致
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-doc-references.cjs
  - name: 工作区出处
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-workspace-provenance.mjs
    timeout: 5m

.daily-gates: &daily_gates
  # ── 每日失败立案：排在**整份清单的最前面**，判的是「上一跑」──────────────────
  #
  # 为什么在这一格（ISSUE #2274）：`check-daily-attendance` 那条判据要有人跑才出结论，
  # 于是「每天 01:00 那一跑红了」这件事在没人问的日子里等于没发生 —— 而它一红就带下去
  # 后面四格整片 `skipped`，其中 `每日单元测试` / `每日全量E2E` 的唯一执行者就在这条链上。
  # 这一格把「红了」自动变成一张单（或在同一格的旧单下追加一条读数），不依赖有人想起来去问。
  #
  # ⚠️ **必须在最前面，不是排版选择**：它立案的是**上一跑**（此刻这一跑还没跑完，
  # 它自己的结论不存在）。写在任何一条红格之后，都会被那条红一起 `skipped` ——
  # 而那正是本单要治的形态。平台没有可用的条件语法可依赖：本文件今天只有 `ifModify`，
  # 没有一处 `when:` / `fail()`（别猜它有）。
  #
  # ⚠️ `--no-block` 是一条**取舍**，不是宽容：这一格自己坏掉时（取不到平台读数 / 写单被拒），
  # 拦路等于用「后面四格没有读数」换「红被承认」。所以非零都落成退 0，但那句红话原样打在
  # 屏幕上并给出可粘贴的手工出口 —— 由用例钉住「不许改成静默 return」（`--no-block` 不带时
  # 仍是仓内三态口径 0/1/2，本地与判据档用那一档）。
  #
  # ⚠️ `--lane 每日生产构建` 是**必给**的（ISSUE #2595）：定性与日志取回来之后，
  # 还要认得出「红的那一格是不是这一档的流水线」—— 02:00 那条定时口的事件名同样是
  # `crontab:` 前缀，只按事件名挑「上一跑」，就会把桌包那一跑的红记到每日档头上
  # （2026-10-28 的现场：`cnb-7g8-1k60e2jk5` 红在 `打包·壳工具链自证`，标题却写成
  # `ci(daily): … 红在「打包·壳工具链自证」`）。流水线名就是平台自己写的归属，
  # 不必猜事件与档的对应关系；给了它之后，不是这一档的那几跑一律「不归本格管」。
  - name: 每日失败立案
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-daily-failure-issue.mjs --no-block --lane 每日生产构建
    # 5m：三条读命令（构建列表 / 逐格详情 / 逐格日志）+ 最多一次建单。实测本地跑同一入口
    # （`--dry-run`，含逐格日志摘录）1.6s。给 5m 是留给节点冷启动与平台慢响应，
    # 而不是给「让它多试几次」—— 这一格拿不到读数时**不重试也不写**，退 2 由话术说出来。
    timeout: 5m
  # ── 令牌权限读数：这一跑的 `CNB_TOKEN` 够得着哪些能力（ISSUE #2551）────────────
  #
  # 为什么要有这一格：本仓引用「PR 那一族只有 `repo-code:r`」这句话的地方有十几处
  # （#2339 / #2362 / #2365 / #2472 / #2550），而出处始终是**别人先撞上 403 之后抄下来的
  # 那句话**。于是「PR 上到底有没有 `repo-issue:r`」这个问题，过去只能翻官方文档的权限表
  # 再猜平台实现。这一格拿一串**只读**接口挨个问一遍：403 里平台会自己点名缺什么 scope，
  # 于是**平台自报的授权面**落进构建日志，不必等某一格真去写、真被拒。
  #
  # ⚠️ **排在第一格 `每日失败立案` 之后**，不是排在它之前：那一格立案的是**上一跑**，
  # 所以它必须排在任何可能红的格前面（否则被前面那次红一起 `skipped`，而它要治的正是
  # 那个形态）。这一格虽然是读数、自己也几乎不会红，但要挪到它前面就得先回答「为什么
  # 立案那一格可以让位」—— 答案是没有理由让位，所以顺序就是这样。
  #
  # ⚠️ **不带 `--strict`**，而且这是踩过一脚之后的结论（ISSUE #2551 的第一跑
  # `cnb-vv9-1k60eb6vl`）：带了之后这一格在 `pr_fail_stage` 上**红**了，而红的原因是
  # **平台侧** —— 那一跑的令牌连 `repo-cnb-history:r` 都没有（同跑的 `PR 失败立案`
  # 撞的就是这一句），于是 14 条探针全落「没拿到答复」，`--strict` 把「一条明确答复
  # 都没有」提成退 2。于是 PR 上会出现一条**永远红、且没有任何人能修**的格子 ——
  # 「没量到」不是这一格坏了，那正是这一格要量的东西。
  #
  # 于是这一格**任何情况都不构成红**（`--strict` 只留给手工自查）。这与
  # `工作区复用读数` / `镜像身份` 同一口径：量的是平台怎么给权限，判它红等于把平台形态
  # 伪装成这次 PR 的缺陷。
  #
  # ⚠️ 它**不打令牌值**（硬规则 17）：打的是「哪些能力够得着」，不是「凭什么够得着」。
  # OIDC 兑换那一问的请求体含 `cnb_token`，所以默认不发、只有 `--probe-oidc` 显式点名才发。
  #
  # ⚠️ **它走 HTTP，不起 `cnb`**（第五跑读数）：自托管 runner 的宿主 PATH 上**没有 cnb**
  # （`Install dependencies` 那一格的日志里只有 node / pnpm / git），前四跑因此全落
  # 「输出里没有平台信封」。这一格只要平台无条件注入的两件：`CNB_TOKEN` +
  # `CNB_API_ENDPOINT`，加宿主 Node 自带的 `fetch` —— 所以它能在装依赖之前就跑。
  - name: 每日令牌权限读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-token-scopes.mjs
    # 5m：14 条只读请求**并发**跑（实测本机合计 0.45s）。第五跑给的是 2m，而那一跑
    # 撞上了这个数 —— 读数全跑完了、却整格被判超时。预算按「卡死要早报」的量级给，
    # 不按那次读数调：并发之后单条慢请求已经被掩盖掉，剩下的风险是平台整体慢。
    timeout: 5m
  # ── 前提三格：script 行与 PR 那条流水线上的同名档**逐字相同** ──────────
  # 为什么不共用 YAML 锚点：`pipelineStageNames()` / `stageBlock()` 是按名字在文本里
  # 取块的，两格重名会让「哪一条流水线的读数」变成解析器的运气。所以这里各起一个
  # 带「每日」前缀的名字，而**由判据钉住它的 script 与 PR 那一格逐字相同**
  # （`tests/no-platform-ci-config.test.ts`）—— 漂移的形态是「一边改了另一边没改」，
  # 那正是这份清单里所有「只许一处」的判据在挡的东西。
  # ── 工具链自证（自托管特有：没有 docker 镜像兜底，装没装由这一步说了算）──
  # 这段是本文件存在的**前提**，不是可选的自检：宿主机缺 Node / pnpm / git 时，
  # 后面每一步都会以看不懂的方式失败（`pnpm: not recognized`、corepack 拉版本超时），
  # 排障成本远高于在这里花三秒正面回答。失败即非零退出 —— 它必须会红。
  #
  # ⚠️ 2026-10-19 从 PR 那一条挪到这里（业主口径：「只是判断环境的，不要每次都判断，
  # 这个环境不会经常改动」）。**挪的是节奏，不是撤账**：这一格在 PR 上每次跑要
  # 13.8s（逐格读数见 `COMFYAPP_CI_GATES` 那段），而它问的是**节点事实** ——
  # 一次 PR 改不动 PATH、改不动 winget。今天卡住每日那一跑的三条基线红里就有一条
  # 长在这一族上（`ci-toolchain-selfcheck`），「每次都判」换到的是噪声而不是结论。
  # 留在 PR 上的那一半是 `Install dependencies` 里的 `check-pnpm-available.mjs` ——
  # 它判的是「这台机跑不动整条链吗」，那才是每个 PR 都需要有人回答的问题。
  - name: 每日工具链自证
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      # ── 编码探针（头注第 6 条那件事的**常读读数**）──
      # 前四行中文分别由四层吐出：PS 自己（写它自己的编码）、cmd（console CP）、
      # node（UTF-8）、以及**绕过控制台对象、直接以 CP936 字节写 stdout** 的那一行。
      # 哪一行在平台侧可读，就说明**平台在那一层用的是什么编码** —— 乱码是「多层里
      # 哪一层断的」这件事，只看一行日志永远分不开。
      Write-Output "编码探针·PS 原生：中文一二三"
      cmd /c "echo 编码探针·CMD：中文一二三"
      node -e "console.log('编码探针·NODE：中文一二三')"
      # 第 4 行是**决定性的那一条**（2026-10-16 晚加）：前两轮读数已经否掉「控制台代码页」
      # 与「宿主 ANSI 代码页」两个嫌疑人，剩下「解码端写死 CP936」这一种。
      # 这一行可读 ⇒ 就是它，仓库侧「逐 stage 以 CP936 出口」这条出路成立；
      # 这一行仍乱 ⇒ 还没找对层，继续往上（判读见头注第 6 条）。
      $gbk=[Text.Encoding]::GetEncoding(936); $b=$gbk.GetBytes("编码探针·GBK 出口：中文一二三`n"); [Console]::OpenStandardOutput().Write($b,0,$b.Length); [Console]::OpenStandardOutput().Flush()
      # 逻辑在 scripts/ci-toolchain-selfcheck.mjs —— **不在这里就地写 PowerShell**。
      #
      # 这一步原先是一段 ~70 行就地 PowerShell（探 Python、用 winget 当场装、
      # 打印「这个账号看得见什么」）。问题不在它写得对不对，而在**配置里的逻辑
      # 一条判据都测不到它** —— `.cnb.yml` 只在平台上跑，本地一个执行者都没有，
      # 于是它只能靠「推上去看看红不红」验（#1959 第二、三轮各红过一次）。
      #
      # 现在是 scripts/ci-toolchain-selfcheck.mjs：
      #   · 候选表回到唯一一处（src/lib/process/python-candidates.ts）——
      #     此前它探的面与门禁探的面不是同一份，两边各判一次「没有」；
      #   · 这一步**能被单测直接跑**（tests/ci-toolchain-selfcheck.test.ts）；
      #   · 失败时的取证（执行账号、PATH、四个安装位置的命中情况）一并搬进脚本，
      #     并给出「位置命中而命令探不到 ⇒ 改账号 PATH，别重复装」这条分岔。
      # 仍会红：缺 git / node（不在 engines.node 内）/ pnpm / Python 时非零退出。
      # 清单与判读顺序见 docs/standards/13-提交与-code-review.md §13.5.3.5。
      #
      # **第一件事是把控制台输出编码钉成 UTF-8**（ISSUE #1959 的日志乱码）。
      # 平台抓取 stage 输出用的是宿主 ANSI 代码页（中文 Windows 上是 CP936），
      # 而 Node / pnpm 无条件写 UTF-8 —— 于是本机打的每一个非 ASCII 字符在日志里
      # 都是乱码（`工具链自证通过 ✓` → `宸ュ叿閾捐嚜璇侀€氳繃 鉁?`），而 PowerShell
      # 自己打的字是好的（它按控制台的编码写字节）。这一句把那两边重新对齐。
      # 放在**最前**：后面的每一步都在打这种字，先把编码钉住再说话。
      # `chcp` / `[Console]::OutputEncoding` 改的是**控制台对象**上的设置，
      # 同一控制台里的进程共享它 —— 所以它在第一步设、后面的 stage 都受益。
      # 它恒退 0（纠正动作与读数，不是判据），机制见 scripts/ci-console-encoding.mjs。
      # ⚠️ 两条各包一层 `ci-cp936-exit`：先钉住控制台编码（让 PowerShell 把 Node 的
      # UTF-8 **解对**），再由外壳把它以 **CP936** 写回给平台（ISSUE #1977）。
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-console-encoding.mjs --apply
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs
  # 与 PR 那格同一份实现（`ci-install-deps.mjs`：先自证 pnpm 起得来，再按语义判
  # 要不要装）。判定与命令行**必须与 PR 那格逐字相同** —— 这不是风格：判据
  # `tests/no-platform-ci-config.test.ts` 的 `CROSS_LANE_SCRIPT_MIRRORS` 比命令行、
  # env 赋值与 `timeout` 三样，同一份脚本长在两条流水线上各配一份 env，
  # 就是两条流水线各自漂（§12.12 的孪生形态）。
  #
  # ⚠️ **这一格现在不接槽，而那是那条判据上唯一登记过的例外**（ISSUE #2081，2026-10-21）：
  # 接槽把作业里的 `node_modules` 整体接成**指向项目根之外**的 junction，而 Turbopack 对
  # 这一条有硬要求 —— 每日那一跑后面背着 `每日生产构建`，它当场
  # `Symlink [project]/node_modules is invalid, it points out of the filesystem root`（13.8s 就死，
  # 连带 skip 掉 ESLint / 浏览器 / 全量E2E / 全量单测四格）。PR 那一格不构建，所以同一条链
  # 在 PR 上从来没有被它的消费者拒绝过（push 那一格同理，#2851 已把开关拨过去）。
  # ⚠️ **这条限制现在是「没验过」而不是「无解」**：#2521 已把官方
  # `experimental.turbopackAdditionalRoots` 那扇门装进 `next.config.js`（只在
  # `COMFY_CI_SLOT=1` 时登记槽根），可这一档从不置那个开关 ⇒ **那份 mitigation 在每日档上
  # 一次都没有被执行过**。撤这条限制要先拿一次真构建验它承重，不能拿「配置在场」当「验过了」。
  # 两臂读数（同一台机、同一份 master，唯一变量就是这一行 env）见规范 §13.5.3.4.3 与
  # `docs/audits/2026-10-21-timing-baseline-refs-volume.md`：接槽命中 13.8s、不接槽 48.8s（暖）。
  # ⇒ 代价是**每天多付 ~35s**，换来的是整条每日档有一个能构建的工作区 —— 槽是优化不是前提。
  # 例外不是「可以随便漂」：判据钉死「PR 那一侧必须置着 `COMFY_CI_SLOT`、每日这一侧一个字都不许出现」，
  # 其余各行仍然逐字相同；改这条形状要走判据，不能只改这里。
  - name: 每日安装依赖
    # 与 PR 那一格同一条链 ⇒ 同一个墙钟（ISSUE #2360）。`timeout` 也在「逐字相同」的
    # 比对面里：这一行改成别的数，就是三份副本里第一份开始漂。
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 每日 Python 可用性
    # ── **必须排在「每日单元测试」之前**（这条顺序原来是 PR 上的，2026-10-19 随两格一起搬来）──
    #
    # 套件里有一族用例（`tests/helpers/python-exe.ts` 的 `PYTHON_OK` 守卫、
    # `e2e/support/fake-comfyui-executor-env.mjs`、`scripts/check-app-port-vectors.cjs`）
    # 需要一个**真能起来**的解释器。缺件时它们按既有口径走 `env` 档跳过并登记 —— 也就是说
    # 这一步**不会让那一格变红**，只是少判几格。而「少判」在日志里是隐身的。
    #
    # 实测（`cnb-jt3-1k5071kou`）：这台节点上确实一个解释器都没有，而单测照样往下跑、
    # `Python 可用性` 排在**两小时之后** —— 于是「缺 Python」这件事要么永远看不到，
    # 要么在最贵的位置才看到：那一次 `单元测试` 跑到 2h24m 被 8640s 的墙钟上限掐断，
    # 整条流水线只留下 `timeout of 8640000ms exceeded`，一条失败原因都读不到。
    #
    # 判据那一份只有 `--python-only` 一个（`findPython` / `installPython` /
    # `pythonForensics`）；它与 `每日工具链自证` 不重复：那一步判**整机四件**且缺件即红，
    # 这一步只回答**解释器住哪** —— 绿时打一行版本号（把「E2E 到底用哪个解释器」变成
    # 可读读数），缺件时打取证并**非零退出**（红在能指路的位置）。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --python-only
  # ── Python 探针读数（两条链各自的结论，**只打印、不阻断**）──
  #
  # `每日 Python 可用性` 用的那条链（`findPython` 起**裸名字**，Windows 交给 CreateProcess
  # 按 PATH 解析）与 E2E 前置用的那条链（`resolvePython` 手工扫 PATH × PATHEXT、再对
  # **绝对路径**起一次）是「同一台机器上哪个解释器能跑」的两个不同实现。实测出过
  # 相反结论（`cnb-g36-1k50hvu52`：`Python 可用性` 绿、`E2E 关键流程` 报
  # 「PATH 上没有可用的 Python」）—— 而**只看一边的日志分不出是哪一边错**。
  #
  # `scripts/python-probe.mjs` 把两边的读数都打，退出码恒为 0：它是**打印**、
  # 不是判据（判据那一份只有 `--python-only` 一个）。2026-10-19 随 `Python 可用性`
  # 一起从 PR 那一条挪来（同一口径：判的是节点，不是这次改动），而它排在解释器
  # 判据之后、`每日全量E2E` 之前 —— 那才是这两份结论互相要看着的位置。
  - name: 每日 Python 探针读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/python-probe.mjs
  - name: 每日同步数据库表结构
    # 库里要有表：套件里读库的那几条在没有库时的形态是「连不上」，看起来像业务故障
    # （§9.1 那格「页面 200、接口 500」的同一族误诊）。`db-push.mjs` 复核真建出表。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/db-push.mjs
  # ── 每日新鲜度账（主体=master；判据本体与 PR 那格逐字相同）────────────────
  #
  # 这一格是 `scripts/freshness-gate.mjs` 的**每日执行者**（判据一字未改，仍与
  # `.githooks/pre-commit` 的 D 组「每档都有主」同一份，§13.5.17 同款）。
  # 它 2026-10-23 从 PR 那一条撤到这里（ISSUE #2300 主体分权）。
  #
  # ⚠️ **env 那一行是这一格存在的理由**：主体=master ⇒ 判据读的是**主干的账**
  # （`FRESHNESS_TRACKS[*].subject` 现在三档都是 `master`；机器分支
  # `ci/freshness-ledger` 上是那份权威副本）。PR 上下文读的是同一份账，
  # 判的却是「这台机器 / 主干怎么被调度」，不是任何一次 PR 的缺陷 ——
  # 所以 PR 那一格撤了，主体这一栏不许省。
  #
  # ⚠️ **位置**：必须排在任何会刷新账的跑法脚本之前（`每日生产构建` /
  # `每日全量E2E` / `每日单元测试` 三格跑绿后会刷新自己那笔账；同一分支的 stage
  # 共享同一个工作区 ⇒ 排在它后面时读到的是「刚被这一次运行改过的账」，
  # 「账是旧的」永远判不出来）。
  - name: 每日新鲜度账
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/freshness-gate.mjs
    env:
      # 主体=master（`scripts/freshness-ledger.mjs` 的 `contextSubject()`：空 ⇒ "pr"，
      # 写错的值直接抛）。这一行是这一格与 PR 那格**唯一**的差别。
      COMFY_CI_SUBJECT: "master"
    # 秒级；给 5m 只是「卡死要早报」那条量级余量（判据本身远小于它，不需要更宽）。
    timeout: 5m
  # ── 全量单测**不在这里**：它排在整份清单的最后 ──
  # 理由是业主那句「最容易出问题的放最后」：这一档是这条流水线上唯一会因**这台机的
  # 负载**而单条超时的格子（实测 `cnb-b0l-1k59op66t`：775 份里 1 份红在
  # `Test timed out in 30000ms`，而同一时刻另一份检出在跑全量 vitest），
  # 排在中间就等于让一单条抖动决定后面三格跑不跑 —— 那三格至今零执行记录。
  # 原文与预算注释在 `.daily-gates` 末尾。顺序由判据钉住（不许回到中间）。
  # 入口是**跑法脚本**（ISSUE #1979 的口径）：
  # 裸 `pnpm run build` 会让这一步的绿只落在日志里、`scripts/.artifact-freshness.json`
  # 一个字不变。外面这一层（`ci-daily-build.mjs`）多出来的只有事件身份与镜像读数，
  # 判据与记账仍然是 `artifact-run.mjs` 那一份。
  - name: 每日生产构建
    # 控制台编码先钉住（头注第 6 条 / `ci-cp936-exit.mjs`），与其余每一格同形。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-daily-build.mjs
    # ── 构建缓存槽（ISSUE #2158；机制与实测见 `scripts/ci-build-cache-slot.mjs` 头注）──
    #
    # 这一格跑的是**生产构建**（每日那格是这台节点上**唯一每天都会发生的构建**；单跑口是同一份
    # 脚本的副本，两格正文必须逐字相同）。runner 每个作业都新建一个带流水线 id 的工作区目录
    # （形态由 `工作区复用读数` 定死）⇒ Turbopack 的持久缓存每次都从零开始。
    # 实测（同机同源三跑，`next build` 自报的编译段）：**冷** 95s ／ **暖**（用上一个工作区
    # 留下的常驻目录）14.9s —— 省的是整个编译段。
    #
    # ⚠️ **开关默认关**（`COMFY_CI_BUILD_CACHE`），只有构建这两格置着它。理由与依赖面那套槽同源：
    # 先让判据在场，再把开关拨过去（规范 §13.5.25）。机制本身是**失败即退回**的：槽根算不出、
    # 空间不够、槽被别人占着 —— 任一成立就只打一行读数、照常构建（缓存是加速，不是前提）。
    env:
      COMFY_CI_BUILD_CACHE: "1"
      COMFY_CI_SUBJECT: "master"
    # 30m：这一格跑的就是 `next build` + 数产物 + 冒烟。实测 118s
    # （`cnb-eus-1k5058g8l`）/ 131.0s（`cnb-ln5-1k540cfn1`），而 `next build` 在冷
    # 节点上比读数慢得多，但真挂死必须早报 —— 一天的预算只有这一条，卡满 2h 墙钟
    # 等于当天这一跑没有结论。与 `artifact-run.mjs` 的 `ARTIFACT_TIMEOUT_MS` 同量级。
    # ⚠️ 它**没有并发旋钮**，这是刻意的（ISSUE #1993 / 规范 §13.5.21）：`next build`
    # 的 worker 数由构建器自己按机器定，没有一个「按核数收敛」的键；`NODE_OPTIONS`
    # 那类改的是内存上限、不是并发 —— 拿它冒充降载就是换一个东西。这条路径上
    # **唯一真能控负载**的手段是「别让两条流水线同时压同一台机」
    # （`lock.cancel-in-progress` + 按 PR 分锁，见 §13.5.3.10）。
    timeout: 30m
  # ── ESLint 零警告（每天一次；2026-10-19 从 PR 那条流水线撤到这里）─────────
  #
  # 它在 PR 上是**唯一一个真的会挂满预算**的静态判据：两次现场都不是「规则报错」，
  # 而是这一步始终没跑完 —— `cnb-jt3-1k5071kou` 挂到 8640s（节点被别的流水线压死），
  # `cnb-hpl-1k5a0s6ss` 挂满 20m（命令口径写成了 `eslint .`，全仓冷跑；那一格现在
  # 跑的是 `pnpm run lint`，理由写在那段注释里）。
  #
  # 撤档的理由与 `每日生产构建` / `每日单元测试` 逐字相同（§13.5.21 / §13.5.23）：
  # 它是这台机上仅有的几档**起一堆子进程**的格子之一（类型感知规则要真起 ts 宿主），
  # 而节点只有一台、平台不给并发旋钮 ⇒ 并行 PR 下它的墙钟读数不可信。红的地方也
  # 不是「这次改动违规」，而是「这台机当时腾不出核」。
  #
  # ⚠️ 这**不是**把 lint 整个挪出 PR 这一档：`oxfmt 格式` / `格式化提交分离` /
  #   一批 `check-*.cjs` 仍在 PR 上，`tsc --noEmit` 也在 —— 只有这一格撤，
  #   因为只有它同时满足「起一堆子进程」与「本地有等价执行者」两条。
  #
  # 判据钉住的两半（`tests/no-platform-ci-config.test.ts`）：
  #   · 它**不在** PR 那一条的清单里，且在 `COMFYAPP_CI_DISABLED_GATES` 里留名
  #     （停用 ≠ 删除：`.gates` 里那段原文必须还在）；
  #   · 这一格必须在每日清单里，且 `script` 与 `.gates` 里那段注释原文的 `script`
  #     行**逐字同形**（漂移的形态是「一边改了另一边没改」）。
  - name: 每日 ESLint 零警告
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- pnpm run lint
    # 冷跑（这条路径上 `--cache` 恒定失效：缓存键含工作区的绝对路径，而平台每个作业
    # 都是新目录，见 `.gates` 里那段）实测：本机 8 核 ≈311s；节点侧历史上热跑
    # 256~274s、被压死时挂满过 8640s。给 30m 与 `每日生产构建` 同档 —— 一天只有这
    # 一跑，卡死要早报，而「跑得完的形态」与它差一个量级。
    timeout: 30m
  # ── 每日全量 E2E 的前提格：浏览器 ──────────────────────────────────
  # 与 PR 那格 `浏览器安装` 同一份实现（`ci-toolchain-selfcheck.mjs --playwright-only`），
  # 所以**两行 env 也必须一起带**：下载根与连接超时是那两次读数换来的
  # （`cnb-gt1-1k513ill4` 起），只镜像命令行不镜像 env 时，「Playwright 换版本的那个
  # 早上」定时那一跑会从默认根去取那 120 MiB —— 而默认根在这台节点上取不到，
  # 红只在第二天 01:00 出现。镜像判据现在两处都比（命令行 + `env` 的赋值行）。
  # 幂等：落点已有那一件时这一格是 1~5s（实测 `cnb-cdt-1k51s6mf1`）。
  # ── 浏览器安装（2026-10-19 起这是**唯一**的执行者：PR 上那一格撤到这里）──
  #
  # 撤的理由与 `每日工具链自证` 同一条：它判的是**这台节点能不能到下载根、浏览器在不在
  # 盘上**，一次 PR 改不动这两件事；而 `E2E 关键流程` 早已撤到 `每日全量E2E`，
  # PR 上没有任何一步再用浏览器 —— 那一格剩下的唯一作用只是「替第二天暖缓存」，
  # 那不该由每个 PR 付费。
  # 判据仍然钉住这件事的两半：这一格必须在 `每日全量E2E` **之前**，
  # 且 script / env 与当初 PR 上那一格**逐字同形**（镜像键与套接字超时是两个实测读数，
  # 抄错一处就回到「到不了」那一档，见下面那两段注释）。
  - name: 每日浏览器安装
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --playwright-only
    env:
      # **这两行是实测读数换来的**（`cnb-gt1-1k513ill4`）。
      #
      # 先撞的是 30s 的**套接字**超时（`NET_DEFAULT_TIMEOUT`）—— 那不等于「CDN 不通」，
      # 是「这一次没量完」。可把它放宽到 120s 之后**照旧超时**（`timed out after 120000ms`），
      # 于是结论变了：这台节点**真的到不了** `cdn.playwright.dev`。180 MiB 的包在
      # 这样一条链路上无论等多久都不会到。
      #
      # 所以换镜像 —— 走 `PLAYWRIGHT_DOWNLOAD_HOST`（Playwright 自己的环境变量，
      # 不引第二套机制）。选 npmmirror 的 Playwright 二进制镜像是因为**它真能供上这一件**：
      # 实测它按同一段路径回 HTTP 200，且 15s 内收到了 99 MiB。
      #
      # **为什么这一行只能是「外面给的」**：Playwright 自己的三个内置镜像**全同族**
      # （`cdn.playwright.dev` / `playwright.download.prss.microsoft.com`），
      # 这台节点出不去这一族时它 `retryCount = 5` 的「回退」等于没有 ——
      # 实测逐字打了 5 次同一个域名，然后 `Download failure, code=1`。
      # 也就是说这一档**推不出来**，只能由这里给：给上之后
      # `runPlaywrightInstall()` 就只用它（不再陪 Playwright 挨个试不通的那三档）。
      #
      # ⚠️ **这个值是给这台节点用的，换网络要跟着换**。平台侧 env 能覆盖它；
      # 本地不设就回到 Playwright 的默认行为（`playwrightHostsToTry` 的判据）。
      # 选它是因为它是 Playwright 点名的镜像键，而不是本仓发明的那一套；
      # 真要换（内网代理、别的镜像站）改这一行即可。
      #
      # ⚠️ 这两行与判据无关：判据仍是「装完真起一次浏览器」（`--playwright-only` 的复验）。
      # 镜像只是把「到得了」这件事从宿主机身上挪到一个到得了的地方。
      # 而这一步有**两条**通道：先自己分片取（不依赖这个根到得了大 body），
      # 失败才原样交给 `playwright install`（那时才用得上下面这两行）。
      #
      # ⚠️ **「很慢」要分两层看，换源只治其中一层**（用户那句诉求）。
      # 换源治的是「从哪儿取」；`playwright install` 自己那份下载**没有续传**
      # （`browserFetcher.ts` 每次失败 `unlink(zipPath)` 从头来），所以慢链路上一换
      # 源也照样卡在大 body 上 —— 那一层由本仓的分片自取（`fetchUrlResumable`）治。
      # 也就是说：**换源不是唯一的慢因，也不是判据**；判据始终是「装完真起一次」。
      # 三个候选根的顺序同步调过（`PLAYWRIGHT_HOST_CANDIDATES` 把 npmmirror 排前），
      # 好处是「没配根的环境（本地 / 别的节点）也先试离得近的源」。
      PLAYWRIGHT_DOWNLOAD_HOST: "https://cdn.npmmirror.com/binaries/playwright"
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
      # ⚠️ **这里不写 `PLAYWRIGHT_BROWSERS_PATH`** —— 它在**流水线级** env 里
      # （见 `.common` 那段「落点」）。理由与当初**不同**，两段都要留着：
      #   · 当初是因为容器那个 `/ms-playwright` 在 Windows 宿主上不存在 —— 写了它等于
      #     让落点判据去一个空目录找东西，「装好了」与「一件都没有」在日志里逐字同形；
      #   · 现在是因为**这一格与 `每日全量E2E` 那一格必须看同一个落点** —— 写在某一格
      #     的 `env:` 里，装的那一格看得到、跑 E2E 的那一格看不到，仍然是「装好了，
      #     探不到」。流水线级 env 是**所有格都能看到**的那一层。
      #
      # 判据钉住这件事的两半：`tests/ci-dev-drive-root.test.ts` 判「那三行在流水线级
      # env 里」，`tests/ci-image-identity.test.ts` 判「不是容器那个路径」。
      # 实测首次要下 ~100+ MiB（chromium + chromium-headless-shell 两件）。给 20m：
      # 冷节点 + 慢链路够用，而卡死（CDN 真的不通）时也能在 20m 报出来，不必等满平台
      # 默认的 2h 墙钟。**不是放宽判据** —— 预算只管多久放弃。
    timeout: 20m
  # ── 全量 E2E（每天一次；这一格是 `FRESHNESS_TRACKS.e2e` 的执行者）──────
  #
  # 为什么要在每日档跑**整档**：本地那一层从 2026-10-19 起不再要求自证（`ciStage`
  # 那一栏，规范 §11.8 / §13.5.23），而 PR 上的 `E2E 关键流程` 只跑 `@critical` 子集 ——
  # `isWholeTrackRun` 明写子集**不构成整档凭证**。没有这一格，「整档 e2e 今天能不能
  # 全过」就从一台有人推代码才判得出来的机器，变成一个谁都不判的空白。
  # （档里现在有多少条，问 `pnpm exec playwright test --list`，别抄在这里 ——
  # 这一行曾写「80 条」而 `--list` 报 81，ISSUE #2878。）
  #
  # ⚠️ **不许带任何收窄参数**（`--grep` / 指到单个 spec）：带了就会**绿着不记账**，
  #   而日志与账面看起来与真跑过一模一样 —— 那正是这一族最坏的静默形态。
  #   判据把这一条钉在 `script` 上（只扫命令行，不扫注释：注释里正当地要写这句话）。
  #
  # 跑法：`e2e-run.mjs` 自己起 webServer（`pnpm dev`，零 `PNPM_START` ⇒ 不依赖构建产物，
  #   这一格因此与 `每日生产构建` **各自独立**：构建坏了不影响端到端链路的结论）。
  # 45m：本地整档是十几分钟量级，而节点上是冷工作区 + 现场编译；与 `每日单元测试`
  #   同一档预算口径（卡死要早报，一天只有这一跑）。
  - name: 每日全量E2E
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/e2e-run.mjs
    # ⚠️ 这一行 env 是**产物前提的声明**，不是调档偏好：webServer 起的是 `pnpm start`，
    # 而 `.next` 里那份产物来自排在前面的 `每日生产构建`（同一分支的 stage 共享工作区）。
    # 旧形态下这件事靠 `playwright.config.ts` 里那句 `CI || PNPM_START` 推断，而它把
    # 「是不是 CI」与「有没有产物」绑成了一件 —— PR 那条撤掉构建之后就是这么红的
    # （`cnb-ob4-1k5828a36`：`Could not find a production build` ⇒ webServer 180s 超时）。
    # 现在写在一句话里，顺序判据也钉住「`每日生产构建` 必须排在这一格之前」。
    env:
      COMFY_E2E_SERVER: start
      COMFY_CI_SUBJECT: "master"
    timeout: 45m
  # ── 全量单测（每天一次；为什么不在 PR 上跑，见上面 `COMFYAPP_CI_DAILY_GATES` 那段）──
  #
  # ⚠️ **它排在整份清单里所有「会红的格」的最后**（业主口径：「最容易出问题的放最后，然后
  # 执行过的就不用重复执行了」）。这一格是这条流水线上唯一会因**这台机的负载**而单条超时的格子 ——
  # 实测 `cnb-b0l-1k59op66t`：775 份里只 1 份红，红在 `Test timed out in 30000ms`，
  # 而同一时刻另一份检出（`comfy-app-t3-branch2`）在跑全量 vitest、又一份在跑全量 eslint。
  # 它排在中间时，那一单条抖动就把 `每日生产构建` / `每日浏览器安装` / `每日全量E2E`
  # 三格一起 skip 掉（那三格至今零执行记录）。挪到最后之后，同一跑里那三格先拿到结论，
  # 不必为了单测的抖动把前面几格重付一次。
  # 顺序有判据：`tests/no-platform-ci-config.test.ts` 钉「每日单元测试 之后只允许跟
  # 覆盖率上报（报告型尾巴）」—— 它后面的那一格是报告型、非关键，不会因它 skip 掉前面的格。
  - name: 每日单元测试
    # 入口是**跑法脚本**，不是裸 vitest（ISSUE #1979 的口径，与 `每日生产构建` 同一条
    # 理由）：它内部就是 `pnpm run test:coverage`，外面那一跳是**记账** ——
    # 跑绿刷新 `scripts/.full-suite-freshness.json`，本地「改了就当天跑」那条判据与
    # 这一档读的是同一份事实。裸写 vitest 时这一档的绿只落在日志里、账面一个字不变。
    #
    # ⚠️ **必须整档跑**：`isWholeTrackRun` 会把「透传了 `--grep` / 指到单个文件」的
    #   绿判成**不构成整档凭证**、当场不记账。并发不进 `extra` 的同一条理由写在
    #   `planRun` 的注释里（塞错位置 = 每一次都绿而不记账）。
    #
    # 这一档还打**分文件耗时榜**（前 10 + 合计 + 中位，junit 落仓库内的
    # `node_modules/.cache/`，与钩子那侧共用 `parseJunitXml`）—— 它顺带回答「这台机上跑全量时
    # 哪几份在吃时间」，而那个数此前只在本地账本里有。只算测试阶段，用来排序不当 stage 墙钟。
    # ⚠️ 落点**不是** `os.tmpdir()`：那样拼出来的是 `--outputFile.junit=C:\…`，而 PowerShell
    #   宿主会在第一个冒号处把它切成两个参数，切剩的一截变成 vitest 的位置过滤器 ——
    #   这一档首跑 12.6s 红、后面三档全 skipped 就是这么来的（`cnb-2in-1k589j0kp`，
    #   边界表在 `scripts/launcher-core/shell.mjs` 的 `PS_UNSAFE_ARG_RE`）。
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/full-suite-run.mjs
    env:
      COMFY_CI_SUBJECT: "master"
    # 45m：`full-suite-run.mjs` 自己的墙钟预算是 30 分钟（`FULL_SUITE_TIMEOUT_MS`），
    # stage 预算必须**大于**它，否则先被平台掐的是 stage，而那一刀不带
    # 「被预算砍 vs 判据红」的分流话术（`classifyOutcome`）。
    # ⚠️ 两次读数把这条预算钉在很窄的带里：安静机器 827s（`cnb-eus-1k5058g8l`，755 文件
    #   全量绿），而**满载机器 2466s**（`cnb-b0l-1k59op66t`，同规模、41 分钟）—— 后者已经
    #   贴着 45m 的 stage 墙钟。而那一跑里 30 分钟的内部预算**并没有掐住它**
    #   （vitest 自己跑完了全程），也就是「被预算砍」那一档话术在这里没有执行者 ——
    #   这一格排到最后之后，被掐的代价不再是「后面三格没了」，但仍要修（见任务：
    #   `full-suite-run.mjs` 的 timeoutMs 在 Windows 上是否真收得掉子树）。
    timeout: 45m

  # ── 覆盖率上报：2026-11-02 从 PR 档挪到每日档（接在 每日单元测试 之后）──────────
  #
  # PR 档上的 `受影响用例` / `固定结构用例` 两测试格撤到每日全量单测后，PR 上不再有产出
  # coverage/lcov.info 的格子，这一格在 PR 上只会「报告不在 → 自己跳过」静默空转；而
  # 每日档的 `每日单元测试` 跑 `pnpm run test:coverage`，同一 job、同一工作区产出 lcov，
  # 这一格接在它后面把它交给平台的上报通道。它是**报告型**（不判任何东西，报告不在时跳过
  # 而不判红），没有 `ifModify`。顺序：必须落在 每日单元测试 之后（见上面那条注释与
  # `tests/no-platform-ci-config.test.ts`「每日单元测试 之后只允许跟 覆盖率上报」那条判据）。
  - name: 覆盖率上报
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-coverage-report.mjs

# ── 单跑口：三档重档各自一条，前提自动带上 ────────────────────────────────
#
# 每档两条流水线（手点 + API），两条都引用**同一张整表锚点**：
# 「单独验一次某一档」此前只能等 01:00 或整档手点，而修完东西想立刻复验一次的人
# 不该为另外九格付费。六条定义都在文件末尾那个**已有的** `master:` 块里 ——
# 这里不再开第二个 `master:`（同名顶层键会让 YAML 静默丢掉前一处，crontab 那条
# 就是这么没的；判据 `topLevelKeys()` 现在也判这件事）。前提集的取证与
# 「每日名 ⇄ 单跑名」的对照见 `scripts/ci-oneshot-gates.mjs` 与规范 §13.5.23。
# ⚠️ 单跑那一跑**不是每日档的出勤**：它只证「这一档现在过不过」，
# 不许被读成「今天定时那一跑跑过了」（ISSUE #2114 那条区分在这里同样成立）。

# ── 单跑那三张清单：整表锚点，格名每张都自带目标档前缀 ───────────────────────
#
# 为什么不用「序列元素级别的别名」（`- *stage_daily_install`）：那种写法必须把列表项拆成
# 两行（`- &anchor` 换行 `name: X`），而本仓有**六份各自独立的 `.cnb.yml` stage 解析器**
# （`ci-autofix-duties` / `ci-env-probe` / `ci-container-plan` / `ci-image-identity` /
# `ci-incremental-gates` / `no-platform-ci-config`），它们认的都是 `- name: X` 这一行形状。
# 实测代价：平台「受影响用例」那一格红三处（「解析出的 stage 数比 `script:` 少 6」、
# 某格「解析不出内容」），而每条红的真实原因都指不到「形状」上 —— 读起来像判据坏了。
# 探针本身是过的（`cnb-7d7-1k5f9m3c5`：平台确实会展开并执行元素级别名），
# **所以这不是能力问题，是这份配置的解析面付不起** —— 结论：不改行形状。
#
# 换成的代价写在明处：前提格的正文在这份文件里有多份（安装那格三份）。它由一条判据钉住
# ——「每个 `单跑<档>·X` 的 script / env / timeout 必须与 `每日X` 那格逐字相同」，
# 与 PR 那侧 ↔ 每日那侧「同一份脚本两条流水线」用的是同一个办法（#2081 就是这套判据抓的）。
#
# 为什么名字要带目标档前缀：`stageBlock()` / `pipelineStageNames()` 是按**名字**在文本里
# 取块的，两格重名就让「读的是哪条流水线的哪一格」变成解析器的运气。安装那一格出现在
# 三张表里 ⇒ 三个不同的名字；不然「逐字相同」那条判据只会比到第一次出现的那份，
# 后面两份漂移得静悄悄。
#
# 为什么每张表都带前提：每次构建都是全新 job 目录、`node_modules` 恒不在场
# （`工作区复用读数` 两跑实测），只跑目标那一格会红在「找不到 next / 连不上库 / 没有浏览器」——
# 那是**已知的假红**。逐档前提集与理由的一份出处：`scripts/ci-oneshot-gates.mjs`。
.oneshot-build: &oneshot_build
  - name: 单跑构建·安装依赖
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 单跑构建·同步数据库表结构
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/db-push.mjs
  - name: 单跑构建·生产构建
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-daily-build.mjs
    # ── 构建缓存槽（ISSUE #2158；机制与实测见 `scripts/ci-build-cache-slot.mjs` 头注）──
    #
    # 这一格跑的是**生产构建**（每日那格是这台节点上**唯一每天都会发生的构建**；单跑口是同一份
    # 脚本的副本，两格正文必须逐字相同）。runner 每个作业都新建一个带流水线 id 的工作区目录
    # （形态由 `工作区复用读数` 定死）⇒ Turbopack 的持久缓存每次都从零开始。
    # 实测（同机同源三跑，`next build` 自报的编译段）：**冷** 95s ／ **暖**（用上一个工作区
    # 留下的常驻目录）14.9s —— 省的是整个编译段。
    #
    # ⚠️ **开关默认关**（`COMFY_CI_BUILD_CACHE`），只有构建这两格置着它。理由与依赖面那套槽同源：
    # 先让判据在场，再把开关拨过去（规范 §13.5.25）。机制本身是**失败即退回**的：槽根算不出、
    # 空间不够、槽被别人占着 —— 任一成立就只打一行读数、照常构建（缓存是加速，不是前提）。
    env:
      COMFY_CI_BUILD_CACHE: "1"
      COMFY_CI_SUBJECT: "master"
    timeout: 30m
.oneshot-e2e: &oneshot_e2e
  - name: 单跑E2E·安装依赖
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 单跑E2E·同步数据库表结构
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/db-push.mjs
  - name: 单跑E2E·浏览器安装
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --playwright-only
    env:
      PLAYWRIGHT_DOWNLOAD_HOST: "https://cdn.npmmirror.com/binaries/playwright"
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
    timeout: 20m
  - name: 单跑E2E·全量E2E
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/e2e-run.mjs
    env:
      COMFY_E2E_SERVER: start
      COMFY_CI_SUBJECT: "master"
    timeout: 45m
.oneshot-unit: &oneshot_unit
  - name: 单跑单测·安装依赖
    # ⚠️ 这一格的真身是**上面 push 那一档的 `安装依赖`**，不是 `每日安装依赖`
    # （注册表 `scripts/ci-oneshot-gates.mjs` 里这一行登记了 `source`，#2853）。为什么允许换真身：
    # 「能不能接依赖缓存槽」判的是**这一档后面有没有会真构建的格子**（#2851 定的那条线，
    # 执行者是 `BUILD_CONSUMER_MARKERS`），不是档名 —— 这一档后面只有 `单跑单测·全量单测`
    # （`full-suite-run.mjs`，vitest 不是 Turbopack 消费者；同一类消费者在 PR 档的
    # `受影响用例` 上早已在接槽形态下每跑都绿 —— **不是 push 档**，那份清单里没有测试格）。
    # 反过来 `单跑构建` / `打包` 两档**不许**跟着改：它们后面有真构建格
    # （#2883 把那条按现役配置扫过一遍，`打包·安装依赖` 出现这枚键会当场红）。
    # 收益的读数不写在这里（跨天不可引用、且并发在场时墙钟不可读）：`pnpm ship --stage-log
    # <sn> 安装依赖` 现取，规范 §13.5.3.4.3 是那份出处。
    env:
      COMFY_CI_SLOT: "1"
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 单跑单测·全量单测
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/full-suite-run.mjs
    env:
      COMFY_CI_SUBJECT: "master"
    timeout: 45m

# ── 壳工具链那一对环境变量：`CARGO_HOME` + `RUSTUP_HOME`（ISSUE #2549）────────────
#
# 为什么要有它：runner 走**服务账号会话**（`orange-runner` 是 `LocalSystem`），它的 `Path`
# 与开发者会话不是同一份 —— `CARGO_HOME` 在这台机上是**用户级**变量，`G:\.cargo\bin` 也只在
# 用户级 `Path` 上。所以流水线里凡是要点 cargo 的格，都必须**自己把这两个值带进场**；
# 否则那一格看到的就是「一台没装 Rust 的机器」（与 Python / pnpm 那两次是同一条岔路）。
#
# 为什么收成一个锚点而不是写两遍（§12.12）：这一对是**这台节点**的事实、出现在三处
# （`重档静态判据` + 桌面成品包那两格），写成三份的那一刻就是它们开始漂的那一刻 ——
# 而漂的那一形正是 #2549 今天的读数：桌包那一档新加的两格没带这对值，第二格 2.2s 就红、
# 后面三格整片 `skipped`，当天没有成品包。
#
# 为什么必须**成对**给：cargo 本体是 rustup 的代理（`G:\.cargo\bin\cargo.exe`），代理要
# `RUSTUP_HOME` 才解析得到工具链 —— 只给 `CARGO_HOME` 时实测
# `could not create home directory …\.rustup: 拒绝访问`（ISSUE #2192 那条 PR 首跑现场）。
#
# ⚠️ 换节点要跟着换这两个值（与上面 TEMP / PLAYWRIGHT_BROWSERS_PATH 同一档）。
.cargo-env: &cargo_env
  CARGO_HOME: "G:\\.cargo"
  RUSTUP_HOME: "C:\\Users\\yuedu\\.rustup"

# ── 桌包那一档（ISSUE #2503）：装依赖 → 打真安装包 → 发布到常驻目录 ────────────────
#
# **为什么是独立一条**：业主口径「每日档另开一条独立流水线真打桌面成品包」，而它不进
# `.daily-gates` 那张表（那张表里只有每日自己的格，`COMFYAPP_CI_DAILY_GATES` 一个字没改）。
# 两件事各自要结论：每日那一条答「master 今天能不能构建出来」，这一条答「今天的安装包在哪儿」。
# 并成一条的代价不是「慢」，是**每一格每日档都要为一次 cargo 编译排队**，而且桌包红了
# 会把同一跑里排在它后面的每日格一起 skip 掉 —— 那正是 #2114 / #2274 那族「一格带走一片」的形态。
#
# **这一档不重抄任何判据**（§12.18 复用优先）：`pnpm tauri build` 的 `beforeBuildCommand`
# 就是 `node scripts/build-desktop.mjs`，而它内部那条 `pnpm build` 链带着产物级两道防线
# （`check-standalone-contents.cjs` 数两层产物 / `check-bundle-budget.cjs` 体积棘轮，
# AGENTS 硬规则 17/18）。所以**发布只能排在它绿之后** —— 这里没有第二条打桌包的路。
#
# ── 实测读数（同一次运行内分段计时，2026-10-27 本机；量具纪律见 §13.6.4.1）────────
#
# | 段 | 入口 | 读数 |
# | --- | --- | --- |
# | 产物装配 | `build-desktop.mjs` 的 `1/4`→`4/4` | **225.9s**（其中 `1/4` 那条 `pnpm build` 链 152.9s、`2/4` 组装 static 72.8s、`3/4` sidecar 100.4 MB 0.2s） |
# | Rust 编译 | cargo 自报 | 暖 **3m12s**（194.7s）／ 冷（`cargo clean` 之后整棵依赖树）**5m01s** |
# | 打包段（msi） | WiX candle + light | **151.4s** ⇒ 成品 `ComfyAPP_0.1.0_x64_en-US.msi` **84.86 MiB** |
# | 总墙钟 | `pnpm tauri build` | **579.2s**（退 0，那一跑只出 msi 一种目标） |
# | 发布段 | `publish-desktop-bundle.mjs` | **1.5s**（拷 84.9 MiB + 写 manifest + 指针 + 轮转） |
#
# ⚠️ **打包段（nsis）今天没有读数 = 没有结论，不是「不需要」**：那一格要现下两件 GitHub
# release 资产（`nsis-3.13.zip` ≈1.3 MiB、`nsis_tauri_utils.dll` ≈0.05 MiB），本机实测两次
# 都落在 `failed to bundle project: timeout: global`（一次 zip 下完、dll 超时；一次连 zip
# 都在 21.8s 超时；随后 18:27 那一跑 `github.com:443` 直接连不上）。**更坏的一件事**：
# tauri 判定缓存目录不完整时会先把 `%LOCALAPPDATA%\tauri\NSIS` **整个删掉**再下 —— 于是
# 一次网络抖动会把这台机的工具缓存也一并清走（`WixTools314` 那一侧不受影响，它在
# msi 那一格是热的）。这两条都记在本单的落地说明里，不写成「以后一定绿」。
#
# · **不接构建缓存槽**（`COMFY_CI_BUILD_CACHE` 这一档不置）：那个开关在 `artifact-run.mjs`
#   这一侧生效，而这条链的构建是 tauri 的 `beforeBuildCommand` 直接跑 `pnpm build` ——
#   在这里写它等于在日志里谎称「接了常驻缓存」。要接是另一件事（`src-tauri/target` 也
#   同样不在任何槽里，冷编译那 5m01s 就是这么来的）。
# · **成品不落工作区**：工作区每跑新建、收尾整目录删（`ci-build-cache-slot.mjs` 头注实测），
#   所以「留 2 份」这件事只能由发布那一格往常驻根做，根目录名由 `pnpm store path` 所在卷推导。
# · **timeout 取的是平台档，不是预估**：下面每一格的数都在上面那张表里有对应的实测段，
#   取的是「实测段之和」量级之上的整数档；没有读数的那一格（nsis 打包）不单独设预算，
#   它跟着 `打包·桌面成品构建` 那一格的总墙钟走。
#   ⚠️ 与每日档同一条口径：**并发在场时墙钟不可读**（§13.6.4.1）—— 这一档会把这台 16 核机
#   压到满载（cargo + light 各占一片），别拿它的耗时去校准别的档。
.package-gates: &package_gates
  - name: 打包·安装依赖
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs
  - name: 打包·壳工具链自证
    # 只答「cargo / rustc 在不在」。这一格在三秒内给答案，而缺件时的报错会长在两分钟之后
    # 的 cargo 段里（`cargo: The term 'cargo' is not recognized` 混在 tauri 的输出里，
    # 那一刻安装依赖的账已经花完）。壳工具链**不是** pnpm 依赖，这一跑不顺手装任何东西。
    #
    # ⚠️ 这一格要的那一对变量（`env: *cargo_env`）只有一半用场：探针是按名字起 `cargo` 的，
    # 所以还得把 `$env:CARGO_HOME\bin` 前置到 `Path` —— 只给变量而 PATH 上没有它，
    # 得到的仍是 `#2549` 那一格 2.2 秒的红（这正是今天那一跑的读数）。
    env: *cargo_env
    timeout: 5m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $env:Path = "$env:CARGO_HOME\bin;$env:Path"
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --rust-only
  - name: 打包·桌包工具预置
    # nsis 那一格要的两件 GitHub release 资产，**不在这条链上现下**（bundler 的下载预算实测
    # 在 22–23s，而本机直连取那份 zip 要 48.4s ⇒ 红的是网络、看起来像链坏了；镜像键实测
    # 29.5s，仍在那条预算之上，所以配镜像不是结案）。这一格从常驻根的工具镜像补缓存，
    # 补不上就退 **2「没有结论」**并念出出口 —— 放行给 bundler 去撞预算，得到的是一跑看不懂的白跑。
    # 读数：空缓存 + 这一格补齐 ⇒ `tauri bundle` 只出 nsis 那一个目标用时 131.8s、成品 62.32 MiB、
    # 日志里没有 `Downloading` / `Recreating it`（2026-10-27 本机实测，见规范 §7.7）。
    timeout: 5m
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/tauri-tools-cache.mjs
  - name: 打包·桌面成品构建
    # 整条链：`beforeBuildCommand`（`build-desktop.mjs` → `pnpm build` → 数产物 → 体积护栏）
    # → cargo release 编译 → bundle（nsis + msi）。判据一个字都不在这里重写，也不带 `--no-bundle`
    # —— 那一带就等于回到「只有 app.exe，没有安装包」的原点（§7.0 那张表今天的形态）。
    #
    # ⚠️ 同样要那一对变量 **并且**把 `$env:CARGO_HOME\bin` 前置到 `Path`：这一格是
    # `pnpm tauri build`，它按名字 spawn `cargo` —— 变量只是「工具链住哪」，
    # PATH 上没有那个代理，就还是 `#2549` 那一形。
    env: *cargo_env
    timeout: 30m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $env:Path = "$env:CARGO_HOME\bin;$env:Path"
      node scripts/ci-cp936-exit.mjs -- pnpm tauri build
  - name: 打包·发布到常驻目录
    # 落 `<常驻根>/<sha-构建号>` 一个目录 + `manifest.json` + `latest.txt` 指针，轮转留 2 份。
    # 退出码三态：0 发布完成 / 1 没有成品（构建那一格没打出来）/ 2 **没有结论**（问不出常驻根、
    # 或目标卷空间不够）。后两档都不许退 0 —— 「今天没有新包」与「没能把包放出去」必须逐字不同。
    timeout: 5m
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/publish-desktop-bundle.mjs

# ── 这里曾有一条「格式修复的委托回写」流水线（ISSUE #2362 / #2365 / #2342）──────────
#
# 形状是：`oxfmt 格式` 那一格判红 ⇒ `ci-format-fixup.mjs --check --autofix` 就地写文件、
# 复判全绿 ⇒ 再 `cnb build start-build --event api_trigger_formatfix` 把回写委托给一条
# **可信事件**的流水线（`--delegate`，它自己直推 PR 源分支，`--sha` 与 ls-remote 实时头
# 做幂等闸）。它当时解决的是「PR 事件的令牌推不动」（#2362 的现场：护栏一条没错，
# 建好修复提交后 push 被拒）。
#
# 今天它被**整条摘掉**（ISSUE #2610，业主口径 2026-10-29：本地判 + 本地修，CI 只判），
# 因为委托那一跳在这类事件上恒发不出去 —— 2026-10-28 实测 build `cnb-tb0-1k61hpvhf`
# 的 `oxfmt 格式` 那格念的是：
#
#   [format-fixup] × start-build 退了 0 但读不回 sn —— 委托没发出去（403 / scope 不足那一族）
#   status: 403 · errcode: 10023
#   errmsg: "The token's authorization scope does not match this request.
#            Missing required scopes: repo-cnb-trigger:rw"
#
# ⇒ 需要的是 `repo-cnb-trigger:rw`，而 PR 事件那把令牌只有 `repo-code:r`，**没有开关可改**。
# 于是这条链的设计前提（「换执行口就能推」）在唯一需要它的事件类型上不成立，
# 每次格式红都要白跑一次委托、再把同一个红交回给人。
# 判与修都挪到 `.githooks/pre-commit` 的 D0（同一份 `check-format.cjs --staged`）。
#
# 如果哪天要把它接回来（比如给 CI 配了带触发权限的单独令牌 —— 那是 ISSUE #2551 那件事），
# 恢复的不该只是这两段 YAML：**委托发的出去之前，PR 那一格不许再挂 `--autofix`** ——
# 「就地修好但回不去」正是让陈旧在 CI 上隐形的那一格（ISSUE #2231 同型，别再来一次）。

# ── PR 失败立案：这一跑红了 ⇒ 把红变成**看得见**的东西（ISSUE #2332）─────────────
#
# 这一档是 **Pipeline 级**的 `endStages`（不是 `stages` 里的一格），所以它是独立锚点、
# 由 `pull_request` 那条流水线以 `<<: *pr_fail_stage` 引入。
#
# 补的是什么：`pull_request` 是一天里跑得最多的那条，而它的红**没有任何通知**。
# 平台没有「构建结束 → 主动打你」的通用回调（`cnb event get-events` 只能主动拉、
# 也不含 build 事件），所以今天知道它红的只有两种人：当场盯着 `pnpm ship` 的
# （它轮询到终态才收工）、以及事后去翻构建列表的。其余时候「红了」=「没发生」。
#
# 为什么不是「挂个 IM 推送插件」：这条件路径上**没有 Docker**（头注第 1 条：带
# `image:` 的 stage 70ms 就红 `Runner does not enable Docker`），插件镜像还默认要出网。
# 所以那一档在本仓今天没有执行者，写进来只是一条会红或永远不响的格。这条走的是
# 同一件事的另一个落点：**PR 的评论区就是通知面** —— 它进列表、有未读、能 @ 人，
# 不需要任何新凭据，也不需要人先去看某个群。
#
# ── 形态：它是 `endStages`，不是 `stages` 的最后一格 ────────────────────
#
# 平台原生就有这一档（官方 `zh/build/grammar.md` §endStages 原文）：
#
#   「当流水线 prepare 阶段成功，**无论 stages 是否成功，endStages 都将执行**。
#     且 endStages 是否成功**不影响流水线状态**（即 endStages 失败，流水线状态也可能是成功）。」
#
# 这两句正好对上这一格的两条要求，而且**不用**任何没被验证过的条件语法：
#   · 「无论 stages 是否成功都执行」—— 本仓 `stages` 是串行链，前面哪里一红后面整片
#     `skipped`（实测 `cnb-dbu-1k5ohq6p4`：`受影响用例` 红 ⇒ 它后面 23 格全是 skipped），
#     所以「红了要有人知道」这件事**不能长在 `stages` 里**；
#   · 「不影响流水线状态」—— 这一格自己坏掉不该把一跑绿变红（那会让「它挂了」与
#     「这一跑红了」在读数上长得一样）。
#
# ⚠️ 走过的那条弯路留着当读数：先写成 `stages` 最后一格 + `run: always()`，实测
# （`cnb-dbu-1k5ohq6p4` / `cnb-2mc-1k5oi9uvh`）那一格仍是 `skipped` —— 本仓 `.cnb.yml`
# 里**没有任何一处 `when:` / `fail()` / 条件表达式**可供依赖，而 `if:` 这个键不在
# Stage 的配置项表里（`grammar.md`）。所以「红也要跑」只有平台自己那一档是真有执行者的。
#
# ⚠️ 也**没有** `run:` 这个键：`.cnb.yml` 的 Stage / Pipeline 配置项表里都没有它，
# 写成 `run: always()` 会被当成未知字段静默忽略（那一格就退回「上一格红了就 skipped」，
# 而屏幕上什么都不会说）。「红也要跑」在本仓只有这一档 `endStages` 是真有执行者的形态。
#
# ⚠️ 但**不是 `failStages`**：那一档只在「正常流程失败」时执行，于是「这一跑绿了」
# 与「这一格自己挂了」两种形态会一起消失，而后者正是最该被看见的（它等于这一格
# 从此不再报红，而账面全绿）。`endStages` 两种都跑，代价是绿的时候也会跑一次只读：
# 三次读命令 + 判定「绿的 ⇒ 无事可立」，与 `每日失败立案` 同量级。
#
# 其余两条形态决定：
#   · **不带 `ifModify`**：它判的是这一跑的状态，不是某几棵树的文本。任何收窄都可能
#     把「真正红了的那一类改动」筛掉，而那正是它唯一的用途。
#   · **带 `--no-block`**：理由与 `每日失败立案` 逐字相同（自己坏掉不拦路，但失败时
#     照打红话与手工出口，由 `tests/ci-pr-failure-issue.test.ts` 钉住不许静默）。
#
# 判决链一个字都不在这里重写：定性是 `ci-build-readout.mjs` 的 `classifyBuildOutcome()`
# （与 `pnpm ship --diagnose` / 每日档同一份），取数是它的 `fetchBuildList()` +
# `check-daily-attendance.mjs` 的 `fetchBuildDetails()`，写单是 `ship-issue-new.mjs`。
# 落点按「有没有人能收」分两档：`CNB_PULL_REQUEST_IID` 在场上 ⇒ 评论在那张 PR 下
# （一条诉求一张单，不另开单）；认不出来 ⇒ 按格名去重建单。取舍与两种形状都在
# `scripts/ci-pr-failure-issue.mjs` 头注里，这里不重抄。
.pr-fail-stage: &pr_fail_stage
  endStages:
    - name: PR 失败立案
      script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-pr-failure-issue.mjs --no-block
      # 5m：三次读命令（列表 / 逐格详情 / 逐格日志，后者最多三格）+ 一次写 + 一次回读。
      # 与 `每日失败立案` 同量级（实测那条 1.6s）。给 5m 是留给节点冷启动与平台慢响应，
      # 不是给「让它多试几次」—— 取不到读数时它**不重试也不写**，退 2 由话术说出来。
      timeout: 5m
    # ── 令牌权限读数（ISSUE #2551）：这一跑的 `CNB_TOKEN` 够得着哪些能力 ────────────
    #
    # 与每日档那一格**同一个入口与同一份理由**（那边写着为什么、为什么排在这里）。
    # `endStages` 里的顺序不是执行顺序的保证（平台并发/顺序由平台定），所以这里不靠
    # 「读数在前」传达什么 —— 它只是与每日档同形，读的人不必在两处用两套心智模型。
    #
    # 5m：14 条只读请求**并发**跑（实测本机合计 0.45s）、零写命令。与每日那一格同量级。
    - name: 令牌权限读数
      script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-token-scopes.mjs
      timeout: 5m
    # ── `GitHub 镜像同步` 不在这一档了（ISSUE #3051）───────────────────────────────
    #
    # 它前移进主列（`.gates` 里 `缓存槽读数` 之后），为什么搬与「搬的是位置、不是那句不承重」
    # 都写在那一格的锚点上。这里留一行是因为这一档剩下的两格**必须留在 `endStages`**：
    # 它们的本职是「红也要跑」（平台 grammar：无论 stages 是否成功，endStages 都将执行），
    # 挪进主列就会被那一次红一起 skip 掉 —— 而立案格要的正是红的时候才有用。

# ── 桌面成品包那一档的失败立案（ISSUE #2550）──────────────────────────────────────
#
# 这一档为什么也要有：桌包那两个触发口（下面 `crontab: 0 3 * * *` 与 `web_trigger_package`）
# 此前**只**引了 `*common` —— 没有 `endStages` 立案格。于是 02:00 那一跑红了之后，
# 知道这件事的唯一办法是去翻构建列表：2026-10-28 那一跑（`cnb-5j8-1k5v8acjd`）红在
# `打包·壳工具链自证`、后面三格整片 `skipped`，当天没有成品包，而账上一张单都没有。
#
# 形态与 PR 那一格逐字同族（`endStages` 而不是 `stages` 的最后一格；理由见上面那个锚点），
# 入口也是**同一个脚本**加一个 `--lane package`：
#   · 那份读写链（定性 / 取逐格 / 摘录失败行 / 建单 → 补标签 → 独立回读）只写了一次，
#     这里不抄第二份（§12.12）；
#   · `--lane` 是「我就是这一档的立案口」的**显式声明** —— 不给它，脚本按老规矩把非
#     `pull_request` 事件判成「不归本格管」（那一刀是对 push / 定时那些「没有 PR 可挂」
#     的跑的保护，今天仍然要留着）；
#   · 这一档**写不写得动**是另一件事、答案是「写得动」：桌包那一跑挂在 `crontab` /
#     手点这两个事件上（不在「不可信事件」那一族），而 #2472 / #2462 那两张单就是
#     `crontab: 0 1 * * *` 那一跑自己建出来的。PR 那一族今天只有 `repo-code:r`
#     （#2339），那是平台按事件可信度分配的口径、本仓改不动 ——
#     与本锚点是两种不同的形状，别拿同一句话概括。
#
# 去重键跟着 `--lane` 走 ⇒ 标题是 `ci(package): 桌包档红在「…」`，与 PR 那一族互不相混。
.package-fail-stage: &package_fail_stage
  endStages:
    - name: 桌包失败立案
      script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-pr-failure-issue.mjs --no-block --lane package
      # 与 `PR 失败立案` 同一量级（三次读命令 + 一次写 + 一次回读）。
      timeout: 5m
    # 令牌权限读数：与 PR 那一格同一个入口、同一份理由（ISSUE #2551）。
    - name: 令牌权限读数
      script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-token-scopes.mjs
      timeout: 5m

.gates: &gates
  # ── 2026-10-19：环境类前提三格从这一条上撤到**每日档**（`COMFYAPP_CI_DAILY_GATES`）──
  # 撤的是节奏、不是账：`工具链自证` / `Python 可用性` / `Python 探针读数` 现在各有
  # 一名每日档里的同名执行者（`每日工具链自证` / `每日 Python 可用性` /
  # `每日 Python 探针读数`），判据双向核对（少了执行者就红，见
  # `tests/no-platform-ci-config.test.ts` 那条「撤下来的每一格必须有每日的对应」）。
  # 为什么它们不属于「每个 PR 都判」：三份脚本问的都是**节点事实**（PATH、winget/scoop
  # 装没装、解释器住哪），一次 PR 改不动它们；留在这一条上的是
  # `Install dependencies` 里的 `check-pnpm-available.mjs` —— 「这台机跑不动整条链吗」
  # 才是每个 PR 都需要有人回答的那一问。逐格代价与这次决定的原文见
  # `COMFYAPP_CI_GATES` 上面那段与 §13.5.23。

  # ── 镜像身份（**读数，恒不退非零**；ISSUE #1993）──
  #
  # 这一步回答的是上一版答不出的那一格：**这台机器长自哪张镜像、哪一版**。
  #
  # 自托管这条路上「镜像」没有被声明的地方（`pipeline.docker.image` 不生效，
  # 见头注第 1 条），所以镜像的用法是**宿主侧**的：装机时 `docker pull` 一张钉了
  # 版本标签的节点镜像、按它装好，再把身份钉进两个机器级环境变量。缺了这一步，
  # 「这台节点跑的是哪一版工具链」只能靠翻上一次的红色日志反推 —— 而工具链清单
  # 反复红，根因正是**环境是隐形的**（§13.5.3.5）。
  #
  # ⚠️ 它是**读数**、不是判据，三条理由：
  #   · 本仓的工具链靠**断言**守（`工具链自证` 判四件、`环境前提` 判版本下限）——
  #     那些是实际能力，镜像是期望身份，两者不一致时以能力为准；
  #   · **没有标识不等于这台机器不对**：裸装机是本路径的历史形态，第一次接进节点
  #     的一跑不该被一条与新事实无关的红拦住；
  #   · 「标签 / digest 对不对得上镜像库」本进程判不了 —— 构建容器里没有 docker。
  #
  # 所以它只做三件事：把磁盘上真有什么（OS / 内核）与声明的身份一起打出来、
  # 把「标签没钉版本 / digest 拼错」写成读数、以及**没有标识时给出下一动作**。
  # 逻辑在 `scripts/ci-image-identity.mjs` —— 不在配置里就地写 PowerShell，
  # 理由与 `工具链自证` 逐字相同（配置里的逻辑一条判据都测不到它）。
  - name: 镜像身份
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-image-identity.mjs

  # ── `Python 可用性` / `Python 探针读数` 已经不在这一条上（2026-10-19）──
  #
  # 两格的**理由与事故**跟着它们搬到了每日档（`每日 Python 可用性` /
  # `每日 Python 探针读数`，见 `.daily-gates` 里那两段），这里只留一句「为什么撤」：
  # 这两份脚本问的是**这台节点上解释器住哪、哪条链起得来** —— 一次 PR 改不动 PATH、
  # 改不动 winget 装没装，而它们每次跑都要在 PR 上占一格排队位。撤下之后仍然有人判
  # 同一件事：`每日单元测试` 之前必有 `每日 Python 可用性`（顺序有判据），
  # 而 PR 侧「跑不动整条链」那一问由下面 `Install dependencies` 里的
  # `check-pnpm-available.mjs` 接着（它判的是 host 解析面，与上面那条不是一条链，
  # 也不该被压成一条）。

  # ── 工作区复用读数（**读数，恒不退非零**）──
  #
  # 本文件头注第 4 条把「每次构建都是全量 clone、没有配置能省掉它」写成了这条路径的
  # 固定成本。那个结论有**数字**（`Prepare` ≈31.5s，规范 §13.5.20 那张预算表），但从来
  # 没有**机制读数** —— 平台在这台宿主机上到底是哪一种：
  #
  #   ① 每次新建一个 job 目录、`git init` + 从零 fetch（那 31.5s 是「从零搬对象库」）；
  #   ② 复用同一目录、只做增量 fetch（那 31.5s 的大头是 checkout 落盘，不是网络）；
  #   ③ 目录复用但 `.git` 每次被重建（常驻已经有一半，缺的是别把对象库清掉）。
  #
  # **第一跑读数（`cnb-f3v-1k57a1o1l`，这一档自己的那一跑）已经把它定成 ①**，而且是靠
  # 路径自己说的、不靠对照：工作区目录名带着本次流水线的 id ——
  # `…\runner\<repoId>\cnb-f3v-1k57a1o1l-001~c5g\workspace` ⇒ 每次构建一个新目录；`.git`
  # 与 `.git/FETCH_HEAD` 出现在 59s / 58s 前（与那一跑 `Prepare` 的 35.5s 同量级）、HEAD
  # detached、`refs/heads` 零条、浅克隆 false、对象库 **57168 KiB ≈ 56 MiB**（**不是**开发
  # 机上那 130 MiB —— 那一份含 99 个 pack、22178 个松散对象与所有本地分支，CI 取的是协商
  # 后的单 ref；本仓此前把两个数混成一处写过，这里按读数订正）。同一跑里 `node_modules` /
  # `.next` / `coverage` / `playwright-report` **四个都不在场** ⇒ 第二格也定了：安装与生产
  # 构建都从冷态起，那两笔（59s / 131s）比克隆本身大。
  #
  # 三种形态各有各的出路，而**没有任何一处日志能把它们分开** —— 于是「要不要动平台那个
  # 检出开关」（Pipeline 级 `git.enable: false`，官方语义「指定是否拉取代码」）这一问
  # 只能靠猜。这一档就是把那一格变成可见读数；它同时读**第二格**：`node_modules` /
  # `.next` 在构建开始时是不是冷的 —— 若冷，这条路径上交的就不止克隆那 31.5s，还有
  # 「安装从零起」与「冷缓存 next build」两笔，而那两笔比克隆大一个量级。
  #
  # 逻辑在 `scripts/ci-workspace-probe.mjs` —— 不在这里就地写 PowerShell，理由与
  # `工具链自证` 逐字相同：配置里的逻辑一条判据都测不到它。
  #
  # ⚠️ 账本跨构建对照要**两跑**才成立，所以**它自己那一跑**报「未定」—— 这不是缺陷，是
  # 这一档刻意不肯拿一次观测猜结论。而「是哪一种形态」这件事第一跑就答得出来：路径形状 +
  # `.git` 的出生时间已经足够（见上面的读数），账本要补的是「会不会有一天变成另一种」。
  # 账本写在**工作区之外**（`COMFYAPP_CI_PROBE_DIR`，缺省退宿主 `LOCALAPPDATA`；实测落点
  # 在 `C:\WINDOWS\system32\config\systemprofile\AppData\Local\` —— 这一跑的执行账号是
  # SYSTEM，与 §13.5.3.5 那条「Python 装在 yuedu 会话里、SYSTEM 够不着」同源）：写进检出
  # 目录就成了未跟踪文件、被结构门禁那一套判，而这一档要的恰恰是「跨检出存活」。
  # 判红的事一件都不做 —— 它判的是这台机器怎么被调度，那不是任何一次 PR 的缺陷。
  #
  # 第二跑（`cnb-f5b-1k57bgqol`）自证了这条链：账本里已有上一跑那条，新跑的 job 目录换成
  # `cnb-f5b-1k57bgqol-001~ttf\workspace` ⇒ 它自己印出「结论·①每次新目录」。它同时暴露了
  # 对照行的一处「读了等于没读」：平台把每个 job 都检出成 `…\<流水线 id>~<随机段>\workspace`，
  # 最后一段**恒等于 `workspace`**，只取 basename 时两跑并排一模一样 —— 有区分度的那一半在
  # 父目录，故现在由 `jobLabel()` 取「父目录名 + 最后一段」，判据钉住「两个不同 job 的标签必须
  # 不同」。与这一档开头那句是同一类病：**读数落在日志里读不出来，与没有读数等价**。
  - name: 工作区复用读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-workspace-probe.mjs
    # 秒级（几次 git 调用 + 几个 stat）。给 5m 与 `新鲜度账` 同款：只是「卡死要早报」的
    # 量级余量，判据本身远小于它。
    timeout: 5m

  # ── 缓存槽读数（ISSUE #2022 第二步；恒不退非零）──
  # 只回答三问：有没有槽、该落哪个键、这一跑与它的关系是 `reuse` / `install-into-slot` /
  # `no-cache` 中哪一档。键刻意复用 `ci-deps-face.mjs` 的 `pnpmInstallFingerprint` ——
  # 两处各算一份 sha 的漂移形态是「缓存命中判断」与「碰了依赖面就得真装」不再一致，
  # 那时的表现是依赖不对但门禁全绿。
  #
  # ⚠️ 这一格**只读数、不碰盘**：动作在执行档 `scripts/ci-slot-apply.mjs`，而它由
  # `COMFY_CI_SLOT=1` 才拨 —— 开关的落点在下面那格 `Install dependencies`（本格不置它，
  # 两格各判一件事：这里回答「会不会命中」，那里执行「命中就接」）。机制与开关分两批推，
  # 理由同 §13.5.25 那条纪律：那一格每次构建都要过，键算错一次的代价是所有 PR 装不上。
  #
  # **这里一个路径都不写**：槽根由 `resolveCacheRoot` 在作业时问
  # `pnpm store path`（同一条 cwd、同一条解析面，所以就是那次 install 真正会用的 store），
  # 取它所在卷下的 `ci-cache/<包名>`。写死盘符曾经把这台机器坑在什么位置上，见
  # §13.5.3.4.3 里「runner 换盘」那一段。
  - name: 缓存槽读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-cache-slot.mjs
    # 与上面那格同量级（几次 stat）。秒级的事给 5m 只为「卡死要早报」。
    timeout: 5m

  # ── GitHub 镜像同步（**读数，恒不退非零**；ISSUE #2978 / #3051）──
  #
  # 双远端镜像（cnb 主）的推送跳：推 HEAD 到 `wuxianyuedu/comfy-app` 的 `cnb-pr-<IID>` 专属
  # ref + `repository_dispatch` 派发，GitHub 侧 workflow 按**同一笔 sha** 起跑 —— 两边判同一份
  # 树，读数才对得上账。
  #
  # ⚠️ 它从 `endStages` 前移到这里（#3051），改的是**起跑时机**：平台对 endStages 的语义是
  # 「stages 跑完才执行」，而这条流水线实测整跑 **2546s**（全绿跑 `cnb-aju-1k6bpjnrk` 的逐格
  # 读数：`固定结构用例` 873.2s / `Install dependencies` 446.4s / `受影响用例` 350.2s /
  # `重档静态判据` 345.3s），于是 GitHub 那一跑最早只能在一个多小时之后开始 —— 等
  # 「按同一笔 sha 读回 GitHub 判决」那一格上线，两条远端就成了串行。前移到
  # `Install dependencies` **之前**，它吃的是 `Prepare` 之后那份已就位的树。
  #
  # ⚠️ 前移**不许顺带改掉承重性**：主列的退码是承重的 —— 某一格 `error` 会把排在它后面的格
  # 整片 `skipped`（本仓把同一条约束写成判据：「每日链里必须有一格排在所有可能红的格之前」，
  # `tests/no-platform-ci-config.test.ts`）。而 GitHub 这一跳今天还不通（实测
  # `Failed to connect to github.com port 443 after 21114 ms`，另有 #3014 的令牌被拒、
  # #3003 的 LFS 缺件、#3027 的自家钩子拦下四形），所以这一格带 `--readout`：内部三态照旧
  # 打点、对外恒不退非零，与上面 `镜像身份` / `工作区复用读数` / `缓存槽读数` 同一族。
  # 原来那句「它坏了既不许把门禁的红洗成绿，也不许把自己的红叠进门禁的账」**搬的正是这个语义**
  # —— 搬的是位置，不是那句话。
  #
  # 什么时候翻成 fail-closed：等回读那一格上线之后（那时「推不出去」=「这一跑没判过」），
  # 条件写在 #3051 期望第 3 条；不在本批。
  #
  # 令牌那一系一字未动：`GITHUB_MIRROR_TOKEN`（平台侧注入，仓库外配置）缺席 ⇒ 内部照旧判
  # 「没跑起来」并留下读数，只是读数档不把它折成流水线的红；令牌值一个字节都不回显
  # （脚本内先脱敏，硬规则 17）。
  - name: GitHub 镜像同步
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-github-mirror-push.mjs --readout
    # 两跳 git 调用各自带超时并对 egress 类失败带退避重试（`scripts/ci-github-mirror-push.mjs`
    # 的 REMOTE_PROBE_TIMEOUT_MS 30s×3 / PUSH_TIMEOUT_MS 240s×2 —— 没有限时就得吃 git 自己
    # 那个 21s 的 connect 超时，而那一形过去只被念成「令牌活不活」；重试的立案依据见
    # 脚本文件头第 8 条）。10m 是外框，包住最坏墙钟（≈105s + ≈485s）与冷启动余量。
    timeout: 10m

  # ── 环境前提（**必须排在 `Install dependencies` 之前**，ISSUE #1959）──
  #
  # 上面三步答的是「四件工具在不在」「解释器住哪」，这一步答的是它们旁边那**三格**：
  #
  #   ① **在，但版本不够** —— 解释器低于本仓写明的下限 Python 3.10；
  #   ② **配置配错了** —— `.cnb.yml` 里有 host 侧 PowerShell（5.1）认不了的语法面；
  #   ③ **浏览器那一格的前提** —— 落点上有没有那一件；没有的话，**下载根通不通**。
  #
  # 三格的共同形态正是 ISSUE #1959 里那句「别等到执行几十分钟后才发现环境不行」：
  # 第 ① 格**不会让哪一步变红**（门禁的 Python 侧以「探测不到」的名义退出比对、
  # 几条真跑的用例走 `env` 档跳过并登记 —— 与「装好了」在日志里逐字同形），
  # 第 ② 格红在**几十步之后**（`Install dependencies` 那段 PowerShell 自己），
  # 第 ③ 格红在**整条流水线的倒数第二步**（`浏览器安装`）；
  # 而第 ②③ 格在跑到那一步之前会先把预算是花掉 —— 实测第 ③ 格就是「前面三十步
  # 全绿、二十几分钟之后卡在下载上」（`cnb-gt1-1k513ill4` / `cnb-g9d-1k515kvrq`）。
  #
  # 判据不重写：解释器怎么找走 `ci-toolchain-python.mjs` 的 `findPython()`（与
  # `Python 可用性` 同一份候选表、同一个探针），`.cnb.yml` 的语法面复用
  # `tests/no-platform-ci-config.test.ts` 导出那一份（本地钩子与平台侧同一条判据），
  # 浏览器那一格复用 `ci-toolchain-browser.mjs` 的 `browserExecutableExists()` /
  # `playwrightReachabilityVerdicts()`（与 `浏览器安装` 同源 —— 打印与判据共用
  # 同一次结论，不造第二轮子）。
  # 逻辑在 `scripts/ci-env-probe.mjs` —— **不在这里就地写 PowerShell**，理由与
  # `工具链自证` 逐字相同：配置里的逻辑一条判据都测不到它。
  # 代价几秒（浏览器那格最坏是 4 个候选 × 8s 的 HEAD 串行），跑在**任何依赖安装
  # 之前**（它只 import `node:*`，那时 `node_modules` 还没有）。
  #
  # ⚠️ 第 ③ 格**只在前置判定**（它是判据、要快），与 `浏览器安装` 失败分支那份
  # 「四个域全量一遍供人定位」的取证刻意不同 —— 后者是失败之后给人看的现场。
  # 也**不**在这里替 `浏览器安装` 去装：探测到「都不通」时的出路在人不在仓
  # （换根 / 配代理 / 预装进落点），这一步的作用是把结论提前，不是代办。
  - name: 环境前提
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-env-probe.mjs

  # ── 安装 ──
  # 门禁用 pnpm（AGENTS 硬规则 1：npm 11 在本项目解析 typescript 别名链会崩）。
  # --frozen-lockfile 保证装的就是锁文件里的版本。
  # 刻意**不**开 corepack enable：自托管宿主机上 pnpm 是预装的，corepack 在
  # 非交互环境里为解析 packageManager 去拉版本会挂住；裸 `pnpm -v` 的上一步
  # 已经证明它可用。
  #
  # ⚠️ **依赖面没动就跳过「装」那一跳**（ISSUE #1981 收尾）：
  # `ifModify` 只能整步跳过，而本步前一半（`check-pnpm-available.mjs`）是**前提**
  # 步骤（跳过它 = 后面几十步都建立在一个没验过的解析面上）。所以收窄放在**步内**：
  # 锁文件与依赖面（`pnpm-workspace.yaml` / `next.config.js` / 补丁目录）一个都没碰时，
  # `node_modules` 本来就在、`--frozen-lockfile` 是一次空操作 —— 这一跳省掉的是
  # pnpm 自己那几秒（实测 59~61s 的绝大部分是后面的 `postinstall` 里那几条
  # node 脚本与缓存刷新，见 §13.5.20）。`pnpm` 自证照旧每次都跑。
  - name: Install dependencies
    env:
      # 开关（ISSUE #2022 第二步，机制见 §13.5.3.4.3）：**这一跑开始走槽**。
      # 走与不走都由 `ci-install-deps.mjs` 自己打印（`✓ 走缓存槽（reuse）` /
      # `走缓存槽（install-into-slot）` / `槽未接管（原因）⇒ 照常装`），所以三档收益的
      # 读数是从它自己的那句话里取的，不是从「这格变快了」倒推的。
      # 该比的两侧在同一格内就有：未命中那一跑量的就是冷装本身，命中那一跳根本没发生
      # （同日三档实测外加一条普通装对照都在规范 §13.5.3.4.3 末那张表里，跨天不可引用）。
      # ⚠️ **哪几档置它，判的是「这一档后面有没有 `next build`」，不是档名**：PR 这一格与
      # push 那一格 `安装依赖` 置着；每日那一格按策略不接（ISSUE #2081：它后面背着
      # `每日生产构建`，接槽形态下 Turbopack 拒指向项目根之外的 node_modules 链；#2521 已把
      # 官方 `experimental.turbopackAdditionalRoots` 那扇门装上，但**每日那一档还没在它上面
      # 跑过一次构建**，所以这条限制暂时原样留着 —— 撤它要先验，不是照 #2521 的在场就当我们验过了）。
      # 每日那一侧的「一个字都不许出现」由 `tests/no-platform-ci-config.test.ts` 的
      # `DAILY_ENV_ONLY_ON_PR` 登记；回退 = 摘掉这里这一行**并同批**把该键从那份名单里删掉，
      # 只动一边会被那条判据当场点名（名单过期）。
      COMFY_CI_SLOT: "1"
    # ── 这一格自己带墙钟（ISSUE #2360）──────────────────────────────────────────
    #
    # 现场：`cnb-c6r-1k5osfdl8` 上这一格挂到**平台 8640s 硬上限**才被掐断 —— 整格日志
    # 19 行、**pnpm 自己的输出一行都没有**（前一步 `check-pnpm-available` 刚在同一秒
    # 打印过 pnpm 12.4.1），而同机同链的上一跑是 `Done in 2m 42.7s`（`cnb-1mr-1k5p4ihfr`）。
    # 挂住的形态里 pnpm 的 stdout 是空的（它的进度条只在 TTY 上输出），所以「卡住」与
    # 「还在跑」在日志上逐字同形 —— 等到平台掐断那一刻，仍然只留下一句
    # `timeout of 8640000ms exceeded`，既不说是谁挂的，也不给下一动作。
    #
    # 两件事同批做掉，**判据一字未改**：
    #   · 装那一跳自带预算（`scripts/ci-install-deadline.mjs`，默认 12 分钟 ≈ 平台上限的
    #     1/12、节点读数 169s~275s 的 2.6~4.3 倍），用尽就收回子进程、退 **2（未判定）**，
    #     并把「卡在第几秒、下一动作是什么」打在脸上；
    #   · 每 30s 一行心跳，于是同一个死法下一次**读得出它在第几秒停住的**。
    #
    # 这一行的 20m 也是为此：要让**自己的**预算（12m）先到，而不是让平台先掐断。
    # 它不是「抬 timeout 换绿」（§11.13 明令禁止那件事）—— 判据没松，改的是拿不到结论
    # 时的收场方式；20m 仍然远小于平台的 8640s，卡死形态二十分钟内报出来。
    # ⚠️ **这一行必须与 `每日安装依赖` / push 那一格 `安装依赖` 逐字相同**：判据
    # `tests/no-platform-ci-config.test.ts` 的 `CROSS_LANE_SCRIPT_MIRRORS` 三样都比 ——
    # 命令行、env 赋值、`timeout`（三份副本各漂一份就是这条链最难查的形态）。
    # 那几格 `单跑*·安装依赖` / `打包·安装依赖` 不在这一对面里，它们由
    # `scripts/ci-oneshot-gates.mjs` 逐格登记自己的真身：默认是 `每日安装依赖`（不接槽那一族），
    # 而 `单跑单测·安装依赖` 登记的是**本格**（接槽那一族 —— 判的是「后面有没有真构建格」，
    # 不是档名；#2853 换真身的那一步，注册表头注写着整段因果）。
    timeout: 20m
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      # 动依赖面前先自证一件事：**这个宿主真的起得来 pnpm** —— 而它正好是这一步
      # 的全部动作。放在这里而不是更早的 stage，是因为这条判据**在更早的位置上做不
      # 出来**：`工具链自证` 那份探针刻意按形态解析（corepack 摆在盘上的 pnpm 有三个
      # 形态，Node 只起得来其中一个，见 §2.1.1），而这一句走的是 host 自己的解析面 ——
      # 两者不是同一条链，也不该被压成一条（脚本自己写着理由：判据全在
      # `scripts/launcher-core/corepack.mjs`，它是薄壳）。
      #
      # 顺序要紧：**判在装之前**。装失败之后再判，红的位置就与原因分开了 —— 而
      # 「pnpm 起不来」这条链上此前每一轮都是这个形态（第一步绿、几十步之后才以一个
      # 看不懂的错收场，实测见 §13.5.3.6）。这里 1 秒就能问出来，且它跑在
      # `Install dependencies` 本来的位置上，代价是零。
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      # 这一跳按语义判，不按「有没有 ifModify」判：空转的安装不该被跑，
      # 而前提步骤不该被跳。判定口径与理由全在脚本头注（唯一实现）。
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-install-deps.mjs

  # ── 分支保护 ──
  # 守在最前：分支不对时后续检查的结果最后都会被丢弃（与 pre-commit 同序）。
  # 与 .githooks/pre-commit 用的是**同一个** scripts/check-branch-guard.cjs，
  # 不另写一份「CI 专用」的分支名判断（会漂移的判据只许定义一次）。
  # --target master 由配置写死传入：判定要的是**分支名**，而流水线里的
  # CNB_PULL_REQUEST_TARGET_SHA 是 sha —— 拿它当 branch 用会静默失效。
  - name: 分支守卫
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-branch-guard.cjs --pr-check --target master

  # ── 提交声明核对（平台侧的第二个执行者，ISSUE #2070）──
  #
  # 判的是「提交信息里那句『§x.y 照旧保留』在那次提交的树里是不是真在」。这一格的
  # 存在理由不是再判一遍，而是**换一个执行者**：本地那一段（`premerge-check.mjs` 的
  # `claims` 段）只在推送那一刻跑一次，而它过去取的是**最近一次提交** —— 假声明长在
  # 批次里较早那笔上时恰好看不见（`ad81a912` 就是这么进的主干：那句话在它自己的树里
  # 不成立，`docs/standards/13` / `AGENTS.md` / `.githooks/pre-commit` 里都没有
  # §13.5.13 / §13.6.3 两节，后来才被补回来）。
  #
  # 两件事同批做掉，判据本体一字未改：
  #   · 扫描面从「最近一笔」改成 `<分叉点>..HEAD` = **本次带进来的那一批**；
  #   · 取不到分叉点时那一段记 **2（没跑起来）并说明**，不再折成 0（绿的）。
  #
  # 平台上这一格跑的是**同一个入口**（`--only=claims`），不是第二份实现 ——
  # 「目标那条线」在这里的来源是 `CNB_PULL_REQUEST_TARGET_SHA`（这台节点只 fetch
  # 协商后的单 ref，未必有 `origin/master` 这个引用名；`受影响用例` 用的是同一个），
  # 分叉点仍然要算 `merge-base`，不拿尖端充数。
  #
  # 代价（本机实测）：没有声明的提交只值一次 `git log`，30 笔 14 秒；贵的是**真带
  # 声明**的那几笔（单条约 49 秒，要对每一节 `ls-tree` + 逐份 `git show`），
  # 而一条 PR 通常 0~1 笔。墙钟给 10 分钟兜那一头。
  - name: 提交声明核对
    timeout: 10m
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/premerge-check.mjs --only=claims

  # ── 新鲜度账判决（2026-10-23 从 PR 那一条撤到**每日档**；ISSUE #2300 主体分权）──
  #
  # 判据本体**一字未改**（仍是 `scripts/freshness-gate.mjs`，与本仓 `.githooks/pre-commit`
  # 的 D 组「每档都有主」同一份，§13.5.17 同款）；改的只是**它在哪一条流水线上跑**。
  #
  # 为什么撤（这一条是主体分权的直接后果）：**PR 上下文读的是主干的账**。
  # `FRESHNESS_TRACKS` 三档的 `subject` 现在都是 `master`
  # （`scripts/freshness-ledger.mjs` 的 `contextSubject()` 读 `COMFY_CI_SUBJECT`，
  # 空 ⇒ `"pr"`），而那一档的**权威账在机器自有分支 `ci/freshness-ledger` 上** ——
  # 那是**主干**的账（每日档在 master HEAD 上跑出来的那一份）。
  # 于是 PR 这一格判的是「这台机器 / 主干怎么被调度」，**不是任何一次 PR 的缺陷**
  # （与 `.gates` 里「工作区复用读数」那段同一句原则）。留在 PR 上，它只会把主干的红
  # 算到这次 PR 头上 —— 那正是「判据主体分权」要治的那件事。
  #
  # 每日那一格叫 `每日新鲜度账`（`.daily-gates` 里），`script` 与这里**逐字相同**，
  # env 多带一行 `COMFY_CI_SUBJECT: "master"`（主体=master ⇒ 读机器分支那份权威账）。
  # 判据钉住这一对：PR 清单里不许再有它、每日清单里必须有那一格、那一格点的仍是
  # `scripts/freshness-gate.mjs`（`tests/no-platform-ci-config.test.ts` 的
  # `PR_MOVED_TO_DAILY`；恢复动作与 `ESLint 零警告` 那条同款）。
  #
  # ⚠️ **位置约束整套搬到了每日那一条**：跑法脚本
  # （`artifact-run.mjs` / `full-suite-run.mjs` / `e2e-run.mjs`）跑绿之后**会刷新自己那笔账**，
  # 而同一分支的 stage 共享同一个工作区 —— 排在它后面时这一步读到的是**刚被这一次
  # 运行改过的账**，于是「账是旧的」这件事**永远判不出来**（判据在场、结论恒放行，
  # 正是本仓最不能有的形态）。
  # 每日档里会刷新账的三格是 `每日生产构建` / `每日全量E2E` / `每日单元测试`
  # ⇒ `每日新鲜度账` 排在它们**之前**（判据：`tests/doc-check-hook-wiring.test.ts`
  # 的「每日档里凡刷新账的档都排在它之后」那一组）。
  #
  # 恢复动作：取消下面三行注释 → 名字挪回 `COMFYAPP_CI_GATES` → 从
  # `COMFYAPP_CI_DISABLED_GATES` 删掉 → 删掉 `.daily-gates` 里的 `每日新鲜度账`
  # 与 `COMFYAPP_CI_DAILY_GATES` 里的名字。
  #   - name: 新鲜度账
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/freshness-gate.mjs
  #   # 秒级；给 5m 只是「卡死要早报」这条量级余量（判据本身远小于它，不需要更宽）。
  #   timeout: 5m

  # ── 建库 ──
  # 走 scripts/db-push.mjs —— 它复核库里到底有没有表，失败即非零退出。
  # 后面的 E2E 要真的读到库（见 e2e/smoke.spec.ts 的「数据库链路」一组），
  # 故必须放在最前。
  - name: 同步数据库表结构
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/db-push.mjs

  # ── 类型 / 静态检查 ──
  #
  # 「类型 / 静态检查」这一段的顺序里**没有先后约束**（都只读工作区、互不依赖），
  # 唯一一条有位置约束的是 `新鲜度账`（必须排在任何会刷新账的跑法脚本之前，见那一格）。
  #
  # ⚠️ 这一格与下面 `lib Node-only 声明` 起本地 CLI 走 `scripts/ci-run-tool.mjs`，
  #   **不写 `node_modules/.bin/<名字>`**（ISSUE #2572）：那三个垫片（`.cmd` / `.ps1` /
  #   无扩展名 shim）是 pnpm 摆给**宿主 shell** 的，Node 一个都直接起不了，于是
  #   `ci-cp936-exit.mjs` 只能回退去起同目录那份 `.ps1` —— 起一个仓里的编译器要绕一层
  #   PowerShell 宿主。直起包真身之后那一层没有了，DEP0190 那类「开 shell + args 数组」
  #   的弃用形态也不会从这里长回来（判据 `scripts/spawn-shell-scan.mjs`）。
  #
  # ⚠️ **按名字问，不按依赖名问**：本仓 `typescript` 是别名 `npm:@typescript/typescript6`
  #   （`bin` 键 `tsc6`），而 `tsc` 这个名字归另一个包（`@typescript/native`，自报名
  #   正是 `typescript`）。两份编译器各有名字、互不等价，所以「它跑的是哪一份」必须由
  #   垫片自己回答 —— 口径与实测在 `scripts/package-bin-entry.mjs` 的
  #   `resolveBinEntryByName` 上方，回归判据在 `tests/spawn-shell-scan.test.ts`。
  - name: 类型检查
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-run-tool.mjs tsc --noEmit

  # ── 受影响用例 / 固定结构用例：2026-11-02 从本档（PR）撤到每日全量单测 ──────────
  #
  # 两格在 PR 上慢且性价比低：本地实测 3.2~3.5 分钟，但冷节点 + 并发 PR 叠加会跑到
  # 25m+（自带墙钟预算 25m、stage 预算 45m），且偶发 `AggregateError` 假红（worker /
  # 模块装载炸了 ≠ 改动有回归）。判据面整份被 `每日单元测试` 全量套件覆盖（固定结构契约
  # 测试那几个文件本就在全量套件里），与 §13.5.21「全量单测只留每日档」同口径：共享节点上
  # PR 级测试读数不可信，每日档空机才可信。附带：`core 骨架单一事实源` / `core 出口纪律与
  # 基类纯度` 两格的执行者正是这一族的固定清单，随之记成 retired（每日全量单测覆盖）。
  # 降级登记见 `tests/no-platform-ci-config.test.ts` 的 `GATE_TIER_LEDGER`。执行者
  # `scripts/ci-affected-tests.mjs` 保留（仍可手动 / 单跑口复用）。


  # ── ESLint 零警告（ISSUE #2022 起恢复；停用期间的历史与两条恢复条件见下面这段）──
  # 停用期的理由（2026-10-16）：它跑得通，但那一轮它在每一格 E2E 调绿的提交里都重跑一遍，
  # 节点侧 256~274s 而**没有新信息** —— 因为当时本地钩子的 B 组每条提交都在跑同一条
  # `pnpm run lint`。**那个前提今天反转了**：钩子默认只跑 D0 形态档，本地不再跑它，
  # 于是这一格从「重复」变成「唯一执行者」。
  # 当初的两条恢复条件现在都成立：① E2E 那两格已绿；② 平台日志中文可读 —— 依据是同一台
  # 节点上 `工作区出处` 那格的读数在流水线日志里逐字可读（`[工作区出处] 出处·红 HEAD=…`），
  # 而那条通道就是下面这层 `ci-cp936-exit.mjs`（它把子进程按 UTF-8 输出，退出码原样透传）。
  # ⚠️ 恢复时**必须一起带上那层包裹**：不带它，红的时候读到的又是 GBK 乱码，
  # 而「读不出原因」正是当初退回它的那一半理由。
  #
  # ⚠️ **命令口径只有一处**（2026-10-19 订正）：这一格跑 `pnpm run lint`，**不是**
  #   `eslint .`。扫描范围（白名单目录）与参数（`--max-warnings 0` / `--cache`）收在
  #   `package.json` 的 `lint` 脚本里 —— 本地钩子的 B 组、`scripts/quality-gate.mjs`、
  #   `quality-gate.ps1` 用的都是它，这里是第四个（也是唯一一个曾经没跟上的）调用点。
  #
  #   现场（`cnb-hpl-1k5a0s6ss`）：`eslint . --max-warnings 0` 在全仓上跑满 20m、
  #   **零输出**被平台掐断（`Finished, code: 1` 来自强杀，不是规则报错）。两处口径差的
  #   两半都在那一跑里量得出来：同一跑 `类型检查` 77.3s、`重档静态判据`（本地串行实测
  #   125s）都不超两分钟，而 `eslint .` 既多扫 `docs/**` 与仓库其它 `.ts/.js` 面，
  #   又没有 `--cache` ⇒ 每个文件都按类型感知规则从头算一遍。
  #
  #   ⚠️ `--cache` 在这条路径上**恒定失效，这是已知且刻意不修的**：缓存键含
  #   `eslint.config.js` 的绝对路径，而平台每个作业都是新目录（`工作区复用读数` 已把
  #   形态定成 ①）⇒ 路径每跑都换。让它热起来要常驻工作区，而那件事的前提是
  #   `工作区出处` 那套判据先成立（见 `scripts/ci-workspace-provenance.mjs` 头注）。
  #   所以脚本里那个 `--cache` 的实际收益只在「本地同一条命令跑两次」这一档，
  #   别把节点侧的墙钟按热缓存估。
  # 命令口径已经收到 `pnpm run lint`（上面那段），但这一格**仍然撤到每日档**
  # （2026-10-19，与 `生产构建` / `单元测试` 同一档、同一个理由）：
  #
  #   · 它是这台机上仅有的几档**起一堆子进程**的格子之一（类型感知规则要真起
  #     `typescript` 宿主），而节点只有一台、没有并发旋钮 ⇒ 并行 PR 会让它的墙钟
  #     读数不可信（§13.5.21）。现场已经有过两次：`cnb-jt3-1k5071kou` 挂到 8640s，
  #     `cnb-hpl-1k5a0s6ss` 挂满 20m —— 两次都不是「规则报错」；
  #   · 与 `生产构建` 同一条取舍：PR 那一格回答的是「这次改动能不能过 lint」，
  #     而那件事在本地有执行者（`pnpm run lint` 一条命令、钩子的 B 组），
  #     平台侧再跑一遍是第二个执行者、不是第二份信息。
  #
  # 每日那一档的名字是 `每日 ESLint 零警告`，命令与这里**逐字相同**（判据
  # `tests/no-platform-ci-config.test.ts` 的 `PR_MOVED_TO_DAILY` 钉住这一对：
  # PR 清单里不许再有它、每日清单里必须有那一格、那一格点的仍是 `pnpm run lint`）。
  #
  # 恢复动作：取消下面三行注释 → 名字挪回 `COMFYAPP_CI_GATES` → 从 `COMFYAPP_CI_DISABLED_GATES`
  # 删掉 → 删掉 `.daily-gates` 里的 `每日 ESLint 零警告` 与 `COMFYAPP_CI_DAILY_GATES` 里的名字。
  # - name: ESLint 零警告
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- pnpm run lint
  #   # 实测 114s（本机 8 核，热缓存）/ 256~274s（自托管节点）。而 `cnb-jt3-1k5071kou` 上它
  #   # 挂到 **8640s**（2h24m）被 Job 上限掐掉 —— 那是节点被压死、这一步根本没在算。
  #   # 给 20m 是「量级余量」：真跑得完的形态差两个数量级，而卡死的形态 20m 就能
  #   # 报出来，不再白等两小时。**不是放宽判据**，判据本身一字未动。
  #   #
  #   # ⚠️ 这条线**不是**用来兜「口径写宽了」的：上面那段那次 `eslint .` 就正好落在里面
  #   #   —— 它挂了整整 20m 才被掐断，而不是当场红。预算按设计只回答「卡死没有」。
  #   timeout: 20m

  # ── 测试（**临时停用**，ISSUE #1959）──
  #
  # ⚠️ 这一步现在是**注释掉的**：宿主侧测试环境还没就绪（Windows 自托管节点上
  # Python 只进了 `yuedu` 会话、构建用的 `SYSTEM` 账号够不着；另有一批跑真子进程的
  # 用例在慢宿主上超预算），先把它摘掉让流水线能往下走，**等测试流程好了再加回来**。
  #
  # 停用这件事有两半、缺一半就会变成「静默删除」：
  #   · 本条目按注释形态留在这里（**别删** —— 恢复动作就是取消注释）；
  #   · 名字从 `env.COMFYAPP_CI_GATES` 摘掉、挪进 `env.COMFYAPP_CI_DISABLED_GATES`。
  # 判据 `tests/no-platform-ci-config.test.ts` 会把「停用」与「删除」分开判：
  # 只在 `DISABLED_GATES` 里登记、且这段注释仍在，才算停用；否则当场点名。
  #
  # 原来的形态（恢复时照抄下面这块，并把名字挪回 `GATES`、从 `DISABLED_GATES` 删掉）：
  #
  #   全量 vitest 只跑**一遍**（`test:coverage` 一次运行即产出覆盖率报告，
  #   判据强度不变，阈值仍由 vitest.config.ts 的目录阈值守着）。
  #
  #   **并发由 `scripts/ci-load.mjs` 按**现场核数**算（ISSUE #1993 / 规范 §13.5.21），
  #   不是写死的 4，也不吃配置里那个 8**：这条件路径与本地跑不是同一种负载。
  #   ① 宿主机 16 逻辑核（无 docker、整机可用），vitest 若照默认铺开就有 ~15 个 worker；
  #   ② `--coverage` 给每个文件都加一层插桩（本机实测同样两文件 6.2s → 9.2s，约 +50% CPU）；
  #   ③ 这一套里有大量**真起子进程**的用例（git / node / prettier / PowerShell），超订的
  #      那一份直接从「等 CPU」变成「等子进程」—— 表现是 `Test timed out in 30000ms`，
  #      而单跑全绿。**这正是本仓已经量过的那一格**（规范 §11.13）：同一套、同一台机器，
  #      `maxWorkers=8` 在负载下仍出争用形态的红，`--maxWorkers=4` 才拿到「560 文件全绿」。
  #   降并发是**降负载**，不是放宽判据 —— 用例、预算、覆盖率阈值一个字不动；
  #   与 `.githooks/pre-commit` 的 C 组同一条理由（AGENTS 硬规则里那句
  #   「降负载的杠杆是并发，不是预算」）。代价是墙钟变长，这是这条路径上买得到的唯一交换。
  #
  #   ⚠️ **为什么不再写死 4**：`runner.cpus` 在自托管上是无效旋钮（官方文档原文见文件头
  #   第 2 条），平台也不给「同时跑几条」的旋钮 —— 那么配置里那个常数就与「这台机现在
  #   几个核」**没有任何联系**。节点换规格、或同一台机上多了第二条流水线时，它照旧按
  #   16 核铺开，现场形态是「既不推进也不报错」。现在由 `scripts/ci-load.mjs` 从
  #   `CNB_CPUS` 与 `os.availableParallelism()` 读现场核数、按「一个 worker 至少 8 核」
  #   折算（16 核 ⇒ 2 个 worker；档位从 4 抬到 8 的理由与三条边界见规范 §13.5.21，
  #   ISSUE #2317：`受影响用例` 一格占整条流水线七成格时，这一档买的是「单条流水线
  #   别占满整台机」，承诺的是峰值占用减半、不是墙钟方向（实测见规范里那两跑对照，
  #   #2317 预估的「时长翻倍」已被 #2320 订正）。唯一出处，
  #   判据见 `tests/ci-load.test.ts`；人还能用
  #   `COMFY_CI_MAX_WORKERS=1` 再压一档）。
  #
  #   ⚠️ **恢复时入口写 `scripts/full-suite-run.mjs`，不是裸 vitest**（ISSUE #1979）：
  #   它内部是 `pnpm run test:coverage`（= `vitest run --coverage`，见 `planRun()`），
  #   而外面多出来的那一跳是**记账** —— 跑绿即刷新 `scripts/.full-suite-freshness.json`。
  #   裸写 vitest 时这一步的绿只落在日志里、账面上一个字不变，本地「改了就当天跑」
  #   那条判据照旧拦人（判据与账是两件事，两个执行者要读到同一份事实）。
  #   本档在平台侧**必须整档跑**（不带 `--grep` / 不指单个文件）：`isWholeTrackRun`
  #   会把「透传了参数的绿」判成**不构成整档凭证**、当场不记账。
  #   用法与边界见 scripts/full-suite-run.mjs 头注与规范 §13.5.4。
  #
  # ⚠️ 这一格**留在注释形态 = 停用**（名字在 `COMFYAPP_CI_DISABLED_GATES` 里，两处同批才成立）。
  #   本批一度把它取消注释当「重档挪到 CI」的承接者，随后撞上并行会话那条决定：会自己起
  #   一堆子进程的那两档只在每天 01:00 那一跑（§13.5.21）—— 同一台机上并行 PR 会把带超时的
  #   读数变成不可信的红，而它跑绿还要刷 `整档凭证`，拿并发下的绿去刷那张账比不刷更坏。
  #   ⇒ **全量**单测归 `每日单元测试`；**增量**那一档（受影响用例）2026-10-20 起由本文件里的
  #   `受影响用例` 一格执行（跑增量面、不刷整档凭证），本地两个执行者同日撤销；
  #   2026-11-02 增量那两格也随 ISSUE #3052 撤到每日全量单测（增量面是全量子集，覆盖不丢）。
  #   恢复前提：平台能给这一格一条不与并行 PR 争抢的执行环境（那才是这条决定的边界，不是判据）。
  # - name: 单元测试
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/full-suite-run.mjs
  # 实测 827s（`cnb-eus-1k5058g8l`，755 文件全量绿）；本机 `--maxWorkers=4` 实测
  # 198s。而 `cnb-did-1k50659np` 上它挂到 **8640s**（2h24m）才被掐掉，留下的
  # 只有 `timeout of 8640000ms exceeded` —— 一条失败原因都读不到。
  # 给 45m：真跑得完的形态差三倍余量，卡死的形态 45m 报出来。
  # timeout: 45m

  # ── 结构 / 一致性硬规则（与 .githooks/pre-commit 同一批脚本）──
  # ⚠️ `ifModify` 的第一处示例（本档共 17 处，全部登记在
  # `scripts/ci-incremental-gates.mjs`）：它只扫 `src/components` + `src/app`，
  # 本次改动一个文件都没落在这两处时跳过。**每加一处都必须同批登记** ——
  # 判据 `tests/ci-incremental-gates.test.ts` 双向核对，机制见上面 `.gates` 头注。
  - name: 标题行让位
    ifModify:
      - src/components/**
      - src/app/**
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-title-bar-clearance.cjs

  # 收窄（ISSUE #2010）：它扫的是**盘上的某一组目录**，不是整仓 —— 根目录里散落的
  # 入口脚本（R9 的第一形态）与 git 临时状态文件（第二形态）只可能出现在**仓库根**，
  # 而 src/lib 的子域纪律（R13/R14）只可能被 `src/lib` 的目录改动破坏。这几处一个
  # 都没碰时，「文件名 / 归属 / 注释流水 / 控制字符」这些判据不可能变。
  #
  # ⚠️ 与上面那些只扫 `src/**` 的判据不同，它的形态更复杂，所以 globs 点得更宽：
  #   · 根级 `*.ps1 / *.bat / *.cmd / *.vbs / *.ts / *.tsx` —— R9 判的是「根目录里
  #     多了个本该归 tools/ 的入口」，面就是根目录本身（不经 `src` / `scripts`）；
  #   · `src/**` —— R1–R5 / R10–R12 的扫描根（`SCAN_ROOTS` 之一）；
  #   · `scripts/**` + `tools/**` —— R7 / R8 的扫描根（含中文的 .ps1 必须 BOM）。
  # 代价写在明处：**新增一条以别的目录为扫描根的规则时，必须同批回来看这一行**
  # （否则改那个目录不会触发本步）。登记与理由的唯一出处是
  # `scripts/ci-incremental-gates.mjs`。
  - name: 文件结构硬规则
    ifModify:
      - "*.ps1"
      - "*.bat"
      - "*.cmd"
      - "*.vbs"
      - "*.ts"
      - "*.tsx"
      - src/**
      - scripts/**
      - tools/**
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-file-structure.cjs

