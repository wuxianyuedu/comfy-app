  #   ⇒ **全量**单测归 `每日单元测试`；**增量**那一档（受影响用例）由本文件里的
  #   `受影响用例` 一格执行（跑增量面、不刷整档凭证），本地两个执行者同日撤销；
  #   增量那两格现在也撤到了每日全量单测（增量面是全量子集，覆盖不丢）。
  #   恢复前提：平台能给这一格一条不与并行 PR 争抢的执行环境（那才是这条决定的边界，不是判据）。
  # - name: 单元测试
  #   script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/full-suite-run.mjs
  # 实测 827s（安静机器，755 文件全量绿）；本机 `--maxWorkers=4` 实测
  # 198s。而满载机器上它挂到 **8640s**（2h24m）才被掐掉，留下的
  # 只有 `timeout of 8640000ms exceeded` —— 一条失败原因都读不到。
  # 给 45m：真跑得完的形态差三倍余量，卡死的形态 45m 报出来。
  # timeout: 45m

  # ── GitHub 判决回读：主列末尾的**承重档**（fail-closed 已落地）──
  #
  # 它回答一个问题：镜像格（主列开头那一格 `GitHub 镜像同步`）派发出去的那一笔
  # head_sha，GitHub Actions 那边跑完了没有、结论是什么。**主路径**轮询
  # `GET /repos/{owner}/{repo}/actions/runs?event=repository_dispatch`，再用
  # `display_title`（= pr-gate.yml 的 run-name，内含 payload 的 head_sha）认领本跑，
  # 按 workflow run 的 `conclusion` 判定 —— 不用 `?head_sha=`：dispatch 触发的 run
  # 其 head_sha 落默认分支 HEAD，payload 的 sha 只在 client_payload，按它过滤恒得
  # 零条（线上实测）。主路径读不到本跑的 run（Actions 权限缺 /
  # display_title 认不出）时**回落** `GET .../commits/{sha}/check-runs`（需 workflow
  # 主动建 check-run 才有效 —— 当前未建，读到零条按「还没跑完」继续等，不误判）。
  # sha 的推导与镜像格同源（同一笔 `CNB_PULL_REQUEST_IID` → 同一镜像 ref → 同一 head_sha）。
  #
  # 为什么排在**主列末尾**：镜像格一跑完 GitHub 那边才起跑，回读放得越靠后，
  # 留给 GitHub 完成的窗口越大；且本格只做 API 读数、零构建，挂在最后不会挡住
  # 任何一格的墙钟。轮询总预算 45 分钟（`POLL_BUDGET_MS`，取法见脚本文件头）——
  # 正常情况第一读就接近完整；预算耗尽按「没跑起来」exit 2 交账 —— 翻承重后 exit 2 退非零、
  # 直接拦合（它不自己发明一红，只是如实报「判不了」，由承重链路拦下）。
  #
  # ⚠️ **45m 是上限，不是每次都该花完**。两种「等下去没有意义」的形态
  # 各有自己的提前收工判据，都在 `scripts/ci-github-verdict-read.mjs` 里：
  #   ① **上游派发没发生**：镜像格把结论落在工作区的 `.comfy-ci/mirror-dispatch.json`
  #      （`writeDispatchState`）。推送 / LFS / 派发任意一跳失败 ⇒ 本跑永远不会有 run，
  #      回读格读到 `dispatched: false` 就**一秒不轮询**、exit 2 并把上游原因念出来
  #      （翻承重后 ⇒ 拦合：上游根本没派发，这跑没判过，不许合）。
  #      两格共用一个工作区，所以这一跳只需要一次读文件。
  #   ② **认领锚点恒假**：触发表里有 run、但没有一条的 `display_title` 含目标 sha
  #      （`run-name` 没渲染出 payload 的 sha / 不是同一笔 sha）。
  #      `run-name` 是 run 创建时定死的 ⇒ 等不出新事实。连续 `CLAIM_MISS_STREAK_TO_ABORT`
  #      轮这一形 ⇒ 提前 exit 2，并把触发表的标题样本念出来（两种候选当场可分）。
  # 零条 run 那一形（GitHub 侧压根还没起跑）**照旧吃满预算** —— 它可能随时起跑。
  #
  # ⚠️ **承重档**（已摘 `--readout`，fail-closed）：三态照常打点，但退码**生效** ——
  # 有结论且红 ⇒ exit 1 直接拦合；没跑起来/没结论 ⇒ exit 2 同样拦合；只有读到绿才放行。
  # 它坏了既不许把门禁的红洗成绿，也不许漏过（与镜像格同一条 fail-closed 规矩）。
  #
  # ⚠️ 两件外部前提不落地，这一格永远只能交「没跑起来」（话术在脚本里会点名）：
  #   ① `GITHUB_MIRROR_TOKEN`（fine-grained PAT）追加 `actions: read`（优先，主路径）
  #      或 `checks: read`（兜底）—— 任一即可、两条都给最稳，并把新值同步进密钥
  #      仓库 `moon-read/GITHUB_MIRROR_TOKEN`（本流水线从那里 imports）；
  #   ② 自托管节点到 `api.github.com:443` 的出网（与镜像格同一条 egress，它通这一格
  #      才有意义）。
  # ── 为什么全量日志**没有**走附件──
  #
  # 回读格不会把几十 MB 的 job 日志直接打进 stage：**CNB 单 stage 日志封顶 102400 字节**
  # （实测：超界时 stage 仍是 success，平台保留头部 + 一行
  # `The log length exceeds the limit(102400)` + `......` + 尾部 —— 静默截断，不是整行丢弃）。
  #
  # 「落文件 + 附件」那条路在这一档上**不可用**：`cnbcool/attachments` 这类插件要 docker，
  # 而自托管节点没开容器能力 —— 实测附件格 0s 就红，
  # 平台给的原因是 `Runner does not enable Docker.`（此前那次「附件成功」的探针
  # 走的是平台池，不是这条件路径）。
  #
  # 所以 stage 里给的是**能直接排障的那一段**：哪条 run / 哪个 job / 哪个 step 失败、
  # `##[error]` 注解、失败 step 的原始窗口（预算 60 KiB，整个 stage 共用、按剩余字节分配），
  # 再加**全量日志的下载端点**（`GET /repos/<owner>/<repo>/actions/jobs/<job_id>/logs`，
  # 需 `actions: read`）与本地落盘路径（`.comfy-ci/tmp/github-verdict-logs/verdict-logs.txt`，
  # 已在 `.gitignore` 内、每次回读先清空旧文件）。
  # ── 老轮询主列（GA 回调转正后停用，原文按注释形态留着供回退）──────────────
  #
  # 出站轮询 api.github.com 的 `GitHub 判决回读`、gzip+base64 日志分块三格、
  # `GitHub 判决判定` 五格一起退场，执行者换成下面那格 `GA 回调结论回读` —— 站内读
  # GA 送回 commit-statuses 的结论（§13.5.33 逐笔对账）。停用 ≠ 删除：恢复动作是
  # 「取消这段注释 → 把五个名字挪回 `COMFYAPP_CI_GATES` → 从 `COMFYAPP_CI_DISABLED_GATES` 删」，
  # 判据 `tests/no-platform-ci-config.test.ts` 的「停用登记」两条钉着。五格原文逐字保留在下：
  #
  # - name: GitHub 判决回读
  # `--decision-out`：这一格只**读数 + 落盘**，退码恒 0 —— 判定交给后面最后一格。
  # 理由：CNB 的 stage 串行，这一格若直接退 1，后面「日志分块」那几格根本跑不到，
  # 而「判红」恰恰是最需要看日志的那一形。判定文件读不到 ⇒ 判定格退 2（fail-closed）。
  # script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-github-verdict-read.mjs --decision-out .comfy-ci/tmp/github-verdict-logs/decision.json
  # 包住 45m 轮询预算 + 进程开销；与 GitHub 侧最重格的外框同级。
  # timeout: 60m
  #
  # ── 失败日志的全量通道：**gzip + base64 + 分块打印**──
  #
  # 为什么不是「附件」：`cnbcool/attachments` 那类格是**插件**（`image` + `settings`），要
  # docker；自托管节点没开容器能力 —— 实测该格 0s 红
  # `Runner does not enable Docker.`（此前那次「附件成功」的探针走的是平台池，不是这条路径）。
  # **必红的格不许留**，所以整格删掉，换成本档这套纯 node 的通道。
  #
  # 为什么不是「把全量直接打进 stage 日志」：单 stage 封顶 **102400 字节**（实测），
  # 超界时 stage 仍是 success、平台保留头 + 一行
  # `The log length exceeds the limit(102400)` + 尾 —— 静默截断，真因恰好被吞。
  #
  # 现形态：回读格把**失败 job**（不是整 run 全部 job）的脱敏正文压成
  # `chunk-<i>.b64`（每块 ≤ 90000 base64 字节）+ `manifest.json`（块数 / 整包 sha256 /
  # 尺寸），下面固定三格各打一块 —— 读者按 `chunk-1..N` 顺序拼接（去换行）→ base64 解码
  # → gunzip → 核对 sha256，即可**逐字重建**那份全量。
  # 体积实测：两条判红 run / 4 个失败 job 的脱敏正文 616395 字节 → gzip 118375 →
  # base64 157836 → **2 块**（三格够用且有余量）；块数超过三格时只印前 3 块并明念
  # 「其余见上面每个 job 的下载端点」（不静默丢）。
  #
  # 这三格**不许变成必红**：清单读不到 / 这一块不存在 / 块文件缺失，都只各念一行、退 0；
  # 判决由最后一格退码，日志取不到不改变三态与退码（用例钉着）。
  # - name: 日志分块 1/3
  # script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-print-log-chunk.mjs 1
  # timeout: 2m
  # - name: 日志分块 2/3
  # script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-print-log-chunk.mjs 2
  # timeout: 2m
  # - name: 日志分块 3/3
  # script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-print-log-chunk.mjs 3
  # timeout: 2m
  #
  # ── 判决判定：**承重**。把回读格留下的 `decision.json` 换成流水线真退码。
  #
  # 读不到 / 不是合法 JSON / 形状不对 ⇒ exit 2（判不了就拦合，fail-closed）；exit 1 ⇒ 拦合；
  # **只有**明确写着 exit 0 才放行 —— 与回读格那套三态一字不差，本格不做第二次判读。
  # - name: GitHub 判决判定
