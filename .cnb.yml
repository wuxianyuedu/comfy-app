# CNB 云原生构建流水线 —— 跑在**根组织自托管 Windows 节点**上（ISSUE #1959）
#
# 这份配置是 ISSUE #623「平台侧用不起、配置删除」的**一次决策反转**，反转的
# 依据是一条前提被推翻：自托管 Runner 走宿主机、不参与核时计费。官方文档
# （docs.cnb.cool/zh/build/build-node.html「限制」一节）原文：
#
#   「自定义 Runner 默认不开启 Docker 能力，构建脚本直接运行在宿主机上，因此：
#     runner.cpus 配置无效……不参与核时计费。」
#
# 而 #623 的全部推理都建立在计费上（160 核时/月 ÷ 8 核 = 一个月约二十次 PR）。
# 计费项没了，那条结论对这条件路径不再成立。**但反转的不只是「能不能跑」**，
# 还有下面这几条形态变化 —— 它们才是这份文件与旧版差别最大、也最容易踩的地方。
#
# ── 与旧版（Linux 平台池 + docker.image）的五条形态差异 ──────────────────
#
# 1. **没有 docker，工具链必须预装在宿主机上**。旧版靠 `docker.image: node:24`
#    提供 Node，这条路在自托管上失效（`pipeline.docker.image` 不会生效）。
#    因此本文件**不声明任何 docker / image / volumes**，而是把「宿主机该有什么」
#    变成第一条流水线步骤去**验**（见下「工具链自证」）—— 环境要求写进配置里
#    没人读，写成会红的断言才有人管。
#
# 2. **`runner.cpus` 无效，故不声明**。旧版写 `cpus: 8` 是为了「避免分配到的节点
#    规格随扩缩容变化把耗时读成回归」，而自托管上整机资源直接可用、这个键被忽略；
#    留着它只会让人以为核数被控制了。
#
# 3. **脚本语言是 PowerShell，不是 POSIX sh**。自托管 Windows 上 stage script
#    默认走 PowerShell，旧的 `rm -rf` / `mkdir -p` / `diff -q` / `>/dev/null` 一律
#    不成立（`rm` 是 Remove-Item 的别名，但没有 `-rf`；`mkdir -p` 会被当成字面参数）。
#    本文件里凡涉及文件系统 / 分支流程的地方都写成 PowerShell 原生的样子。
#
# 4. **OverlayFS 不可用，秒级克隆降级为普通 git clone**。每一次构建都是全量 clone，
#    这是这条件路径的固定成本，没有配置能省掉它。
#
# 5. **节点离线会静默改派**。文档原文：节点「离线、被临时禁用，或资源使用达到上限」
#    时系统会自动尝试重新分配到其他可用节点，实在没有才失败。在自托管这一档上
#    「其他可用节点」就是计费的平台池 —— 于是最坏情况是**悄悄花回核时**，而没有任何
#    报错。诊断靠日志里那一行 `runner.namespace` / 实际标签，见 §13.5.3 的「怎么确认
#    真的跑在自托管上」。
#
# 6. **stage shell 是 PowerShell，而它的输出编码默认是 CP936**（2026-10-16 补）。
#    Node 往管道里写的是 UTF-8 字节，PowerShell 拿 `[Console]::OutputEncoding`
#    （中文 Windows 上 = CP936）去解，再按同一个编码吐回给平台 —— 于是**所有中文
#    日志在平台侧都是乱码**：现场 `[e2e-run] 璧� Playwright 鍓嶏細搴旂敤绔彛 绌�`
#    就是「UTF-8 被当 GBK 读了一遍」。平台自己那条错误行（`任务执行失败，返回码：1`）
#    是好好的，所以病不在平台解码侧，在 stage shell 这一层。
#    故**每个 stage 的脚本都以
#    `$enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc;` 开头**
#    （单行脚本用 `;` 接，块脚本写成第一行）；本地不受影响（本地直接调 node，
#    没有这一层转发）。⚠️ 这一句不是装饰：**红的时候最该读的那些行正好是中文**。
#
#    ⚠️⚠️ **但它不是全部，而且「抓取端按宿主 ANSI 代码页解码」这句推断已被证否**
#    （2026-10-16 晚两次探针读数，逐字相同）：
#
#      · 把控制台钉成 65001 之后，PS 原生 / cmd / node **三层的中文仍然同一种乱法**
#        ⇒ 解码端**不是**按当前控制台代码页解；
#      · 那台机的**宿主 ANSI 代码页已经换成 UTF-8**（系统区域设置里勾了「使用
#        Unicode UTF-8 提供全球语言支持」并重启过 —— 本文件读数行里那个值也从 936
#        变成了 65001），而乱码**一个字没变** ⇒ 解码端**也不是**按宿主 ANSI 代码页解。
#
#    同一份日志里还有一组更硬的对照：**runner 自己打的行（`script` 原文回显）是完好
#    中文**，而**子进程输出的每一行**都是「UTF-8 字节按 CP936 解」⇒ 解码发生在
#    **子进程输出那一跳**，而它用的编码是**不与宿主设置联动的 CP936**。
#
#    所以「机器侧改一处全好」这条路**不成立**（已经改过、也重启过，读数说没用）。
#    仓库侧只剩一条：**让每个字节以 CP936 出口**（逐 stage 转码）。本 stage 第 4 行探针
#    就是用来一次定死这件事的（直接以 CP936 字节写 stdout）。
#    `scripts/ci-console-encoding.mjs` 头注与规范 §13.5.3.5 记着读数与判读。
#
#    ⚠️⚠️ **那条出路 2026-10-16 晚已经有执行者了**（ISSUE #1977）：每个 stage 的命令
#    现在都包在 `scripts/ci-cp936-exit.mjs` 外面 ——
#
#      node scripts/ci-cp936-exit.mjs -- <真命令>
#
#    它起那条命令、把输出交给 PowerShell **按 936 重发**、再把退出码原样转出去。
#    两件事别搞混：**钉 65001 照旧要留**（它让 PS 把 Node 的 UTF-8 **读对**，是转码能
#    拿对字节的前提 —— 直接 `chcp 936` 会先毁掉解码，转出来的只是乱码换了个编码），
#    新增的只是「读对了之后再按 CP936 写回」那一跳。Node 没有 GBK 编码器
#    （`TextEncoder("gbk")` 静默落到 UTF-8），所以转码这一步只能是 PowerShell 的
#    `GetEncoding(936)`；判据由 Node 的 `TextDecoder("gbk")` 反向复算
#    （`tests/ci-cp936-exit.test.ts`）。
#    ⚠️ 写成 `$enc=…` 而不是直接 `[Console]::OutputEncoding=…` 是**被咬过**：
#    YAML 里 `[` 开头的纯量是**流式序列**，那样写整份文件解析不过
#    （prettier 的 YAML 解析器当场报 `SyntaxError: Unexpected scalar at node end`，
#    而平台侧只会表现为「流水线起不来」）。判 `.cnb.yml` 的语法用
#    `pnpm exec prettier --check .cnb.yml` —— 它带 YAML 解析器。
#
# ── 两条流水线：谁在什么事件上跑 ────────────────────────────────────────
#
#   质量门禁        pull_request（不合并就不该结束）
#   master 合并复核  push（只复核「确实是 PR 合并进来的」，不重跑全套）
#
# push 不重跑全套的理由与旧版相同（合并提交由平台按**已验过的源分支 SHA** 生成、
# 不引入新代码），但今天它不再是「省额度」，而是「省一遍没有新信息的运行时间」。
#
# ⚠️ **`&common` 锚点里刻意不含 stages**：`<<: *pipeline` 会把 stages 一起带过去，
# 那正是「push 也跑整套门禁」的来源（详见 git 历史里 55bc9b36 的立案说明）。
# 覆盖根键时锚点里的键会被整体替换，故每个事件都写出完整形态。

.common: &common
  runner:
    # group = 当前仓库所属根组织下的自托管构建节点（不是平台公共池）。
    # 漏掉这一行会退化成平台池 —— 那时核时重新开始计费，而配置看起来完全一样。
    namespace: group
    # 「与」关系：列出的每个 tag 都必须出现在节点标签上。当前节点声明的标签是 win。
    tags:
      - win
  # 同一分支上并发只留一条：**这条是节点侧的止血，不是省时间**。
  #
  # 实测（ISSUE #1961）自托管节点只有一台，而这一轮里连着推了好几个提交，每个
  # `pull_request` 事件都起一条**全量**流水线，全落到同一台机上：
  #
  #   cnb-jt3-1k5071kou  ESLint 零警告  挂 8640s（同分支更早那跑 256s 跑过）
  #   cnb-did-1k50659np  单元测试       挂 8640s（2h24m）
  #   cnb-s61-1k50eo6p1  npc go         挂 start，整机不推进
  #
  # 几份 `--maxWorkers=4` 的 vitest + 几份 ESLint + 几份 `next build` 线性叠加，
  # 这台 16 核机被吃干净，**最先被挤掉的恰好是排队早的那条**：它拿不到 CPU，
  # 于是既不推进也不报错，直到撞上 2h 的 Job 上限。
  #
  # `cancel-in-progress: true` = 同 key 上新流水线到达时终止旧的。key 默认是
  # `分支名-流水线名`，正是我们要的粒度：**同一分支**上只留最新的那一跑
  # （旧的已经被新提交取代，它的读数本来就没有意义），不同分支之间互不影响。
  # 这不是「跳过门禁」—— 被终止的那条对应的修订号已经不在分支上了。
  lock:
    cancel-in-progress: true
  retries: 0
  env:
    # 与旧版对齐：构建机上没有真实密钥，用占位值过 src/env.js 的校验。
    # BETTER_AUTH_SECRET 必须一并注入 —— SKIP_ENV_VALIDATION 只绕过 src/env.js，
    # 绕过不了 better-auth 自己的生产校验（缺失 → 退回 DEFAULT_SECRET 抛错 →
    # createTRPCContext() 抛错 → 所有 authedProcedure 全灭，设置页整页读不出来）。
    # 该值只用于构建期冒烟，不参与任何真实部署。
    SKIP_ENV_VALIDATION: "1"
    BETTER_AUTH_SECRET: "ci-placeholder-secret-not-for-production-use"
    # 避免 corepack 在非交互环境下为拉取 pnpm 版本而等待输入。
    CI: "true"
    # 覆盖率 reporter 的安静档（ISSUE #1959）：`vitest` 的 `text` reporter 会把报告里
    # **每一个文件**打一行，450+ 行的表本身就有 ~90KB，而平台对单次构建日志的硬上限是
    # 102400 字节 —— 超了就只留一句 `The log length exceeds the limit(102400)`、
    # 后面全部截断，于是这一步看起来「跑完了」而失败原因一个字都看不到。
    # 置位后由 `vitest.config.ts` 切成 `text-summary`（几行汇总）：
    # **逐文件明细一份没少**（它本来就在落盘的 `lcov` / `json-summary` 里）。
    # ⚠️ 这一行是本档唯一的执行者 —— 不在任何 `script` 里（见规范 11 §11.7）。
    COMFYAPP_QUIET_COVERAGE: "1"
    # 本题解析器要用 `steps` 里**没有**的那几个东西（`steps` 会内联进工作区、
    # 被 checkout 抹掉，而 `env` 是 HEAD 的事）。判据按本键解析 `.cnb.yml`：
    #   · `PYTHON_PROBE` —— `scripts/python-probe.mjs`：逐个候选打印「这个命令起不起
    #     得来」。缺件时那几条用例走 `env` 档跳过（不会红），跳过的是哪几条只有它答得出。
    #   · `GATES` —— 本档的 stage 名有序清单。两条被判的约束都是实测出来的：
    #     ① `单元测试` 必须排在 `Python 可用性` 之后 —— `cnb-jt3-1k5071kou` 上它跑到
    #        **2h24m** 被 8640s 墙钟掐断（只留下 `timeout of 8640000ms exceeded`），
    #        而那一步**照旧会往下跑**（缺 Python 只让它少判几格）；
    #     ② `环境前提` 必须排在 `Install dependencies` 之前 —— 它答的就是「这次装得成
    #        装不成」的前提，排在后面等于把结论推到自己要解释的那一步后面。
    #     两条都不是风格。判据分别在 `tests/no-platform-ci-config.test.ts` 与
    #     `tests/ci-env-probe.test.ts`。
    #   · `DISABLED_GATES` —— **临时停用**的 stage 名清单（此刻是 `单元测试` /
    #     `ESLint 零警告` / `prettier 格式`，理由逐条写在那个键旁边）。
    #
    # **`COMFYAPP_CI_DISABLED_GATES` 是「停用」这件事的执行者，不是备注。**
    # 屏蔽一个 stage 的两半（注释掉 `.gates` 里的条目 + 从 `GATES` 摘名）**都不报错**：
    # 前者是 YAML 注释、后者只是数组少一项，于是「暂时屏蔽」与「永久删除」在配置里
    # 长得一模一样。这一键把它变回一句读得出来的事实，判据据此把两件事分开：
    #   · 不在 `GATES` 里、**也**不在本清单里 ⇒ 那是删除，判据当场点名；
    #   · 不在 `GATES` 里、但在本清单里 ⇒ 停用，判据放行、并要求条目仍在 `.gates`
    #     里以**注释形态**留着（可 grep 回原文），否则「加回来」就没有原文可依。
    # 恢复动作：`.gates` 里取消注释 → 把名字挪回 `GATES` → 从本清单删掉。
    # 判据见 `tests/no-platform-ci-config.test.ts` 的「停用登记」那两条。
    COMFYAPP_CI_PYTHON_PROBE: scripts/python-probe.mjs
    COMFYAPP_CI_DISABLED_GATES: >-
      单元测试, ESLint 零警告, prettier 格式
    # ⚠️ 这份清单里的三项各有各的理由，共同点是**名字在这儿 = 停用**（不是删掉）：
    #   · `单元测试` —— 宿主侧测试环境未就绪（ISSUE #1959），等环境好了再加回来；
    #   · `ESLint 零警告` / `prettier 格式` —— **2026-10-16 临时让位**：两项都跑得通，
    #     但在「把 E2E 那两格调绿」的每一轮里都要白重跑一遍（节点侧 ESLint 256~274s），
    #     而**平台日志的乱码**会把它们真红时最该读的那几行一起吃掉。
    #
    # ⚠️⚠️ **恢复条件是两条，缺一不可**（同日曾只按第一条恢复过一次，当天退回）：
    #
    #   ① `E2E 关键流程` 一绿 —— **已成立**（2026-10-16，`cnb-h80-1k51ukj26`：整条
    #      流水线 success，34 个 stage，`浏览器安装` 0.7s / `E2E 关键流程` 51.3s）；
    #   ② **平台日志的中文可读** —— **尚未成立**（读数见下）。
    #
    #   ② 为什么也算一条：耗时项真红时人能拿到的只有日志，而**平台侧那一跳**把
    #   子进程写的 UTF-8 字节按 CP936 解，Node 打的每一个非 ASCII 字符都是乱码 ⇒
    #   恢复它们等于把「每轮多花 5 分钟」换成一个**读不出原因的红**。
    #
    #   ② 的现状（2026-10-16，`工具链自证` 那几行探针）：**两个嫌疑人都被否掉了** ——
    #     · 控制台输出代码页 936 → **65001**：四行探针逐字未变；
    #     · 宿主 ANSI 代码页也已换成 UTF-8（那台机勾了「使用 Unicode UTF-8 提供全球
    #       语言支持」**并重启过**）：四行探针**仍然逐字未变**。
    #   加上同一份日志里的一组对照 —— **runner 自己打的行（`script` 原文回显）是完好
    #   中文**，而子进程输出的每一行都是「UTF-8 按 CP936 解」⇒ 解码发生在**子进程输出
    #   那一跳**，用的是**不与宿主设置联动的 CP936**。所以「机器侧改一处全好」这条
    #   路**不成立**（已经改过、也重启过，读数说没用）。剩下的仓库侧出路只有一条：
    #   **让每个字节以 CP936 出口**（逐 stage 转码）。本 stage 的第 4 行探针就是用来
    #   一次定死这件事的。口径与三轮读数见 §13.5.3.5 最后一节。
    #
    # ⚠️ `浏览器安装` / `E2E 关键流程` 也曾在这份清单里（ISSUE #1966：这台节点一次
    # 取不回那 120 MiB），**2026-10-16 按恢复动作加回来了** —— 取消注释 → 名字挪回
    # 下面那一行 → 从本清单删掉，三件事同批做完。恢复的依据不是「节点网络修好了」，
    # 而是**取法换掉了**（分片自取：片长自适应、断了从已落盘的字节接着来），
    # 读数与判读见规范 §13.5.3.5 ⑩ 与 `.gates` 里那两段注释。
    COMFYAPP_CI_GATES: >-
      工具链自证, Python 可用性, Python 探针读数, 环境前提, Install dependencies, 分支守卫, 同步数据库表结构,
      类型检查, 标题行让位, 文件结构硬规则, 跨平台动作对照,
      import 别名统一, ComfyUI 端口口径, 内联样式注入, 跨文件重复块, 函数长度 TS,
      函数长度 Rust, 模块循环依赖, 端口推导跨语言一致性, CHANGELOG 碎片, 主题色扫描,
      UI/逻辑分离, lib Node-only 声明, 格式化提交分离, 生成态文档与源同步,
      API 文档生成物与源同步, 文档引用与权威源一致, core 骨架单一事实源,
      零消费导出, core 出口纪律与基类纯度, 生产构建, 浏览器安装, E2E 关键流程
    # ⚠️ 末尾那两条的**顺序有意**：`浏览器安装` 要下 ~120 MiB（分钟级），而判「装没装成」
    # 是零成本的 —— 排在 `E2E 关键流程` 之前，缺件才会在便宜的位置报出来（判据判这条序）。

# 门禁清单。
# ⚠️ 它**没有**「清单逐条核对」那类判据捧着 —— `tests/cnb-pipeline-gates.test.ts` 已随
# 旧版 `.cnb.yml` 一并删除（#623），本 PR 不复活它（它锁的是旧版那三十步与上报插件，
# 两样在自托管上都不成立）。守着这份文件的现有判据只有 `tests/no-platform-ci-config.test.ts`
# 那一条**形态**判据（分支键 / `namespace: group` / 非空 `tags` / 两个事件键），
# **条目本身的增删不报错** —— 所以这里的每一步都要靠人逐条核对，别指望它会红。
.gates: &gates
  # ── 工具链自证（自托管特有：没有 docker 镜像兜底，装没装由这一步说了算）──
  # 这段是本文件存在的**前提**，不是可选的自检：宿主机缺 Node / pnpm / git 时，
  # 后面每一步都会以看不懂的方式失败（`pnpm: not recognized`、corepack 拉版本超时），
  # 排障成本远高于在这里花三秒正面回答。失败即非零退出 —— 它必须会红。
  - name: 工具链自证
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      # ── 编码探针（头注第 6 条那件事的**常读读数**）──
      # 前四行中文分别由四层吐出：PS 自己（写它自己的编码）、cmd（console CP）、
      # node（UTF-8）、以及**绕过控制台对象、直接以 CP936 字节写 stdout** 的那一行。
      # 哪一行在平台侧可读，就说明**平台在那一层用的是什么编码** —— 乱码是「多层里
      # 哪一层断的」这件事，只看一行日志永远分不开。
      Write-Output "编码探针·PS 原生：中文一二三"
      cmd /c "echo 编码探针·CMD：中文一二三"
      node -e "console.log('编码探针·NODE：中文一二三')"
      # 第 4 行是**决定性的那一条**（2026-10-16 晚加）：前两轮读数已经否掉「控制台代码页」
      # 与「宿主 ANSI 代码页」两个嫌疑人，剩下「解码端写死 CP936」这一种。
      # 这一行可读 ⇒ 就是它，仓库侧「逐 stage 以 CP936 出口」这条出路成立；
      # 这一行仍乱 ⇒ 还没找对层，继续往上（判读见头注第 6 条）。
      $gbk=[Text.Encoding]::GetEncoding(936); $b=$gbk.GetBytes("编码探针·GBK 出口：中文一二三`n"); [Console]::OpenStandardOutput().Write($b,0,$b.Length); [Console]::OpenStandardOutput().Flush()
      # 逻辑在 scripts/ci-toolchain-selfcheck.mjs —— **不在这里就地写 PowerShell**。
      #
      # 这一步原先是一段 ~70 行就地 PowerShell（探 Python、用 winget 当场装、
      # 打印「这个账号看得见什么」）。问题不在它写得对不对，而在**配置里的逻辑
      # 一条判据都测不到它** —— `.cnb.yml` 只在平台上跑，本地一个执行者都没有，
      # 于是它只能靠「推上去看看红不红」验（#1959 第二、三轮各红过一次）。
      #
      # 现在是 scripts/ci-toolchain-selfcheck.mjs：
      #   · 候选表回到唯一一处（src/lib/process/python-candidates.ts）——
      #     此前它探的面与门禁探的面不是同一份，两边各判一次「没有」；
      #   · 这一步**能被单测直接跑**（tests/ci-toolchain-selfcheck.test.ts）；
      #   · 失败时的取证（执行账号、PATH、四个安装位置的命中情况）一并搬进脚本，
      #     并给出「位置命中而命令探不到 ⇒ 改账号 PATH，别重复装」这条分岔。
      # 仍会红：缺 git / node（不在 engines.node 内）/ pnpm / Python 时非零退出。
      # 清单与判读顺序见 docs/standards/13-提交与-code-review.md §13.5.3.5。
      #
      # **第一件事是把控制台输出编码钉成 UTF-8**（ISSUE #1959 的日志乱码）。
      # 平台抓取 stage 输出用的是宿主 ANSI 代码页（中文 Windows 上是 CP936），
      # 而 Node / pnpm 无条件写 UTF-8 —— 于是本机打的每一个非 ASCII 字符在日志里
      # 都是乱码（`工具链自证通过 ✓` → `宸ュ叿閾捐嚜璇侀€氳繃 鉁?`），而 PowerShell
      # 自己打的字是好的（它按控制台的编码写字节）。这一句把那两边重新对齐。
      # 放在**最前**：后面的每一步都在打这种字，先把编码钉住再说话。
      # `chcp` / `[Console]::OutputEncoding` 改的是**控制台对象**上的设置，
      # 同一控制台里的进程共享它 —— 所以它在第一步设、后面的 stage 都受益。
      # 它恒退 0（纠正动作与读数，不是判据），机制见 scripts/ci-console-encoding.mjs。
      # ⚠️ 两条各包一层 `ci-cp936-exit`：先钉住控制台编码（让 PowerShell 把 Node 的
      # UTF-8 **解对**），再由外壳把它以 **CP936** 写回给平台（ISSUE #1977）。
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-console-encoding.mjs --apply
      node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs

  # ── Python 可用性（**必须排在「单元测试」之前**）──
  #
  # `单元测试` 里有一族用例（`tests/helpers/python-exe.ts` 的 `PYTHON_OK` 守卫、
  # `e2e/support/fake-comfyui-executor-env.mjs`、`scripts/check-app-port-vectors.cjs`）
  # 需要一个**真能起来**的解释器。缺件时它们按既有口径走 `env` 档跳过并登记 —— 也就是说
  # 这一步**不会让那条 stage 变红**，只是少判几格。而「少判」在日志里是隐身的。
  #
  # 实测（`cnb-jt3-1k5071kou`）：这台节点上确实一个解释器都没有，而 `单元测试` 照样
  # 往下跑、`Python 可用性` / `E2E 关键流程` 那两步排在**两小时之后** —— 于是
  # 「缺 Python」这件事要么永远看不到，要么在最贵的位置才看到。第六次首跑就是后一种：
  # 在 `ESLint` 之后排队两小时，`单元测试` 一步跑到 2h24m 被 8640s 的墙钟上限掐断，
  # 整条流水线只留下 `timeout of 8640000ms exceeded`，一条失败原因都读不到。
  #
  # 所以把它从「E2E 之前那一步」提前到这里：判据是**同一个**（`--python-only` 调的是
  # `findPython` / `installPython` / `pythonForensics` 那一份），只是让它在整条流水线上
  # **最先**回答，代价几秒。它与第一步「工具链自证」不重复：那一步判的是**整机四件**
  # 且缺件时非零退出（这一步在它绿了之后跑，说明四件齐），这一步只回答**解释器住哪**
  # ——绿的时候打一行版本号（等于把「E2E 到底会用哪个解释器」变成可读读数），
  # 缺件时打取证并**非零退出**（红在能指路的位置，而不是两小时后一串超时）。
  - name: Python 可用性
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-toolchain-selfcheck.mjs --python-only

  # ── Python 探针读数（两条链各自的结论，**只打印、不阻断**）──
  #
  # `Python 可用性` 用的那条链（`findPython` 起**裸名字**，Windows 交给 CreateProcess
  # 按 PATH 解析）与 E2E 前置用的那条链（`resolvePython` 手工扫 PATH × PATHEXT、再对
  # **绝对路径**起一次）是「同一台机器上哪个解释器能跑」的两个不同实现。实测出过
  # 相反结论（`cnb-g36-1k50hvu52`：`Python 可用性` 绿、`E2E 关键流程` 报
  # 「PATH 上没有可用的 Python」）—— 而**只看一边的日志分不出是哪一边错**。
  #
  # `scripts/python-probe.mjs` 把两边的读数都打，退出码恒为 0：它是**打印**、
  # 不是判据（判据那一份只有 `--python-only` 一个）。放在这里是因为它会跟着
  # `Python 可用性` 一起在最便宜的位置跑，而 E2E 那一步要等十几分钟。
  - name: Python 探针读数
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/python-probe.mjs

  # ── 环境前提（**必须排在 `Install dependencies` 之前**，ISSUE #1959）──
  #
  # 上面三步答的是「四件工具在不在」「解释器住哪」，这一步答的是它们旁边那**三格**：
  #
  #   ① **在，但版本不够** —— 解释器低于本仓写明的下限 Python 3.10；
  #   ② **配置配错了** —— `.cnb.yml` 里有 host 侧 PowerShell（5.1）认不了的语法面；
  #   ③ **浏览器那一格的前提** —— 落点上有没有那一件；没有的话，**下载根通不通**。
  #
  # 三格的共同形态正是 ISSUE #1959 里那句「别等到执行几十分钟后才发现环境不行」：
  # 第 ① 格**不会让哪一步变红**（门禁的 Python 侧以「探测不到」的名义退出比对、
  # 几条真跑的用例走 `env` 档跳过并登记 —— 与「装好了」在日志里逐字同形），
  # 第 ② 格红在**几十步之后**（`Install dependencies` 那段 PowerShell 自己），
  # 第 ③ 格红在**整条流水线的倒数第二步**（`浏览器安装`）；
  # 而第 ②③ 格在跑到那一步之前会先把预算是花掉 —— 实测第 ③ 格就是「前面三十步
  # 全绿、二十几分钟之后卡在下载上」（`cnb-gt1-1k513ill4` / `cnb-g9d-1k515kvrq`）。
  #
  # 判据不重写：解释器怎么找走 `ci-toolchain-python.mjs` 的 `findPython()`（与
  # `Python 可用性` 同一份候选表、同一个探针），`.cnb.yml` 的语法面复用
  # `tests/no-platform-ci-config.test.ts` 导出那一份（本地钩子与平台侧同一条判据），
  # 浏览器那一格复用 `ci-toolchain-browser.mjs` 的 `browserExecutableExists()` /
  # `playwrightReachabilityVerdicts()`（与 `浏览器安装` 同源 —— 打印与判据共用
  # 同一次结论，不造第二轮子）。
  # 逻辑在 `scripts/ci-env-probe.mjs` —— **不在这里就地写 PowerShell**，理由与
  # `工具链自证` 逐字相同：配置里的逻辑一条判据都测不到它。
  # 代价几秒（浏览器那格最坏是 4 个候选 × 8s 的 HEAD 串行），跑在**任何依赖安装
  # 之前**（它只 import `node:*`，那时 `node_modules` 还没有）。
  #
  # ⚠️ 第 ③ 格**只在前置判定**（它是判据、要快），与 `浏览器安装` 失败分支那份
  # 「四个域全量一遍供人定位」的取证刻意不同 —— 后者是失败之后给人看的现场。
  # 也**不**在这里替 `浏览器安装` 去装：探测到「都不通」时的出路在人不在仓
  # （换根 / 配代理 / 预装进落点），这一步的作用是把结论提前，不是代办。
  - name: 环境前提
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/ci-env-probe.mjs

  # ── 安装 ──
  # 门禁用 pnpm（AGENTS 硬规则 1：npm 11 在本项目解析 typescript 别名链会崩）。
  # --frozen-lockfile 保证装的就是锁文件里的版本。
  # 刻意**不**开 corepack enable：自托管宿主机上 pnpm 是预装的，corepack 在
  # 非交互环境里为解析 packageManager 去拉版本会挂住；裸 `pnpm -v` 的上一步
  # 已经证明它可用。
  - name: Install dependencies
    script: |
      $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc
      $ErrorActionPreference = "Stop"
      # 动依赖面前先自证一件事：**这个宿主真的起得来 pnpm** —— 而它正好是这一步
      # 的全部动作。放在这里而不是更早的 stage，是因为这条判据**在更早的位置上做不
      # 出来**：`工具链自证` 那份探针刻意按形态解析（corepack 摆在盘上的 pnpm 有三个
      # 形态，Node 只起得来其中一个，见 §2.1.1），而这一句走的是 host 自己的解析面 ——
      # 两者不是同一条链，也不该被压成一条（脚本自己写着理由：判据全在
      # `scripts/launcher-core/corepack.mjs`，它是薄壳）。
      #
      # 顺序要紧：**判在装之前**。装失败之后再判，红的位置就与原因分开了 —— 而
      # 「pnpm 起不来」这条链上此前每一轮都是这个形态（第一步绿、几十步之后才以一个
      # 看不懂的错收场，实测见 §13.5.3.6）。这里 1 秒就能问出来，且它跑在
      # `Install dependencies` 本来的位置上，代价是零。
      node scripts/ci-cp936-exit.mjs -- node scripts/check-pnpm-available.mjs
      node scripts/ci-cp936-exit.mjs -- pnpm install --frozen-lockfile

  # ── 分支保护 ──
  # 守在最前：分支不对时后续检查的结果最后都会被丢弃（与 pre-commit 同序）。
  # 与 .githooks/pre-commit 用的是**同一个** scripts/check-branch-guard.cjs，
  # 不另写一份「CI 专用」的分支名判断（会漂移的判据只许定义一次）。
  # --target master 由配置写死传入：判定要的是**分支名**，而流水线里的
  # CNB_PULL_REQUEST_TARGET_SHA 是 sha —— 拿它当 branch 用会静默失效。
  - name: 分支守卫
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-branch-guard.cjs --pr-check --target master

  # ── 建库 ──
  # 走 scripts/db-push.mjs —— 它复核库里到底有没有表，失败即非零退出。
  # 后面的 E2E 要真的读到库（见 e2e/smoke.spec.ts 的「数据库链路」一组），
  # 故必须放在最前。
  - name: 同步数据库表结构
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/db-push.mjs

  # ── 类型 / 静态检查 ──
  - name: 类型检查
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node_modules/.bin/tsc --noEmit

  # ⚠️ **临时停用**（`COMFYAPP_CI_DISABLED_GATES`，2026-10-16）：这一步**已经跑得通**，
  # 只是正在把 E2E 那两格调绿的每一轮里它都要重跑一遍（实测 256~274s 节点侧）而没有
  # 新信息 —— 属于「耗时项，先让位」。**不是判据被放宽**：本地 `.githooks/pre-commit`
  # 里那条 `eslint --max-warnings 0` 一个字没动，这一步的判据也一字未改。
  # 恢复动作：取消下面三行注释 → 名字挪回 `COMFYAPP_CI_GATES` → 从停用清单删掉。
  # ⚠️ **但恢复条件有两条**（`E2E` 一绿 **且** 平台日志的中文可读）：第二条还没成立，
  # 依据与「唯一剩下的那一个开关」写在 `env.COMFYAPP_CI_DISABLED_GATES` 旁边那一段。
  # 2026-10-16 曾只按第一条恢复过一次，当天退回 —— 耗时项真红时日志读不出原因。
  # - name: ESLint 零警告
  #   script: node_modules/.bin/eslint . --max-warnings 0
  # 实测 114s（本机 8 核）/ 256~274s（自托管节点）。而 `cnb-jt3-1k5071kou` 上它
  # 挂到 **8640s**（2h24m）被 Job 上限掐掉 —— 那是节点被压死、这一步根本没在算。
  # 给 20m 是「量级余量」：真跑得完的形态差两个数量级，而卡死的形态 20m 就能
  # 报出来，不再白等两小时。**不是放宽判据**，判据本身一字未动。
  # timeout: 20m

  # ── 测试（**临时停用**，ISSUE #1959）──
  #
  # ⚠️ 这一步现在是**注释掉的**：宿主侧测试环境还没就绪（Windows 自托管节点上
  # Python 只进了 `yuedu` 会话、构建用的 `SYSTEM` 账号够不着；另有一批跑真子进程的
  # 用例在慢宿主上超预算），先把它摘掉让流水线能往下走，**等测试流程好了再加回来**。
  #
  # 停用这件事有两半、缺一半就会变成「静默删除」：
  #   · 本条目按注释形态留在这里（**别删** —— 恢复动作就是取消注释）；
  #   · 名字从 `env.COMFYAPP_CI_GATES` 摘掉、挪进 `env.COMFYAPP_CI_DISABLED_GATES`。
  # 判据 `tests/no-platform-ci-config.test.ts` 会把「停用」与「删除」分开判：
  # 只在 `DISABLED_GATES` 里登记、且这段注释仍在，才算停用；否则当场点名。
  #
  # 原来的形态（恢复时照抄下面这块，并把名字挪回 `GATES`、从 `DISABLED_GATES` 删掉）：
  #
  #   全量 vitest 只跑**一遍**（`test:coverage` 一次运行即产出覆盖率报告，
  #   判据强度不变，阈值仍由 vitest.config.ts 的目录阈值守着）。
  #
  #   **显式 `--maxWorkers=4`，不是配置里那个 8**：这条件路径与本地跑不是同一种负载。
  #   ① 宿主机 16 逻辑核（无 docker、整机可用），vitest 若照默认铺开就有 ~15 个 worker；
  #   ② `--coverage` 给每个文件都加一层插桩（本机实测同样两文件 6.2s → 9.2s，约 +50% CPU）；
  #   ③ 这一套里有大量**真起子进程**的用例（git / node / prettier / PowerShell），超订的
  #      那一份直接从「等 CPU」变成「等子进程」—— 表现是 `Test timed out in 30000ms`，
  #      而单跑全绿。**这正是本仓已经量过的那一格**（规范 §11.13）：同一套、同一台机器，
  #      `maxWorkers=8` 在负载下仍出争用形态的红，`--maxWorkers=4` 才拿到「560 文件全绿」。
  #   取 4 是**降负载**，不是放宽判据 —— 用例、预算、覆盖率阈值一个字不动；
  #   与 `.githooks/pre-commit` 的 C 组同一个数、同一条理由（AGENTS 硬规则里那句
  #   「降负载的杠杆是并发，不是预算」）。代价是墙钟变长，这是这条路径上买得到的唯一交换。
  #
  #   - name: 单元测试
  #     script: node_modules/.bin/vitest run --coverage --maxWorkers=4
  #     # 实测 827s（`cnb-eus-1k5058g8l`，755 文件全量绿）；本机 `--maxWorkers=4` 实测
  #     # 198s。而 `cnb-did-1k50659np` 上它挂到 **8640s**（2h24m）才被掐掉，留下的
  #     # 只有 `timeout of 8640000ms exceeded` —— 一条失败原因都读不到。
  #     # 给 45m：真跑得完的形态差三倍余量，卡死的形态 45m 报出来。
  #     timeout: 45m

  # ── 结构 / 一致性硬规则（与 .githooks/pre-commit 同一批脚本）──
  - name: 标题行让位
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-title-bar-clearance.cjs

  - name: 文件结构硬规则
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-file-structure.cjs

  - name: 跨平台动作对照
    script: $enc=[Text.Encoding]::UTF8; [Console]::OutputEncoding=$enc; node scripts/ci-cp936-exit.mjs -- node scripts/check-ps1-consistency.mjs

  - name: import 别名统一
